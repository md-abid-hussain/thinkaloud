stage0:
  summary: You build a command-line tool that reads lines of text and prints them in sorted order, much like the Unix
    sort tool. It takes a file name or standard input and writes the sorted lines to standard output, and later it can
    also remove repeated lines, let the user pick a sorting method, or shuffle the lines while keeping identical ones
    together. What makes it harder than it looks is that 'sorted' depends on a rule you must choose, since byte order
    and a language's alphabetical order give different results for the same text. The simplest approach works on small
    files but slows down quickly as the input grows, and it fails when the input is larger than memory. A correct tool
    also has to handle edge cases such as empty files, repeated lines and input that is already sorted.
  questions:
    - id: p-what
      kind: what
      prompt: A teammate says a sort is correct as long as its output is in order. Is that enough? What else must the output
        keep from the input?
      looks_for:
        - the output must be a rearrangement of the input
        - no line may be lost or invented
        - each line must appear as many times as it did in the input, unless duplicates are removed
        - order is defined by a comparison rule, so that rule must be stated
    - id: p-why
      kind: why
      prompt: Why does a small tool like this exist when a spreadsheet or database could sort the same data? Think about
        where it sits in a chain of commands.
      looks_for:
        - it reads a stream and fits between other commands in a pipeline
        - scripts often sort first so that other tools such as uniq or join can work
        - it handles files too big or too many for a spreadsheet
    - id: p-how
      kind: how
      prompt: What is the simplest way you could sort the lines of a file, and what happens to it when the file grows much
        larger? Explain in plain words.
      looks_for:
        - repeatedly compare and swap neighbours, or pick the smallest remaining line again and again
        - the work grows much faster than the number of lines
        - the whole file must fit in memory at once
questions:
  - id: s1-q1
    step: s1
    concept: comparison-sorting
    prompt: "You write the simplest sort first: each pass scans what's left for the smallest line. A colleague runs it on
      a file ten times bigger and the time grows much more than ten times. Why does the cost grow that fast, and what
      kind of sort brings it down?"
    looks_for:
      - each pass compares a line with every remaining line, so the work grows with the square of the input
      - a comparison sort can't beat about n log n comparisons in the worst case
      - merge sort or quicksort does roughly n log n work
      - fewer comparisons is the lever, since each comparison costs the same
  - id: s1-q2
    step: s1
    concept: byte-order-collation
    prompt: Your output puts every capital letter before every lowercase one. A teammate says the list is wrong because it
      isn't alphabetical. What's the difference between byte order and collation, and why is byte order still the
      right target for this step?
    looks_for:
      - byte order compares raw byte values, so capital Z sorts before lowercase a
      - collation follows the locale's rules for case, accents and punctuation
      - byte order gives the same result on any machine, so it can be checked against the real sort under LC_ALL=C
      - a locale-aware sort on another machine gives a different order for the same file
  - id: s1-q3
    step: s1
    concept: external-sorting
    prompt: Your sort reads the whole input into a list before it prints anything. A user runs it on a file far bigger
      than memory and the program crashes. What's the limit here, and how would you change the program so it still
      finishes?
    looks_for:
      - a sort can't print the first line until it has seen the last one, so all the input must be held somewhere
      - split the input into sorted runs written to temporary files, each small enough for memory
      - merge the runs with a heap that holds the current smallest line from each run
      - memory is set by the buffer size, not by the size of the file
  - id: s2-q4
    step: s2
    concept: deduplication
    prompt: Your -u removes repeats by checking each new line against every line kept so far. On a huge file where most
      lines repeat, it gets very slow. What's the cost of that approach, and what would you do instead?
    looks_for:
      - checking against every kept line is quadratic in the number of lines
      - after sorting, copies sit next to each other, so comparing with the previous line is enough
      - a hash set can drop repeats before sorting, which shrinks the sort when most lines repeat
      - a hash set costs memory for every distinct line
  - id: s3-q5
    step: s3
    concept: merge-quick-heap
    prompt: You add quicksort, and it's fast on random words but very slow on the word list, which repeats many words.
      Your partition sends every line equal to the pivot to the same side. What happens, and how would you fix the
      partition?
    looks_for:
      - all lines equal to the pivot land on one side, so the split is lopsided
      - the lopsided splits push the sort toward quadratic time
      - three-way partitioning gathers equal lines in the middle so they are not sorted again
      - a better pivot choice alone doesn't fix many equal keys
  - id: s3-q6
    step: s3
    concept: radix-sort
    prompt: A teammate's radix sort creates 256 buckets at every level, even when a group has only two lines. On a file
      made of many small groups, it runs slower than a simple sort would. Why, and what would you change?
    looks_for:
      - every level pays for every bucket, empty or not
      - for small groups the bucket overhead outweighs the byte-by-byte work
      - switch to a simple sort such as insertion sort once a group is small
      - the buckets also cost memory, so radix sort pays off only for large groups
  - id: s3-q7
    step: s3
    concept: sort-correctness
    prompt: All your algorithms agree on the word list, but a teammate's merge sort crashes on an empty file. Why would
      the word list alone miss this, and what would you test instead?
    looks_for:
      - the word list is never empty, already sorted or all equal, so it hides edge cases
      - "add small inputs: empty, one line, all lines equal, already sorted, reversed, no final newline"
      - compare every algorithm with the others and with the real sort under LC_ALL=C
  - id: s4-q8
    step: s4
    concept: random-sort
    prompt: Run without -u, copies of the same word end up far apart in the output. What's wrong, and how should the sort
      key be chosen?
    looks_for:
      - each copy gets its own random number, so copies scatter
      - the key must depend only on the line's content, so identical lines get the same key
      - the random seed must change each run, so the order changes between runs
      - two different lines with the same hash should be ordered by comparing the lines themselves
  - id: s4-q9
    step: s4
    concept: sort-correctness
    prompt: Random sort gives a different order each run, so a test with one fixed expected output can't pass. How would
      you test the output, and what must hold on every run?
    looks_for:
      - check properties of the output, not one exact order
      - the output is a permutation of the input, with each line appearing as often as in the input
      - identical lines are next to each other
      - two runs differ, and a fixed random source repeats a run exactly
