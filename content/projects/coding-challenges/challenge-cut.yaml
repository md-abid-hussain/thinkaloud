# Coding Challenges, Build your own cut. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-cut . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-cut
  title: Build your own cut
  source_url: https://codingchallenges.fyi/challenges/challenge-cut
  level: beginner
  status: generated
  figure:
    kind: columns
  summary: A command-line tool that picks chosen columns out of tab- or comma-separated text, from a file or from a
    pipe, and gives the same output as the Unix cut tool, so it can sit in a pipeline with uniq and wc.
  requirements:
    - Print the chosen fields of every line, with -f taking one field or a list such as 1,2 or "1 2"
    - Split at a tab by default, or at the character given with -d
    - Print the chosen fields in the order they appear in the line, joined by the delimiter
    - Read standard input when no file name is given or the name is a single dash
    - Reject a bad field list with a message on the error stream and a non-zero exit status
    - Work as one step in a pipeline such as cut, then uniq, then wc
  primer:
    what: cut is a small Unix tool that picks columns out of text. It treats each line as a record and splits it into
      fields wherever a delimiter character appears, a tab unless you name another one. You say which fields you want,
      and cut prints just those for every line. You will build your own version that gives the same output as the real
      one.
    why: Exported spreadsheets, logs and the output of other tools are all columns of text. Pulling out one column and
      handing it to the next tool is one of the most common jobs on a command line.
    example: A file has the line Ada, a tab, 36, a tab, London. Fields are counted from the left starting at 1, so field 1
      is Ada, field 2 is 36 and field 3 is London. Asked for field 3, cut prints London and a newline, then does the
      same for the next line of the file.
    words:
      - term: field
        meaning: One value in a line, the text between two delimiters or between a delimiter and the edge of the line.
      - term: delimiter
        meaning: The character that separates fields, a tab by default or a comma in a CSV file.
      - term: field list
        meaning: The fields you ask for, either one number or several, such as 1 and 3.
      - term: standard input
        meaning: The stream of text a program receives when another program's output is piped into it.
      - term: pipeline
        meaning: A chain of tools where each one's output is the next one's input.
  restate_rubric:
    - id: r1
      point: The tool prints chosen fields, numbered from 1, from every line of delimited text
    - id: r2
      point: The delimiter is a tab unless -d names another character, and -f takes one field or a list
    - id: r3
      point: It reads standard input when there is no file name or the name is a dash, so it works in a pipe
  reflection_prompt: In your own words, how does your cut split a line, choose its fields and handle input from a file
    or a pipe, and what would you change to handle CSV values that contain commas inside quotes?
  reference_tool: GNU cut (coreutils). Compare outputs byte for byte, not by eye.
  done_when: Fields, delimiters, field lists, errors, standard input and the pipeline all match the real cut on
    sample.tsv, fourchords.csv and your own Windows and no-final-newline files; memory stays flat on a large file; and
    your notes explain, in your own words, why cut is the wrong tool for CSV with quoted commas.
  open_checks:
    - What the reference cut prints for a line that has no delimiter at all, and for a line with fewer fields than
      asked for.
    - Whether the reference keeps the carriage return of a Windows line in the last field.
    - Whether the order you write fields in the list changes the order they are printed in.
    - What exit status and message the reference gives for each kind of bad field list.
learning_map:
  - concept: delimited-fields
    where: cut prints chosen fields of each line, split at a tab or at the character given with -d, counting fields from 1.
    explain_back:
      prompt: A finance team exports a spreadsheet as tab-separated text. Some cells are empty, and a script that splits
        each line on runs of whitespace reports prices in the quantity column. Explain what went wrong and how a
        field-based tool such as cut avoids it.
      rubric:
        - id: e1
          point: Each tab ends one field, so two tabs in a row mean an empty field between them
        - id: e2
          point: Splitting on runs of whitespace merges empty fields away, shifting every later field one place to the left
        - id: e3
          point: A field tool splits at every single delimiter and counts positions from 1, so field n stays field n even when
            cells are empty
  - concept: csv-quoting
    where: The challenge's fourchords.csv has quoted song titles. cut splits at every comma, even inside quotes, which
      shows where plain field splitting stops being enough.
    explain_back:
      prompt: You run cut -d, -f1 on a CSV of songs and one title comes out as "Hello instead of Hello, World. Explain why,
        and what a reader of real CSV has to do differently.
      rubric:
        - id: e1
          point: CSV wraps a field that contains a comma in double quotes, and doubles any quote inside it
        - id: e2
          point: cut splits at every comma, including the one inside the quotes, so the title is cut in two
        - id: e3
          point: "A CSV reader tracks whether it is inside quotes: there a comma is data, and a quoted field can even contain a
            line break"
  - concept: line-endings
    where: A file from Windows ends each line with a carriage return and a newline. Only the newline ends the record, so
      the carriage return ends up inside the last field unless you deal with it.
    explain_back:
      prompt: A script joins two exports on the last field, a customer ID, and finds no matches, although the IDs look
        identical on screen. One file came from Windows. Explain what is happening.
      rubric:
        - id: e1
          point: Windows ends lines with a carriage return followed by a newline, while Unix uses only the newline
        - id: e2
          point: A tool that removes only the newline leaves the carriage return at the end of the last field
        - id: e3
          point: The IDs differ by an invisible character, so they never compare equal until the carriage return is removed or
            both sides are normalised
  - concept: cli-subcommands
    where: cut takes -f with a field list written as 1,2 or "1 2", and -d for the delimiter, and must reject a bad list
      with a message on standard error and a non-zero exit status.
    explain_back:
      prompt: A nightly job runs your cut with -f0 by mistake. Explain what your tool should print, where, and with what
        exit status, and why the job runner cares.
      rubric:
        - id: e1
          point: Fields are numbered from 1, so 0 is not a valid field and the list must be rejected
        - id: e2
          point: A short message explaining the problem goes to standard error, not standard output
        - id: e3
          point: The exit status is non-zero, so the job runner can see the step failed instead of passing empty output down the
            pipeline
  - concept: stdin-vs-file
    where: With no file name, or a single dash, cut reads standard input, so it can sit in the middle of a pipeline.
    explain_back:
      prompt: Explain why the dash convention exists, and how one reading routine can serve a named file, a dash and piped
        input.
      rubric:
        - id: e1
          point: A dash as a file name means standard input, so a tool can mix real files and the pipe in one list
        - id: e2
          point: All three are a stream of lines read until the end, so the routine only needs something to read from
        - id: e3
          point: Which source to open is decided once from the arguments, before any reading starts
  - concept: streaming-constant-memory
    where: cut handles one line at a time and keeps nothing else, so its memory stays flat however large the file is.
    explain_back:
      prompt: Your cut is given a 30 GB log. Explain how much memory it should need and why, and what one very long line
        would change.
      rubric:
        - id: e1
          point: It reads, splits and prints one line at a time, so memory does not grow with the size of the file
        - id: e2
          point: Nothing from earlier lines needs to be kept, because each line's fields are independent
        - id: e3
          point: Memory is bounded by the longest line, so one enormous line is the case to think about
  - concept: unix-pipelines
    where: The last step runs cut, then uniq, then wc, and shows how order in a pipeline changes the answer.
    explain_back:
      prompt: cut on fourchords.csv into head prints its five lines instantly even though the file is large, and cut into
        uniq into wc -l gives a different count from cut into sort into uniq into wc -l. Explain both.
      rubric:
        - id: e1
          point: The programs in a pipeline run at the same time, joined by small buffers, so head can print as soon as lines
            arrive
        - id: e2
          point: When head exits, the next write by cut fails, so cut stops instead of reading the whole file
        - id: e3
          point: uniq removes only adjacent duplicates, so without sort first it misses repeats that are not next to each other
milestones:
  - title: Fields from a line
    summary: Print chosen fields, choose the delimiter, accept field lists, and handle line endings correctly.
    steps:
      - title: Print one field
        minutes: 30
        build: Make your cut read a tab-separated file and print field 2 of every line.
        outcome: cut -f2 sample.tsv prints f1, 1, 6, 11, 16 and 21, one per line, the same as the real cut.
        concepts:
          - delimited-fields
        hints:
          hint: Split at every single tab and count from 1. What should a line with fewer fields print?
      - title: Choose the delimiter and see CSV break
        minutes: 45
        build: Add -d to set the delimiter, keeping tab as the default. Run it on fourchords.csv and look at the quoted
          titles.
        outcome: cut -d, -f1 fourchords.csv piped into head -5 prints the same five lines as the real cut, and your notes
          explain which titles a CSV reader would split differently.
        concepts:
          - delimited-fields
          - csv-quoting
        hints:
          hint: Find a title with a comma inside its quotes and predict what both tools print for it.
      - title: Field lists and errors
        minutes: 45
        build: Accept a field list written with commas, such as 1,2, or with spaces inside quotes, such as "1 2". Print chosen
          fields in line order, joined by the delimiter. Reject a field of 0, a non-numeric list or a missing -f.
        outcome: cut -f1,2 sample.tsv matches the real cut byte for byte, and each bad list prints a message on standard error
          and exits non-zero.
        concepts:
          - delimited-fields
          - cli-subcommands
        hints:
          hint: Does the order you list fields in change the output order? Check the real cut.
      - title: Windows line endings
        minutes: 30
        build: Remove only the line ending before splitting, and decide what to do with a carriage return. Test a Windows file
          and a file with no final newline.
        outcome: Your output matches the real cut byte for byte on both files, and your notes say what happens to the carriage
          return.
        concepts:
          - line-endings
        hints:
          hint: Look at the output bytes, not the screen, with a hex dump tool.
  - title: Pipes and pipelines
    summary: Read standard input, stream one line at a time, and work as one stage of a pipeline.
    steps:
      - title: Read from standard input
        minutes: 30
        build: When no file name is given, or the name is a single dash, read standard input through the same code.
        outcome: Piping the last five lines of fourchords.csv into cut -d, -f "1 2" prints the same five lines as the real
          cut, with and without a dash as the file name.
        concepts:
          - stdin-vs-file
        hints:
          hint: Where in your program is the source chosen, and does the splitting code need to know?
      - title: One line at a time
        minutes: 30
        build: Read and print one line at a time, keeping only the current line in memory.
        outcome: cut on a multi-gigabyte generated file piped into head -5 prints at once, and memory stays flat while cut
          runs over the whole file.
        concepts:
          - streaming-constant-memory
          - unix-pipelines
        hints:
          hint: What happens to your tool when head stops reading?
      - title: cut, uniq and wc together
        minutes: 30
        build: "Run your cut in a pipeline: the artist field of fourchords.csv into uniq into wc -l. Then put sort before
          uniq."
        outcome: The first pipeline prints 155, as with the real cut, and your notes explain why adding sort before uniq
          changes the number.
        concepts:
          - unix-pipelines
        hints:
          hint: Look at which duplicate artists are next to each other and which are not.
