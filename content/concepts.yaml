# The shared concept catalogue. Every project file refers to concepts by slug.
#
# Rules for adding to it:
#   - Search this file first. Never add a near-duplicate of a concept that exists.
#   - A concept is language-neutral. Language and framework detail goes under language_notes.
#   - `prerequisites` lists the concepts that should be understood BEFORE this one.
#   - `related` lists concepts that overlap but are not required first.
#   - Briefs are 2 to 3 sentences in our own words.
#   - `status: generated` means nobody has checked it yet. Change it to `reviewed` after a check.
#
# Areas (fixed): text-encodings, streams-io, formats-parsing, state-storage, process-testing,
#                design-structure, networking-http, concurrency, apis-backends, data-stores

format: 1

concepts:
  # ---- from the wc sample (reviewed) ----
  - slug: bytes-vs-characters
    name: Bytes vs characters
    area: text-encodings
    kind: foundation
    status: reviewed
    brief: A byte is a unit of storage. A character is a unit of text. In UTF-8 one character takes one to four bytes.
    superseded_by: text-encoding-utf8 # content v2 teaches this inside the full encoding lesson

  - slug: explicit-charsets
    name: Explicit charsets
    area: text-encodings
    kind: foundation
    status: generated # brief reviewed for v1; lesson added 2026-10-29, not reviewed
    brief: Decoding bytes needs a named encoding. Relying on a platform default breaks when the tool runs elsewhere.
    lesson:
      how_it_works: |-
        Decoding needs an encoding. If code does not name one, the language picks a default, and defaults differ: the
        operating system's setting, the user's locale, or a fixed value that changed between versions. Java used the
        platform encoding until Java 18, so the same program decoded files as Windows-1252 on many Windows machines and
        as UTF-8 on Linux. Since Java 18 the default is UTF-8, but older code and other languages still vary.

        The safe habit is to name the encoding every time bytes become text or text becomes bytes, usually UTF-8. Then
        the program gives the same answer on a laptop, a server and a CI runner.

        Sometimes the encoding has to be discovered. Protocols state it: HTTP in the Content-Type header, XML in its
        declaration, email in its headers. Plain files usually say nothing. A byte order mark at the start is a strong
        hint: EF BB BF for UTF-8, FF FE or FE FF for UTF-16. Without one a program can only guess, which is why formats
        such as JSON simply require UTF-8.

        When a UTF-8 file does start with a byte order mark, decide what to do with it. Most readers should skip it,
        since it is not part of the text.
      examples:
        - A CSV saved by Excel as CSV UTF-8 starts with EF BB BF. A script that does not skip it reads the first
          column name as an invisible character followed by name, and lookups by that name fail.
        - A program that shows é correctly on a developer's Mac shows Ã© on a Windows build server, because it decoded
          with the default encoding instead of UTF-8.
        - A web page served with the wrong charset in its Content-Type header shows mojibake, although the file itself
          is fine.
      misconceptions:
        - A text file records its own encoding. Most do not, so the reader must know or guess.
        - The default encoding is always UTF-8. It depends on the language, its version and the machine.
        - A byte order mark is harmless. Many tools treat it as part of the first line.
      elsewhere:
        - Database connections have their own encoding, and a mismatch corrupts names on the way in.
        - Command-line tools read the locale to decide how to decode, so the same command can count differently on two
          machines.
        - APIs that accept text should say which encoding they expect, and reject or convert anything else.
    prerequisites: [ text-encoding-utf8 ]
    resources:
      - title: "W3C, Character encodings: Essential concepts"
        url: https://www.w3.org/International/articles/definitions-characters/
        opened: true
      - title: W3C, Choosing and applying a character encoding
        url: https://www.w3.org/International/questions/qa-choosing-encodings
        opened: true
      - title: Mojibake (Wikipedia)
        url: https://en.wikipedia.org/wiki/Mojibake
        opened: true

  - slug: decoding-across-chunks
    name: Decoding across chunk boundaries
    area: text-encodings
    kind: foundation
    status: generated # brief reviewed for v1; lesson added 2026-10-29, not reviewed
    brief: A chunk of bytes can end in the middle of a character, so a decoder keeps the leftover bytes for the next chunk.
    lesson:
      how_it_works: |-
        A streaming program reads bytes in chunks, and chunk boundaries fall wherever the buffer happens to fill. In
        UTF-8 a character can take up to four bytes, so a chunk can end after the first byte of é or after two bytes of
        an emoji.

        If each chunk is decoded on its own, the decoder sees an unfinished sequence at the end of one chunk and stray
        continuation bytes at the start of the next. It reports both as invalid, usually replacing each with the
        replacement character U+FFFD, so one real character becomes two wrong ones. The bug depends on where the boundary
        falls: the same file can count correctly with one buffer size and wrongly with another, and small test files that
        fit in one chunk never show it.

        The fix is a decoder that keeps state between chunks. It decodes every complete character in a chunk and holds
        back the bytes of an unfinished one, then puts them in front of the next chunk. At the very end of the input, any
        bytes still held back are a truncated character, which is invalid. Languages provide such decoders, as a reader
        that wraps a byte stream or as a decoder object that accepts partial input.

        Byte-level counts such as bytes and newlines need no decoding at all, because in UTF-8 a newline byte never
        appears inside a multi-byte character.
      examples:
        - A tool counts characters correctly on a short test file but reports a few extra on a large Chinese text,
          where three-byte characters often straddle the 4096-byte boundary.
        - A chat server that decodes each network packet separately sometimes shows a broken symbol in the middle of a
          message with emoji, whenever a packet boundary splits one.
        - A log shipper that cuts files into fixed-size pieces for upload must cut on line boundaries, or each piece
          can no longer be decoded on its own.
      misconceptions:
        - Decoding chunk by chunk is the same as decoding the whole file. Only when no character crosses a boundary.
        - A bigger buffer fixes it. It only makes boundaries rarer, so the bug hides better.
        - Counting bytes and lines needs decoding too. In UTF-8 newline bytes can be counted on the raw bytes.
      elsewhere:
        - Anything that carries text over a stream, such as chat, WebSockets or server-sent events, needs a decoder
          that keeps state.
        - "Compression and encryption streams have the same shape: state is carried from one block to the next."
        - Editors that open huge files in pieces must align the pieces to character boundaries.
    prerequisites: [ explicit-charsets, stream-read-contract ]
    resources:
      - title: WHATWG Encoding Standard (streaming decode and end-of-stream flush)
        url: https://encoding.spec.whatwg.org/
        opened: true
      - title: UTF-8 (Wikipedia), self-synchronisation and byte sequences
        url: https://en.wikipedia.org/wiki/UTF-8
        opened: true

  - slug: streaming-constant-memory
    name: Streaming in constant memory
    area: streams-io
    kind: foundation
    status: generated # brief reviewed for v1; lesson added 2026-10-29, not reviewed
    brief: Read input in fixed-size chunks and keep running totals, so memory does not grow with the input.
    lesson:
      how_it_works: |-
        A program that reads a whole file into memory before working on it needs as much memory as the file is big.
        That is fine for a 2 KB file and fatal for a 20 GB log on a machine with 8 GB of memory: the program slows to a
        crawl as the system swaps, or the operating system stops it.

        A streaming program keeps a fixed-size buffer, perhaps 64 KB, fills it with the next part of the input, updates
        a few running totals and reuses the same buffer for the next part. Its memory depends on the buffer and the
        totals, not on the input, so it is the same for 2 KB and for 20 GB. The time still grows with the input, since
        every byte is read once, but the memory does not.

        Not every question can be answered this way. Counting bytes, lines and words, finding the longest line or adding
        up a column needs only a few numbers carried from one chunk to the next. Counting distinct words, sorting lines or
        finding the median needs memory that grows with the input, because the answer depends on everything seen so far.
        The skill is to ask, before writing code, what state the answer has to carry.

        Streaming also lets a program produce output before its input has finished arriving, which is what makes pipes
        between tools work.
      examples:
        - Counting the lines of a 20 GB web server log with a streaming counter takes a few megabytes of memory and
          finishes as fast as the disk can be read. Loading it first fails on most laptops.
        - A video player decodes a few seconds ahead and throws away what it has shown, so a two-hour film never sits
          in memory at once.
        - Database backups are written and read as streams, so the size of the database is not limited by the memory
          of the machine that makes the backup.
      misconceptions:
        - Reading line by line is always streaming. It is, until the code collects the lines into a list.
        - A bigger buffer is always faster. Beyond some tens of kilobytes the disk is the limit, and more buffer only
          costs memory.
        - Streaming is only for huge files. The same code handles small files and pipes, so there is no reason to
          write two versions.
      elsewhere:
        - HTTP servers stream request and response bodies, so a large upload does not need to fit in memory.
        - grep, gzip, checksum programs and the merge phase of sort all stream.
        - Data pipelines are designed around what state they must keep per record.
    prerequisites: [ stream-read-contract ]
    resources:
      - title: Data buffer (Wikipedia)
        url: https://en.wikipedia.org/wiki/Data_buffer
        opened: true
      - title: Pipeline (Unix) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Pipeline_(Unix)
        opened: true
      - title: read(2), Linux manual page
        url: https://man7.org/linux/man-pages/man2/read.2.html
        opened: true

  - slug: stdin-vs-file
    name: Standard input vs file
    area: streams-io
    kind: foundation
    status: generated # brief reviewed for v1; lesson added 2026-10-29, not reviewed
    brief: A file and standard input can be treated as the same kind of byte stream, so one loop serves both.
    lesson:
      how_it_works: |-
        Unix tools are built to be joined. A tool given a file name opens and reads that file; a tool given no name reads
        standard input, which is whatever the shell connects to it: the keyboard, a file redirected into it, or the output
        of another program through a pipe. Many tools also accept a single dash as a name that means standard input.

        A file and standard input are both byte streams, read in the same way under the same read contract. So a tool
        should open the right source and hand it to one shared counting loop, not keep one code path for files and
        another for pipes.

        Some things are true only of files. A file has a size that can be asked for without reading it, and a position
        that can be moved back. A pipe has neither: its size is unknown until the writer finishes, and data once read is
        gone. A tool that takes a shortcut that only works on files, such as asking for the size instead of counting
        bytes, breaks the moment it is used in a pipeline.

        The output side mirrors this: a tool writes its results to standard output, so the next tool in a pipeline, or a
        file, can receive them.
      examples:
        - Piping a compressed log through a decompressor into wc counts its lines without ever writing the 20 GB of
          uncompressed text to disk.
        - wc prints the file name next to its counts, but reading a pipe there is no name to print, so it prints the
          counts alone.
        - A program that rewinds its input to read it twice works on files and fails, or hangs, on a pipe.
      misconceptions:
        - Standard input is the keyboard. It is whatever the shell connects to the program.
        - A pipe is a temporary file. It is a buffer in the operating system, with no size and no rewind.
        - Supporting pipes needs a separate code path. One loop over a byte stream serves both.
      elsewhere:
        - Compilers, formatters and build tools read standard input so editors and scripts can pipe code through them.
        - Containers and services write logs to standard output so the platform can collect the stream.
        - "Network sockets behave like pipes: no size and no rewind."
    resources:
      - title: Standard streams (Wikipedia)
        url: https://en.wikipedia.org/wiki/Standard_streams
        opened: true
      - title: stdin(3), Linux manual page
        url: https://man7.org/linux/man-pages/man3/stdin.3.html
        opened: true
      - title: Pipeline (Unix) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Pipeline_(Unix)
        opened: true

  - slug: stream-read-contract
    name: The read contract
    area: streams-io
    kind: foundation
    status: generated # brief reviewed for v1; lesson added 2026-10-29, not reviewed
    brief: A read can return fewer bytes than the buffer holds. The returned count says how many are valid, and -1 means
      the end.
    lesson:
      how_it_works: |-
        When a program asks the operating system to read into a buffer, it says how many bytes it wants at most. The
        read returns how many it actually delivered, which can be anything from one to the size of the buffer. Only
        those bytes are valid. The rest of the buffer still holds whatever was there before, often bytes from the
        previous read.

        A short read does not mean the input has ended. A file usually fills the buffer until its last part, but a pipe
        delivers whatever the writing program has produced so far, and a network socket whatever packets have arrived.
        Only a special result says the end has been reached: zero bytes in C and most operating systems, or minus one
        from an InputStream in Java.

        So a correct read loop follows three rules. Use the returned count, never the buffer size, for everything done
        with the data. Keep reading after a short read. Stop only on the end marker. A loop that breaks the first rule
        counts leftover bytes again. A loop that breaks the second stops early on pipes and networks while appearing to
        work on files, which is why the bug often survives testing.
      examples:
        - A 10 KB file read with a 4 KB buffer usually comes back as 4 KB, 4 KB and 2 KB, then the end marker. A
          program that always adds 4 KB reports 12 KB.
        - When a slow program writes into a pipe a line at a time, each read may return one short line, although much
          more is coming.
        - Network code that expects one read to return one whole message works on a fast local network and fails when
          a message is split across packets.
      misconceptions:
        - A read fills the buffer unless the input is over. It can return fewer bytes at any time.
        - Getting fewer bytes than asked for means the end. Only the end marker means the end.
        - The bytes beyond the count are zero. They are left over from earlier reads, so counting them adds
          real-looking data.
      elsewhere:
        - Sockets follow the same contract, which is why network protocols need message framing.
        - Every language wraps it, for example InputStream in Java, the read call in C and streams in Node.
        - "Writes have a matching contract: a write can accept fewer bytes than offered, and the rest must be written
          again."
    resources:
      - title: read(2), Linux manual page (return value and short reads)
        url: https://man7.org/linux/man-pages/man2/read.2.html
        opened: true
      - title: read(3p), POSIX Programmer's Manual
        url: https://man7.org/linux/man-pages/man3/read.3p.html
        opened: true

  # ---- added for wc ----
  - slug: line-endings
    name: Lines and line endings
    area: text-encodings
    kind: foundation
    status: generated
    brief: >-
      A line is the text up to and including a newline byte, so tools count lines by counting newlines. A last line
      with no newline after it is not counted. Files written on Windows end each line with a carriage return and a
      newline, and the carriage return is an extra byte that line counting ignores but byte counting sees.
    lesson:
      how_it_works: |-
        A file has no lines, only bytes. A line is a convention: in Unix, the text up to a newline byte, 0A. POSIX
        defines a line as characters followed by a newline, so a file whose last line has no newline ends with an
        incomplete line. wc counts newline bytes, so for such a file it reports one line fewer than an editor shows.

        Windows ends each line with two bytes, a carriage return 0D and then a newline 0A, a habit from typewriters and
        teleprinters, where returning the carriage and feeding the paper were separate actions. Classic Mac systems used
        a carriage return alone. Most modern tools accept both, but not all.

        The carriage return causes quiet bugs. Counting lines by newline still works, but the carriage return stays at
        the end of each line's text, so a comparison with yes fails because the value is really yes followed by an
        invisible character. It is also a byte, and whitespace for word counting. Git can convert line endings on
        checkout, which changes a file's byte count between Windows and Linux machines.

        Splitting a whole text at its newlines also produces an empty last piece when the file ends with a newline, and
        code must not treat that piece as a real line.
      examples:
        - A CSV exported on Windows and read on Linux keeps a carriage return at the end of every last column, so a
          filter for the value active matches nothing.
        - An editor shows 10 lines and wc -l reports 9, because the last line has no newline. Each is right by its own
          definition.
        - A test that checks the byte count of a fixture passes on Linux and fails on a Windows CI runner, because Git
          converted the line endings on checkout.
      misconceptions:
        - A line ends however the operating system ends it. Files move between systems, so a tool must handle both
          endings.
        - The number of lines is the number of newlines plus one. Not for a file that ends with a newline, and not for
          an empty one.
        - The carriage return is harmless because it is invisible. It changes comparisons, lengths and byte counts.
      elsewhere:
        - HTTP, SMTP and many other protocols require a carriage return and a newline at the end of every header line.
        - Git's autocrlf setting and attributes file exist to control this conversion.
        - Diff tools show a whole file as changed when only its line endings changed.
    related: [ text-encoding-utf8 ]
    resources:
      - title: Newline (Wikipedia)
        url: https://en.wikipedia.org/wiki/Newline

  - slug: word-state-machine
    name: Counting words with a state machine
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A word counter walks the text once and remembers one thing: whether it is inside a word. A word starts when a
      non-space character follows a space or the start of input, so runs of spaces never make empty words. The
      remembered state has to survive from one chunk of input to the next.
    lesson:
      how_it_works: |-
        What is a word? wc's answer is simple and strict: a word is a run of characters that are not whitespace.
        Punctuation is part of the word, so don't, e-mail and 3.14 are each one word, and a dash with spaces around it is
        a word of its own. Spell checkers and search engines use the more complex word boundary rules of Unicode; wc does
        not.

        That definition fits a tiny state machine. The counter remembers one thing: whether it is inside a word. Reading
        a non-space while outside a word starts a word, so the count goes up and the state becomes inside. Reading
        whitespace makes the state outside. Runs of spaces therefore never create empty words, and leading or trailing
        spaces do not matter.

        The state has to survive chunk boundaries. If a word straddles two chunks and the counter forgets that it was
        inside a word, the second half counts as a new word. Carrying one flag from one chunk to the next fixes it, and
        that flag is the whole state.

        The hard part is deciding what whitespace is. Space, tab, newline, carriage return, form feed and vertical tab
        are the classic set. Unicode adds others, such as the no-break space U+00A0, the em space and the ideographic
        space used in Chinese and Japanese text. Which of them count depends on the tool, its version and the locale, so
        the same file can have different word counts on two machines.
      examples:
        - The phrase rock-and-roll is one word to wc and three to a person or a search engine.
        - Text pasted from a web page often has no-break spaces between words, and a counter that does not treat them
          as whitespace reports fewer words than the author expects.
        - Japanese text usually has no spaces between words, so wc counts whole sentences as single words.
      misconceptions:
        - Counting words means counting spaces and adding one. Double spaces, leading spaces and empty files break
          that.
        - A word is what a dictionary calls a word. For wc it is any run of non-whitespace.
        - Whitespace means the space bar. Tabs, newlines and several Unicode characters count too, depending on the
          locale.
      elsewhere:
        - "Lexers in compilers use the same idea with more states: inside a number, a string or a comment."
        - Editors and search engines use the Unicode word boundary rules to select and index words.
        - Protocol parsers carry a small state across network packets in exactly this way.
    related: [ streaming-constant-memory ]
    resources:
      - title: Finite-state machine (Wikipedia)
        url: https://en.wikipedia.org/wiki/Finite-state_machine
        opened: true
      - title: Newline (Wikipedia)
        url: https://en.wikipedia.org/wiki/Newline
        opened: true

  - slug: differential-testing
    name: Testing against a reference tool
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      Run your tool and a trusted reference on the same inputs and compare the outputs. Your own expected values only
      test what you already believe, while the reference exposes cases you did not think of, such as odd whitespace or
      line endings. Pin the reference version and settings, since they can change its answers.
    lesson:
      how_it_works: |-
        Unit tests compare your program with expected values that you wrote. That checks the cases you thought of,
        against your understanding of the right answer. If your understanding is wrong, the code and the test are wrong
        together, and the test passes.

        Differential testing compares your program with another implementation on the same input, often a trusted
        reference tool. When the outputs differ, one of the two is wrong, and finding out which teaches you something you
        did not know, such as how the reference treats a no-break space or a file without a final newline.

        It works best with many and varied inputs: an empty file, one without a final newline, Windows line endings,
        accented text, emoji, invalid bytes, a file larger than the buffer, and piped input as well as named files.
        Generating random inputs and comparing automatically, a form of fuzzing, finds cases nobody would write by hand.

        The reference must be pinned. Different versions and builds of wc disagree on some inputs, and the locale changes
        the answers, so record which version and settings produced the expected output.
      examples:
        - The real wc in Git Bash reports 58070 words for the challenge's file when run from a script and 58164 in its
          terminal, because the locale differs, so a test that compares against it must pin the locale first.
        - Compiler teams compile the same programs with two compilers and compare the results to find miscompilations.
        - When a service is rewritten, running the old and new versions side by side on real traffic and comparing
          their responses catches differences before users do.
      misconceptions:
        - If my unit tests pass, my tool matches the original. Only for the cases and answers you wrote down.
        - The reference is always right. It has bugs and version differences too, so a difference is a question, not a
          verdict.
        - Comparing a couple of files is enough. The bugs live in the unusual inputs.
      elsewhere:
        - Browser engines, databases and JSON parsers are tested against each other and against shared test suites.
        - Large refactorings often rely on comparing old and new outputs.
        - Data migrations compare row counts and checksums between the old store and the new one.
    resources:
      - title: Differential testing (Wikipedia)
        url: https://en.wikipedia.org/wiki/Differential_testing
        opened: true
      - title: Command Line Interface Guidelines (output and behaviour scripts rely on)
        url: https://clig.dev/
        opened: true

  # ---- added for the static site generator ----
  - slug: site-directory-layout
    name: Directory layout as the data model
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      A site generator treats folders as its data model. Content holds what the author writes, themes hold how pages
      look, and the output folder holds what gets published. Keeping them apart lets each change without touching the
      others, and lets the output be rebuilt from the other two.
    resources:
      - title: Hugo, directory structure
        url: https://gohugo.io/getting-started/directory-structure/

  - slug: cli-subcommands
    name: Command-line arguments and exit codes
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      A command-line tool reads its options, subcommands and file names from its arguments, and rejects ones it does
      not understand. It writes results to standard output and problems to the error stream, and exits with a non-zero
      status on failure, so scripts can tell success from failure.
    lesson:
      how_it_works: |-
        A command-line tool has a contract with its caller, which is often another program rather than a person. The
        contract has three channels.

        Standard output carries the result and nothing else, so it can be piped into the next tool or saved to a file.
        Standard error carries messages for the person: warnings, usage help and errors. Keeping the two apart means an
        error message never ends up inside a file of results.

        The exit status, a small number returned when the program ends, says whether it worked. Zero means success and
        anything else means failure, and some tools use different values for different problems. Shells, scripts and CI
        systems check it, so a step that fails but exits with zero lets a broken build pass.

        Arguments complete the contract. Options such as -c and -l choose what to do and can usually be combined, the
        remaining words are file names, and an unknown option is an error with a usage message, not something to ignore.
        When several files are given and one cannot be read, a well-behaved tool reports that file on standard error,
        still processes the others, and exits with a non-zero status at the end.
      examples:
        - A deploy script runs the tests and checks their exit status. If the tests fail but the command exits with
          zero, broken code ships.
        - A tool that prints its errors on standard output corrupts every report that saves its output to a file.
        - GNU wc given three files, one of them missing, prints counts for the two that exist and a total, writes an
          error about the third on standard error, and exits with status 1.
      misconceptions:
        - Exit codes are for people to read. They are mainly for other programs.
        - Printing an error is enough. Without a non-zero exit status a script cannot tell that anything went wrong.
        - Results and error messages can share one stream. Mixing them breaks pipelines.
      elsewhere:
        - CI systems mark a step as failed purely from its exit status.
        - HTTP status codes play the same role for web APIs that exit statuses play for commands.
        - Container platforms decide whether to restart a service from how its process exited.
    resources:
      - title: Command Line Interface Guidelines
        url: https://clig.dev/
        opened: true
      - title: Exit status (Wikipedia)
        url: https://en.wikipedia.org/wiki/Exit_status
        opened: true
      - title: Standard streams (Wikipedia)
        url: https://en.wikipedia.org/wiki/Standard_streams
        opened: true

  - slug: untrusted-paths
    name: Untrusted names in file paths
    area: streams-io
    kind: foundation
    status: generated
    brief: >-
      A name that ends up inside a file path, from a command line or a web request, can contain .. and climb out of
      the folder you meant. Resolve the full path, normalise it, and check that it still sits inside the base folder
      before you read or write.
    related: [ site-directory-layout ]
    resources:
      - title: OWASP, Path Traversal
        url: https://owasp.org/www-community/attacks/Path_Traversal
        opened: true
      - title: PortSwigger Web Security Academy, Path traversal
        url: https://portswigger.net/web-security/file-path-traversal
        opened: true
      - title: Java Path (Javadoc)
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/Path.html
        language: java
    language_notes:
      - language: java
        body: |-
          Join the base folder and the name with Path.resolve, remove dot segments with Path.normalize, and check the
          result with Path.startsWith against the base, which should already be absolute and normalised.
          Path.startsWith compares whole name elements, so a folder called public-old does not count as inside public.
          An absolute name replaces the base when it is resolved, and the startsWith check then rejects it. Use
          Path.toRealPath on the base if symbolic links are possible.
    lesson:
      how_it_works: >-
        Whenever a name from outside, such as a URL path, a file name in an upload or a command-line argument, becomes
        part of a file path, an attacker can choose it. The classic attack is directory traversal: the segment ..
        means 'the parent folder', so a request for /../../etc/passwd joined naively to a web root climbs out of it
        and reads a system file.


        The safe approach has three parts. First decode the path the way the server will finally interpret it, because
        attackers hide dots and slashes in percent-encoding such as %2e%2e%2f. Then resolve it against the root folder
        and normalise it, so that every . and .. is removed and you have one absolute path. Finally check that this
        absolute path is still inside the root, comparing whole path segments: a root of /srv/www must not accept
        /srv/www-private, even though the text starts the same way.


        Rejecting strings that contain .. is not enough, because encodings, backslashes on Windows, and symbolic links
        that point outside the root all get around simple text checks. Resolving and then checking containment is what
        holds. The same rule applies to any code that writes files, where traversal can overwrite configuration or
        code.
      examples:
        - A photo service lets users download their files by name, and a request for ../../config/secrets.env returns
          the server's credentials.
        - A filter that removes ../ from paths is beaten by ....// which becomes ../ after the filter runs.
        - An archive extractor writes a file named ../../.bashrc outside the target folder, a bug class called Zip
          Slip.
      misconceptions:
        - People think browsers and curl will never send .. in a path. They normalise it by default, but an attacker's
          own client sends whatever bytes it likes.
        - People think checking that the resolved path starts with the root text is enough. A sibling folder with a
          longer name passes that check.
        - People think this only matters for reading. Writing to an attacker-chosen path is usually worse.
      elsewhere:
        - File upload handlers, template loaders and backup restore tools all join untrusted names to folders.
        - Path traversal has its own entry in the OWASP and CWE lists of common weaknesses.
        - Containers and chroot jails limit the damage, but they are a second line of defence, not a replacement for
          the check.

  - slug: markup-to-html
    name: Converting Markdown to HTML
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A Markdown renderer works in two layers. It finds the block structure first, such as headings and paragraphs,
      then handles inline marks such as emphasis and links inside each block. The result is written out as HTML
      elements.
    related: [ explicit-charsets ]
    resources:
      - title: CommonMark specification
        url: https://spec.commonmark.org/
      - title: Markdown syntax (Daring Fireball)
        url: https://daringfireball.net/projects/markdown/syntax

  - slug: output-escaping
    name: Escaping text inserted into HTML
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Text placed into HTML must be escaped, so that characters such as <, > and & show as text and are not read as
      markup. Escape plain values at the point they are inserted, and leave alone text that is already HTML.
    resources:
      - title: OWASP, Cross Site Scripting Prevention Cheat Sheet
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

  - slug: template-substitution
    name: Template substitution
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A template is text with named holes, such as {{ Title }}. Filling it in one pass over the template, instead of
      one replace per name, keeps text that merely looks like a placeholder inside a value from being filled in a
      second time.
    prerequisites: [ markup-to-html, output-escaping ]
    resources:
      - title: Hugo, introduction to templating
        url: https://gohugo.io/templates/introduction/

  - slug: build-pipeline
    name: Build pipeline
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      A build reads inputs, transforms them and writes outputs, and the same inputs should always give the same
      output. Writing everything into a freshly cleared output folder, instead of editing files in place, keeps stale
      files out and makes the result safe to publish as a whole.
    prerequisites: [ site-directory-layout ]
    resources:
      - title: Static site generator (Wikipedia)
        url: https://en.wikipedia.org/wiki/Static_site_generator

  - slug: static-file-serving
    name: Serving static files over HTTP
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      A static server turns a URL path into a file. It maps / to index.html, sends the file with the right
      Content-Type, and answers 404 when nothing matches. The browser trusts the Content-Type header, not the file
      extension.
    prerequisites: [ untrusted-paths ]
    resources:
      - title: MDN, Media types (MIME types)
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/MIME_types
        opened: true
      - title: MDN, Content-Type header
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Type
        opened: true
      - title: MDN, Content-Length header
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Length
        opened: true
      - title: jdk.httpserver package (Javadoc)
        url: https://docs.oracle.com/en/java/javase/25/docs/api/jdk.httpserver/com/sun/net/httpserver/package-summary.html
        language: java
    language_notes:
      - language: java
        body: |-
          The JDK ships a small HTTP server in the jdk.httpserver module. HttpServer.create binds a server to an
          InetSocketAddress, and HttpServer.createContext registers a handler for a path prefix. In the handler, add
          the Content-Type header to the exchange's response headers before calling HttpExchange.sendResponseHeaders
          with the status and the length. Files.probeContentType can return null, so keep a small map from extension
          to type for html, css and js.
    lesson:
      how_it_works: >-
        A static file server maps the path in a request to a file under a root folder and sends its bytes back. By
        convention a path ending in a slash maps to an index file, usually index.html. If nothing matches, the server
        answers 404 Not Found.


        Two headers matter most. Content-Type tells the client what the bytes are, as a media type such as text/html,
        image/png or application/javascript, sometimes with a charset parameter such as text/html; charset=utf-8.
        Browsers decide how to treat a response from this header, not from the file name, so a stylesheet sent as
        text/plain is ignored. Content-Length gives the body's size in bytes, which lets the client know where the
        body ends.


        Files should be read and sent as bytes, never decoded and re-encoded as text, because an image is not text and
        even a text file's byte count is what Content-Length needs. Real servers add more: caching headers so browsers
        do not refetch unchanged files, range requests for large media, and a sensible default when the extension is
        unknown, usually application/octet-stream, which makes browsers download rather than display.
      examples:
        - A site's CSS has no effect because the server sends it with Content-Type text/plain, and the browser refuses
          to apply it.
        - A server that reads images as text corrupts every PNG it serves.
        - Visiting a folder path such as /docs/ returns /docs/index.html, so the address can stay short.
      misconceptions:
        - People think browsers trust the file extension. They trust the Content-Type header.
        - People think Content-Length is the number of characters. It is the number of bytes in the body.
        - People think a missing file should crash the handler or return 500. It is the client asking for something
          that does not exist, so it is 404.
      elsewhere:
        - CDNs and object storage services such as S3 are static file servers at scale, with the same Content-Type
          rules.
        - Front-end build tools produce folders of static files meant to be served exactly this way.
        - Download links that open as gibberish in the browser are usually a wrong Content-Type.

  - slug: file-watching
    name: Watching files for changes
    area: streams-io
    kind: foundation
    status: generated
    brief: >-
      A tool can notice file changes by polling modification times on a timer, or by asking the operating system for
      change notifications. Notifications are faster and cheaper but platform-specific, and they often arrive in
      bursts, so a tool waits briefly (debouncing) before it acts.
    resources:
      - title: inotify(7), Linux manual page
        url: https://man7.org/linux/man-pages/man7/inotify.7.html
      - title: WatchService (Javadoc)
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/WatchService.html
        language: java
    language_notes:
      - language: java
        body: |-
          WatchService in java.nio.file reports create, modify and delete events for one directory. It does not watch
          subdirectories, so register each one yourself, for example while walking the tree with Files.walkFileTree.
          WatchService.take waits for the next batch of events, and WatchKey.reset must be called afterwards or the
          key stops delivering. On some platforms the built-in implementation polls, so changes can arrive late.

  - slug: live-reload-push
    name: Pushing a reload to the browser
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      A page cannot know that the server rebuilt it unless something tells it. The development server keeps a
      connection open, for example with server-sent events, and sends a message after each rebuild. A small script
      added to pages in development only then reloads the browser.
    prerequisites: [ static-file-serving, file-watching ]
    resources:
      - title: MDN, Using server-sent events
        url: https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events

  # ---- added for wave 1: text tools (cut, grep) ----
  - slug: delimited-fields
    name: Fields in delimited text
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Tab- and comma-separated files store one record per line, split into fields at a delimiter character. Fields are
      numbered from 1, and two delimiters in a row mean an empty field, not a missing one. Plain splitting breaks when
      a value contains the delimiter inside quotes, which full CSV parsers handle and simple tools do not.
    related: [ line-endings ]
    resources:
      - title: Delimiter-separated values (Wikipedia)
        url: https://en.wikipedia.org/wiki/Delimiter-separated_values

  - slug: unix-pipelines
    name: Composing tools with pipes
    area: streams-io
    kind: foundation
    status: generated
    brief: >-
      Small tools that read standard input and write standard output can be chained, so each does one job and the
      shell joins them. Lines of text are the shared format. The order of the chain matters, because some tools only
      work on what they see next to each other, such as uniq, which only removes adjacent duplicates.
    prerequisites: [ stdin-vs-file ]
    resources:
      - title: Pipeline (Unix) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Pipeline_(Unix)

  - slug: regex-matching
    name: Matching with regular expressions
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A regular expression describes a set of strings using literal characters, classes such as any digit or any word
      character, and anchors for the start and end of a line. A line matches when the pattern succeeds starting at
      some position in it, so an unanchored pattern can match anywhere and an empty pattern matches every line.
    resources:
      - title: Regular expression (Wikipedia)
        url: https://en.wikipedia.org/wiki/Regular_expression
      - title: MDN, Regular expressions guide
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions

  - slug: recursive-file-walk
    name: Walking a directory tree
    area: streams-io
    kind: foundation
    status: generated
    brief: >-
      To visit every file under a folder, list its entries, handle the files, and descend into each subfolder the same
      way. The order entries come back in is not guaranteed, symbolic links can form loops, and some folders cannot be
      read, so a walker needs a rule for each.
    resources:
      - title: Depth-first search (Wikipedia)
        url: https://en.wikipedia.org/wiki/Depth-first_search

  - slug: case-folding
    name: Comparing text without case
    area: text-encodings
    kind: foundation
    status: generated
    brief: >-
      A case-insensitive match maps both the pattern and the text to one common form before comparing. In ASCII that
      is a simple swap between upper and lower letters, but in Unicode some letters change length or have more than
      one lower-case form, so the language's case-folding rules are safer than a hand-made table.
    related: [ bytes-vs-characters ]
    resources:
      - title: Unicode FAQ, case mapping
        url: https://unicode.org/faq/casemap_charprop.html

  # ---- added for wave 1: parsing (JSON parser) ----
  - slug: lexical-analysis
    name: Lexing text into tokens
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A lexer reads characters and groups them into tokens, such as a brace, a string, a number or a keyword, and
      skips the whitespace between them. The parser then works with meaningful pieces instead of single characters.
    resources:
      - title: Crafting Interpreters, Scanning
        url: https://craftinginterpreters.com/scanning.html
        opened: true
      - title: Lexical analysis (Wikipedia)
        url: https://en.wikipedia.org/wiki/Lexical_analysis
        opened: true
      - title: Introducing JSON (json.org), the token-level railroad diagrams
        url: https://www.json.org/json-en.html
        opened: true
    lesson:
      how_it_works: >-
        Text arrives as a flat run of characters, but the rules of a format are written about larger pieces: a string,
        a number, a keyword, a punctuation mark. A lexer, also called a scanner or tokenizer, walks the characters
        once from left to right and groups them into those pieces, called tokens. Each token has a kind, such as left
        brace, string, number or the keyword true, and usually its text and its position in the input.


        The lexer decides where one token ends and the next begins. Some tokens are a single character, like a comma
        or a colon. Others are longer and need a small loop: a string runs from its opening double quote to the
        matching closing one, and a number keeps going while the characters still fit the number rules. Whitespace
        between tokens is skipped, which is why the parser never has to think about spaces or newlines.


        Splitting the work this way keeps each part simple. The lexer knows how characters form words, and the parser
        knows how words form sentences. It is also the natural place to catch characters that cannot start any token,
        such as a stray at-sign, and to record the line and column of every token so later errors can point at the
        right place.
      examples:
        - In a JSON text holding an opening square bracket, the number 42, a comma, a space, the word true and a
          closing square bracket, the lexer hands over five tokens and drops the space.
        - A string that contains spaces, commas or braces is still one token, because the lexer only stops at the
          closing double quote.
        - Compilers, interpreters, syntax highlighters in editors and template engines all start with a lexer before
          anything else looks at the text.
      misconceptions:
        - People think splitting on spaces is enough. Strings can hold spaces, and tokens such as a comma and a
          closing bracket can touch with no space between them.
        - People think the lexer checks whether the text is valid. It only checks that each piece is a valid token;
          the order of the pieces is the parser's job.
        - People think the lexer must finish before the parser starts. Many parsers ask the lexer for one token at a
          time.
      elsewhere:
        - Programming language compilers and interpreters.
        - Syntax highlighting and code formatting in editors.
        - Command-line shells, which split a typed line into words while respecting quotes.

  - slug: recursive-descent-parsing
    name: Recursive descent parsing
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A recursive descent parser has one routine per rule of the grammar, and a rule that contains other rules calls
      their routines, so nesting in the input becomes nesting of calls. It looks at the next token to decide which
      rule applies.
    prerequisites: [ lexical-analysis ]
    resources:
      - title: Crafting Interpreters, Parsing Expressions
        url: https://craftinginterpreters.com/parsing-expressions.html
        opened: true
      - title: Crafting Interpreters, Representing Code (grammars and rules)
        url: https://craftinginterpreters.com/representing-code.html
        opened: true
      - title: Recursive descent parser (Wikipedia)
        url: https://en.wikipedia.org/wiki/Recursive_descent_parser
        opened: true
    lesson:
      how_it_works: >-
        Recursive descent is the most direct way to turn a grammar into a parser. Each rule of the grammar becomes one
        routine. The routine for value looks at the next token and decides which rule applies: a left brace means
        object, a left square bracket means array, a string token means string, and so on. The routine for object
        expects a left brace, then repeatedly expects a string, a colon and a value, separated by commas, and finally
        a right brace. Whenever the object routine needs a value, it calls the value routine, which may call the
        object routine again.


        That is where the name comes from: the parser descends through the grammar from the top rule, and it is
        recursive because rules contain themselves. The nesting in the input becomes nesting of routine calls, and the
        call stack remembers where the parser is in every enclosing object and array.


        Looking at only the next token to choose a rule works for JSON because every kind of value starts with a
        different token. The parser can therefore decide without guessing or backtracking. At any point it knows
        exactly which tokens are allowed next, so the first token that does not fit is a precise place to report an
        error, with what was expected and what was found.
      examples:
        - For an array of two objects, the array routine calls the value routine twice, and each call runs the object
          routine, which itself calls the value routine for every member.
        - When the object routine has read a key and expects a colon but finds a comma, it can say exactly that, at
          the comma's line and column.
        - Many hand-written parsers for real programming languages use recursive descent because errors are easy to
          explain.
      misconceptions:
        - People think a parser needs a parser generator tool. For a grammar like JSON's, hand-written recursive
          descent is short and clear.
        - "People think recursion here is only an implementation detail. It mirrors the grammar, and it brings a real
          limit: very deep nesting uses a lot of stack."
        - People think the parser must build a tree to be useful. A validator can walk the same routines and only
          answer valid or invalid.
      elsewhere:
        - Compilers and interpreters for programming languages.
        - Parsers for configuration formats, query languages and expressions in calculators.
        - Command-line argument parsers that handle nested subcommands.

  - slug: json-grammar
    name: The JSON grammar
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A JSON value is an object, an array, a string, a number, true, false or null, and objects and arrays can hold
      any value, nested as deep as you like. The rules are strict: keys are double-quoted strings, and there are no
      trailing commas or comments.
    related: [ recursive-descent-parsing ]
    resources:
      - title: "RFC 8259: The JavaScript Object Notation (JSON) Data Interchange Format"
        url: https://www.rfc-editor.org/rfc/rfc8259
        opened: true
      - title: ECMA-404, The JSON data interchange syntax
        url: https://ecma-international.org/publications-and-standards/standards/ecma-404/
        opened: true
      - title: Introducing JSON (json.org)
        url: https://www.json.org/json-en.html
        opened: true
      - title: Backus–Naur form (Wikipedia)
        url: https://en.wikipedia.org/wiki/Backus%E2%80%93Naur_form
        opened: true
    lesson:
      how_it_works: >-
        A grammar is a small set of rules that says which sequences of tokens are allowed. JSON's grammar fits on one
        page. A JSON text is one value, with optional whitespace around it. A value is one of seven things: an object,
        an array, a string, a number, true, false or null. An object is a pair of curly braces holding zero or more
        members separated by commas, and each member is a string, a colon and a value. An array is a pair of square
        brackets holding zero or more values separated by commas.


        The rules are recursive: a value can be an object, whose members hold values, which can be objects again. That
        is what lets JSON nest to any depth, and it is why a parser for it is naturally recursive too.


        JSON is strict on purpose. Keys must be double-quoted strings. There is no comma after the last member or
        element. There are no comments. Single quotes are not strings. Numbers have no leading zeros, no plus sign and
        no bare decimal point. Two standards describe the same syntax, ECMA-404 and RFC 8259. RFC 8259 adds advice for
        interoperability, for example that keys inside one object should be unique and that a JSON text exchanged
        between systems must be UTF-8. Older versions said the top level had to be an object or an array; RFC 8259
        allows any value there.
      examples:
        - An object with a comma after its last member looks harmless but is invalid, and strict parsers reject it.
        - A single number or a single string on its own is a valid JSON text under RFC 8259, although some old
          validators reject it.
        - Configuration files that allow comments are not plain JSON; they use an extension such as JSON5 or JSON with
          comments.
      misconceptions:
        - People think JSON is the same as a JavaScript object literal. JavaScript allows unquoted keys, single
          quotes, trailing commas and comments; JSON allows none of them.
        - People think duplicate keys are invalid. The grammar allows them, but RFC 8259 says keys should be unique
          because parsers disagree about which value wins.
        - People think the top level must be an object or array. That was true of the older RFC 4627, not of RFC 8259.
      elsewhere:
        - Web API requests and responses.
        - Configuration files and package manifests.
        - Grammars for every other format and language, written the same way as rules about tokens.

  - slug: conformance-test-suite
    name: Conformance test suites
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      A conformance suite is a shared set of inputs, each with the verdict a correct implementation must give. Running
      it shows whether you follow the specification in the corners nobody thinks of.
    related: [ differential-testing ]
    resources:
      - title: Parsing JSON is a Minefield
        url: https://seriot.ch/security/parsing_json.html
        opened: true
      - title: JSONTestSuite
        url: https://github.com/nst/JSONTestSuite
        opened: true
      - title: JSON_checker and its test suite (json.org)
        url: https://www.json.org/JSON_checker/
        opened: true
      - title: Conformance testing (Wikipedia)
        url: https://en.wikipedia.org/wiki/Conformance_testing
        opened: true
    lesson:
      how_it_works: >-
        Your own tests check the cases you thought of, so they share your blind spots. A conformance suite is a set of
        inputs written by other people, usually to probe the corners of a specification, each labelled with the
        verdict a correct implementation must give: must accept, must reject, or implementation-defined. Running your
        program over the whole suite and comparing its verdicts with the labels finds mistakes you would never have
        tested, such as a number with a capital E and no digits after it, or a lone surrogate escape.


        A good harness runs the suite automatically after every change, derives the expected verdict from each file's
        name or label, compares it with your program's exit status, and lists every mismatch. A rejected valid file
        and an accepted invalid file are both failures; accepting too much is not safer than rejecting too much.


        Suites are not perfect either. The json.org suite is small, and its own checker gets some numbers wrong; one
        of its fail files is a bare string, which RFC 8259 now allows; another is nested 20 levels deep, which only
        fails under a depth limit. Larger suites such as JSONTestSuite split tests into must-pass, must-fail and
        implementation-defined groups. When you deliberately follow a different rule from a test, record the choice
        and the reason instead of hiding the mismatch.
      examples:
        - The JSONTestSuite study ran dozens of popular JSON parsers over hundreds of edge-case files and found that
          almost every one disagreed with the specification somewhere.
        - A team runs a conformance suite in its build so that a refactor of the number lexer cannot quietly start
          accepting a leading zero.
        - Web browsers share large conformance suites so that the same page behaves the same everywhere.
      misconceptions:
        - People think passing their own tests means conforming. Their tests only cover what they already understood.
        - People think a suite's verdicts are always right. Suites age and contain mistakes, so a mismatch is a
          question to settle against the specification.
        - People think accepting an invalid input is harmless. It means your program and a strict one now disagree
          about the same data.
      elsewhere:
        - Browser engines and web platform tests.
        - Compilers checked against language test suites.
        - Protocol implementations such as HTTP and TLS tested against shared vectors.

  # ---- added for wave 1: bits and structures (Huffman, Bloom filter) ----
  - slug: frequency-map
    name: Counting with a map
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      To count how often each symbol occurs, keep a map from symbol to count and add one for every symbol you read.
      One pass over the input is enough, and the map grows with the number of distinct symbols, not with the size of
      the input.
    resources:
      - title: Hash table (Wikipedia)
        url: https://en.wikipedia.org/wiki/Hash_table

  - slug: priority-queue
    name: Priority queues
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      A priority queue hands back the smallest (or largest) item first, whatever order the items were added in. A
      binary heap does this in logarithmic time per insert or removal, which makes it the usual tool for greedy
      algorithms that repeatedly take the two cheapest items.
    resources:
      - title: Priority queue (Wikipedia)
        url: https://en.wikipedia.org/wiki/Priority_queue

  - slug: huffman-coding
    name: Huffman coding
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Huffman coding gives frequent symbols short bit codes and rare symbols long ones. It builds a binary tree by
      repeatedly joining the two least frequent nodes, and each symbol's code is the path from the root to its leaf,
      for example 0 for left and 1 for right.
    prerequisites: [ frequency-map, priority-queue ]
    resources:
      - title: Huffman coding (Wikipedia)
        url: https://en.wikipedia.org/wiki/Huffman_coding

  - slug: prefix-codes
    name: Prefix-free codes
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      In a prefix-free code no code is the start of another, so a stream of bits can be decoded without separators:
      read bits until they spell a whole code, emit its symbol, and start again. Codes read from the leaves of a
      binary tree are prefix-free by construction.
    related: [ huffman-coding ]
    resources:
      - title: Prefix code (Wikipedia)
        url: https://en.wikipedia.org/wiki/Prefix_code

  - slug: bit-packing
    name: Packing flags into bits
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Compact formats pack several small fields into one number: single-bit flags and short numbers at fixed bit
      positions. Programs read and set them with masks and shifts, so one field can change without disturbing the
      others.
    related: [ bytes-vs-characters ]
    resources:
      - title: Bit field (Wikipedia)
        url: https://en.wikipedia.org/wiki/Bit_field
        opened: true
      - title: Mask (computing) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Mask_(computing)
        opened: true
      - title: RFC 1035 (header section format)
        url: https://www.rfc-editor.org/rfc/rfc1035
        opened: true
    lesson:
      how_it_works: >-
        A byte has 8 bits and a 16-bit field has 16, and a format can give each bit, or each small group of bits, its
        own meaning. The DNS header's flags field is an example. Its top bit says whether the message is a query or a
        response. The next four bits hold the operation code. Then come single bits for an authoritative answer, a
        truncated message, recursion desired and recursion available, three reserved bits, and finally four bits for
        the response code.


        To work with such a field, a program uses masks. A mask is a number with ones only in the positions it cares
        about. Combining the field with a mask using AND keeps only those bits, which tests a flag or extracts a
        group. Combining with OR sets bits without touching the rest. Shifting moves a group of bits down to the low
        end so it can be read as a small number, or up into its place before it is combined. For example, recursion
        desired is bit 8 counting from zero at the low end, the mask 0x0100, and setting it on an otherwise empty
        field gives the flags bytes 01 00.


        Mistakes are silent: setting the wrong bit produces a valid-looking message that means something else, such as
        a query marked as a response. Writing each mask once, with a name and a comment pointing at the specification,
        and testing against known bytes catches them.


        Packing saves space and bandwidth, which mattered when these formats were designed, and still matters for
        hardware, network headers and dense storage.
      examples:
        - A teammate sets the top bit of the DNS flags instead of the recursion-desired bit, and servers ignore the
          query because it now claims to be a response.
        - File permissions on Unix pack read, write and execute for owner, group and others into nine bits, which is
          why permissions are written as numbers like 644.
        - A TCP header packs its SYN, ACK, FIN and other flags into single bits of one byte.
      misconceptions:
        - Each flag needs its own byte. Flags usually share bits of one field.
        - Setting a flag means writing a number into the field. Writing replaces the other flags; OR with a mask sets
          one and keeps the rest.
        - Bit positions are obvious. Specifications number bits differently, from the top or from the bottom, so check
          against known bytes.
      elsewhere:
        - Bloom filters and bitmaps store millions of yes or no facts as single bits.
        - Image and audio formats pack colour channels and samples into bit fields.
        - Feature flags and permission systems often store sets of options as bits in one integer.

  - slug: file-header-format
    name: Self-describing file headers
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      A binary file usually starts with a header: a fixed identifier that says what kind of file it is, a version, and
      the numbers a reader needs before the data, such as sizes or a table. Reading checks the identifier and version
      first, so a wrong or newer file is rejected instead of misread, and the header says where the data starts.
    resources:
      - title: List of file signatures (Wikipedia)
        url: https://en.wikipedia.org/wiki/List_of_file_signatures

  - slug: byte-order
    name: Byte order
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A number wider than one byte can be stored with its most significant byte first, big-endian, or least
      significant first, little-endian. Network protocols use big-endian, called network byte order, so programs must
      write and read multi-byte fields explicitly.
    resources:
      - title: Endianness (Wikipedia)
        url: https://en.wikipedia.org/wiki/Endianness
        opened: true
      - title: Beej's Guide to Network Programming (byte order)
        url: https://beej.us/guide/bgnet/html/
        opened: true
      - title: RFC 1035 (data transmission order)
        url: https://www.rfc-editor.org/rfc/rfc1035
        opened: true
    lesson:
      how_it_works: >-
        Memory and files hold bytes, but many values need more than one byte: a 16-bit number spans two bytes and a
        32-bit number four. There are two common ways to lay them out. Big-endian puts the most significant byte
        first, the way we write numbers, so 22 as a 16-bit number is the bytes 00 16 in hexadecimal. Little-endian
        puts the least significant byte first, so the same number is 16 00.


        Most desktop and phone processors are little-endian, while internet protocols such as IP, TCP, UDP and DNS
        specify big-endian, which is therefore called network byte order. A program that copies a number from memory
        straight onto the wire sends it in the machine's order, which is wrong on most machines. The other side then
        reads a different number: the bytes 16 00 read as big-endian are 5632.


        The safe habit is to build and read every multi-byte field explicitly in the order the format specifies, byte
        by byte or with the conversion functions every language provides, and never to depend on the machine's own
        order. Formats define their order and stick to it: some file formats are little-endian, some big-endian, and a
        few, like UTF-16 text, mark the order with a byte order mark at the start.


        Byte order only applies to values wider than a byte. A sequence of single bytes, such as ASCII text, reads the
        same either way.
      examples:
        - A DNS client writes its query ID 22 in the machine's order, the server echoes back the bytes it received,
          and the client reads them as 5632 and rejects the reply as a mismatch.
        - A file written by a program on one machine and read on another with a different byte order gives nonsense
          numbers unless the format fixes the order.
        - Network packet captures show port 53 as the bytes 00 35, because 53 is 0x35 in big-endian order.
      misconceptions:
        - Byte order affects every byte. It affects only values wider than one byte.
        - The machine handles it for you. Only if you use the conversion explicitly, or build the bytes yourself.
        - Big-endian is the norm everywhere. Most processors are little-endian; networks use big-endian.
      elsewhere:
        - Binary file formats such as images, archives and databases each state their byte order.
        - UTF-16 text uses a byte order mark to say which order its 16-bit units are in.
        - Hash and checksum outputs are defined as byte sequences so that every machine gets the same result.

  - slug: round-trip-testing
    name: Round-trip testing
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      When one step undoes another, such as compress and decompress or save and load, feed many inputs through both
      and check that you get back exactly what you started with, byte for byte. Include awkward inputs, such as an
      empty file, a single repeated symbol and every possible byte value.
    related: [ differential-testing ]
    resources:
      - title: Round-trip format conversion (Wikipedia)
        url: https://en.wikipedia.org/wiki/Round-trip_format_conversion

  - slug: hash-functions
    name: Hash functions
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      A hash function turns any input into a fixed-size number. The same input always gives the same number, and a
      good non-cryptographic hash such as FNV-1a spreads similar inputs across the whole range. Different inputs can
      still collide, so code that uses hashes has to decide what a collision means.
    resources:
      - title: Fowler-Noll-Vo hash function (Wikipedia)
        url: https://en.wikipedia.org/wiki/Fowler%E2%80%93Noll%E2%80%93Vo_hash_function

  - slug: bloom-filter
    name: Bloom filters
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      A Bloom filter answers "is this item in the set?" with a bit array and several hash functions. Adding an item
      sets the bit chosen by each hash, and a lookup that finds any of those bits clear means definitely not present.
      All bits set only means probably present, and the bit count and hash count are chosen from the expected number
      of items and the false positive rate you accept.
    prerequisites: [ hash-functions ]
    related: [ bit-packing ]
    resources:
      - title: Bloom filter (Wikipedia)
        url: https://en.wikipedia.org/wiki/Bloom_filter

  # ---- added for wave 1: networking (echo server, web server) ----
  - slug: tcp-sockets
    name: TCP sockets
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      A TCP server binds to an address and port, listens, and accepts connections, each of which becomes its own
      socket. A connection is a two-way stream of bytes that arrives in order, and a read that returns nothing means
      the other side closed it.
    related: [ stream-read-contract ]
    resources:
      - title: Beej's Guide to Network Programming
        url: https://beej.us/guide/bgnet/
        opened: true
      - title: "RFC 9293: Transmission Control Protocol (TCP)"
        url: https://www.rfc-editor.org/rfc/rfc9293
        opened: true
      - title: listen(2), Linux manual page (the backlog)
        url: https://man7.org/linux/man-pages/man2/listen.2.html
        opened: true
      - title: accept(2), Linux manual page
        url: https://man7.org/linux/man-pages/man2/accept.2.html
        opened: true
    lesson:
      how_it_works: >-
        A server asks the operating system for a listening socket bound to an address and a port, for example
        127.0.0.1 and 8080. The address picks which network interface accepts connections: 127.0.0.1 is only reachable
        from the same machine, while 0.0.0.0 accepts connections from anywhere. The port picks which program receives
        them. Ports below 1024 usually need administrator rights.


        When a client connects, the operating system completes the TCP handshake on its own and places the new
        connection in a queue called the backlog. Each time the server accepts, it takes one connection off that queue
        and gets a brand-new socket for it, while the listening socket stays open for the next client. So a busy
        server holds one listening socket and many connection sockets.


        A TCP connection is a two-way stream of bytes. TCP guarantees that the bytes arrive complete and in the order
        they were sent, retransmitting lost packets, but it does not keep any boundaries between sends. Reading from
        the socket returns whatever bytes have arrived so far, which can be part of one message or pieces of several.
        A read that returns no bytes means the other side has closed its sending direction.
      examples:
        - Running a development server on 0.0.0.0 instead of 127.0.0.1 makes it reachable from every machine on the
          café Wi-Fi.
        - A second copy of a server fails to start with an 'address already in use' error, because the first copy
          still holds the listening socket on that port.
        - A load test opens connections faster than the server accepts them; once the backlog is full, new clients see
          their connection attempts time out or get refused.
      misconceptions:
        - People think each send arrives as one read. In fact TCP is a byte stream, so one send can arrive in several
          reads and several sends in one.
        - People think accepting uses the listening socket for the conversation. In fact accept returns a new socket
          per client, and the listening socket keeps waiting.
        - People think a read returning nothing means 'no data yet'. On a blocking socket it means the peer closed the
          connection.
      elsewhere:
        - Every database driver, message broker client and HTTP client sits on top of TCP sockets.
        - Container port mappings and firewall rules are about which address and port a listening socket can be
          reached on.
        - Connection pools in applications exist because opening a TCP connection costs a handshake and time.

  - slug: message-framing
    name: Message framing on a byte stream
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      TCP keeps no message boundaries: two sends can arrive in one read, and one send can arrive split over several. A
      protocol therefore marks where a message ends, with a delimiter such as a newline or a blank line, or with a
      length sent first, and the reader buffers bytes until a whole message is there.
    prerequisites: [ tcp-sockets ]
    related: [ stream-read-contract ]
    resources:
      - title: Stephen Cleary, Message Framing
        url: https://blog.stephencleary.com/2009/04/message-framing.html
        opened: true
      - title: Beej's Guide to Network Programming
        url: https://beej.us/guide/bgnet/
        opened: true
      - title: "RFC 9112: HTTP/1.1 (message body length)"
        url: https://www.rfc-editor.org/rfc/rfc9112
        opened: true
    lesson:
      how_it_works: >-
        Because TCP delivers a stream of bytes with no boundaries, every protocol built on it has to say where one
        message ends and the next begins. That rule is called framing. There are three common ways to do it.


        A delimiter marks the end, such as a newline for line-based protocols or the empty line that ends the head of
        an HTTP request. A length prefix sends the size first, so the reader knows how many bytes to wait for; HTTP's
        Content-Length header does this for a body, and binary protocols often send a fixed-size length field. Closing
        the connection can also mark the end, but then the connection can carry only one message.


        A reader that frames correctly keeps a buffer. It appends each read to the buffer, checks whether a complete
        message is now there, takes it out if so, and keeps any extra bytes for the next message. It never assumes
        that one read equals one message. Getting framing wrong produces bugs that only appear on slow networks or
        under load, when messages start arriving split or glued together.
      examples:
        - A server tested only with curl on localhost works perfectly, then fails for a user on a slow mobile
          connection whose request arrives in three small pieces.
        - A chat app that treats each read as one message sometimes shows two messages fused into one line, because
          both arrived in the same read.
        - An HTTP client reads a response body until it has exactly Content-Length bytes, then reuses the connection
          for the next request.
      misconceptions:
        - People think the receiver sees the same chunks the sender wrote. In fact chunk sizes depend on the network
          and buffers, not on the sender.
        - People think a length prefix is only for binary protocols. HTTP uses one too, in the Content-Length header.
        - People think framing is a problem for the network layer. In fact it is the application's job, because TCP
          deliberately does not do it.
      elsewhere:
        - Redis's protocol prefixes bulk strings with their length, and WebSocket frames carry a length field.
        - Log shippers split streams into records by newline, which is why a log line containing a raw newline breaks
          them.
        - Video and audio container formats use length-prefixed boxes or chunks for the same reason.

  - slug: concurrent-connections
    name: Serving many connections at once
    area: concurrency
    kind: foundation
    status: generated
    brief: >-
      A server that handles one connection at a time makes every other client wait, even for a slow one that sends
      nothing. Giving each connection its own thread, a thread from a pool, or a slot in an event loop lets clients be
      served side by side. Any state they share then needs protecting.
    prerequisites: [ tcp-sockets ]
    resources:
      - title: Dan Kegel, The C10K problem
        url: http://www.kegel.com/c10k.html
        opened: true
      - title: C10k problem (Wikipedia)
        url: https://en.wikipedia.org/wiki/C10k_problem
        opened: true
      - title: Thread pool (Wikipedia)
        url: https://en.wikipedia.org/wiki/Thread_pool
        opened: true
      - title: Event loop (Wikipedia)
        url: https://en.wikipedia.org/wiki/Event_loop
        opened: true
    lesson:
      how_it_works: >-
        A server that handles one connection at a time makes every other client wait in the backlog, and a single slow
        client, one that is on a bad network or deliberately sends nothing, stalls everyone. To serve clients side by
        side there are three main models.


        Thread per connection gives each accepted connection its own thread. It is simple to write, because each
        thread can read and wait as if it were alone, but every thread costs memory and scheduling, so thousands of
        idle connections become expensive. A thread pool keeps a fixed number of worker threads and queues the rest,
        which caps resource use but means a pool full of slow clients still blocks new ones. An event loop uses one or
        a few threads and asks the operating system which sockets are ready, handling each only when it can make
        progress. It scales to many idle connections but requires code that never blocks.


        Whichever model you pick, anything shared between connections, such as a counter, a cache or a log file, can
        now be touched by two of them at the same moment and needs protection. And every model needs limits, because a
        server that accepts without bound runs out of memory or file descriptors under load instead of slowing down
        gracefully.
      examples:
        - A team's internal tool freezes for everyone whenever one person uploads a large file, because it serves one
          request at a time.
        - A server with a pool of 10 threads becomes unreachable when 10 clients open connections and send nothing.
        - The C10k problem described in the early 2000s was about serving ten thousand clients at once, which pushed
          servers toward event loops.
      misconceptions:
        - People think more threads always means more throughput. Past a point, memory and switching between threads
          make the server slower.
        - People think an event loop makes code faster. It makes waiting cheaper; any slow work done on the loop
          blocks every connection.
        - People think concurrency bugs need many users to appear. Two simultaneous requests are enough to corrupt an
          unprotected shared counter.
      elsewhere:
        - Web frameworks, database servers and message brokers each choose one of these models, and their
          configuration options expose its limits.
        - Async and await in modern languages are a way to write event-loop code that reads like sequential code.
        - Serverless platforms run one request per instance, moving the concurrency problem to how many instances they
          start.

  - slug: udp-datagrams
    name: UDP and datagrams
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      UDP sends separate messages called datagrams, each delivered whole or not at all, with no connection, no
      ordering and no retransmission. It suits small request and reply exchanges such as DNS, where a lost message is
      simply asked again.
    related: [ tcp-sockets ]
    resources:
      - title: "RFC 768: User Datagram Protocol"
        url: https://www.rfc-editor.org/rfc/rfc768
        opened: true
      - title: Beej's Guide to Network Programming
        url: https://beej.us/guide/bgnet/html/
        opened: true
      - title: User Datagram Protocol (Wikipedia)
        url: https://en.wikipedia.org/wiki/User_Datagram_Protocol
        opened: true
    lesson:
      how_it_works: >-
        UDP is the thin alternative to TCP. Instead of a connection that carries a stream of bytes, a program sends
        datagrams: self-contained messages, each with the destination address and port attached. The receiver gets
        each datagram as one unit. A receive call returns exactly one datagram together with the address and port it
        came from, never half of one and never two glued together. That is the opposite of TCP, where the boundaries
        between writes disappear.


        UDP promises very little. A datagram can be lost, duplicated or arrive after one sent later, and nobody
        resends it. There is no handshake, so there is also no notion of a connected client: a server simply receives
        datagrams from many senders on one socket and must reply to the address that came with each one.


        Size matters. A datagram has an 8-byte header and must fit in one IP packet, and a receive buffer smaller than
        the datagram silently loses the rest of it on most systems. Large datagrams may be fragmented by IP, and
        losing any fragment loses the whole datagram, so protocols over UDP keep messages small. Classic DNS limits a
        UDP reply to 512 bytes and marks a reply that did not fit as truncated, telling the client to ask again over
        TCP.


        Because nothing is guaranteed, the application adds what it needs: a timeout and a limited number of retries
        for requests, an ID to match replies to questions, and sometimes its own ordering. In return it gets low
        latency, no connection setup and the ability to talk to many peers from one socket.
      examples:
        - A DNS lookup is one small datagram out and one back. If the reply is lost, the resolver waits a second or
          two and asks again, which is cheaper than setting up a TCP connection for every lookup.
        - "Video calls and online games use UDP because a late packet is useless: it is better to skip it than to
          stall everything while it is resent."
        - A logging agent that fires metrics over UDP keeps the application fast, at the price of losing a few metrics
          when the network is busy.
      misconceptions:
        - UDP is unreliable, so it is broken. It is simply minimal; the application decides how much reliability it
          needs.
        - A UDP server has a connection per client. It has one socket and a stream of datagrams from many addresses,
          and must reply to each sender's address.
        - Datagrams can be any size. Large ones are fragmented or dropped, and a receive buffer that is too small cuts
          them short.
      elsewhere:
        - QUIC, the transport under HTTP/3, runs over UDP and builds its own reliability and encryption on top.
        - Service discovery and network time use small UDP exchanges for the same reasons DNS does.
        - Firewalls and NAT routers keep a short-lived mapping for UDP flows, which is why some UDP replies never
          arrive on restrictive networks.

  - slug: graceful-shutdown
    name: Graceful shutdown
    area: concurrency
    kind: foundation
    status: generated
    brief: >-
      To stop a server without losing work, first stop accepting new connections, then let the work already in flight
      finish, then close what is left. A time limit keeps one stuck client from blocking the exit forever.
    related: [ concurrent-connections ]
    resources:
      - title: Kubernetes, Pod Lifecycle (termination of pods)
        url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
        opened: true
      - title: Controlling nginx (graceful shutdown)
        url: https://nginx.org/en/docs/control.html
        opened: true
      - title: signal(7), Linux manual page
        url: https://man7.org/linux/man-pages/man7/signal.7.html
        opened: true
    lesson:
      how_it_works: >-
        Stopping a server abruptly cuts off every request in flight: a download stops halfway, a form submission may
        or may not have been saved, and clients see errors. A graceful shutdown stops in a defined order instead.


        First the server stops accepting new connections, usually by closing its listening socket, so new clients go
        elsewhere or retry. Then it lets the requests already in progress finish, while telling clients on kept-alive
        connections not to send more, for example by answering with Connection: close. Finally, after the in-flight
        work is done, it closes the remaining connections and releases resources such as files and database
        connections. A time limit bounds the whole process, so one stuck client cannot keep the server alive forever;
        when it expires, the server closes what is left.


        Shutdown is usually triggered by a signal from the operating system or a process manager, such as an interrupt
        from Ctrl+C or a termination request from a deployment system. The server has to catch that signal and start
        the sequence instead of dying immediately. Process managers wait a set time and then force the process to
        stop, so the server's own limit must be shorter.
      examples:
        - During a deployment, users see a burst of errors because old server instances are killed in the middle of
          requests.
        - Kubernetes sends a termination signal, waits a grace period, then kills the container, so a server must
          finish its work inside that period.
        - nginx can be told to quit gracefully, finishing current requests with old workers while new workers take new
          connections.
      misconceptions:
        - People think closing the listening socket ends the open connections. It only stops new ones; existing
          connections stay open until closed.
        - People think waiting for every request is safe. Without a time limit, one hung client blocks the shutdown
          forever.
        - People think shutdown handling only matters for huge sites. Every deployment or restart of a small service
          runs through it.
      elsewhere:
        - "Job workers drain their queues the same way: stop taking jobs, finish the current one, then exit."
        - Databases flush and close cleanly on shutdown to avoid recovery work on the next start.
        - Load balancers 'drain' a server by sending it no new traffic before it is removed.

  - slug: http-message-format
    name: The HTTP message format
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      An HTTP/1.1 request is a request line with the method, path and version, then header lines, then an empty line,
      then an optional body. A response has the same shape, starting with a status line such as 200 OK. Every line
      ends with a carriage return and a newline, and the empty line is what ends the headers.
    prerequisites: [ message-framing ]
    resources:
      - title: MDN, HTTP messages
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Messages
        opened: true
      - title: "RFC 9112: HTTP/1.1"
        url: https://www.rfc-editor.org/rfc/rfc9112
        opened: true
      - title: "RFC 9110: HTTP Semantics"
        url: https://www.rfc-editor.org/rfc/rfc9110
        opened: true
      - title: MDN, HTTP response status codes
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
        opened: true
    lesson:
      how_it_works: >-
        HTTP/1.1 is text with a strict shape. A request begins with a request line of three parts separated by single
        spaces: the method, such as GET, the request target, such as /index.html, and the version, HTTP/1.1. Header
        lines follow, each a name, a colon and a value, such as Host: localhost. An empty line ends the head. A body
        may follow, and the head says how long it is.


        Every line ends with a carriage return and a line feed, written CRLF. Clients that send only a line feed
        exist, so robust servers accept both, but servers should always send CRLF. A response has the same shape,
        except that it starts with a status line: the version, a three-digit status code and a short reason phrase,
        such as HTTP/1.1 404 Not Found.


        The first digit of the status code is its class: 2 means success, 3 a redirect, 4 a mistake by the client, and
        5 a failure on the server. Clients act on the number, not the phrase, so returning 200 with an error page, or
        400 when you mean 404, misleads every program that reads the reply. HTTP/1.1 also requires a Host header in
        each request, which lets one server answer for several site names.
      examples:
        - A monitoring tool reports a site as healthy because its error page is sent with status 200 instead of 500.
        - Running curl with -i shows the status line and every header, which is the quickest way to see exactly what a
          server sent.
        - One machine serves both example.com and example.org, choosing the site from the Host header of each request.
      misconceptions:
        - People think the reason phrase matters. Clients rely only on the code; the phrase is for people reading it.
        - People think 400 means 'not found'. 400 means the request itself was malformed; 404 means the target does
          not exist.
        - People think headers end at the first blank-looking line. They end at the empty line, a CRLF immediately
          after the previous CRLF.
      elsewhere:
        - REST APIs communicate success and failure through these same status codes.
        - Reverse proxies and load balancers parse and rewrite request lines and headers on every request.
        - HTTP/2 and HTTP/3 keep the same methods, headers and status codes but send them in a binary framing.

  # ---- added for wave 1: backends (URL shortener, rate limiter) ----
  - slug: rest-api-design
    name: Designing a resource API over HTTP
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      A REST-style API names resources with URLs and acts on them with HTTP methods, answering with status codes that
      say what happened. Clear resources, the right method and honest status codes let any client, proxy or monitor
      understand the API without reading its bodies.
    prerequisites: [ http-message-format ]
    resources:
      - title: "Roy Fielding, Chapter 5: Representational State Transfer (REST)"
        url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
        opened: true
      - title: MDN, HTTP request methods
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods
        opened: true
      - title: "RFC 9110: HTTP Semantics (status codes)"
        url: https://www.rfc-editor.org/rfc/rfc9110
        opened: true
    lesson:
      how_it_works: >-
        HTTP already has a vocabulary for working with things on a server. REST, the architectural style described by
        Roy Fielding, uses it directly. Each thing the API offers, such as a short link, is a resource with its own
        URL. Methods say what to do with it: GET reads it, POST to a collection creates a new member, PUT replaces it,
        DELETE removes it. Requests carry everything needed to serve them, so the server does not depend on remembered
        conversation state.


        Status codes carry the outcome, and they matter more than the body. 200 OK means success with a body. 201
        Created says a new resource exists, with a Location header naming it. 400 Bad Request says the client sent
        something invalid, and a good error body names the problem, such as a missing field. 404 Not Found says the
        resource does not exist. 409 Conflict says the request clashes with the current state. 5xx codes say the
        server failed. Clients, retry logic, caches and monitoring all act on these codes, so an API that answers 200
        with an error message inside defeats them all.


        Representations, usually JSON, are what the resource looks like on the wire. Consistent field names, a stable
        error shape and a clear content type make an API easy to use. Methods also bring promises: GET must not change
        anything, and PUT and DELETE must be safe to repeat, so clients can retry them.


        Good design is mostly about being predictable. A developer who has used one well-designed HTTP API can guess
        how yours works.
      examples:
        - A mobile client treats every 200 as success, so an API that answers errors with 200 and a message inside
          makes the app silently show broken data.
        - A shortening service answers a POST with 201 Created and the new short URL, and answers a body without a url
          field with 400 and a message naming url.
        - Monitoring counts 5xx replies to alert on outages, which works only if the API uses them for its own
          failures.
      misconceptions:
        - Any URL with JSON is a REST API. Resources, methods and status codes are what make it one.
        - The status code is a detail; the body tells the story. Clients, proxies and monitors act on the code.
        - POST is for everything that changes data. PUT and DELETE exist so that replacing and removing can be retried
          safely.
      elsewhere:
        - Most public web APIs follow these conventions, which is why generic HTTP tools can explore them.
        - API gateways route, cache and rate-limit by method and path.
        - Specifications such as OpenAPI describe resources, methods and status codes so clients can be generated.

  - slug: http-redirects
    name: HTTP redirects
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      A server can answer with a 3xx status and a Location header that sends the client to another URL. The status
      says whether the move is permanent or temporary and whether the method is kept, and permanent redirects are
      cached.
    prerequisites: [ http-message-format ]
    resources:
      - title: MDN, Redirections in HTTP
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections
        opened: true
      - title: MDN, 301 Moved Permanently
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/301
        opened: true
      - title: MDN, 302 Found
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/302
        opened: true
      - title: OWASP Unvalidated Redirects and Forwards Cheat Sheet
        url: https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        opened: true
    lesson:
      how_it_works: >-
        A redirect is a reply that says the content is elsewhere. The status code is in the 300 range and the Location
        header holds the new URL, which may be relative to the URL that was requested. A client that follows it sends
        a new request to that address, possibly on another host and with another scheme.


        The codes differ in two ways. Permanence: 301 Moved Permanently and 308 Permanent Redirect say the old URL is
        gone for good, so browsers and search engines may remember the new one and stop asking; 302 Found and 307
        Temporary Redirect say it is temporary, so clients keep using the original URL. Method: 307 and 308 require
        the client to repeat the same method and body, while for 301 and 302 clients historically changed a POST into
        a GET, and 303 See Other asks for a GET explicitly.


        Caching is the part that surprises people. A browser may cache a 301 indefinitely and go straight to the new
        address on later visits, without contacting the original server at all. A 302 is not cached unless the server
        says so. For a service that wants to see every visit, such as a link shortener counting clicks, that
        difference is decisive.


        Following redirects automatically has risks. A chain can loop, so clients limit the number of hops. A redirect
        can lead to another host, so clients must not forward credentials or cookies meant for the first one, and
        should be wary of moving from https to http.
      examples:
        - A link shortener switched from 302 to 301 to look more permanent, and its click counts stopped growing,
          because browsers now skipped it.
        - A site moves from http to https and answers every plain-http request with a 301 to the same path on https.
        - A misconfigured server redirects a page to itself, and the browser gives up after about twenty hops with a
          too many redirects error.
      misconceptions:
        - All redirects are the same. They differ in permanence, caching and whether the method is kept.
        - A 301 can be undone instantly. Browsers that cached it keep using the new URL until their cache expires or
          is cleared.
        - Following a redirect is always safe. It can loop, change host, or downgrade to plain http.
      elsewhere:
        - Single sign-on flows bounce the browser between sites with redirects carrying codes in the URL.
        - Open redirects, where a site redirects to any URL in a parameter, are abused in phishing.
        - APIs use 303 See Other after a POST so that refreshing the page does not repeat the POST.

  - slug: short-id-generation
    name: Short IDs, key spaces and collisions
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      Short identifiers are drawn from a limited key space, such as 6 characters of base62. The birthday effect makes
      collisions likely long before the space is full, so a service must detect them and choose a strategy: rehash,
      count, or pick at random and retry.
    related: [ hash-functions ]
    resources:
      - title: Birthday problem (Wikipedia)
        url: https://en.wikipedia.org/wiki/Birthday_problem
        opened: true
      - title: Hash collision (Wikipedia)
        url: https://en.wikipedia.org/wiki/Hash_collision
        opened: true
      - title: Base62 (Wikipedia)
        url: https://en.wikipedia.org/wiki/Base62
        opened: true
      - title: URL shortening (Wikipedia)
        url: https://en.wikipedia.org/wiki/URL_shortening
        opened: true
    lesson:
      how_it_works: >-
        A short link needs a short, unique key. Base62 uses the 62 characters a to z, A to Z and 0 to 9, which are
        safe in URLs and easy to type. A key of length n has 62 to the power n possible values: about 56.8 billion for
        6 characters and about 3.5 trillion for 7.


        There are several ways to make keys. Hashing the long URL and writing the hash in base62, keeping the first
        few characters, gives the same key for the same URL every time, which makes creation repeatable. A counter
        written in base62 gives every new link the next key, which never collides but reveals how many links exist and
        lets people guess others. A random key hides that, but must be checked against the store.


        Collisions come sooner than intuition suggests. By the birthday effect, among randomly chosen keys a repeat
        becomes likely once the number of keys reaches roughly the square root of the key space. For 6 base62
        characters that is a few hundred thousand keys, not billions. A truncated hash behaves the same way. So every
        scheme except a counter must detect when a key is already taken by a different URL and pick another, for
        example by adding a counter or a salt to the input and hashing again.


        The store should enforce uniqueness itself, with a unique constraint or an atomic insert-if-absent, so that
        two requests racing for the same key cannot both win. Longer keys make collisions rarer but links longer, and
        that trade-off is a product decision.
      examples:
        - A shortener cuts its keys to two characters for a test and sees collisions after a few dozen links, which
          proves its collision handling works.
        - A service that issues sequential keys lets anyone walk through every link by counting upwards.
        - A team assumed 6-character keys would never collide and lost links when two URLs hashed to the same prefix.
      misconceptions:
        - Collisions only happen when the key space is nearly full. They become likely around the square root of its
          size.
        - A good hash never collides. Any hash cut to a few characters collides; the question is how often.
        - Checking that a key is free, then inserting it, is safe. Two requests can pass the check at once unless the
          store makes the insert atomic.
      elsewhere:
        - Git abbreviates commit hashes to the shortest prefix that is still unique in the repository.
        - Order numbers, invite codes and ticket IDs face the same choice between counters, hashes and random codes.
        - Unique IDs in distributed systems combine time, machine and sequence to avoid coordination and collisions.

  - slug: key-value-store
    name: Key-value stores
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      A key-value store keeps values under unique keys and offers three basic operations: put, get and delete. It does
      no joins or searches inside values, which is what makes it fast and simple to scale.
    resources:
      - title: Key–value database (Wikipedia)
        url: https://en.wikipedia.org/wiki/Key%E2%80%93value_database
        opened: true
      - title: Hash table (Wikipedia)
        url: https://en.wikipedia.org/wiki/Hash_table
        opened: true
      - title: Redis data types
        url: https://redis.io/docs/latest/develop/data-types/
        opened: true
    lesson:
      how_it_works: >-
        A key-value store maps each unique key to one value. The core operations are to store a value under a key,
        read the value for a key, and delete a key. Underneath, an in-memory store usually keeps a hash table: the key
        is turned into a number by a hash function, the number picks a slot, and the value lives at that slot. Finding
        a key therefore takes about the same time whether the store holds a thousand keys or ten million, because the
        work does not depend on how many keys there are.


        The price of that speed is that the store only knows how to find values by their exact key. It cannot answer
        "all users older than 30" or sort values unless you build extra structures for it, such as a second key that
        holds a sorted list. Designing keys well, for example session:42 or user:7:cart, is how you make a key-value
        store answer the questions you need.


        Values can have types. Redis stores strings, which may hold text, numbers or bytes, and also lists, sets,
        hashes and sorted sets. Each key holds exactly one type, and a command meant for one type refuses a key of
        another type with an error rather than guessing what you meant. Commands on a type, such as adding to the head
        of a list, are implemented with the data structure that suits them, so they stay fast.


        Keeping everything in memory makes reads and writes very fast, but memory is limited and lost on a restart,
        which is why expiry and persistence matter so much for such a store.
      examples:
        - A web app keeps each logged-in session under a key such as session plus a random token, and reads it on
          every request in well under a millisecond.
        - A shop keeps each cart as a list under the user's id, adding items to the tail as they are chosen.
        - A cache stores the rendered HTML of a page under its URL, so the next request skips the database entirely.
      misconceptions:
        - People think a key-value store can search inside its values. It can only find values by their exact key
          unless you maintain extra keys that act as an index.
        - People think more keys always means slower lookups. With a hash table the time to find one key stays about
          the same as the store grows.
        - People think a value's type can change freely. In Redis a key holds one type, and a list command on a string
          key is refused.
      elsewhere:
        - Browser local storage, configuration services and distributed caches all expose the same get, put and delete
          model.
        - Many databases use a key-value engine underneath and build tables and indexes on top of it.
        - Content-addressed storage, such as Git's object store, uses the hash of the content as the key.

  - slug: idempotency
    name: Idempotent and safe requests
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      An operation is idempotent when doing it twice has the same effect as doing it once. In HTTP, GET, PUT and
      DELETE are idempotent and POST is not, which decides which requests can be retried safely after a timeout.
    related: [ rest-api-design ]
    resources:
      - title: "RFC 9110: HTTP Semantics (idempotent methods)"
        url: https://www.rfc-editor.org/rfc/rfc9110
        opened: true
      - title: "MDN Glossary: Idempotent"
        url: https://developer.mozilla.org/en-US/docs/Glossary/Idempotent
        opened: true
      - title: "Stripe API Reference: Idempotent requests"
        url: https://docs.stripe.com/api/idempotent_requests
        opened: true
    lesson:
      how_it_works: >-
        Networks lose replies. When a client sends a request and hears nothing back, it cannot tell whether the
        request never arrived or the reply was lost after the work was done. Retrying is only safe if doing the work
        twice causes no harm. That property is called idempotency: repeating the request leaves the system in the same
        state as doing it once.


        HTTP defines it per method. GET, HEAD and OPTIONS are safe, meaning they should not change anything, and
        therefore idempotent. PUT replaces a resource with the given representation, so putting the same thing twice
        ends in the same state. DELETE removes a resource, and deleting it again leaves it just as removed, even if
        the second reply says it was not found. POST is not idempotent: posting an order twice usually creates two
        orders.


        Idempotency is about the effect on the server, not the reply. A second DELETE may answer 404 instead of 200
        and still be idempotent. It is also a promise each service must keep: a GET that updates a counter or a PUT
        that appends to a list breaks it.


        For operations that must not run twice but are not naturally idempotent, services accept an idempotency key:
        the client sends a unique value with the request, and the server remembers which keys it has completed and
        returns the stored result for a repeat. Designing creation so that the same input returns the same result,
        such as a shortener returning the existing key for a URL it has seen, achieves the same thing.
      examples:
        - A payment request times out on a train. Without an idempotency key, the app does not know whether to retry,
          and retrying might charge the customer twice.
        - A URL shortener that returns the existing key when the same long URL is posted again lets clients retry
          freely.
        - Automatic retries in HTTP clients and proxies are usually limited to idempotent methods for exactly this
          reason.
      misconceptions:
        - Idempotent means the reply is always the same. It means the effect on the server is the same.
        - POST can be retried like GET. It can create duplicates unless the service adds an idempotency key.
        - A second DELETE must answer 200 to be idempotent. Answering 404 is fine; the state is the same.
      elsewhere:
        - Message queues deliver some messages more than once, so consumers are written to be idempotent.
        - Database migrations and deployment scripts are written so that running them twice does no harm.
        - Payment and order APIs commonly accept an idempotency key header.

  - slug: token-bucket
    name: Token bucket rate limiting
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      A token bucket holds up to a fixed number of tokens and refills at a steady rate. Each request takes one token,
      and a request that finds the bucket empty is rejected. The capacity sets how big a burst can be, and the refill
      rate sets the long-run average.
    resources:
      - title: Token bucket (Wikipedia)
        url: https://en.wikipedia.org/wiki/Token_bucket
        opened: true
      - title: Stripe, Scaling your API with rate limiters
        url: https://stripe.com/blog/rate-limiters
        opened: true
      - title: Brandur Leach, Rate Limiting, Cells, and GCRA
        url: https://brandur.org/rate-limiting
        opened: true
      - title: smudge.ai, Visualizing algorithms for rate limiting
        url: https://smudge.ai/blog/ratelimit-algorithms
        opened: true
    lesson:
      how_it_works: >-
        Picture a bucket for each client that can hold a fixed number of tokens, its capacity. Tokens drip into the
        bucket at a steady rate, and any token that arrives when the bucket is already full is thrown away. Every
        request must take one token to be served. A request that finds the bucket empty is rejected, or in some
        designs made to wait.


        The two settings do different jobs. The capacity is the largest burst a client can send at once after being
        quiet: a bucket of 10 lets ten requests through back to back. The refill rate is the long-run average: once
        the bucket is empty, a client can send only as fast as tokens arrive. A quiet client builds up credit, but
        never more than the capacity, so it cannot save up an unlimited burst.


        The bucket does not need a timer. When a request arrives, the limiter can work out how many tokens were earned
        since the last request from the time that has passed, add them up to the capacity, and then try to take one.
        So the state per client is just two numbers: the token count and the time of the last update.


        This shape matches real clients well. An app that opens and makes several calls at once, then goes quiet,
        passes freely, while a script that hammers the API is held to the refill rate. That is why many public APIs
        use it. Its relative, the leaky bucket, holds requests in a queue and releases them at a fixed rate, smoothing
        the output instead of allowing bursts.
      examples:
        - A payments API lets each account burst to a few hundred requests while holding the long-run rate to a
          hundred per second.
        - A mobile app sends eight calls when it starts. With a capacity of ten they all pass, and the bucket refills
          while the user reads the screen.
        - A network router shapes traffic with the same idea, measuring tokens in bytes instead of requests.
      misconceptions:
        - People think the capacity and the rate are the same limit. The capacity bounds a burst; the rate bounds the
          average over time.
        - People think a token bucket needs a background job to add tokens. The tokens earned can be worked out from
          the elapsed time when a request arrives.
        - People think a client that was idle for an hour can send an hour's worth of requests. It can send at most
          the capacity.
      elsewhere:
        - Network traffic shaping and quality-of-service in routers.
        - Client libraries that pace their own outgoing calls to stay under a provider's limit.
        - The generic cell rate algorithm, a token bucket stored as a single timestamp, used in some rate-limiting
          modules.

  - slug: fixed-window-counter
    name: Fixed window counter
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      A fixed window limiter cuts time into windows of equal length, such as each whole minute, counts each client's
      requests in the current window and rejects those over the limit. It is cheap, but the count resets at every
      boundary, so a client can get up to twice the limit across one.
    related: [ token-bucket ]
    resources:
      - title: Figma, An alternative approach to rate limiting
        url: https://www.figma.com/blog/an-alternative-approach-to-rate-limiting/
        opened: true
      - title: smudge.ai, Visualizing algorithms for rate limiting
        url: https://smudge.ai/blog/ratelimit-algorithms
        opened: true
      - title: Cloudflare, How we built rate limiting capable of scaling to millions of domains
        url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
        opened: true
    lesson:
      how_it_works: >-
        A fixed window limiter divides time into windows of equal length that line up with the clock, for example each
        whole minute. Every request belongs to the window that contains its time, found by rounding the time down to
        the start of the window. The limiter keeps one counter per client and window, adds one for each accepted
        request, and rejects requests once the counter reaches the limit. When the next window starts, a new counter
        starts at zero.


        This is the simplest limiter there is. It needs one small number per client, it is easy to explain to users,
        and the counters for old windows can simply be thrown away.


        Its weakness is the boundary. The rule is "at most N per window", not "at most N in any minute". A client can
        send N requests in the last second of one window and N more in the first second of the next, and both windows
        accept them, so 2N requests arrive within about two seconds. If the limit exists to protect a slow database,
        that burst is exactly what it was meant to prevent.


        The other algorithms in this project exist largely to fix that seam: the sliding window log counts exactly
        over any span, and the sliding window counter approximates it cheaply.
      examples:
        - An API that resets its quota on the hour lets a script spend the whole quota at 9:59 and again at 10:00.
        - A gym that allows three visits per calendar week turns away a fourth visit on Saturday but lets the same
          member in on Monday morning.
        - Daily quotas on free plans, which reset at midnight, are fixed windows a day long.
      misconceptions:
        - People think a fixed window guarantees at most N requests in any window-length span. It only bounds each
          aligned window.
        - People think the boundary burst needs bad luck. A client that knows the window length can aim for it on
          purpose.
      elsewhere:
        - Monthly billing quotas and data caps.
        - Metrics systems that count events per minute bucket.
        - Login attempt counters that reset each hour.

  - slug: sliding-window-log
    name: Sliding window log
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      A sliding window log keeps the time of every accepted request. For each new request it drops the times older
      than the window and accepts the request only if fewer than the limit remain. It is exact, but its memory grows
      with the traffic.
    related: [ fixed-window-counter ]
    resources:
      - title: Figma, An alternative approach to rate limiting
        url: https://www.figma.com/blog/an-alternative-approach-to-rate-limiting/
        opened: true
      - title: smudge.ai, Visualizing algorithms for rate limiting
        url: https://smudge.ai/blog/ratelimit-algorithms
        opened: true
    lesson:
      how_it_works: >-
        Instead of counting requests in fixed blocks of time, a sliding window log remembers when each accepted
        request happened. For each client it keeps a list of timestamps. When a new request arrives, the limiter first
        removes every timestamp older than one window length, then counts what is left. If the count is below the
        limit, the request is accepted and its time is added to the list; otherwise it is rejected and nothing is
        added.


        Because the window always ends at the current moment, there are no boundaries to exploit. No stretch of time
        one window long can ever contain more accepted requests than the limit, which is exactly the guarantee the
        fixed window fails to give.


        The cost is memory and work. The list holds one entry per accepted request in the last window, so a limit of
        1,000 per hour means up to 1,000 timestamps per client. Under a flood, or for clients with high limits, the
        lists are at their largest, so the limiter becomes most expensive precisely when the system is under the most
        pressure.


        Two details are easy to get wrong. Rejected requests must not be added to the log, or a client that keeps
        retrying stays blocked for ever. And old entries must really be removed from the stored list, not just skipped
        when counting, or the list grows without end.
      examples:
        - A library lets you borrow three books in any fourteen days. Each time you ask, the librarian crosses out
          loans older than fourteen days and counts the rest.
        - A security system allows five failed logins in any ten minutes, counted exactly from the times of the
          failures.
        - A team replaces its log with a sliding window counter after the logs for a few busy customers use most of
          the limiter's memory.
      misconceptions:
        - People think logging rejected requests is harmless. It makes a retrying client look busier and can block it
          permanently.
        - People think the log's memory is fixed per client. It grows with the limit and with the traffic.
      elsewhere:
        - Sorted sets in key-value stores are a common way to keep one such log per client.
        - Fraud checks that look at every event in the last hour.
        - Moving averages over the last N seconds in monitoring tools.

  - slug: sliding-window-counter
    name: Sliding window counter
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      A sliding window counter keeps only two counts, for the current and the previous fixed window, and estimates the
      last window as the current count plus the previous count weighted by how much of it still overlaps. It is
      approximate but costs two numbers per client.
    prerequisites: [ fixed-window-counter ]
    resources:
      - title: Cloudflare, How we built rate limiting capable of scaling to millions of domains
        url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
        opened: true
      - title: Figma, An alternative approach to rate limiting
        url: https://www.figma.com/blog/an-alternative-approach-to-rate-limiting/
        opened: true
      - title: smudge.ai, Visualizing algorithms for rate limiting
        url: https://smudge.ai/blog/ratelimit-algorithms
        opened: true
    lesson:
      how_it_works: >-
        The sliding window counter is a compromise between the cheap fixed window and the exact log. It keeps fixed,
        clock-aligned windows and their counters, but it uses the previous window's counter as well as the current one
        to estimate how many requests arrived in the last full window length.


        Suppose windows are one minute and a request arrives 15 seconds into the current window. The last minute then
        covers the 15 seconds of the current window and the final 45 seconds of the previous one. The limiter adds the
        current window's count to three quarters of the previous window's count, because three quarters of the
        previous window still overlaps the last minute. If that estimate is below the limit, the request is accepted
        and the current count goes up by one.


        The estimate assumes the previous window's requests were spread evenly across it. If they all came at its
        start, the estimate is a little too high; if they came at its end, a little too low. In practice the error is
        small: one large provider measured wrong decisions on a tiny fraction of requests across hundreds of millions.
        In exchange, each client costs two counters no matter how much traffic it sends.


        It also fixes the boundary burst: right after a boundary the previous window still counts almost in full, so a
        client that spent its limit just before the boundary cannot spend it again just after.
      examples:
        - A content delivery network uses this method to apply limits across millions of sites without storing a
          timestamp per request.
        - A design tool's API team moved from a log to two counters per user and cut the limiter's memory sharply.
        - Just after a new window starts, a client that used its whole limit in the previous minute is still rejected,
          because the previous count is weighted almost fully.
      misconceptions:
        - People think an approximation means a weak limit. The error is bounded and small, and it never lets through
          twice the limit like a fixed window can.
        - People think the weight depends on when the previous requests happened. It depends only on how far into the
          current window we are.
      elsewhere:
        - Rolling averages in monitoring that blend two buckets instead of storing every sample.
        - Approximate counting in large-scale analytics, where exactness is traded for fixed memory.

  - slug: distributed-counters
    name: Counting across several servers
    area: concurrency
    kind: foundation
    status: generated
    brief: >-
      When several servers enforce one limit, the count has to live in a shared store and be updated atomically.
      Counts kept in each server's memory let a client spread across N servers get N times the limit, and
      read-then-write updates in the store lose counts.
    related: [ key-value-store ]
    resources:
      - title: Redis, INCR (includes the rate limiter pattern)
        url: https://redis.io/docs/latest/commands/incr/
        opened: true
      - title: Stripe, Scaling your API with rate limiters
        url: https://stripe.com/blog/rate-limiters
        opened: true
      - title: Cloudflare, How we built rate limiting capable of scaling to millions of domains
        url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
        opened: true
    lesson:
      how_it_works: >-
        A limiter that keeps its counts in its own memory works only while there is one copy of the server. Real
        services run several copies behind a load balancer, and each copy then enforces the limit on its own. A client
        whose requests are spread across three copies gets three times the limit, and the exact amount depends on how
        the load balancer happens to route.


        The usual fix is to move the counts into a shared store, often an in-memory key-value store, that every copy
        talks to. Now every server sees the same count for a client. But the store brings back the race from a single
        server, across the network: if each server reads the count, decides, and writes the new value, two servers can
        both read 59 against a limit of 60 and both accept. The update has to be one atomic step in the store, such as
        an increment that returns the new value, after which the server compares the result with the limit. More
        complex algorithms run as a single script inside the store so that all their steps happen together.


        Keys must say whose count they are and for which window, and they need an expiry so old windows disappear on
        their own.


        The store is now on the path of every request, so its speed and availability matter. Teams must decide what
        happens if it is down: let requests through, which keeps the service working but unprotected, or reject them,
        which protects the backend but fails users. Very large systems sometimes keep approximate counts locally and
        reconcile them, trading exactness for less traffic to the store.
      examples:
        - A payments company runs its limiter against a cluster of in-memory stores shared by all its API servers.
        - Three web servers each allow 100 requests per minute; a client spread across them really gets 300 until the
          counts move to a shared store.
        - When the shared store went down, a team's limiter let all traffic through by design, so the API stayed up
          during the outage.
      misconceptions:
        - People think a shared store alone fixes the problem. Updates must still be atomic, or counts are lost.
        - People think the limiter cannot affect availability. It now depends on the store, so its failure mode must
          be chosen on purpose.
      elsewhere:
        - View counters, likes and inventory counts in large web services.
        - Distributed locks and leases built on the same shared stores.
        - Approximate counting structures used when exact global counts are too expensive.

  # ---- added for wave 2: text algorithms (sort, diff, comment remover) ----
  - slug: lexicographic-order
    name: Ordering text
    area: text-encodings
    kind: foundation
    status: generated
    brief: >-
      Sorting text compares two strings character by character and decides at the first difference, so apple comes
      before apricot and a shorter prefix comes first. Comparing raw byte values puts every capital letter before
      every small one, while a locale's collation rules order text the way a dictionary does, so the same lines can
      sort differently on two machines.
    related: [ bytes-vs-characters ]
    resources:
      - title: Lexicographic order (Wikipedia)
        url: https://en.wikipedia.org/wiki/Lexicographic_order
      - title: GNU coreutils, sort invocation
        url: https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html

  - slug: sorting-algorithms
    name: Sorting algorithms
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      Merge sort, quicksort, heapsort and radix sort all put items in order but differ in cost. Merge sort is stable,
      meaning equal items keep their input order, and always takes order n log n time; quicksort is usually faster but
      can degrade on unlucky input; heapsort needs no extra memory; radix sort avoids comparisons altogether.
    prerequisites: [ time-space-complexity ]
    resources:
      - title: Sorting algorithm (Wikipedia)
        url: https://en.wikipedia.org/wiki/Sorting_algorithm

  - slug: external-sorting
    name: Sorting more than fits in memory
    area: streams-io
    kind: foundation
    status: generated
    brief: >-
      When the input is larger than memory, sort it in pieces that fit, write each sorted piece to a temporary file,
      then merge the pieces by repeatedly taking the smallest front line among them. Only one line per piece needs to
      be in memory during the merge.
    prerequisites: [ sorting-algorithms ]
    related: [ streaming-constant-memory ]
    resources:
      - title: External sorting (Wikipedia)
        url: https://en.wikipedia.org/wiki/External_sorting

  - slug: time-space-complexity
    name: How cost grows with input
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      Big O notation describes how the time or memory an algorithm needs grows as the input grows, ignoring constant
      factors. An order n squared algorithm that is fine for a hundred lines can be hopeless for a million, so the
      question to ask is what happens when the input is ten times bigger.
    resources:
      - title: Big O notation (Wikipedia)
        url: https://en.wikipedia.org/wiki/Big_O_notation

  - slug: longest-common-subsequence
    name: Longest common subsequence
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      A subsequence keeps items in order but may skip some, so ACE is a subsequence of ABCDE. The longest common
      subsequence of two sequences is the longest one that both contain, and it is what stays the same between an old
      and a new file. It is found with a table where each cell holds the answer for two shorter prefixes.
    prerequisites: [ dynamic-programming ]
    resources:
      - title: Longest common subsequence (Wikipedia)
        url: https://en.wikipedia.org/wiki/Longest_common_subsequence

  - slug: dynamic-programming
    name: Dynamic programming
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      Dynamic programming solves a problem by solving its smaller overlapping parts once each and storing the answers
      in a table, then building the full answer from them. It turns an exponential search into polynomial work, at the
      price of the memory the table needs.
    related: [ time-space-complexity ]
    resources:
      - title: Dynamic programming (Wikipedia)
        url: https://en.wikipedia.org/wiki/Dynamic_programming

  - slug: edit-scripts
    name: Describing changes as an edit script
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      A diff describes how to turn the old version into the new one: lines only in the old version are removed, lines
      only in the new version are added, and the common subsequence stays. Classic diff output marks removed lines
      with a less-than sign and added lines with a greater-than sign, grouped by where they occur.
    prerequisites: [ longest-common-subsequence ]
    resources:
      - title: Diff (Wikipedia)
        url: https://en.wikipedia.org/wiki/Diff
      - title: GNU diffutils, normal format
        url: https://www.gnu.org/software/diffutils/manual/html_node/Normal.html

  - slug: unit-tests-first
    name: Writing tests first
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      Writing a small failing test before the code makes you decide what the code should do, including edge cases such
      as empty input, before you decide how. Each test stays as a guard, so later changes and optimisations can be
      made without silently breaking what already worked.
    related: [ differential-testing ]
    resources:
      - title: Test-driven development (Wikipedia)
        url: https://en.wikipedia.org/wiki/Test-driven_development

  - slug: lexer-states
    name: Scanning with context states
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      The same characters mean different things in different places: two slashes start a comment in code but not
      inside a string. A scanner therefore tracks which context it is in, such as code, string, line comment or block
      comment, and each character can switch the context. A pattern search that ignores context removes too much.
    related: [ lexical-analysis, word-state-machine ]
    resources:
      - title: Comment (computer programming) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Comment_(computer_programming)

  - slug: meaningful-comments
    name: Comments that tools read
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Some comments are instructions, not notes. Doc comments right before a declaration become documentation, build
      constraints decide which files compile, and directives tell a linter to skip a line. A tool that strips comments
      has to recognise and keep these, or it changes what the program does.
    related: [ lexer-states ]
    resources:
      - title: Go Doc Comments
        url: https://go.dev/doc/comment
      - title: Flake8, selecting and ignoring violations
        url: https://flake8.pycqa.org/en/latest/user/violations.html

  # ---- added for wave 2: interpreters (calculator, Brainfuck) ----
  - slug: operator-precedence
    name: Operator precedence and associativity
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Precedence decides which operator binds tighter, so multiplication happens before addition unless brackets say
      otherwise. Associativity decides the order among equal operators: subtraction and division work left to right,
      so 8 minus 3 minus 2 is 3, not 7.
    resources:
      - title: Order of operations (Wikipedia)
        url: https://en.wikipedia.org/wiki/Order_of_operations

  - slug: shunting-yard
    name: The shunting yard algorithm
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      The shunting yard algorithm turns an infix expression into postfix order. Numbers go straight to the output, and
      operators wait on a stack until an operator of lower or equal precedence, or a closing bracket, pushes them out.
      The result can be evaluated without any brackets.
    prerequisites: [ operator-precedence ]
    resources:
      - title: Shunting yard algorithm (Wikipedia)
        url: https://en.wikipedia.org/wiki/Shunting_yard_algorithm

  - slug: stack-evaluation
    name: Evaluating postfix with a stack
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      In postfix order an operator follows its operands, so an expression is evaluated with one stack: push each
      number, and for each operator pop two numbers, apply it and push the result. The second number popped is the
      left operand, which matters for subtraction and division. A well-formed expression leaves exactly one number.
    related: [ shunting-yard ]
    resources:
      - title: Reverse Polish notation (Wikipedia)
        url: https://en.wikipedia.org/wiki/Reverse_Polish_notation

  - slug: floating-point-numbers
    name: Integer and floating-point numbers
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      Integers are exact within their range, but floating-point numbers store fractions in binary, so many decimals
      such as 0.1 are approximate and very large integers lose precision. Formats and tools have to decide how they
      read and print numbers.
    resources:
      - title: The Floating-Point Guide
        url: https://floating-point-gui.de/
        opened: true
      - title: What Every Computer Scientist Should Know About Floating-Point Arithmetic
        url: https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html
        opened: true
      - title: Double-precision floating-point format (Wikipedia)
        url: https://en.wikipedia.org/wiki/Double-precision_floating-point_format
        opened: true
      - title: RFC 8259, section 6 (numbers and interoperability)
        url: https://www.rfc-editor.org/rfc/rfc8259
        opened: true
    lesson:
      how_it_works: >-
        Most programs store fractional numbers in IEEE 754 double precision: 64 bits split into a sign, an exponent
        and a fraction, which gives about 15 to 17 significant decimal digits. The fraction is binary, so a decimal
        like 0.1, which is a repeating fraction in base two, cannot be stored exactly. It is stored as the nearest
        representable value, and small errors show up when such values are added, which is why 0.1 plus 0.2 prints as
        a value slightly above 0.3.


        Integers have their own limit inside a double. Every whole number up to 2 to the power 53, about nine thousand
        million million, is exact. Beyond that, the gaps between representable values are larger than one, so a long
        ID such as a 19-digit database key can silently change its last digits when read into a double.


        A text format only writes digits, so the format itself has no precision limit, but every reader converts those
        digits into some machine type. JSON's number grammar is strict about spelling: an optional minus sign, an
        integer part with no leading zero unless it is zero itself, an optional fraction after a dot with at least one
        digit, and an optional exponent with at least one digit. There is no plus sign, no hexadecimal, and no NaN or
        Infinity. RFC 8259 warns that numbers outside double precision are not interoperable and lets implementations
        set limits on range and precision.
      examples:
        - An API sends a 19-digit order ID as a JSON number, a JavaScript client reads it as a double, and the last
          digits change, so the client looks up the wrong order. Many APIs send such IDs as strings for this reason.
        - A bill adds 0.1 and 0.2 and prints 0.30000000000000004; money is usually stored as whole cents or in a
          decimal type instead.
        - The numbers minus zero, 1E400 and 0.0000001 are all valid JSON, but parsers disagree on what they become.
      misconceptions:
        - People think a valid JSON number always round-trips. It does only if both sides read it into a type with
          enough range and precision.
        - People think 0.1 is stored exactly. It is stored as the nearest binary fraction.
        - People think 01, .5, 1. and plus 1 are fine JSON numbers. All four are invalid under the grammar.
      elsewhere:
        - Money and accounting code, which avoids binary floating point for amounts.
        - Databases with decimal column types.
        - Calculators and spreadsheets choosing how many digits to show.

  - slug: interpreter-loop
    name: The interpreter loop
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      An interpreter keeps a program counter that points at the current instruction and runs a loop: fetch the
      instruction, carry it out, move the counter on. A jump instruction sets the counter somewhere else instead.
      Everything else the program can touch, such as memory cells and a data pointer, is state the loop updates.
    resources:
      - title: Interpreter (computing) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Interpreter_(computing)
      - title: Brainfuck (Wikipedia)
        url: https://en.wikipedia.org/wiki/Brainfuck

  - slug: bracket-matching
    name: Matching brackets with a stack
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      To pair each opening bracket with its closing one, push the position of every opening bracket on a stack and pop
      it when a closing bracket arrives. A pop from an empty stack, or a stack that is not empty at the end, means the
      brackets are unbalanced. Doing this once before running gives every jump its target.
    resources:
      - title: Stack (abstract data type) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Stack_(abstract_data_type)

  - slug: bytecode-compilation
    name: Compiling to bytecode
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      Instead of interpreting source text directly, a compiler first turns it into a compact list of instructions,
      dropping comments and working out jump targets once. A small virtual machine then runs the list, which is faster
      because the slow decisions were made ahead of time.
    related: [ interpreter-loop ]
    resources:
      - title: Bytecode (Wikipedia)
        url: https://en.wikipedia.org/wiki/Bytecode

  - slug: peephole-optimization
    name: Peephole optimisation
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      A peephole optimiser looks at short runs of instructions and replaces them with fewer that do the same thing,
      such as five increments becoming one add of five, or a loop that only empties a cell becoming one clear. Each
      rewrite must leave the program's output unchanged.
    prerequisites: [ bytecode-compilation ]
    resources:
      - title: Peephole optimization (Wikipedia)
        url: https://en.wikipedia.org/wiki/Peephole_optimization

  - slug: benchmarking
    name: Measuring performance
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      Measure before and after a change on the same workload and machine, run it several times, and compare like with
      like, such as the same request count, concurrency and pipelining. Report latency percentiles as well as
      throughput.
    resources:
      - title: Redis benchmark
        url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/benchmarks/
        opened: true
      - title: Benchmark (computing) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Benchmark_(computing)
        opened: true
    lesson:
      how_it_works: >-
        A benchmark runs a fixed workload against a system and measures the result, so that two systems, or two
        versions of one system, can be compared. It is only meaningful if everything except the thing being compared
        stays the same: the machine, the workload, the number of concurrent clients, the number of requests, the size
        of the data, and settings such as pipelining. Changing two things at once leaves you unable to say which one
        made the difference.


        Two kinds of number matter. Throughput is how many requests complete per second. Latency is how long a single
        request takes from being sent to its reply arriving. They are related but not the same: a server can complete
        many requests per second while some of them wait a long time, and a single average hides that.


        That is why latency is reported as percentiles. The p50, or median, is the time that half of the requests
        beat. The p99 is the time that 99 out of 100 requests beat, so it describes the slow tail. Users notice the
        tail: a page that makes ten requests is slowed by the slowest of them, so a bad p99 is felt far more often
        than its 1 percent suggests.


        Results vary from run to run because of other programs, caches warming up and the operating system's
        scheduling, so a benchmark is repeated several times and the spread is noted. Running the load generator on
        the same machine as the server also competes for the processor, which is fine for comparing two servers on
        that machine but not for measuring absolute capacity.
      examples:
        - Comparing your server with the real Redis using the same redis-benchmark options on the same laptop shows
          how far apart they are on SET and GET.
        - A change that raises average throughput by 10 percent but doubles p99 latency makes the slowest pages
          noticeably worse.
        - Running a benchmark once while a backup runs in the background gives numbers that cannot be compared with
          anything.
      misconceptions:
        - People think one run is enough. Results vary between runs, so repeat them and look at the spread.
        - People think the average latency describes what users feel. The slow tail, shown by p99, is what users
          notice.
        - People think comparing numbers from different machines or settings is fair. Only like-for-like comparisons
          say anything about the systems.
      elsewhere:
        - Web teams track p95 and p99 page load times rather than averages.
        - Database and storage vendors publish benchmarks whose settings must be read carefully before comparing them.
        - Performance regression tests in a build pipeline compare each change against the previous version on the
          same machine.

  # ---- added for wave 2: files (duplicate file finder) ----
  - slug: candidate-filtering
    name: Cheap checks before expensive ones
    area: design-structure
    kind: foundation
    status: generated
    brief: >-
      When comparing many items, rule out most pairs with a cheap test first and save the expensive test for what is
      left. Files of different sizes cannot be duplicates, so group by size before hashing, and only compare bytes for
      files whose hashes match.
    related: [ time-space-complexity ]
    resources:
      - title: Data deduplication (Wikipedia)
        url: https://en.wikipedia.org/wiki/Data_deduplication

  - slug: content-digests
    name: Content digests
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      A digest such as MD5 or SHA-256 reduces a file of any size to a short fingerprint, computed by streaming the
      file through it. Equal files always have equal digests, and different files almost never do, but MD5 collisions
      can be made on purpose, so a byte comparison is the final proof.
    related: [ hash-functions, streaming-constant-memory ]
    resources:
      - title: Cryptographic hash function (Wikipedia)
        url: https://en.wikipedia.org/wiki/Cryptographic_hash_function

  - slug: cache-invalidation
    name: Knowing when a cache is stale
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      A cache saves work by remembering results, but it must know when a result no longer holds. Store what the result
      depended on, such as a file's size and modification time, next to it, and recompute when either has changed.
    resources:
      - title: Cache invalidation (Wikipedia)
        url: https://en.wikipedia.org/wiki/Cache_invalidation

  - slug: safe-destructive-actions
    name: Confirming destructive actions
    area: process-testing
    kind: foundation
    status: generated
    brief: >-
      A command that deletes or overwrites should show exactly what it will do, ask before doing it, and treat
      anything other than a clear yes as no. Keeping at least one copy of every duplicate, and logging what was
      removed, makes a mistake recoverable.
    related: [ cli-subcommands ]
    resources:
      - title: Command Line Interface Guidelines
        url: https://clig.dev/

  # ---- added for wave 2: network clients (curl, DNS resolver) ----
  - slug: url-parsing
    name: Parsing and validating URLs
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      A URL has a defined structure: scheme, optional user information, host, optional port, path, query and fragment.
      Parsing it correctly, applying defaults and percent-encoding, and validating untrusted URLs prevents both broken
      requests and classic tricks.
    resources:
      - title: "RFC 3986: Uniform Resource Identifier (URI): Generic Syntax"
        url: https://www.rfc-editor.org/rfc/rfc3986
        opened: true
      - title: WHATWG URL Standard
        url: https://url.spec.whatwg.org/
        opened: true
      - title: MDN, What is a URL?
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL
        opened: true
    lesson:
      how_it_works: >-
        A URL such as http://user@example.com:8080/docs/a%20b?lang=en#intro has parts with fixed roles. The scheme,
        http, says which protocol to speak and implies a default port, 80 for http and 443 for https. After the two
        slashes comes the authority: optional user information ending in an at sign, then the host, then an optional
        colon and port. The path starts at the next slash. A question mark starts the query and a hash starts the
        fragment.


        The fragment is never sent to the server; it is used by the client, for example to scroll to a heading.
        Everything else is used to build the request: the host and port to connect to, and the path and query to put
        in the request line. A path with no characters becomes a single slash.


        Only certain characters may appear as they are. Others, such as spaces, are percent-encoded as a percent sign
        followed by two hexadecimal digits, so a space becomes %20. Decoding happens once, at the right time; decoding
        twice, or decoding before splitting, lets an encoded slash or dot change the meaning of a path.


        Untrusted URLs need care. In http://trusted.com@evil.example/ the trusted-looking part is user information and
        the real host is evil.example. Schemes such as javascript: or data: are not web addresses at all. Hosts are
        case-insensitive and can be written in many ways, so a service that compares or stores URLs should parse and
        normalise them first, and should accept only the schemes it really supports.


        Two standards describe URLs: RFC 3986 for the general syntax and the WHATWG URL Standard for how browsers
        parse them. They differ in edge cases, which is one reason to use a well-tested parser when the input comes
        from strangers.
      examples:
        - A link shortener that stores URLs as raw text gives http://Example.com/x and http://example.com/x two
          different keys, although they name the same page.
        - A phishing email shows a link that starts with the name of a real bank, followed by an at sign and the
          attacker's domain.
        - A client that forgets to encode a space in a query sends a request line with three spaces, and the server
          rejects it as malformed.
      misconceptions:
        - The fragment is part of the request. It stays in the client.
        - "Anything that starts with a scheme is a web address. javascript: and data: URLs run code or carry content
          directly."
        - Splitting on slashes is enough. User information, ports, IPv6 hosts in brackets and percent-encoding all
          break naive splitting.
      elsewhere:
        - Every HTTP client, browser and proxy parses URLs, and differences between parsers have caused real security
          bugs.
        - Server-side request forgery attacks abuse services that fetch user-supplied URLs without validating the host.
        - Database connection strings and many configuration files reuse the URL syntax.

  - slug: dns-message-format
    name: The DNS message format
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      Every DNS query and reply is one binary message: a 12-byte header with an ID, flags and four counts, then the
      question, answer, authority and additional sections. Records have variable length, so a decoder walks them in
      order.
    prerequisites: [ byte-order ]
    related: [ udp-datagrams ]
    resources:
      - title: "RFC 1035: Domain names, implementation and specification"
        url: https://www.rfc-editor.org/rfc/rfc1035
        opened: true
      - title: Julia Evans, Implement DNS in a weekend
        url: https://implement-dns.wizardzines.com/
        opened: true
      - title: Domain Name System (Wikipedia)
        url: https://en.wikipedia.org/wiki/Domain_Name_System
        opened: true
    lesson:
      how_it_works: >-
        DNS uses the same message layout for questions and answers. It starts with a fixed 12-byte header: a 16-bit ID
        chosen by the client so it can match the reply to its query, a 16-bit flags field, and four 16-bit counts
        giving the number of entries in each of the four sections that follow.


        The question section holds the name being asked about, encoded as labels, followed by a type and a class. Type
        1 asks for an A record, an IPv4 address, and class 1 means internet. The answer section holds resource records
        that answer the question. The authority section holds records pointing at the servers responsible for the
        name, which is how referrals work. The additional section holds helpful extras, such as the addresses of those
        servers.


        Each resource record has a name, a type, a class, a time to live in seconds, a data length, and then that many
        bytes of data. For an A record the data is four bytes, shown as four numbers joined by dots. Because names and
        data vary in length, there is no fixed offset for the second record: a decoder must read each record
        completely to find where the next begins.


        Names are written as a series of labels, each preceded by a byte giving its length, and ended by a zero byte,
        so dns.google.com becomes 3 dns 6 google 3 com 0. Labels can be at most 63 bytes and a whole name at most 255.
        Every number in the message is big-endian.
      examples:
        - A resolver that ignores the counts and assumes the answer starts right after the header misreads the
          question as an answer.
        - Tools such as dig print the five parts of a reply, the header and four sections, in exactly this order.
        - "A reply with zero answers and records in the authority section is not an error: it is a referral to other
          servers."
      misconceptions:
        - Records have fixed sizes, so you can jump to the answers. You must walk each record, because names and data
          vary in length.
        - The question is only in the query. Replies repeat it, and decoders must skip it.
        - An empty answer section means the name does not exist. It can mean a referral; the response code says
          whether the name exists.
      elsewhere:
        - Many binary protocols use the same pattern of a fixed header with counts followed by variable-length records.
        - DNS over HTTPS and DNS over TLS carry these same binary messages inside other protocols.
        - Email delivery depends on MX records and spam checks on TXT records, all carried in this format.

  - slug: dns-name-compression
    name: DNS name compression
    area: formats-parsing
    kind: foundation
    status: generated
    brief: >-
      To save space, a DNS name can end with a two-byte pointer to an earlier place in the message where the rest of
      the name is written. Decoders must follow pointers and also guard against pointers that loop.
    prerequisites: [ dns-message-format ]
    resources:
      - title: RFC 1035 (message compression)
        url: https://www.rfc-editor.org/rfc/rfc1035
        opened: true
      - title: Julia Evans, Implement DNS in a weekend
        url: https://implement-dns.wizardzines.com/
        opened: true
    lesson:
      how_it_works: >-
        A DNS reply often repeats the same name many times: in the question, in every answer and in authority records.
        Writing it out in full each time would waste most of a 512-byte message, so DNS compresses names with
        pointers.


        A name is normally a sequence of labels, each starting with a length byte between 0 and 63, ending with a zero
        byte. Because 63 needs only six bits, the top two bits of a length byte are free. When both are set, the byte
        is not a length but the start of a pointer: those two bits together with the next 14 bits form an offset,
        counted from the start of the message, where the rest of the name continues. The pair c0 0c, for example,
        points at offset 12, which is where the question's name starts, right after the 12-byte header.


        A name may be written partly in full and finish with a pointer, such as a new label followed by a pointer to
        an existing domain. A decoder reads labels, and when it meets a pointer it jumps to the offset and keeps
        reading there. The name ends at a zero byte, wherever that is. After a pointer, the decoder must remember to
        continue reading the record from just after the two pointer bytes, not from where the jump ended.


        Pointers come from the network, so they are untrusted. A pointer that points at itself or at a later pointer
        that points back creates a loop, and a naive decoder spins forever. Decoders defend themselves by checking
        that every offset lies inside the message, by limiting the number of jumps, and by capping the decoded name at
        255 bytes.
      examples:
        - The sample reply in the challenge uses c0 0c for every answer name, so each answer spends two bytes on its
          name instead of sixteen.
        - A fuzzing tool sends a reply whose pointer points at itself, and a resolver without a jump limit uses all
          its CPU.
        - A decoder that keeps reading the record from the jump target instead of after the pointer misreads the type
          and TTL of every compressed answer.
      misconceptions:
        - After following a pointer, carry on reading from there. Return to just after the pointer for the rest of the
          record.
        - Pointers only appear at the start of a name. A name can start with labels and end with a pointer.
        - Pointers from a server can be trusted. Anything off the network must be bounds-checked and loop-checked.
      elsewhere:
        - Compression by back-references to earlier data is the core of formats such as gzip.
        - Parsers for any untrusted binary format need the same bounds and loop checks.
        - Email and other protocols that carry domain names reuse DNS-style label encoding.

  - slug: iterative-resolution
    name: Iterative resolution from the root
    area: networking-http
    kind: foundation
    status: generated
    brief: >-
      No single server knows every name. A resolver starts at a root server, which refers it to the servers for the
      top-level domain, which refer it on, until a server responsible for the name answers. Glue records supply the
      addresses of the servers it is referred to.
    prerequisites: [ dns-message-format ]
    resources:
      - title: "RFC 1034: Domain names, concepts and facilities"
        url: https://www.rfc-editor.org/rfc/rfc1034
        opened: true
      - title: IANA, Root Servers
        url: https://www.iana.org/domains/root/servers
        opened: true
      - title: Julia Evans, Implement DNS in a weekend
        url: https://implement-dns.wizardzines.com/
        opened: true
    lesson:
      how_it_works: >-
        DNS is a tree split into zones, each run by its own servers. The root servers know which servers handle each
        top-level domain such as com. The com servers know which servers handle google.com. Those servers hold the
        actual records for names under google.com. Resolving a name means walking down this tree.


        A resolver that starts from scratch sends its query to a root server, with the recursion-desired flag cleared.
        The root does not know the answer, so it replies with a referral: no answers, but NS records in the authority
        section naming the servers for com, and, in the additional section, their addresses. Those addresses are
        called glue; without them the resolver would first have to resolve the name server's own name. The resolver
        repeats the query to one of the com servers, gets another referral to the google.com servers, asks one of
        those, and finally receives an answer with the address.


        Things go wrong in interesting ways. A referral may name a server with no glue, so the resolver must resolve
        that server's name first, starting again from the root. A server may be down, so the resolver tries another. A
        misconfiguration can send it round in circles, so it caps the number of queries. The response code says when a
        name truly does not exist.


        Most programs never do this themselves. They send one query with recursion desired to a recursive resolver,
        such as the one their network provides or a public one, and that resolver does the whole walk, caching every
        step so the next lookup is faster.
      examples:
        - "dig with the trace option shows the same walk: root, then com, then the domain's own servers."
        - When a top-level domain's servers had an outage, every name under it failed to resolve for resolvers whose
          caches had expired.
        - A domain whose name servers live inside the domain itself depends on glue records, or no one could ever find
          them.
      misconceptions:
        - Root servers know every name. They only know who runs each top-level domain.
        - An answer with no records is a failure. It is usually a referral to the next servers down.
        - Your computer walks the tree for every lookup. A recursive resolver normally does it and caches the results.
      elsewhere:
        - Recursive resolvers at internet providers and public services run this algorithm millions of times a second,
          mostly from cache.
        - Domain registrars set the NS records and glue in the parent zone when you register a domain.
        - DNSSEC adds signatures that let a resolver check each step of the walk.

  # ---- added for wave 2: storage servers (Redis, Bitcask) ----
  - slug: resp-protocol
    name: The Redis protocol (RESP)
    area: apis-backends
    kind: foundation
    status: generated
    brief: >-
      RESP marks each value with its first byte, such as plus for a simple string, colon for an integer, dollar for a
      bulk string and star for an array, and ends each line with a carriage return and newline. Bulk strings state
      their length, so they can hold any bytes.
    prerequisites: [ message-framing ]
    resources:
      - title: Redis serialization protocol specification
        url: https://redis.io/docs/latest/develop/reference/protocol-spec/
        opened: true
      - title: Type–length–value (Wikipedia)
        url: https://en.wikipedia.org/wiki/Type%E2%80%93length%E2%80%93value
        opened: true
    lesson:
      how_it_works: >-
        RESP is the format a Redis client and server use to exchange values over a connection. Every value begins with
        one byte that names its type: a plus sign for a simple string, a minus sign for an error, a colon for an
        integer, a dollar sign for a bulk string and a star for an array. Each header line ends with a carriage return
        and a newline.


        Simple strings and errors are short pieces of text that run to the end of their line, so they cannot contain a
        line break. Bulk strings are different: the header gives the length in bytes, then exactly that many bytes
        follow, then a final line ending. Because the reader counts bytes instead of looking for a line break, a bulk
        string can carry anything, including line breaks, zero bytes or an image. That property is called binary
        safety.


        An array header gives the number of elements, and each element is itself a full RESP value, so arrays can
        nest. Clients send every command as an array of bulk strings: the command name first, then its arguments. A
        length of minus one marks a null bulk string or null array, which is how a server says "no value", for example
        when GET asks for a missing key.


        The design mixes two framing ideas. Delimiters, the line endings, are easy to read and debug by eye. Length
        prefixes make large and binary values safe and let the reader know in advance how much to wait for. A parser
        has to handle both, and must also cope with a value that has only partly arrived.
      examples:
        - Typing PING in redis-cli sends an array of one bulk string holding the four letters, and the server replies
          with the simple string PONG.
        - Storing a JPEG thumbnail with SET works because the image bytes travel inside a bulk string whose length is
          stated up front.
        - GET on a missing key returns a bulk string with length minus one, which redis-cli shows as (nil).
      misconceptions:
        - People think RESP is a line-based text protocol. Headers are lines, but bulk strings are read by length and
          may contain any bytes, including line breaks.
        - People think a simple string and a bulk string are interchangeable. A simple string cannot hold a line break
          and has no length, so values from users must go in bulk strings.
        - People think an empty bulk string and a null bulk string are the same. Length zero is an empty value; length
          minus one means there is no value at all.
      elsewhere:
        - "HTTP/1.1 uses the same two ideas: headers end with line endings, and the body length comes from a
          Content-Length header."
        - Many binary formats and network protocols use type, length and value records so a reader can skip fields it
          does not understand.
        - Message queues and database wire protocols prefix each message with its length so a reader on a byte stream
          knows where one ends.

  - slug: key-expiry
    name: Expiring keys
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      A key with a time to live disappears after a set time. Storing the absolute moment it expires, rather than the
      time left, keeps the four expiry options consistent, and expired keys are removed both when read and by a light
      background sweep.
    related: [ key-value-store ]
    resources:
      - title: Redis EXPIRE command (how Redis expires keys)
        url: https://redis.io/docs/latest/commands/expire/
        opened: true
      - title: Redis SET command (EX, PX, EXAT, PXAT)
        url: https://redis.io/docs/latest/commands/set/
        opened: true
      - title: Time to live (Wikipedia)
        url: https://en.wikipedia.org/wiki/Time_to_live
        opened: true
    lesson:
      how_it_works: >-
        Expiry lets a key remove itself after a while, which is how caches and sessions stay fresh and how memory is
        reclaimed without anyone deleting keys by hand. The time can be given in different ways: a number of seconds
        or milliseconds from now, or an absolute moment as a Unix time. The simplest design converts all of them, as
        soon as the command arrives, into one absolute expiry moment stored next to the key. Then every check is the
        same comparison: has the current time passed the stored moment?


        There are two complementary ways to enforce it. Lazy expiry checks the moment whenever a key is accessed, and
        treats an expired key as missing, deleting it on the spot. This guarantees no client ever reads an expired
        value, at almost no cost. But a key that is never read again would sit in memory forever.


        Active expiry fixes that with a background task. Scanning every key would cost too much with millions of keys,
        so Redis instead tests a small random sample of keys that have an expiry, deletes the expired ones, and
        repeats straight away if a large share of the sample had expired. The work per round stays small and steady,
        and memory is reclaimed over time.


        Clocks matter. Using the wall clock means a clock change can make keys expire early or late, while timing
        durations with a clock that only moves forward avoids jumps. Copies of the data on other machines also need
        the same expiry, which is why an absolute moment travels better than a remaining duration.
      examples:
        - A login session is stored with a 30-minute expiry, so a user who walks away is logged out without any
          clean-up job.
        - A cache of exchange rates expires every minute, so the next request after that fetches fresh rates.
        - A one-time password is stored with a five-minute expiry and is useless after that even if it leaks.
      misconceptions:
        - People think an expired key is deleted at exactly the moment it expires. It is hidden from readers at once,
          but its memory may be reclaimed a little later by the background sweep.
        - People think the server must scan all keys to expire them. Sampling a few keys repeatedly keeps the cost
          small however many keys there are.
        - People think storing the remaining seconds is enough. The remaining time changes every second, while an
          absolute moment stays correct and is easy to compare.
      elsewhere:
        - DNS records and HTTP caches carry a time to live that says how long an answer may be reused.
        - Network packets have a hop limit, also called time to live, so a packet caught in a loop is dropped.
        - Job queues and locks often use expiry so a crashed worker does not hold work or a lock forever.

  - slug: snapshot-persistence
    name: Saving a snapshot to disk
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      An in-memory store can survive a restart by writing its whole state to a file and reading it back at startup.
      Writing to a temporary file and renaming it over the old one means a crash mid-write leaves the previous
      snapshot intact, and anything changed since the last snapshot is lost on a crash.
    related: [ key-value-store ]
    resources:
      - title: Redis persistence (RDB snapshots and AOF)
        url: https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
        opened: true
      - title: rename(2), Linux manual page
        url: https://man7.org/linux/man-pages/man2/rename.2.html
        opened: true
      - title: Snapshot (computer storage) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Snapshot_(computer_storage)
        opened: true
    lesson:
      how_it_works: >-
        An in-memory store loses everything when the process stops. A snapshot is the simplest cure: write the whole
        state to a file at a moment in time, and read that file back when the server starts. Redis calls its snapshot
        an RDB file and can take one on a schedule or when asked with SAVE.


        What a snapshot gives you is the state at the moment it was taken, no more. Every change made after the last
        snapshot is lost if the server crashes, so the interval between snapshots is the amount of data you accept
        losing. Snapshots are compact and fast to load, which makes them good for backups and restarts, but poor when
        every write matters.


        How the file is written matters as much as when. If the server overwrites the old file in place and crashes
        halfway, it leaves a file that is part old and part new, and possibly unreadable, so both snapshots are gone.
        The safe pattern is to write the complete new snapshot to a temporary file in the same folder and then rename
        it over the old one. On most systems a rename within one file system replaces the old name in a single step,
        so any reader sees either the whole old snapshot or the whole new one.


        Writing a snapshot of a busy store also takes time. A server must either pause, which is what SAVE does, or
        keep serving while it writes, which Redis does by writing from a separate copy of the process so the snapshot
        stays consistent while new commands are served.
      examples:
        - A cache server restarts after an upgrade and is warm again within seconds because it reloads last night's
          snapshot instead of starting empty.
        - A program that overwrites its settings file in place and crashes halfway leaves a half-written file that
          will not load on the next start.
        - A team keeps hourly snapshots as backups and accepts losing up to an hour of cache data in a crash.
      misconceptions:
        - People think a snapshot keeps every change. It keeps the state at one moment; everything after it is lost in
          a crash.
        - People think overwriting the old file is fine because writes are fast. A crash during the write can leave a
          corrupt file and no good snapshot at all.
        - People think a completed write is on disk. It may still be in the operating system's memory until it is
          flushed.
      elsewhere:
        - Games save progress to a temporary file and rename it, so a crash while saving does not destroy the old save.
        - Virtual machines and file systems take snapshots to roll back to a known state.
        - Databases combine a periodic snapshot with a log of later changes, so recovery loads the snapshot and
          replays the log.

  - slug: append-only-log
    name: Append-only log storage
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      An append-only store never changes a record in place: every write, including an update, adds a new record at the
      end of the active file. Appending is fast and a crash can only damage the last record. The latest record for a
      key wins, and old ones are cleaned up later.
    resources:
      - title: Bitcask, A Log-Structured Hash Table for Fast Key/Value Data
        url: https://riak.com/assets/bitcask-intro.pdf

  - slug: checksums
    name: Checksums for stored records
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      A checksum such as CRC-32, stored with each record, is computed again when the record is read. If the two differ
      the record was cut short or corrupted, for example by a crash mid-write, and it is skipped instead of being
      trusted.
    resources:
      - title: Cyclic redundancy check (Wikipedia)
        url: https://en.wikipedia.org/wiki/Cyclic_redundancy_check

  - slug: hash-index
    name: An in-memory index into log files
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      Keeping every value in memory does not scale, but keeping only where each value lives does. An in-memory hash
      table maps each key to the file, the position and the size of its latest value, so a read is one lookup and one
      disk seek.
    prerequisites: [ append-only-log ]
    related: [ key-value-store ]
    resources:
      - title: Bitcask, A Log-Structured Hash Table for Fast Key/Value Data
        url: https://riak.com/assets/bitcask-intro.pdf

  - slug: tombstones
    name: Deleting with tombstones
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      In an append-only store a delete cannot remove the old record, so it appends a tombstone, a record that says the
      key is gone. Reads and rebuilds treat the tombstone as the latest word on that key, and compaction drops both
      the tombstone and the old values.
    prerequisites: [ append-only-log ]
    resources:
      - title: Tombstone (data store) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Tombstone_(data_store)

  - slug: log-compaction
    name: Compacting a log
    area: data-stores
    kind: foundation
    status: generated
    brief: >-
      An append-only log keeps growing with stale values and tombstones. Compaction, which Bitcask calls merging,
      rewrites the closed files keeping only the latest live value of each key, can write a small hint file listing
      where each key now lives, and then deletes the old files.
    prerequisites: [ append-only-log, tombstones ]
    resources:
      - title: Bitcask, A Log-Structured Hash Table for Fast Key/Value Data
        url: https://riak.com/assets/bitcask-intro.pdf

  - slug: crash-recovery
    name: Recovering after a crash
    area: state-storage
    kind: foundation
    status: generated
    brief: >-
      After a crash a store rebuilds its in-memory state from what is on disk, by replaying the log from the start or
      by reading smaller hint files. Records that fail their checksum, usually a half-written last one, are dropped,
      so the store comes back with every write that fully reached the disk.
    related: [ checksums, hash-index ]
    resources:
      - title: Write-ahead logging (Wikipedia)
        url: https://en.wikipedia.org/wiki/Write-ahead_logging

  # ---- added for content v2 (concept-first), wc ----
  - slug: text-encoding-utf8
    name: Unicode code points and UTF-8
    area: text-encodings
    kind: foundation
    status: generated
    brief: Unicode gives every character a number, its code point. UTF-8 stores each code point in one to four bytes, with
      plain ASCII in one byte, so the byte count and the character count of the same text often differ.
    lesson:
      how_it_works: |-
        Text in a file is only bytes. To turn bytes into letters, the program that wrote them and the program that
        reads them must agree on an encoding: a rule that maps each character to bytes and back.

        Unicode splits this into two questions. First, which character is it? Unicode gives every character a number
        called its code point, written like U+0041 for the capital letter A or U+1F600 for the grinning face emoji, with
        room for about 1.1 million of them. Second, how is that number stored? That is the job of an encoding such as
        UTF-8, UTF-16 or UTF-32.

        UTF-8 uses a variable number of bytes. Code points up to U+007F, which is plain ASCII, take one byte, exactly as
        in ASCII. Code points up to U+07FF take two bytes (accented Latin letters, Greek, Cyrillic, Arabic, Hebrew), up
        to U+FFFF take three (most Chinese, Japanese and Hindi text, and the euro sign), and the rest take four, which
        includes most emoji. The first byte of a character says how many bytes it has: its leading bits are 0 for one
        byte, or 110, 1110 or 11110 for two, three or four. Every following byte starts with the bits 10, so a reader
        dropped anywhere in a file finds the start of the next character by skipping bytes that start with 10.

        Why this design? Every ASCII file is already valid UTF-8, so old files and tools kept working. No multi-byte
        character contains a byte that looks like an ASCII letter, a slash, a newline or a zero, so tools that only care
        about those bytes, such as counting lines by newline, work on UTF-8 without decoding it. And UTF-8 has no byte
        order question, because it is a sequence of single bytes.

        Some programs write the three bytes EF BB BF at the very start of a UTF-8 file. This byte order mark only says
        "this is UTF-8", and many tools do not expect it.
      examples:
        - The word café is 4 characters but 5 bytes in UTF-8, because é (U+00E9) needs two bytes. A column limited to
          4 bytes cannot hold it, and a tool that counts bytes as letters reports 5.
        - For years the MySQL encoding called utf8 stored at most three bytes per character, so saving an emoji in a
          username failed or cut the text short. The fix was a separate encoding, utf8mb4, which allows four.
        - "A web address cannot contain é directly, so browsers send its two UTF-8 bytes in percent form: café becomes
          caf%C3%A9."
      misconceptions:
        - UTF-8 means 8 bits per character. It means the code unit is 8 bits, and a character takes one to four units.
        - Unicode is an encoding. Unicode is the list of characters and their numbers; UTF-8, UTF-16 and UTF-32 are
          ways to store those numbers.
        - A file's size in bytes is its number of characters. That holds only for plain ASCII text.
        - A UTF-8 file must start with a byte order mark. It needs none, and the mark can break tools that read the
          first line or column name.
      elsewhere:
        - JSON exchanged between systems must be UTF-8, and so is almost every web page and API.
        - Databases limit text in bytes or in characters depending on the type, which matters as soon as users type
          other scripts or emoji.
        - Go and Rust strings hold UTF-8 bytes, so their length is a byte count, not a character count.
    related:
      - utf16-code-units
      - grapheme-clusters
    resources:
      - title: "RFC 3629: UTF-8, a transformation format of ISO 10646"
        url: https://www.rfc-editor.org/rfc/rfc3629
        opened: true
      - title: "Unicode FAQ: UTF-8, UTF-16, UTF-32 and BOM"
        url: https://www.unicode.org/faq/utf_bom.html
        opened: true
      - title: Joel Spolsky, The Absolute Minimum Every Software Developer Must Know About Unicode
        url: https://www.joelonsoftware.com/2003/10/08/the-absolute-minimum-every-software-developer-absolutely-positively-must-know-about-unicode-and-character-sets-no-excuses/
        opened: true
      - title: UTF-8 (Wikipedia)
        url: https://en.wikipedia.org/wiki/UTF-8
        opened: true

  - slug: utf16-code-units
    name: UTF-16, UTF-32 and code units
    area: text-encodings
    kind: foundation
    status: generated
    brief: "UTF-16 stores code points in 16-bit units: one unit for most characters and a surrogate pair of two units for
      the rest, including most emoji. Java, JavaScript, C# and Windows use it, so their string length counts units,
      not characters."
    lesson:
      how_it_works: |-
        UTF-16 stores text in units of 16 bits. A code point up to U+FFFF, the Basic Multilingual Plane that holds almost
        every living script, fits in one unit. A code point above U+FFFF, such as U+1F600, does not fit, so it is split
        across two units called a surrogate pair. The first comes from the high surrogate range D800 to DBFF and the
        second from the low surrogate range DC00 to DFFF. Those ranges are never used for real characters, so a reader
        always recognises a pair.

        This matters because Java, JavaScript, C#, Objective-C and the Windows text APIs store strings as UTF-16, and
        their length counts code units. A string holding one grinning face has length 2 there. Cutting such a string at
        a fixed length can split a pair and leave half an emoji, which shows up as a box or a question mark. Counting or
        slicing by code point needs separate methods that each language provides.

        Because a unit is two bytes, UTF-16 also needs a byte order: UTF-16LE puts the low byte first and UTF-16BE the
        high byte first. A file may begin with the mark FF FE or FE FF to say which.

        UTF-32 stores every code point in four bytes. It is simple to index, since the nth code point starts at byte 4n,
        but it uses four times the space of ASCII text, so it is rare in files.

        Before Unicode, single-byte encodings such as Latin-1 and Windows-1252 mapped 256 values to the letters of one
        group of languages. Reading UTF-8 bytes as Windows-1252 turns café into cafÃ©, the garbled text called mojibake.
      examples:
        - A social app limits posts by JavaScript string length. A post of 140 emoji measures 280, so users meet a
          limit that seems to shrink.
        - A notification cuts a message at 100 units to fit the screen. If unit 100 is the first half of a surrogate
          pair, the phone shows a broken symbol at the end.
        - Excel's Unicode Text export writes UTF-16LE with the mark FF FE, so a script expecting UTF-8 sees a zero
          byte after every English letter.
      misconceptions:
        - UTF-16 uses exactly two bytes per character. Characters above U+FFFF take four bytes, two units.
        - String length in Java or JavaScript counts characters. It counts UTF-16 units, so most emoji count as two.
        - UTF-32 gives one unit per visible character. It gives one per code point, and a visible character can be
          several.
      elsewhere:
        - JSON writes an escaped character above U+FFFF as two escapes, one per surrogate, so a parser must join them.
        - Windows file names are UTF-16, so tools that move files between Windows and Linux convert the names.
        - Any API with a length limit needs to say whether it means bytes, UTF-16 units, code points or what users see.
    prerequisites:
      - text-encoding-utf8
    resources:
      - title: "Unicode FAQ: UTF-8, UTF-16, UTF-32 and BOM"
        url: https://www.unicode.org/faq/utf_bom.html
        opened: true
      - title: UTF-16 (Wikipedia)
        url: https://en.wikipedia.org/wiki/UTF-16
        opened: true
      - title: Byte order mark (Wikipedia)
        url: https://en.wikipedia.org/wiki/Byte_order_mark
        opened: true
      - title: MDN, String length
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/length
        language: javascript

  - slug: grapheme-clusters
    name: What users see as one character
    area: text-encodings
    kind: foundation
    status: generated
    brief: "A grapheme cluster is what a reader sees as one character, and it can be several code points: a letter and a
      combining accent, an emoji and a skin tone, or emoji joined into a family. The same visible text can also be
      stored as different code points, which normalisation makes comparable."
    lesson:
      how_it_works: |-
        Code points are not the characters a person sees. Unicode builds many visible characters out of several code
        points, and calls the visible unit a grapheme cluster.

        Combining marks attach to the character before them: e followed by U+0301, the combining acute accent, shows as
        é. Emoji use the same idea. The thumbs up U+1F44D followed by the skin tone modifier U+1F3FD shows as one thumb
        but is two code points. A family emoji of a man, a woman and a girl is three person emoji joined by two invisible
        zero width joiners, U+200D, so it is five code points and eighteen UTF-8 bytes for one picture. A flag is two
        regional indicator letters: the Indian flag is the letters I and N.

        Because of combining marks, the same visible text can be stored in more than one way. é can be the single code
        point U+00E9, called precomposed, or e plus U+0301, called decomposed. They look identical but compare as
        different strings and have different lengths and bytes. Normalisation converts text to one agreed form: NFC
        prefers precomposed characters and NFD takes them apart. Compare and store text only after normalising it the
        same way.

        Counting what users see needs the segmentation rules of Unicode Annex 29, which libraries implement. Most tools,
        including wc with -m, count code points instead, so a family emoji counts as five characters there.
      examples:
        - Two accounts both called José can exist side by side if one phone sent the precomposed é and another system
          sent e plus an accent, unless the sign-up form normalises names.
        - A form that limits display names to 10 characters by counting code points rejects a short name with a family
          emoji in it, although the user sees far fewer than 10 characters.
        - macOS used to store file names in decomposed form, so a file named café there could fail to match the same
          name typed on Linux.
      misconceptions:
        - One code point is one character. A visible character can be many code points.
        - Strings that look the same are equal. They are equal only when their code points match, which may need
          normalising first.
        - Reversing or cutting text one code point at a time is safe. It can separate an accent from its letter or
          break up an emoji.
      elsewhere:
        - Text editors move the cursor and delete by grapheme cluster, so one backspace removes a whole family emoji.
        - Search and databases need normalisation and collation rules so that café finds café however it was typed.
        - Password checks should normalise first, or the same password typed on another keyboard can fail.
    prerequisites:
      - text-encoding-utf8
    resources:
      - title: "UAX #29: Unicode Text Segmentation"
        url: https://www.unicode.org/reports/tr29/
        opened: true
      - title: "UTS #51: Unicode Emoji"
        url: https://www.unicode.org/reports/tr51/
        opened: true
      - title: "UAX #15: Unicode Normalization Forms"
        url: https://unicode.org/reports/tr15/
        opened: true
      - title: Unicode equivalence (Wikipedia)
        url: https://en.wikipedia.org/wiki/Unicode_equivalence
        opened: true

  - slug: io-buffering
    name: Buffered I/O and system calls
    area: streams-io
    kind: foundation
    status: generated
    brief: Every read from the operating system is a system call with a fixed cost, so reading one byte at a time is slow
      even though the data is the same. Reading into a buffer of some kilobytes and working from memory spreads that
      cost over many bytes.
    lesson:
      how_it_works: |-
        Programs do not read files by themselves. They ask the operating system through a system call, and each call
        has a fixed cost: switching into the kernel, checking the request, copying the data, switching back. That cost
        is small, but paid once per byte it dominates everything else.

        A buffer fixes this. The program asks for many bytes at once, perhaps 64 KB, then works through them in memory,
        where each byte costs almost nothing. One system call now serves tens of thousands of bytes. Languages offer
        buffered readers and writers that keep such a buffer behind the scenes, so code can ask for one byte or one line
        at a time without paying a system call for each.

        The operating system buffers too. Recently read parts of files stay in memory in the page cache, and the system
        reads ahead when it sees a file being read in order. That is why counting a file the second time is often much
        faster than the first.

        Bigger is not always better. Once the buffer holds some tens of kilobytes, the time goes into waiting for the
        disk or copying memory, not into calls, and a bigger buffer only uses more memory. Measuring is the honest way to
        choose a size.
      examples:
        - Counting a 1 GB file one byte per system call makes about a billion calls and can take minutes. Reading 64
          KB at a time makes about sixteen thousand calls and takes seconds.
        - Writing a log without a buffer slows a busy server down, so logging libraries buffer and write out the
          buffer on a timer or when it fills.
        - Running wc twice on the same large file is faster the second time, because the file now sits in the page
          cache.
      misconceptions:
        - A buffered reader holds the whole file. It holds one buffer's worth at a time.
        - When code asks for one byte, the disk reads one byte. Disks and the operating system work in blocks of
          kilobytes.
        - Buffered output is written the moment the code writes it. It waits in the buffer until the buffer fills or
          is flushed, so a crash can lose the last part.
      elsewhere:
        - Sockets, database drivers and file uploads all buffer for the same reason.
        - Forgetting to flush a buffered writer before a program exits is a classic cause of missing last lines in
          output files.
        - Tracing tools such as strace on Linux count system calls, which exposes unbuffered code.
    related:
      - streaming-constant-memory
      - stream-read-contract
    resources:
      - title: System call (Wikipedia)
        url: https://en.wikipedia.org/wiki/System_call
      - title: Page cache (Wikipedia)
        url: https://en.wikipedia.org/wiki/Page_cache

  - slug: malformed-input
    name: Handling malformed input
    area: formats-parsing
    kind: foundation
    status: generated
    brief: "Real input breaks its format: invalid UTF-8 bytes, a truncated last record, a value out of range. A tool must
      decide whether to reject it, replace the bad part or skip it, and say clearly where the problem was."
    lesson:
      how_it_works: |-
        Every format has rules, and real input breaks them: a file cut off in the middle of a write, a byte that cannot
        start any UTF-8 character, a log line written by a buggy program. A tool cannot pretend this never happens, so it
        needs a policy.

        There are three honest choices. Reject: stop and report an error with the position of the bad input, which is
        right when wrong output would be worse than none, such as when loading configuration. Replace: put a marker in
        place of the bad part and carry on, which is what text decoders usually do, substituting U+FFFD, the replacement
        character, for each invalid sequence. Skip: drop the bad part quietly, which keeps the tool running but hides
        problems, so it should at least be counted or logged.

        In UTF-8 the invalid cases are a continuation byte with no lead byte before it, a lead byte without enough
        continuation bytes after it, a sequence longer than its code point needs, called overlong, and the code points
        reserved for UTF-16 surrogates. Overlong forms matter for security: an old attack wrote a slash as two bytes to
        slip past filters that only looked for the one-byte slash.

        Whatever the policy, write it down, apply it the same way at a chunk boundary as in the middle of a chunk, and
        test it, ideally against a reference tool.
      examples:
        - A log file holds a few bytes of binary data from a crashed process. A character counter that stops at the
          first invalid byte cannot report anything about the rest of a 20 GB file.
        - Browsers show U+FFFD, often drawn as a black diamond with a question mark, wherever a page's bytes are not
          valid in its declared encoding.
        - A JSON parser must reject invalid UTF-8 in a string instead of guessing, because two systems that guess
          differently would read different data.
      misconceptions:
        - Input from files is well formed. Truncated writes, wrong encodings and binary junk happen every day.
        - Replacing bad bytes loses nothing important. It changes the data, so the tool should say that it happened.
        - Being lenient is always kinder. A lenient reader and a strict one can disagree about the same input, and
          attackers use that.
      elsewhere:
        - Parsers for JSON, HTTP, DNS and file formats all need a policy for malformed input.
        - Data pipelines often send bad records to a separate queue instead of failing or dropping them.
        - Security reviews look for places where two components treat malformed input differently.
    related:
      - decoding-across-chunks
    resources:
      - title: WHATWG Encoding Standard (replacement and fatal error modes)
        url: https://encoding.spec.whatwg.org/
        opened: true
      - title: Specials Unicode block and U+FFFD (Wikipedia)
        url: https://en.wikipedia.org/wiki/Specials_(Unicode_block)
        opened: true

  - slug: locale-settings
    name: Locales and the environment
    area: text-encodings
    kind: foundation
    status: generated
    brief: A locale is a set of environment settings, such as LANG and LC_ALL, that tells programs which encoding,
      character classes and sorting rules to use. The same command can give different answers under two locales, so
      tests must set it.
    lesson:
      how_it_works: |-
        Many Unix tools do not decide by themselves how to read text. They ask the C library, which follows the locale:
        environment variables such as LANG, LC_CTYPE and LC_ALL, where LC_ALL overrides the others. A locale name such as
        en_US.UTF-8 or C.UTF-8 says which language conventions to follow and which encoding to decode with.

        The plain C locale, also called POSIX, treats every byte as one character and only ASCII letters as letters. In
        that locale wc -m counts bytes, so it gives the same number as wc -c, and é counts as two characters. In a UTF-8
        locale wc -m decodes UTF-8 and counts code points. The locale also decides which characters are whitespace for
        wc -w, which characters grep calls letters, and how sort orders lines.

        So a result can change without any change to the file or the program: another terminal, a scheduled job with an
        almost empty environment, a container image built without locale data, or a CI runner. Git Bash on Windows, for
        example, sets a UTF-8 locale in its terminal window but not always for scripts, and its wc counts an emoji above
        U+FFFF as two characters even in UTF-8.

        To get reproducible results, set the locale explicitly whenever a test or script runs a tool, and record which
        locale an expected value was taken with.
      examples:
        - The challenge's test file gives 339292 for wc -m in a UTF-8 locale and 342190, its byte count, in the C
          locale, on the same machine.
        - A nightly job that sorts customer names produces a different order from the same command typed in a
          terminal, because the scheduler runs it with the C locale.
        - A container image without locale data falls back to C, so a tool that handled accented names on a laptop
          treats them as bytes in production.
      misconceptions:
        - A program behaves the same wherever it runs. Its environment, including the locale, is part of its input.
        - The locale only changes language and date formats. It also decides decoding, character classes and sort
          order.
        - A UTF-8 file is always read as UTF-8. The tool uses the locale's encoding, whatever the file holds.
      elsewhere:
        - sort, grep, awk and many language runtimes read the locale.
        - Databases have a collation setting that plays the same role for sorting and comparing text.
        - Number formats differ by locale, such as a comma or a point before decimals, which breaks parsing numbers
          written on another machine.
    related:
      - explicit-charsets
    resources:
      - title: The GNU C Library, Locales and Internationalization
        url: https://www.gnu.org/software/libc/manual/html_node/Locales.html
      - title: ArchWiki, Locale
        url: https://wiki.archlinux.org/title/Locale
  - slug: http-keep-alive
    name: Persistent HTTP connections (keep-alive)
    area: networking-http
    kind: foundation
    status: generated
    brief: In HTTP/1.1 a connection stays open after a response unless either side asks to close it, so several requests
      can reuse one TCP connection. That saves handshakes, but the server must frame each message exactly and close
      idle connections itself.
    lesson:
      how_it_works: >-
        Opening a TCP connection costs a handshake, and for HTTPS a longer TLS handshake on top, before the first byte
        of a request can be sent. Early HTTP opened a new connection for every request, which made pages with dozens
        of images slow. HTTP/1.1 made connections persistent by default: after a response, the connection stays open
        and the client can send the next request on it. Either side can end this by sending the header Connection:
        close, after which the connection closes once the current message is done.


        Persistence only works if both sides know exactly where each message ends. That is why a server keeping
        connections open must send a correct Content-Length, or use chunked transfer encoding, on every response:
        without it, the client can only find the end of the body when the connection closes, which defeats reuse. On
        the server side, after writing a response, the code goes back to reading the next request head from the same
        socket, and any bytes already buffered past the previous request belong to the next one.


        Open idle connections cost the server memory and, in some models, a thread each, so servers close connections
        that stay idle longer than a short timeout and often cap how many requests one connection may carry.
      examples:
        - A browser loading a page with 30 images reuses a handful of connections instead of opening 30.
        - curl -v with two URLs on the same host prints that it is re-using the existing connection for the second
          request.
        - A server that omits Content-Length on kept-alive connections makes clients hang, waiting for a body end that
          never comes.
      misconceptions:
        - "People think keep-alive is something the client must ask for in HTTP/1.1. It is the default; Connection:
          close is what has to be asked for."
        - People think the Keep-Alive header keeps connections open. It only hints at timeouts; persistence comes from
          the protocol version and the Connection header.
        - People think persistent connections let several requests be in flight at once. In HTTP/1.1 they are answered
          in order, one after another; HTTP/2 added true multiplexing.
      elsewhere:
        - Database and HTTP client libraries keep pools of persistent connections for the same reason.
        - Load balancers keep long-lived connections to back-end servers and reuse them for many client requests.
        - HTTP/2 and HTTP/3 push the idea further by carrying many concurrent requests over one connection.
    prerequisites:
      - message-framing
      - http-message-format
    resources:
      - title: MDN, Connection management in HTTP/1.x
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x
        opened: true
      - title: HTTP persistent connection (Wikipedia)
        url: https://en.wikipedia.org/wiki/HTTP_persistent_connection
        opened: true
      - title: MDN, Keep-Alive header
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Keep-Alive
        opened: true
      - title: "RFC 9112: HTTP/1.1 (connection management)"
        url: https://www.rfc-editor.org/rfc/rfc9112
        opened: true
  - slug: slow-client-timeouts
    name: Timeouts and slow clients
    area: networking-http
    kind: foundation
    status: generated
    brief: A connection that sends slowly, or not at all, holds server resources while doing nothing. Read and idle
      timeouts, plus limits on how many connections and how large a request may be, keep a few slow or hostile clients
      from exhausting a server.
    lesson:
      how_it_works: >-
        A server spends resources on every open connection: memory for buffers, a file descriptor, and in some models
        a whole thread. A client that opens a connection and then sends its request one byte every few seconds, or
        never sends anything, keeps those resources busy without doing useful work. If enough such clients appear, the
        server has no capacity left for real users. This is the idea behind the Slowloris attack, which needs only one
        machine to take down an unprotected server.


        The defence is to put a time limit on every wait. A read timeout closes a connection when no bytes arrive for
        a set period. A header timeout bounds the total time allowed to receive the whole request head, so dribbling
        one byte at a time does not reset the clock forever. An idle timeout closes kept-alive connections that have
        finished a response and are not sending another request. When the server gives up waiting for a request, it
        may answer 408 Request Timeout before closing.


        Timeouts work together with limits: a maximum number of connections, a maximum size for the request head and
        body, and a cap per client address. Choosing values is a trade-off, because timeouts that are too short cut
        off real users on slow networks, and ones that are too long leave the server open to exhaustion.
      examples:
        - A small company's site goes down because one script holds hundreds of connections open, each sending a
          header byte every ten seconds.
        - Telnetting to a server and typing nothing shows whether it ever closes an idle connection.
        - Reverse proxies such as nginx are often placed in front of application servers partly because they enforce
          these timeouts well.
      misconceptions:
        - People think attacks need huge bandwidth. Slow attacks use almost none; they exhaust connections, not the
          network.
        - People think a timeout per read is enough. A client can send one byte just before each read timeout; a
          deadline for the whole request is also needed.
        - People think the operating system protects the server. TCP happily keeps quiet connections open for a very
          long time.
      elsewhere:
        - Database drivers, HTTP clients and message consumers all need timeouts, or one slow dependency freezes the
          caller.
        - Load balancers and API gateways expose idle and request timeouts as core settings.
        - Rate limiters and connection caps per IP address are the related defences against floods of fast requests.
    prerequisites:
      - tcp-sockets
      - concurrent-connections
    resources:
      - title: Slowloris (cyber attack) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Slowloris_(cyber_attack)
        opened: true
      - title: MDN, 408 Request Timeout
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/408
        opened: true
      - title: MDN, Connection management in HTTP/1.x (idle connections)
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x
        opened: true
  - slug: nesting-depth-limits
    name: Nesting depth and stack limits
    area: formats-parsing
    kind: foundation
    status: generated
    brief: Every level of nesting in the input costs a level of the parser's call stack or of an explicit stack. Deeply
      nested input can exhaust it and crash the program, so robust parsers set a depth limit or use an explicit stack.
    lesson:
      how_it_works: >-
        A recursive descent parser enters one routine call for every level of nesting. An array inside an array inside
        an array is three calls deep, and each call keeps a small frame on the call stack until it finishes. The call
        stack has a fixed size, often a few megabytes, decided by the operating system or the language runtime. A file
        containing a hundred thousand opening square brackets in a row is only a hundred kilobytes, yet it asks the
        parser to go a hundred thousand calls deep. Long before the end, the stack runs out and the program crashes
        with a stack overflow.


        This is a real security problem, not a curiosity. Anyone who can send JSON to a service can send deeply nested
        JSON, and a crash on every request is an easy denial of service. That weakness is catalogued as uncontrolled
        recursion.


        There are two standard defences. The first is a depth limit: the parser counts how deep it is and rejects the
        input with a clear error once it passes a chosen maximum, such as a few hundred or a thousand levels. The
        second is to replace recursion with an explicit stack kept in ordinary memory, which grows much further and
        can be capped by size. RFC 8259 explicitly allows implementations to set limits on nesting depth, so either
        choice is conforming as long as it is deliberate and documented.
      examples:
        - A service accepts JSON from users and crashes on a request body made of tens of thousands of opening
          brackets, taking the worker down every time.
        - "The json.org test suite includes a file nested 20 levels deep that its own checker rejects as too deep,
          while RFC 8259 parsers may accept it: the depth limit is an implementation choice."
        - XML and YAML parsers face the same problem with deeply nested elements.
      misconceptions:
        - People think file size limits protect them. A tiny file can still be extremely deep.
        - People think the stack is as large as memory. It is a small, fixed region, far smaller than the heap.
        - People think any depth limit breaks the standard. RFC 8259 permits limits on depth.
      elsewhere:
        - Any recursive algorithm over untrusted input, such as walking a directory tree or evaluating nested
          expressions.
        - Web servers and API gateways that set limits on request depth and size.
        - Compilers that limit how deeply expressions or blocks may nest.
    resources:
      - title: "CWE-674: Uncontrolled Recursion"
        url: https://cwe.mitre.org/data/definitions/674.html
        opened: true
      - title: Stack overflow (Wikipedia)
        url: https://en.wikipedia.org/wiki/Stack_overflow
        opened: true
      - title: RFC 8259, section 9 (parsers may limit nesting depth)
        url: https://www.rfc-editor.org/rfc/rfc8259
        opened: true
      - title: Parsing JSON is a Minefield (deep nesting tests)
        url: https://seriot.ch/security/parsing_json.html
        opened: true
  - slug: string-escapes
    name: Escapes in strings
    area: formats-parsing
    kind: foundation
    status: generated
    brief: Inside a quoted string, an escape such as a backslash followed by n or a double quote stands for a character
      that could not be written plainly. JSON's backslash-u escape names a UTF-16 code unit, so a character beyond
      U+FFFF is written as two escapes, a surrogate pair.
    lesson:
      how_it_works: >-
        A string in a text format needs a way to hold the characters that would otherwise end it or be invisible. JSON
        strings sit between double quotes, so a double quote inside the string is written as a backslash followed by a
        double quote, and a backslash itself is written as two backslashes. Control characters, the code points from
        U+0000 to U+001F such as newline and tab, must not appear raw inside a JSON string at all; they have to be
        written as escapes such as backslash n or backslash t.


        The most general escape is a backslash, the letter u and exactly four hexadecimal digits, which names one
        UTF-16 code unit. That covers every character up to U+FFFF directly. A character above that, such as most
        emoji, needs two such escapes in a row: a high surrogate followed by a low surrogate. A parser that builds
        real text has to recognise the pair and join the two halves into one code point. A lone high or low surrogate
        with no partner is not a real character, and RFC 8259 notes that parsers behave unpredictably when they meet
        one.


        A lexer for strings therefore runs a small state machine: inside the string, a backslash switches to an escape
        state that accepts only the allowed letters, and a u starts a run of four hex digits. Anything else, such as a
        backslash followed by x, or a raw tab, makes the string invalid.
      examples:
        - The grinning face emoji is written in an escaped JSON string as two backslash-u escapes, D83D followed by
          DE00, and a correct parser turns them into one character.
        - A log line containing a raw tab inside a JSON string is rejected by strict parsers because control
          characters must be escaped.
        - Two services disagree about a username because one parser replaces a lone surrogate escape with U+FFFD and
          the other keeps it, so the same JSON means two different strings.
      misconceptions:
        - People think backslash-u can write any code point. It writes one 16-bit unit, so characters above U+FFFF
          need a surrogate pair.
        - People think any backslash sequence is allowed, as in many programming languages. JSON allows only eight
          escape letters plus the u form.
        - People think non-ASCII characters must be escaped. JSON allows them raw, in UTF-8; escaping is optional for
          them.
      elsewhere:
        - String literals in programming languages, URLs with percent-encoding, and HTML entities all solve the same
          problem in different ways.
        - Logging pipelines that escape newlines so one event stays on one line.
        - Security bugs where an escape is decoded twice or not at all.
    resources:
      - title: RFC 8259, section 7 (strings and escapes) and 8.2 (unpaired surrogates)
        url: https://www.rfc-editor.org/rfc/rfc8259
        opened: true
      - title: Escape sequence (Wikipedia)
        url: https://en.wikipedia.org/wiki/Escape_sequence
        opened: true
      - title: "Unicode FAQ: UTF-8, UTF-16, UTF-32 and BOM (surrogates)"
        url: https://www.unicode.org/faq/utf_bom.html
        opened: true
  - slug: parse-error-reporting
    name: Reporting parse errors
    area: formats-parsing
    kind: foundation
    status: generated
    brief: A good parser stops at the first token the grammar does not allow and says where it is, by line and column,
      what it expected and what it found, so a person can fix the input quickly.
    lesson:
      how_it_works: >-
        Rejecting invalid input is only half the job; the other half is telling a person how to fix it. Because a
        recursive descent parser always knows which tokens are allowed next, the first token that does not fit is a
        precise place to stop. A useful message has three parts: where the problem is, what the parser expected at
        that point, and what it actually found. For example, after the key name inside an object the parser expected a
        colon and found a comma.


        Where means a position a person can use. Byte offsets are easy for programs, but people think in lines and
        columns, so the lexer records the line and column where each token starts. Counting columns has its own
        subtlety: a column can be counted in bytes, in code points or in what a person sees as characters, and they
        differ for non-ASCII text. Editors and tools should agree on which one they report.


        The position that is reported should be where the rule broke, not where the program noticed. A missing closing
        bracket is only discovered at the end of the input, so a helpful parser also says which opening bracket was
        never closed. Messages should quote a little of the input but never echo huge or sensitive values, since error
        messages often end up in logs.
      examples:
        - "Invalid JSON at line 12, column 7: expected a colon after the key, found a comma."
        - A configuration loader that only says invalid JSON makes a person bisect a 2,000-line file by hand.
        - An API that returns the exact position of a syntax error in a request body lets the client developer fix it
          in one try.
      misconceptions:
        - People think the error position is where the program failed. It should be where the input first broke the
          rules.
        - People think one message per error is always possible. After the first error the parser's view of the input
          is uncertain, which is why simple parsers stop at the first error.
        - People think columns are obviously counted in characters. Tools differ between bytes, code points and
          visible characters.
      elsewhere:
        - Compiler and interpreter error messages.
        - Form validation that points at the wrong field.
        - Linters and schema validators for configuration files.
    resources:
      - title: Crafting Interpreters, Parsing Expressions (syntax errors)
        url: https://craftinginterpreters.com/parsing-expressions.html
        opened: true
      - title: Elm, Compiler Errors for Humans
        url: https://elm-lang.org/news/compiler-errors-for-humans
        opened: true
      - title: Crafting Interpreters, Scanning (lexical errors and positions)
        url: https://craftinginterpreters.com/scanning.html
        opened: true
  - slug: strict-vs-lenient-parsing
    name: Strict and lenient parsing
    area: formats-parsing
    kind: foundation
    status: generated
    brief: A strict parser accepts exactly what the specification allows. A lenient one also accepts common mistakes such
      as trailing commas or comments. Leniency feels friendly, but when two systems parse the same input differently
      it causes interoperability and security bugs.
    lesson:
      how_it_works: >-
        Every parser makes choices at the edges of the specification. Some choices are about mistakes: should a
        trailing comma, a comment, single quotes or an unquoted key be rejected or quietly accepted? Others are about
        places the specification leaves open: when an object has the same key twice, should the first value win, the
        last one, or should it be an error? How large a number, how long a string, how deep a nesting will be
        accepted?


        The old advice known as the robustness principle said be conservative in what you send and liberal in what you
        accept. Experience has shown the cost of the liberal half. When one component accepts input that another
        rejects, or reads it differently, the two systems no longer agree on what the data means. An attacker can then
        craft one document that a security check reads one way and the service behind it reads another way. Duplicate
        keys are the classic case: a gateway checks the first value of a role key while the application uses the last
        one.


        The practical approach is to be strict by default, to reject what the specification forbids, and to make every
        remaining choice deliberate and documented: which value wins for duplicate keys, the depth limit, and what
        happens to numbers beyond the supported precision. Extensions such as comments belong in an explicitly named
        format, such as JSON5, not silently in a JSON parser.
      examples:
        - A permissions check reads the first role key in a request and the application reads the last one, so a
          request with role user and then role admin passes the check and runs as admin.
        - A configuration file with a trailing comma works in one tool and fails in another, and nobody can tell which
          tool is right without the specification.
        - The json.org checker accepts some numbers the grammar forbids and rejects some it allows, which shows that
          even reference tools need testing.
      misconceptions:
        - People think accepting more input is always kinder. It moves the error to a later, more confusing place, or
          to a different system.
        - People think strictness is only pedantry. Disagreement between parsers is a known source of security bugs.
        - People think the specification answers every question. RFC 8259 leaves duplicate keys, number limits and
          depth limits to the implementation.
      elsewhere:
        - HTTP request smuggling, where a proxy and a server disagree about where a request ends.
        - Email and URL parsing differences between libraries.
        - File formats such as ZIP, where two readers can see different contents in the same file.
    resources:
      - title: Bishop Fox, An Exploration and Remediation of JSON Interoperability Vulnerabilities
        url: https://bishopfox.com/blog/json-interoperability-vulnerabilities
        opened: true
      - title: "RFC 9413: Maintaining Robust Protocols"
        url: https://www.rfc-editor.org/rfc/rfc9413
        opened: true
      - title: Robustness principle (Wikipedia)
        url: https://en.wikipedia.org/wiki/Robustness_principle
        opened: true
      - title: JSON5, an explicitly named extension of JSON
        url: https://json5.org/
        opened: true
  - slug: client-identity
    name: Identifying the client to limit
    area: apis-backends
    kind: foundation
    status: generated
    brief: A rate limit is only as fair as the key it counts by. An IP address is easy to get but shared by many users
      behind one network, hidden behind proxies, and forgeable in headers; an API key or user account identifies the
      caller far better.
    lesson:
      how_it_works: >-
        Every limiter counts something per key: per IP address, per API key, per user account, per session or a
        combination. The key decides who shares a limit, and so whether the limit is fair and whether it can be
        escaped.


        The IP address is the easiest key because every request carries one, and it is the only choice for anonymous
        traffic. But it is weak in three ways. First, many people can share one public address: an office, a school, a
        mobile carrier or a VPN can put thousands of users behind it, so they all share one limit and one heavy user
        blocks the rest. Second, when the server sits behind a load balancer, CDN or reverse proxy, the address it
        sees is the proxy's, so every client collapses into a single bucket unless the real address is recovered.
        Third, the headers that carry the original address, such as X-Forwarded-For or Forwarded, are just text the
        client can write, so they can be trusted only when a proxy you control sets them.


        When the caller is known, a key tied to them is better: an API key, an account or a tenant. It follows the
        caller across networks and lets limits depend on their plan. Many systems use the IP for unauthenticated
        endpoints such as login, and the account everywhere else.


        The opposite mistake is a key that is too broad, for example a counter keyed only on the window and not the
        client, so that all clients share one limit.
      examples:
        - A university's students all appear from one public address and keep hitting a per-IP limit meant for single
          users.
        - A server behind a load balancer limits by the address it sees, which is the load balancer's, and ends up
          rate-limiting the whole internet as one client.
        - An attacker sends a different made-up X-Forwarded-For value on each request to a server that trusts the
          header, and never hits the limit.
      misconceptions:
        - People think one IP address means one person. Networks routinely put many people behind one address, and one
          person can use many.
        - People think the X-Forwarded-For header is reliable. It is only as trustworthy as the proxy that set it.
      elsewhere:
        - Fraud detection and abuse prevention face the same question of who a request really comes from.
        - Analytics that count unique visitors by address undercount offices and overcount mobile users.
        - Logging and auditing behind proxies need the real client address recovered the same way.
    resources:
      - title: MDN, X-Forwarded-For header
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Forwarded-For
        opened: true
      - title: "RFC 7239: Forwarded HTTP Extension"
        url: https://www.rfc-editor.org/rfc/rfc7239
        opened: true
      - title: NGINX, Module ngx_http_realip_module
        url: https://nginx.org/en/docs/http/ngx_http_realip_module.html
        opened: true
      - title: Network address translation (Wikipedia)
        url: https://en.wikipedia.org/wiki/Network_address_translation
        opened: true
  - slug: rate-limit-responses
    name: Telling clients they are limited
    area: networking-http
    kind: foundation
    status: generated
    brief: A rejected request should get the HTTP status 429 Too Many Requests, ideally with a Retry-After header saying
      how long to wait, so programs can tell a limit apart from success or a server failure and back off.
    lesson:
      how_it_works: >-
        Programs that call an API make decisions from the status code, not from the words in the body. If a limiter
        rejects a request with 200 OK and a message such as "slow down", every program treats it as success, keeps
        going at full speed and may even store the message as if it were data. The limit then protects nothing and
        confuses everyone.


        HTTP has a status code for this case: 429 Too Many Requests, defined in RFC 6585. It says the client has sent
        too many requests in a given time. Like other 4xx codes it puts the cause on the client, which separates it
        from 503 Service Unavailable, which says the server itself is overloaded or down for everyone. A 429 must not
        be cached, because it describes a moment, not the resource.


        The response may include a Retry-After header, defined in HTTP's core semantics, giving either a number of
        seconds or a date after which the client may try again. Well-behaved clients wait that long instead of
        retrying at once, which matters because immediate retries make the overload worse. Many APIs also send headers
        describing the quota itself, such as how many requests remain and when the window resets, so clients can slow
        down before they are blocked; the IETF is standardising these as RateLimit fields, but they are still a draft.


        On the client side the matching habit is back-off: wait as told, or wait longer after each rejection, often
        with a little randomness so many clients do not all retry at the same instant.
      examples:
        - A script calling a code-hosting API reads a 429 with Retry-After of 30, sleeps 30 seconds and continues
          without errors.
        - An API that returned 200 with an error message for limits found that clients cached the message and showed
          it to users for hours.
        - Thousands of phones that all retried at once after an outage were spread out by adding random delays to
          their back-off.
      misconceptions:
        - People think the body explains the error well enough. Programs act on the status code and headers.
        - People think 429 and 503 mean the same. 429 is about one client's rate; 503 is about the server's own state.
      elsewhere:
        - Every major cloud and SaaS API returns 429 and documents its retry behaviour.
        - HTTP client libraries often have built-in retry with back-off that reads Retry-After.
        - Message queues and email servers use similar 'try again later' signals.
    resources:
      - title: "RFC 6585: Additional HTTP Status Codes (429 Too Many Requests)"
        url: https://www.rfc-editor.org/rfc/rfc6585.html
        opened: true
      - title: "RFC 9110: HTTP Semantics (Retry-After)"
        url: https://www.rfc-editor.org/rfc/rfc9110.html
        opened: true
      - title: MDN, 429 Too Many Requests
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/429
        opened: true
      - title: IETF draft, RateLimit header fields for HTTP
        url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/
        opened: true
  - slug: durability-and-fsync
    name: Durability, fsync and the append-only log
    area: state-storage
    kind: foundation
    status: generated
    brief: A write normally lands in the operating system's memory, not on disk, so a power cut can lose it. Forcing a
      flush with fsync makes data durable at a cost in speed, and an append-only log flushed every write or every
      second bounds what a crash can lose.
    lesson:
      how_it_works: >-
        When a program writes to a file, the operating system usually copies the bytes into its page cache in memory
        and reports success at once. It writes them to the disk later, in the background. This makes writes fast, but
        if the machine loses power before that background write, the data is gone even though the program was told the
        write succeeded. A process crash alone does not lose it, because the operating system still holds the cache; a
        power cut or a kernel crash does.


        Durability means that once a write is confirmed, it survives such failures. The system call fsync asks the
        operating system to push a file's data to stable storage and waits until the device reports it done. Only
        after fsync returns is the data safe from a power cut. The cost is time: a flush waits for the disk, which
        takes from well under a millisecond on a fast drive to many milliseconds on a slow one, so calling it after
        every write slows a busy server down.


        Redis offers a second kind of persistence for this, the append-only file. Every write command is appended to a
        log as it happens, and on restart the log is replayed to rebuild the store. How often the log is flushed is a
        setting: after every write, which is the safest and slowest; once a second, which risks about a second of
        writes; or never, leaving it to the operating system, which is fastest. Because the log grows, it is
        periodically rewritten into a compact form.


        Snapshots and logs trade off differently: a snapshot is compact but loses everything since it was taken, while
        a log loses at most what was not yet flushed.
      examples:
        - A server replies OK to SAVE, and a power cut a second later leaves an empty or partial file because the
          bytes were still in memory.
        - A payment service flushes its log after every write and accepts the slower writes, because losing a
          confirmed payment is not acceptable.
        - A cache uses the once-a-second setting and accepts losing up to a second of writes in exchange for speed.
      misconceptions:
        - People think a successful write means the data is on disk. It usually means the data is in the operating
          system's memory.
        - People think a crash of the program loses unflushed writes. A process crash usually does not, since the
          operating system still holds them; a power cut does.
        - People think flushing after every write is free. Each flush waits for the storage device, so it can cut
          throughput sharply.
      elsewhere:
        - Databases write a log ahead of changing their data files and flush it at commit, which is why a committed
          transaction survives a crash.
        - File systems keep a journal so they can recover a consistent state after a power cut.
        - Message queues let you choose whether a message is confirmed before or after it is flushed to disk.
    resources:
      - title: fsync(2), Linux manual page
        url: https://man7.org/linux/man-pages/man2/fsync.2.html
        opened: true
      - title: Redis persistence (AOF fsync policies)
        url: https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
        opened: true
      - title: Durability (database systems) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Durability_(database_systems)
        opened: true
      - title: Page cache (Wikipedia)
        url: https://en.wikipedia.org/wiki/Page_cache
        opened: true
  - slug: request-pipelining
    name: Pipelining requests
    area: networking-http
    kind: foundation
    status: generated
    brief: Waiting for each reply before sending the next request costs a full round trip per request. Pipelining sends
      many requests at once and reads the replies afterwards, in order, so the round trip is paid once per batch.
    lesson:
      how_it_works: >-
        Every request over a network pays a round trip: the time for the request to reach the server and the reply to
        come back. Inside one data centre that is a fraction of a millisecond, but between continents it can be over a
        hundred milliseconds. A client that sends one command, waits for the reply, then sends the next spends most of
        its time waiting, so 1,000 commands cost 1,000 round trips however fast the server is.


        Pipelining removes that waiting. The client writes many commands to the connection one after another without
        reading anything, then reads all the replies. The round trip is paid once for the whole batch, and the server
        also does less work per command, because it handles one large read and one large write instead of many tiny
        ones. Throughput can rise by several times.


        For this to work the server must do two things. It must parse every complete command that arrives in one read,
        rather than assuming one read holds one command. And it must send the replies in exactly the order the
        commands arrived, because the client matches replies to commands by position, not by any id.


        Pipelining is not a transaction. Commands from other clients can still run between the commands of a batch,
        and if one command fails the others still run. Very large batches also make the server hold many replies in
        memory before the client reads them, so clients usually send batches of a sensible size.
      examples:
        - Loading 100,000 keys into a remote store one by one takes minutes; sent in pipelined batches it takes
          seconds.
        - redis-benchmark with the pipeline option set to 16 reports several times more requests per second than
          without it on the same server.
        - HTTP/1.1 allowed pipelining but replies still had to come back in order, so one slow reply delayed the rest,
          which later protocols fixed.
      misconceptions:
        - People think a faster server fixes slow remote commands. When the time goes on round trips, only fewer round
          trips help.
        - People think pipelined commands run together atomically. Other clients' commands can run in between, and
          each command succeeds or fails on its own.
        - People think the server needs special support to receive a pipeline. It only needs to parse several commands
          from one read and answer them in order.
      elsewhere:
        - Database drivers batch inserts so many rows travel in one round trip.
        - HTTP/2 multiplexes many requests on one connection, removing the in-order delay of HTTP/1.1 pipelining.
        - Web pages bundle many small files into fewer requests to cut round trips on slow mobile networks.
    resources:
      - title: Redis pipelining
        url: https://redis.io/docs/latest/develop/using-commands/pipelining/
        opened: true
      - title: Round-trip delay (Wikipedia)
        url: https://en.wikipedia.org/wiki/Round-trip_delay
        opened: true
      - title: HTTP pipelining (Wikipedia)
        url: https://en.wikipedia.org/wiki/HTTP_pipelining
        opened: true
  - slug: flow-control-backpressure
    name: Flow control and backpressure
    area: networking-http
    kind: foundation
    status: generated
    brief: When a receiver reads more slowly than a sender writes, buffers fill and the sender is forced to slow down. TCP
      does this with its receive window, and programs feel it as writes that block or would block. Handling it, rather
      than buffering without limit, keeps a server alive.
    lesson:
      how_it_works: >-
        Every TCP connection has buffers at both ends. Bytes a program writes go into its send buffer, travel to the
        other machine, and wait in that machine's receive buffer until the receiving program reads them. The receiver
        keeps telling the sender how much room is left in its receive buffer, the receive window, and the sender may
        only have that much unacknowledged data in flight.


        If the receiving program stops reading, its receive buffer fills and the window shrinks to zero. The sender
        can no longer transmit, so its own send buffer fills too. From then on the sending program's write cannot
        complete: a blocking write waits until space frees up, and a non-blocking write reports that it would block.
        The sender has been slowed to the receiver's pace. That pressure flowing backwards from a slow consumer to a
        fast producer is called backpressure.


        Backpressure is a feature, but a server must respect it. A server that keeps reading from one side and
        queueing what it cannot write in its own memory turns a slow client into unbounded memory growth. A thread
        blocked on a write to a client that never reads is a thread lost. Good servers stop reading from a source
        while they cannot write to its destination, cap how much they buffer per connection, and use timeouts so a
        peer that never drains is eventually disconnected.


        The same idea appears wherever data flows between parts that run at different speeds: pipes between programs,
        message queues, streams in a program, and protocols that carry flow-control windows of their own.
      examples:
        - "An echo server whose client sends a large file but never reads the echoes: after a few hundred kilobytes
          the server's writes stop going through, and a naive server either blocks that thread forever or keeps
          queueing the echoes in memory."
        - "A shell pipeline where the last program is slow: the earlier programs block on writes to the pipe and pause
          instead of filling memory."
        - A proxy that downloads from a fast server and sends to a phone on a slow network must pause reading from the
          server, or it will hold the whole download in memory.
      misconceptions:
        - A write that returned has delivered the data. It only means the data is in the local send buffer.
        - Bigger buffers solve slow consumers. They only delay the moment the buffers fill.
        - Backpressure is an error. It is the normal signal that the other side needs time.
      elsewhere:
        - Stream libraries in most languages expose backpressure, for example a write that reports the buffer is full
          and a later signal that it has drained.
        - Message queues apply it by refusing or delaying producers when consumers fall behind.
        - HTTP/2 and QUIC carry their own per-stream flow-control windows on top of the connection.
    resources:
      - title: Flow control (data) (Wikipedia)
        url: https://en.wikipedia.org/wiki/Flow_control_(data)
        opened: true
      - title: "RFC 9293: Transmission Control Protocol (TCP)"
        url: https://www.rfc-editor.org/rfc/rfc9293
        opened: true
      - title: Sliding window protocol (Wikipedia)
        url: https://en.wikipedia.org/wiki/Sliding_window_protocol
        opened: true
  - slug: name-resolution
    name: Turning names into addresses
    area: networking-http
    kind: foundation
    status: generated
    brief: Before a program can connect to a host name it must turn the name into IP addresses, through the hosts file and
      the system's DNS resolver. A name can have several addresses, IPv6 and IPv4, and how a client tries them affects
      speed and reliability.
    lesson:
      how_it_works: >-
        Sockets connect to IP addresses, not names. When a program is given a host name, it asks the operating
        system's resolver to translate it. The resolver checks local sources first, such as the hosts file and a
        cache, and otherwise sends a DNS query to a recursive resolver, usually run by the network or a public
        service, which does the full lookup and returns the answer.


        The answer is often a list. A name can have several IPv4 addresses for load spreading and several IPv6
        addresses as well. The resolver orders them by rules about which address families work best, and a
        well-written client tries them in turn: if connecting to the first fails or takes too long, it moves to the
        next. Modern clients race IPv6 and IPv4 attempts a fraction of a second apart, a technique called Happy
        Eyeballs, so a broken IPv6 path does not cost the user a long timeout.


        Resolution takes time and can fail separately from connecting. A name may not exist, the resolver may be
        unreachable, or the answer may be cached and out of date. Errors should say which step failed, because "could
        not resolve host" and "connection refused" point to very different problems.


        Because answers carry a time to live, resolvers cache them. That is what makes the second lookup of a name
        instant, and also why a changed address can take a while to reach everyone.
      examples:
        - A command-line tool hangs for twenty seconds on a server but not on a laptop because the server gets an IPv6
          address first and has no working IPv6 route, so every connection waits for a timeout before trying IPv4.
        - A developer adds a line to the hosts file to point a production name at a test machine, and forgets to
          remove it.
        - An outage at a public DNS service makes many sites unreachable even though their servers are fine.
      misconceptions:
        - A host name maps to exactly one address. It often maps to several, of both families.
        - Every lookup goes out to the internet. Most are answered from caches on the machine or at the resolver.
        - If the name resolves, the server is up. Resolution and connection are separate steps that fail separately.
      elsewhere:
        - Browsers and HTTP clients keep their own DNS caches and connection pools keyed by host.
        - Service discovery in clusters works by answering name lookups with the addresses of healthy instances.
        - Content delivery networks answer the same name with different addresses depending on where the user is.
    resources:
      - title: getaddrinfo(3), Linux manual page
        url: https://man7.org/linux/man-pages/man3/getaddrinfo.3.html
        opened: true
      - title: "MDN Glossary: DNS"
        url: https://developer.mozilla.org/en-US/docs/Glossary/DNS
        opened: true
      - title: Domain Name System (Wikipedia)
        url: https://en.wikipedia.org/wiki/Domain_Name_System
        opened: true
  - slug: chunked-transfer-encoding
    name: Chunked transfer encoding
    area: networking-http
    kind: foundation
    status: generated
    brief: HTTP/1.1 can send a body whose total length is not known in advance as a series of chunks, each preceded by its
      size in hexadecimal and ended by a chunk of size zero. A client must strip the size lines and join the data.
    lesson:
      how_it_works: >-
        An HTTP/1.1 reply needs a way to say where its body ends while the connection stays open. Content-Length gives
        the exact number of bytes, but a server that generates its output on the fly may not know that number when it
        starts sending. Chunked transfer encoding solves this. The server sends the header Transfer-Encoding: chunked
        and then the body as a sequence of chunks.


        Each chunk starts with a line holding its size in hexadecimal, followed by a carriage return and line feed,
        then exactly that many bytes of data, then another carriage return and line feed. The body ends with a chunk
        of size zero, which may be followed by trailer headers and a final empty line. So a chunk line reading 1f8
        announces 504 bytes of data.


        A client reading such a body loops: read a size line, convert it from hexadecimal, read exactly that many
        bytes, read the line ending, and stop at size zero. The size lines are framing, not content, so they must
        never be printed as part of the body. The bytes of one chunk can still arrive across several reads, which is
        why the reader must count bytes rather than rely on read boundaries.


        Chunked encoding and Content-Length must not be combined. Servers and proxies that disagree about which one
        wins have been tricked into reading one request as two, an attack called request smuggling. HTTP/2 and HTTP/3
        do not use chunked encoding; they frame data in their own way.
      examples:
        - A search page that streams results as it finds them sends each batch as a chunk, so the browser can start
          showing results before the search finishes.
        - A hand-written HTTP client prints stray lines such as 1f8 and 0 around the JSON it fetched, because it
          printed the chunk sizes along with the data.
        - A server that compresses its output on the fly cannot know the compressed size in advance, so it uses
          chunked encoding.
      misconceptions:
        - The chunk size is in decimal. It is hexadecimal.
        - One chunk arrives in one read. A chunk can be split across reads, and one read can hold several chunks.
        - A body is either chunked or has no end. Content-Length and closing the connection are the other two ways to
          end one.
      elsewhere:
        - Streaming APIs, including servers that stream model output, use chunked replies over HTTP/1.1.
        - Proxies must rewrite or pass through the encoding correctly, and bugs here cause request smuggling.
        - The same length-prefixed framing idea appears in many binary protocols.
    resources:
      - title: "RFC 9112: HTTP/1.1 (chunked transfer coding)"
        url: https://www.rfc-editor.org/rfc/rfc9112
        opened: true
      - title: MDN, Transfer-Encoding header
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Transfer-Encoding
        opened: true
  - slug: tls-basics
    name: "TLS: encrypted, authenticated connections"
    area: networking-http
    kind: foundation
    status: generated
    brief: TLS sits between TCP and HTTP. A handshake agrees on keys and lets the client check the server's certificate
      before any request is sent, and then every byte is encrypted and protected against tampering. https is HTTP over
      TLS, normally on port 443.
    lesson:
      how_it_works: >-
        Plain HTTP travels as readable text, so anyone on the path, such as a shared Wi-Fi network or a compromised
        router, can read the request, the reply and any password or cookie, and can change them. TLS fixes this by
        adding a layer between the TCP connection and the HTTP messages.


        When the TCP connection opens, client and server first run a handshake. The client says which host it wants,
        using an extension called server name indication, because one address can serve many sites. The server sends
        its certificate, which binds its name to a public key and is signed by a certificate authority. The client
        checks that the signature chains up to an authority it trusts, that the certificate is still valid, and that
        the name matches the host it meant to reach. The two sides then agree on fresh secret keys. In TLS 1.3 this
        takes one round trip before data can flow.


        After the handshake, every byte of HTTP is encrypted and carries an integrity check, so an eavesdropper sees
        only sizes and timing, and any change is detected. The request itself is unchanged: the same request line and
        headers, just sent inside the encrypted channel.


        Certificate checking is the part that gives security. Encryption with a server whose identity was not checked
        only protects you from everyone except the attacker you are talking to. Turning off verification to make an
        error go away removes the protection entirely.
      examples:
        - A user on café Wi-Fi logs in to a plain-http site, and anyone on the same network can read the password from
          the traffic.
        - "A tool that speaks plain HTTP on port 80 cannot fetch an https URL: the server on port 443 expects a TLS
          handshake first, not a request line."
        - An expired certificate makes browsers show a full-page warning, because the server can no longer prove who
          it is.
      misconceptions:
        - TLS hides which site you visit. The server name is usually visible in the handshake, and the address always
          is.
        - Encryption alone makes a connection safe. Without checking the certificate, you may be encrypting to an
          attacker.
        - https changes the HTTP messages. They are the same messages, carried inside an encrypted channel.
      elsewhere:
        - Email, databases and message brokers use TLS for their own protocols.
        - Mutual TLS, where the client also presents a certificate, is common between services inside companies.
        - Let's Encrypt issues free certificates automatically, which is why most sites now use https.
    resources:
      - title: "RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3"
        url: https://www.rfc-editor.org/rfc/rfc8446
        opened: true
      - title: MDN, Transport Layer Security (TLS)
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security
        opened: true
  - slug: dns-caching-ttl
    name: Caching and time to live
    area: state-storage
    kind: foundation
    status: generated
    brief: Every DNS record carries a time to live in seconds. Resolvers keep and reuse a record until it expires, which
      makes lookups fast and also delays changes. Negative answers are cached too.
    lesson:
      how_it_works: >-
        Looking a name up from the root every time would be slow and would overload the root and top-level servers.
        Instead, every resource record carries a time to live, a number of seconds chosen by the owner of the zone. A
        resolver that receives a record may keep it in its cache and answer later questions from the cache until that
        many seconds have passed. When it hands out a cached record it reduces the TTL by the time already spent in
        the cache.


        Caching happens at several levels: in the recursive resolver, often in the operating system, and in
        applications such as browsers. Referral records are cached too, so after one lookup under com a resolver no
        longer needs the root for other com names. Negative answers, saying a name does not exist, are cached for a
        time taken from the zone's settings, so a typo is not looked up again and again.


        The price is that changes spread slowly. If a record has a TTL of a day and its address changes, resolvers
        that cached it keep handing out the old address until their copy expires. Teams planning a move lower the TTL
        well in advance, at least one old TTL before the change, make the change, and raise the TTL again afterwards.


        A short TTL means fresher answers and more queries; a long one means fewer queries and slower changes. Values
        from a minute to a day are common.
      examples:
        - A company moves its website to a new server, and for hours some customers keep reaching the old one because
          their resolvers cached the old address with a long TTL.
        - A resolver that has just looked up one name under com answers the next com name faster, because it cached
          the referral to the com servers.
        - Someone mistypes a domain, then registers it, and finds it does not work for a while because the "does not
          exist" answer was cached.
      misconceptions:
        - Changing a DNS record takes effect at once. Caches keep the old record until its TTL runs out.
        - Only positive answers are cached. Answers saying a name does not exist are cached too.
        - The TTL is set by the resolver. It is set by the zone owner on each record.
      elsewhere:
        - Every cache, from HTTP to databases, faces the same trade-off between freshness and load.
        - Content delivery networks use short TTLs so they can move traffic between locations quickly.
        - Service discovery in clusters often relies on very short DNS TTLs so clients notice when instances come and
          go.
    resources:
      - title: "RFC 1034: Domain names, concepts and facilities (caching)"
        url: https://www.rfc-editor.org/rfc/rfc1034
        opened: true
      - title: "RFC 2308: Negative Caching of DNS Queries"
        url: https://www.rfc-editor.org/rfc/rfc2308
        opened: true
      - title: Time to live (Wikipedia)
        url: https://en.wikipedia.org/wiki/Time_to_live
        opened: true
