stage0:
  summary: "You will build a command-line tool that counts the bytes, lines, words and characters in a text file, and
    that gives the same answers as the Unix wc tool. The input is either a file named on the command line or text
    piped in from another program, and the output is a set of counts printed to the terminal. The tool looks simple,
    but each count has a precise meaning: a line ends at a newline, a word is a run of non-whitespace, and a character
    depends on the text encoding and the locale. The hard part is getting those meanings exactly right while reading
    input that may be larger than the computer's memory, in one pass that can't be rewound."
  questions:
    - id: p-what
      kind: what
      prompt: A user runs the tool on a text file and also pipes text into it from another program. What does the tool take
        in, what does it give back, and what does a word mean here?
      looks_for:
        - It takes a file name or standard input, and gives back counts printed to the terminal
        - A word is a run of characters separated by whitespace, not a single space-separated piece
        - Lines are counted by newline characters, so the last line without a newline may not count
    - id: p-why
      kind: why
      prompt: Why would someone need a small tool that only counts lines, words and bytes, when editors and spreadsheets
        exist? Think about where it would show up in daily work.
      looks_for:
        - Quick checks on the size or shape of data without opening it in an editor
        - Used in scripts and pipelines, where one tool's output feeds the next
        - Small, single-purpose tools can be chained together to do bigger jobs
    - id: p-how
      kind: how
      prompt: A log file is far bigger than the computer's memory, so it can't be loaded whole. How would you approach
        counting its words without holding all of it at once?
      looks_for:
        - Read the input in fixed-size pieces and reuse the same space each time
        - Keep running totals and update them as each piece arrives
        - Remember whether the last character was whitespace, since a word can be split across two pieces
questions:
  - id: s0-q1
    step: s0
    concept: differential-testing
    prompt: Your tool matches wc on the sample file, and a teammate says that proves it works. What's missing, and what
      inputs would you add?
    looks_for:
      - One file only tests the cases it happens to contain.
      - Add nasty inputs such as an empty file, no final newline, emoji, invalid bytes and CRLF line endings.
      - Run both tools on each input and compare, so you don't need to know the answer in advance.
  - id: s1-q2
    step: s1
    concept: text-encoding
    prompt: A colleague's song title has accented letters, and the byte count reports more bytes than the letters they
      see. Is the count wrong, and why?
    looks_for:
      - The count is correct, because a byte count measures bytes, the unit the file is stored in.
      - In UTF-8, a letter outside plain ASCII takes two or more bytes.
      - Counting bytes works on raw data and never decodes it, so the encoding doesn't matter for this count.
  - id: s1-q3
    step: s1
    concept: streaming-constant-memory
    prompt: Your -c reads a file in fixed-size chunks and adds the chunk size to the total on every read. A small file
      gives a total that's too big. Why, and what should it add?
    looks_for:
      - The last read usually returns fewer bytes than requested.
      - Add the number of bytes the read actually returned.
      - A read that returns nothing signals the end of input.
  - id: s2-q4
    step: s2
    concept: lines-and-line-endings
    prompt: Your -l counts newlines. A file's last line has no newline after it, so a teammate who splits the text into
      pieces gets one more line than you do. Why does your count differ, and which one matches wc?
    looks_for:
      - wc counts newline characters, one per line ending.
      - A last line with no newline after it isn't counted.
      - Splitting into pieces counts that trailing piece as a line, which wc doesn't do.
  - id: s3-q5
    step: s3
    concept: word-state-machine
    prompt: A file has words separated by a tab, then two spaces, then a newline. A quick version counts each separator as
      a word break and reports the count. What's wrong, and what should it count?
    looks_for:
      - A run of whitespace is one break, not one per character.
      - A word starts when the machine moves from whitespace into a non-whitespace character.
      - The count is those transitions, not the separators.
  - id: s3-q6
    step: s3
    concept: streaming-constant-memory
    prompt: Your word counter processes the file in chunks, and a word is split between the last byte of one chunk and the
      first byte of the next. If each chunk is counted on its own, what goes wrong, and what must carry over?
    looks_for:
      - The split word is counted twice or not at all.
      - The in-word or between-words state must survive from one chunk to the next.
      - That state lives across reads, not inside a single chunk.
  - id: s4-q7
    step: s4
    concept: text-encoding
    prompt: Your -m counts a family emoji as several characters, but a reader sees one symbol. Why does -m count that way,
      and what does wc treat as one character?
    looks_for:
      - A character here is a code point, and one emoji can be several joined code points.
      - One visible symbol can be several characters, which is a grapheme cluster.
      - wc counts code points under the current encoding, not what a reader sees.
  - id: s4-q8
    step: s4
    concept: differential-testing
    prompt: A teammate's -m count matches wc on their laptop, but the same test fails on the build server with the same
      file. What's the likely cause, and what should the test pin?
    looks_for:
      - The locale sets the encoding, so the same file gives different counts.
      - Pin the locale in the test, such as C.UTF-8, on both sides.
      - The reference tool's version and settings must also be fixed.
  - id: s5-q9
    step: s5
    concept: streaming-constant-memory
    prompt: Default output needs lines, words and bytes from the same input. Your program reads the file once per count,
      and then a teammate pipes it in. What breaks, and how would you fix it?
    looks_for:
      - A pipe can only be read once, so later passes get nothing.
      - Update all the counts while reading each chunk, in one pass.
      - Keep one buffer and reuse it for every chunk.
  - id: s6-q10
    step: s6
    concept: process-contract
    prompt: A script runs your tool on a file name that doesn't exist and checks the exit code. Your tool prints the error
      to standard output and returns 0. What goes wrong for the script, and what should the tool do?
    looks_for:
      - A zero exit code tells the script the run succeeded.
      - Errors belong on standard error so they don't mix with results.
      - Return a non-zero exit code on failure so scripts can react.
