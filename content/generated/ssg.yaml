stage0:
  summary: "You build a command-line tool that turns a folder of Markdown pages and a theme into a folder of plain HTML
    files that any web host can serve. It creates a new site, adds pages to it, runs a local server that updates the
    browser as you edit, and builds the finished files. The inputs are the words each author writes and the layout of
    the theme, and the output is a set of ready-to-upload pages that nobody edits by hand. It looks like
    find-and-replace on a template, but it gets hard fast: text inserted into HTML must be escaped or it breaks the
    page, Markdown has to be read by its structure rather than line by line, and a change to one file should rebuild
    only what depends on it. Along the way you keep content, presentation and output apart, and the rest of the
    project depends on that split."
  questions:
    - id: p-what
      kind: what
      prompt: A writer has a folder of Markdown pages and one theme. What does your tool take in, what does it hand back,
        and what does one page become? Keep the answer to the page level.
      looks_for:
        - the inputs are Markdown content files and a theme that holds the layout
        - the output is a folder of HTML files that a web host can serve as they are
        - each Markdown file becomes one HTML page, named to match its address
        - the output needs no program running on the server
    - id: p-why
      kind: why
      prompt: Why would someone build a site this way instead of writing each HTML page by hand? Think about a site with
        dozens of pages that all share one look.
      looks_for:
        - the shared layout is written once and reused by every page
        - the words and the look can change separately, so a writer never touches HTML
        - a static site needs no server to run, so it is cheap and quick to host
        - the output is plain files, so any host or CDN can serve it
    - id: p-how
      kind: how
      prompt: You edit one Markdown page in a site of many pages, then build again. How would you decide which output files
        must be made again, and why not rebuild everything?
      looks_for:
        - each output depends on its own source page and on shared inputs like the theme
        - a change to a shared input affects every page that uses it
        - rebuilding only what depends on the change saves time on large sites
        - the tool needs a record of which inputs each output depends on
questions:
  - id: s1-q1
    step: s1
    concept: folder-tree-generation
    prompt: A user runs the init command for a project that already has an index.html they have edited, and then runs it
      again. What happens to their edits, and what should the command do instead?
    looks_for:
      - Opening the file for writing in the usual mode empties it, so the second run wipes the user's edits
      - The command should refuse with a clear message, or create only what is missing
      - Creating the file only if absent should be one exclusive call, not a check followed by a write
      - A safe command gives the same result when run a second time
  - id: s3-q2
    step: s3
    concept: content-presentation-output
    prompt: A writer puts column layout written as raw HTML inside about.md, and later the theme's design changes. What
      happens to that page, and why?
    looks_for:
      - The layout sits in the content, so the page does not follow the theme
      - Content should hold only the words, in Markdown
      - The theme owns the look, and changing one part should not require touching the others
      - The output is rebuilt from the sources, so layout belongs in the theme
  - id: s3-q3
    step: s3
    concept: names-urls-links
    prompt: A writer runs the new page command with the name ../../config and some spaces. Where could the file end up,
      and what should the command turn the name into?
    looks_for:
      - Dots and slashes can point the file outside the content folder
      - The command should build a slug from lower-case letters, digits and hyphens
      - The file name becomes the page's address, so the slug should be stable and link-friendly
      - Typed names should never be used as file names unchanged
  - id: s4-q4
    step: s4
    concept: templates-and-escaping
    prompt: A writer's heading reads Tom & <Jerry>, and the page body is converted HTML. If the build puts both into the
      template without escaping, what does a reader see, and how should each value be handled?
    looks_for:
      - The title is plain text, so the ampersand and angle brackets must be escaped
      - The body is HTML that must go in unchanged
      - The place a value goes decides how it is escaped
      - Templates should escape by default and insert raw HTML only on purpose
  - id: s4-q5
    step: s4
    concept: markdown-to-html
    prompt: A page starts with a code block containing a line that begins with a hash, and its real heading is underlined
      with equals signs. Your title lookup takes the first line that starts with a hash. What goes wrong, and how
      should the build find the title?
    looks_for:
      - Block structure is parsed first, so a line inside a code block is code, not a heading
      - The underlined heading is missed by a line search
      - The title should come from the parsed tree as the heading's plain text
      - Searching raw lines is fragile because Markdown rules meet at block level
  - id: s5-q6
    step: s5
    concept: file-watching-live-reload
    prompt: You save a Markdown file in your editor and the dev server builds the site several times, sometimes from a
      half-written file. Why does that happen, and what should the watcher do?
    looks_for:
      - Many editors write a temporary file and rename it, so one save makes several events
      - Rebuilding on every event wastes work and can read a partial file
      - The watcher should wait until events settle, then rebuild once (debouncing)
      - Watching folders rather than single files survives editor renames
  - id: s5-q7
    step: s5
    concept: build-pipeline
    prompt: A writer edits the shared theme, but the dev server rebuilds only the page whose Markdown last changed. What's
      wrong, and how should the build decide what to rebuild?
    looks_for:
      - Every page depends on the template, so all of them are out of date
      - Each output should be linked to the inputs it depends on
      - Timestamps or content hashes show which outputs are stale
      - The rebuild set follows dependencies, not the file that was touched
