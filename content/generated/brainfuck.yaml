stage0:
  summary: "You will build a program that reads a file written in a tiny language made of single-character commands,
    then carries out what the file says. The input is the text of that file, where most characters are ignored as
    plain comments, and the output is whatever the program prints as it runs. Underneath, the program needs a row of
    memory cells that all start at zero, a marker for the current cell, and a marker for the current place in the
    code. The tricky part is loops: every opening bracket must find its matching closing bracket even when loops are
    nested, and execution must jump to the right place in both directions. The language leaves some details open, such
    as how large a cell is, what happens at either end of memory, and what reading input does when none is left, so
    you have to choose behaviour on purpose and keep to it. A first working version will also run slowly, which sets
    up the later work on speed."
  questions:
    - id: p-what
      kind: what
      prompt: Take a file that holds a valid program with a comment in it, such as the word hello sitting between commands.
        What should the program do with that word, and why?
      looks_for:
        - Characters that aren't commands are skipped
        - They have no effect on memory or on the output
        - The program only acts on the command characters, so these are not errors
    - id: p-why
      kind: why
      prompt: You are writing a program that runs code written by someone else. Where do similar programs, which read text
        in a small language and act on it, turn up in everyday software?
      looks_for:
        - Config or query languages inside databases, apps and tools
        - Spreadsheet formulas, search filters or templates
        - Compilers and editors that read source code
        - The same pattern of reading text and then acting on it
    - id: p-how
      kind: how
      prompt: Suppose you had to run one of these files by hand with pencil and paper. What would you write down, and what
        would you do with each character in turn?
      looks_for:
        - A row of cells, all zero, and a note of which cell you are on
        - A note of your place in the file
        - Each command changes the current cell or moves your place
        - Brackets need a way to send you forward or back to their partner
questions:
  - id: s1-q1
    step: s1
    concept: repl
    prompt: A user types the first line of a loop and presses Enter. Your REPL reports an unmatched bracket and stops
      reading. What should it do instead, and how can it tell the entry isn't finished?
    looks_for:
      - An unfinished entry should wait for more lines instead of failing
      - Completeness is judged by whether the brackets balance
      - The partial entry is kept rather than thrown away
  - id: s2-q2
    step: s2
    concept: machine-model
    prompt: Your interpreter's closing bracket moves the data pointer as well as jumping back, and cells come out wrong
      after loops. What does each counter track, and which one should a bracket change?
    looks_for:
      - The data pointer chooses which cell the commands touch
      - The program counter chooses the next command to run
      - Brackets change only the program counter, never the data pointer
  - id: s2-q3
    step: s2
    concept: bracket-matching
    prompt: Your interpreter jumps from a closing bracket back to the nearest opening bracket it sees going backwards. A
      nested loop then runs the wrong number of times. Why, and how should you find the right partner?
    looks_for:
      - Inner loops put brackets of the same kind between the outer pair
      - Counting depth lets an inner pair be skipped
      - The partner is the opening bracket where the depth returns to zero
  - id: s2-q4
    step: s2
    concept: cell-semantics
    prompt: Your copy program prints its last character forever once input runs out. Your comma leaves the cell unchanged
      at end of input. What is happening, and what should you decide and record?
    looks_for:
      - The loop never sees a zero cell, so it never exits
      - The language description leaves the end-of-input value open
      - Choose one behaviour on purpose and document it
      - Programs written for another choice will misbehave
  - id: s3-q5
    step: s3
    concept: bytecode-compilation
    prompt: Your compiler copies the source characters into a list, and the virtual machine still skips comments and
      searches for brackets at run time. Has anything moved to compile time, and what should the compiler produce
      instead?
    looks_for:
      - Work that depends only on the program text belongs at compile time
      - Comments are dropped and each loop's partner target is stored in the instruction
      - Instructions are opcodes with operands, not raw characters
  - id: s4-q6
    step: s4
    concept: virtual-machine
    prompt: Your compiler stores each loop's target as a position in the source text, but your virtual machine reads it as
      a position in the bytecode. Loops now land in the wrong place. What does this say about the instruction set, and
      how do you stop it happening?
    looks_for:
      - Compiler and virtual machine share one definition of each instruction and operand
      - A change to one side is a change to the shared contract
      - Write the meaning down and test both sides together
  - id: s4-q7
    step: s4
    concept: fetch-decode-execute
    prompt: Your virtual machine runs one bytecode instruction per source command, and Mandelbrot only improves a little.
      Why does each trip round the loop cost so much, even though the work per command is tiny?
    looks_for:
      - Fetch and decode happen on every instruction, whatever it does
      - The work a single command does is small
      - Skipping comments removes only a small part of that overhead
  - id: s4-q8
    step: s4
    concept: measuring-performance
    prompt: You time the interpreter and the virtual machine once each, with output going to the terminal, and the virtual
      machine looks a little faster. Is that enough to claim a speed-up, and what would you change?
    looks_for:
      - A single run is noisy and can mislead
      - Printing to the terminal adds its own cost to the timing
      - Repeat runs on the same input and machine, and compare typical values
  - id: s5-q9
    step: s5
    concept: peephole-optimisation
    prompt: Your compiler replaces a run of 300 plus commands with one instruction that adds 300. A program that relies on
      the cell wrapping now prints different output from the uncollapsed version. What should the single instruction
      do with the result, and how would you check it matches the original?
    looks_for:
      - The instruction must apply the cell's size and wrap rule to the total
      - The collapsed and uncollapsed versions must give the same output
      - Test by comparing both versions on the same programs
  - id: s6-q10
    step: s6
    concept: peephole-optimisation
    prompt: Your compiler replaces any loop whose body is a subtract with one clear instruction. A loop that subtracts two
      from an odd value on a wrapping cell never reaches zero. What goes wrong with the rewrite, and what must the
      compiler check before it recognises a loop?
    looks_for:
      - The rewritten loop finishes where the original never ends, so the meaning changed
      - Only a loop that subtracts exactly one reaches zero on every value
      - The rule must match the exact loop body, not any subtract
