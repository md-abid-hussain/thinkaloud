stage0:
  summary: You will build a server that speaks the Redis wire protocol, so the real redis-cli can connect to it and run
    commands such as SET and GET. It keeps keys and their values in memory, and each client sends commands as
    structured messages over a network connection and gets a typed reply back. The input is a stream of bytes from
    each client, and the output is replies in the same format, with the reply type matching the command that was sent.
    What makes it harder than it looks is that a network connection delivers bytes without message boundaries, so one
    read can hold part of a command or several commands at once. Many clients can also connect at the same time and
    change the same keys, so the server must stay correct under concurrent access while handling expiry and saving to
    disk.
  questions:
    - id: p-what
      kind: what
      prompt: A teammate asks who talks to whom when someone runs redis-cli GET on a key, and what that exchange looks like
        as bytes on the wire. What do you tell them?
      looks_for:
        - redis-cli is the client and your server is the one that answers, over a TCP connection
        - the client sends the command as an array of bulk strings, with the command name first
        - the server replies with a typed value, such as a bulk string, or null when the key is missing
        - the reply type depends on the command
    - id: p-why
      kind: why
      prompt: Many web applications use Redis as a fast shared store. Why would a team need to understand its wire protocol,
        and where does that protocol show up day to day?
      looks_for:
        - client libraries in most languages speak the same protocol to a Redis server
        - a compatible server can be tested with the real tools such as redis-cli
        - understanding how the protocol frames messages helps debug any network protocol
        - it appears wherever an app caches data, counts things, or shares state between processes
    - id: p-how
      kind: how
      prompt: Your program receives a stream of bytes from a client, and the bytes carry no marked message boundaries. How
        would it know where one command ends and the next begins?
      looks_for:
        - the protocol marks message ends, either with a length or with line endings
        - a bulk string's header states its length in bytes, so the parser reads exactly that many
        - incoming bytes go into a buffer, and only complete messages are acted on
        - an incomplete message is kept and the program waits for more bytes
questions:
  - id: s1-q1
    step: s1
    concept: resp-wire-format
    prompt: Your test sends a bulk string that holds café, and your decoder counts its length in characters. What happens
      to that value and to the bytes after it, and what should the count be?
    looks_for:
      - the decoder ends the value in the wrong place, so the bytes after it are misread
      - the length counts bytes, and an accented letter takes two
      - the same problem hits any value with non-ASCII bytes
      - the length is known before reading, so the decoder never scans for special characters
  - id: s2-q2
    step: s2
    concept: stream-framing
    prompt: A client sends PING and ECHO hello as two writes, and your server gets both in one read. A long ECHO argument
      also arrives split across two reads. What goes wrong, and how should each connection handle its bytes?
    looks_for:
      - a TCP stream has no message boundaries, so one read can hold half a command or two
      - each connection keeps a buffer and parses one complete command from its front
      - leftover bytes stay in the buffer and are checked again before the next read
      - a read that returns zero bytes means the client closed, so the server closes and frees the buffer
  - id: s2-q3
    step: s2
    concept: command-dispatch
    prompt: A client sends a command with an unknown name, then a batch of bytes that is not RESP at all. What should the
      server reply in each case, and why are the two cases different?
    looks_for:
      - an unknown command is a valid message, so reply with an error and keep the connection open
      - invalid RESP leaves the server unable to find where the next command starts
      - so the server sends a protocol error and closes the connection
      - one bad command should never disconnect other clients
  - id: s3-q4
    step: s3
    concept: keyspace-hash-table
    prompt: Your store keeps keys in a list and scans it on every GET. It passes with five keys but crawls once a
      benchmark fills it. Why does a scan slow down as keys grow, and how does a hash table avoid that?
    looks_for:
      - a scan checks entries one by one, so the cost grows with the number of keys
      - a hash function maps the key to a bucket, so a lookup touches about one bucket
      - collisions share buckets, and the table grows to keep them short
      - growing moves every entry, which can cause a pause
  - id: s3-q5
    step: s3
    concept: command-dispatch
    prompt: A client sends GET with no key. Your handler reads the first argument without checking the count, and the
      server crashes. Where should the check go, and what should the client get back?
    looks_for:
      - the command table records how many arguments each command takes
      - the count is checked before the handler runs, so it never reads a missing argument
      - the client gets an error reply, and the connection stays open
      - one bad command should not crash the server for other clients
  - id: s4-q6
    step: s4
    concept: serving-many-clients
    prompt: Your server starts a thread per client, and all threads write into one shared map. Two clients SET different
      keys at the same moment, and sometimes a key is lost or the server crashes. Why does that happen, and what would
      you change?
    looks_for:
      - two threads changing the map at once can corrupt its internal layout or lose a write
      - a lock must cover the whole map operation, not just part of it
      - reads of the shared map need the same protection as writes
      - or run all commands on one thread with an event loop, so each finishes before the next starts
  - id: s5-q7
    step: s5
    concept: key-expiry
    prompt: A key is set with a one-second lifetime and nobody reads it again. A timer for every key with a lifetime costs
      too much once there are millions of keys. How does your server still free that key's memory?
    looks_for:
      - a lazy check deletes a key when a command touches it and finds its deadline passed
      - a periodic pass samples a few random keys that have deadlines and removes the expired ones
      - the work per pass is bounded, so its cost does not grow with the number of keys
      - a timer per key costs memory and scheduling work that grows with the key count
  - id: s6-q8
    step: s6
    concept: typed-values
    prompt: A key holds a list made by LPUSH, and a client sends GET on it. What should the server reply, and why does the
      store need to remember each key's type?
    looks_for:
      - each key holds one type, and each command works only on the types it accepts
      - the server checks the type before acting and replies with a WRONGTYPE error
      - the connection stays open and the list is unchanged
      - SET replaces a value of any type, so it is the one command that does not check
  - id: s6-q9
    step: s6
    concept: snapshot-persistence
    prompt: SAVE is writing the file when the machine loses power halfway through. If the file was written in place, what
      does the next start find, and how would you write it so a crash can't leave a broken file?
    looks_for:
      - writing over the old file in place can leave neither the old nor the new snapshot intact
      - write a temporary file, flush it to disk, then rename it over the old one
      - a rename replaces the file in one step, so a reader sees either the old or the new version
      - anything written after the last save is still lost, which a snapshot accepts
  - id: s7-q10
    step: s7
    concept: measuring-throughput
    prompt: Your server is about half as fast as Redis with the default 50 connections, but with -P 16 the two come close.
      What does that tell you about where the time goes, and what should you check before changing the data structure?
    looks_for:
      - with the default settings each client waits for every reply, so throughput depends on the round trip
      - pipelining sends many commands per round trip, so the gap shrinks when the cost is per round trip
      - the cost points at per-request work such as reads, writes or system calls, not at the store's lookups
      - profile first, and compare runs with the same settings, repeated several times
