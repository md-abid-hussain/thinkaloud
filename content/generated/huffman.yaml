stage0:
  summary: "You will build a command-line tool that shrinks a text file using Huffman coding, then restores it to an
    exact copy. The input is an ordinary file, and the output is a smaller file that carries enough information to
    rebuild the original. The method rests on text being uneven: some letters appear far more often than others, so
    they can get shorter codes. The hard part is that the result must come back byte for byte, which means the
    compressed file has to describe its own code, and the decoder must know exactly where the data stops. A tool that
    only makes the file smaller is not enough, because it must also undo its work perfectly."
  questions:
    - id: p-what
      kind: what
      prompt: The tool reads a text file and writes a smaller file. What goes in and out, and what is the unit of data it
        counts?
      looks_for:
        - the input is an ordinary file read as a stream of symbols, such as bytes or characters
        - the output is a compressed file that must hold what is needed to undo the work
        - a symbol is the unit whose occurrences are counted and given codes
        - the restored file must match the original exactly
    - id: p-why
      kind: why
      prompt: A friend asks why anyone would bother with a tool like this when storage is cheap. What would you tell them it
        is for, and where do such ideas show up?
      looks_for:
        - smaller files save storage and time when sending them over a network
        - lossless means nothing is lost, which matters for documents and code
        - the same idea runs inside everyday formats and archives
    - id: p-how
      kind: how
      prompt: Your first idea is to give each letter a short code, chosen by guessing how common it is. What goes wrong when
        the text is much longer, or different from what you guessed?
      looks_for:
        - a guess fits some texts and not others
        - counting the actual file first gives the real frequencies
        - the decoder also needs the codes, so they must be stored with the data
questions:
  - id: s1-q1
    step: s1
    concept: frequency-and-entropy
    prompt: Your counts show that 'u' is rare in your text, yet 'q' is almost always followed by 'u'. A teammate expects
      Huffman to use that pattern to save more. What do the counts miss, and what would you need to use it?
    looks_for:
      - the table counts each symbol on its own and ignores what comes next
      - Huffman can only save from how uneven single-symbol counts are
      - patterns between symbols need a different model
  - id: s1-q2
    step: s1
    concept: bytes-versus-characters
    prompt: Your counter decodes the input as text, so a photo in your test folder makes it fail. What should it count
      instead, and what does that choice buy you?
    looks_for:
      - count raw bytes, which have at most 256 possible values
      - no decoding step, so any file works, not only text
      - the decompressor can restore the exact bytes
  - id: s1-q3
    step: s1
    concept: streaming-two-passes
    prompt: A teammate's counter loads the whole input into memory before counting, and it crashes on a file bigger than
      the machine's memory. How would you count the file instead, and what would you keep the same?
    looks_for:
      - read fixed-size blocks and add each block's counts to the table
      - memory depends on the block size, not the file size
      - the table stays small, with one entry per byte value
  - id: s2-q4
    step: s2
    concept: greedy-huffman-tree
    prompt: Your tree joins the two lightest trees at each step. A teammate asks why this is safe and not just a lucky
      guess. What do you say?
    looks_for:
      - the rarest symbols can sit deepest without hurting the total length
      - some best tree places the two rarest symbols as siblings at the bottom
      - the joined pair then acts as one symbol in a smaller problem of the same kind
  - id: s2-q5
    step: s2
    concept: lossless-round-trip
    prompt: Your input is 1,000 copies of the same byte. The tree ends up as a single leaf whose code has no bits, so the
      data section is empty. What goes wrong when you decode, and what would you add to fix it?
    looks_for:
      - the decoder has no bits to walk, so it cannot tell how many symbols to write
      - a stored symbol count or a special case for one symbol fixes it
      - one distinct symbol is an edge case the naive version gets wrong
  - id: s3-q6
    step: s3
    concept: prefix-free-codes
    prompt: Your code table comes from walking the tree. Why can no code in it be the start of another, and what would a
      decoder face if one were?
    looks_for:
      - every symbol sits at a leaf, and a leaf has no children to extend
      - a decoder can't tell whether a symbol is finished if another code begins the same way
      - each code ends at a leaf, where decoding can restart from the root
  - id: s3-q7
    step: s3
    concept: frequency-and-entropy
    prompt: Your table gives a symbol that makes up 90 percent of the input a 1-bit code, yet its information content is
      far below one bit. A teammate asks whether the table can do better. What do you answer?
    looks_for:
      - a whole-bit code can't go below 1 bit per symbol
      - entropy is the lower bound for single-symbol codes
      - the gap comes from the limit of whole-bit codes, and methods that spend fractions of a bit can close it
  - id: s4-q8
    step: s4
    concept: self-describing-format
    prompt: Your header stores the tree as a walk, where each step is a branch or a leaf with its symbol. The decompressor
      reads that walk and must know when it stops. How can it tell, and what would you add if the walk alone isn't
      enough?
    looks_for:
      - a full binary tree walk ends once every branch has two children
      - storing the header length first is another way to find the end
      - the reader must know where the header ends before the bits begin
  - id: s4-q9
    step: s4
    concept: bytes-versus-characters
    prompt: One byte of your header has the value 10, and you write the output in text mode on Windows. The decompressed
      file comes back wrong. Why, and what should you change?
    looks_for:
      - text mode translates a line feed byte into two bytes when writing
      - the header is raw bytes, not text, so it must not be translated
      - open the output in binary mode so every byte is written as-is
  - id: s5-q10
    step: s5
    concept: bit-packing
    prompt: Your encoder fills each byte from the most significant bit, but your decoder reads from the least significant
      bit. The code table is correct, yet the output decodes to garbage from the first byte. Why does one mismatch
      ruin the whole file?
    looks_for:
      - codes run across byte boundaries with no gaps, so one shift misaligns every later code
      - both sides must agree on bit order, and the format should say which
      - a short test input can show the mismatch quickly
  - id: s5-q11
    step: s5
    concept: streaming-two-passes
    prompt: A teammate's encoder writes each output byte with its own write call, and it runs far slower than reading the
      input. Why, and what would you change, including at the end?
    looks_for:
      - each write call has fixed overhead, so per-byte writes cost more than the data
      - collect output in a buffer and write it in chunks
      - flush the last partial buffer at the end, or the tail of the output is lost
  - id: s6-q12
    step: s6
    concept: self-describing-format
    prompt: A teammate sends you a compressed file from a newer version of the tool, and your decompressor produces
      garbage without an error. What should the reader check first, and why before reading the rest?
    looks_for:
      - a magic number identifies your format and rejects files that aren't yours
      - a version number says whether the layout is one the reader knows
      - checking these first stops the reader from trusting counts or lengths it can't interpret
  - id: s6-q13
    step: s6
    concept: greedy-huffman-tree
    prompt: The compressor and decompressor both rebuild the tree from the same header, but two symbols have equal counts
      and the decompressor breaks the tie the other way. What happens when it decodes, and how do you prevent it?
    looks_for:
      - equal counts can give different trees, so the codes differ between the two sides
      - the walk lands on wrong symbols and the output drifts from the input
      - use one fixed tie-break rule on both sides, or store the codes themselves
  - id: s7-q14
    step: s7
    concept: prefix-free-codes
    prompt: Your decoder has used the last bit of the packed data, but its walk down the tree is still on an inner node,
      not a leaf. What does that tell you about the file, and what should the decoder do?
    looks_for:
      - every complete code ends at a leaf, so a walk stuck on an inner node means the data is truncated or corrupt
      - the decoder should not emit a symbol it cannot confirm from the bits
      - reporting an error is safer than guessing, and the symbol count from the header marks where decoding should
        stop
  - id: s7-q15
    step: s7
    concept: bit-packing
    prompt: The last byte holds 5 real bits and 3 filler bits, and those filler bits happen to form a valid code. What
      would the decoder do with them, and what should the format store to prevent it?
    looks_for:
      - the decoder would output an extra symbol that isn't in the input
      - padding appears only at the end, so the decoder needs to know where data stops
      - store the symbol count or the number of real bits, and stop there
  - id: s7-q16
    step: s7
    concept: lossless-round-trip
    prompt: A teammate's test checks that every compressed file is smaller than its input, and a random-bytes test fails.
      What is wrong with that check, and what should the test assert for every input?
    looks_for:
      - no lossless method shrinks every input, and random data has no uneven counts to exploit
      - every input should round trip back to the exact same bytes
      - a size check belongs only to inputs that are expected to compress
