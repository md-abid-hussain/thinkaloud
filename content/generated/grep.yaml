stage0:
  summary: "You build a program that prints the lines of some text that match a pattern, the way the Unix grep tool
    does. The pattern arrives as an argument, along with either files, a folder tree or text piped in from another
    program. Matching lines go out unchanged to standard output, and an exit code tells the caller whether any line
    matched at all. The line is the unit: each one either matches or it doesn't, and a script can act on the result
    without reading any output. What makes it harder than it looks is that the pattern is a small language of its own,
    with special symbols and rules about what binds to what, and it must be read exactly right before any line is
    tested. The tool also has to cope with input too big to hold in memory and with pipes that never end."
  questions:
    - id: p-what
      kind: what
      prompt: A teammate pipes a long server log into your tool with a pattern. What goes in, what comes out, and what
        counts as one match?
      looks_for:
        - The input is a pattern plus a file or standard input
        - The output is the matching lines, printed as they were
        - A match is judged one whole line at a time
        - The exit code reports whether any line matched
    - id: p-why
      kind: why
      prompt: A colleague asks why anyone needs a tool that only prints matching lines when editors can search. Where would
        you expect this tool to earn its place, and why?
      looks_for:
        - It searches many files and folders at once, without a screen
        - It works in pipelines on any text another program produces
        - The exit code lets a script or build decide without reading output
        - It handles files too big for an editor to open comfortably
    - id: p-how
      kind: how
      prompt: You have a pattern with a few special symbols and a file too big to load at once. What's the first idea you'd
        use to split the job, in plain words?
      looks_for:
        - Turn the pattern into a structure once, before reading any line
        - Read the input in pieces rather than all at once
        - Test each line against that structure to get a yes or no
        - Keep the pattern reading separate from the line reading
questions:
  - id: s1-q1
    step: s1
    concept: pattern-parsing
    prompt: A script builds the pattern from a variable, and the variable is empty when the user passes nothing. Should
      your tool print every line, print nothing, or report an error, and why?
    looks_for:
      - The empty pattern is valid input with no pieces, so it is not an error.
      - It matches every line, because every line contains the empty string.
      - Validity comes from the grammar, not from whether the pattern seems useful.
      - An unclosed bracket breaks the grammar, so it must be reported instead.
  - id: s1-q2
    step: s1
    concept: line-streaming
    prompt: The last line of a file has no newline at the end. Your tool adds a newline after every line it prints, and a
      teammate diffs the output against the input. What goes wrong, and what should the tool do?
    looks_for:
      - A file with no final newline still has a last line, and that line must be printed.
      - Adding a newline changes the bytes, so the diff shows a difference.
      - The tool should print a newline only where the input had one.
      - The reader has to notice whether the last line ended with a newline.
  - id: s2-q3
    step: s2
    concept: regex-automata
    prompt: On a 2 GB log, the letter you want appears on the first line. Your matcher reads each line once, keeping a
      small state as it goes. What is that state for a single letter, and when can it answer yes?
    looks_for:
      - The state is a few possibilities, such as seen or not yet seen, not the text read so far.
      - For one letter, one hit is enough to answer yes for that line.
      - The cost grows with the characters read, not with the paths a backtracking search could explore.
      - A fixed set of states keeps the cost predictable.
  - id: s2-q4
    step: s2
    concept: exit-codes
    prompt: A build script runs your tool and reads only its exit code. A file has no line with the letter, and your tool
      prints nothing. What must the exit code be, and why does an exit code of 0 break the script?
    looks_for:
      - No selected line must give a non-zero code, separate from the success code.
      - The script never reads the output, so the exit code is its only signal.
      - Zero means at least one line was selected, so 0 would claim a match that did not happen.
      - Printing nothing is correct, because the code carries the answer.
  - id: s3-q5
    step: s3
    concept: directory-traversal
    prompt: You search a folder tree with recursion, and a symbolic link inside it points back to a folder above it. What
      does a naive walk do, and what should it do instead?
    looks_for:
      - Following the link loops forever, revisiting the same folders.
      - The walk must notice links that lead back into a folder it is already inside.
      - The walk should carry on with the rest of the tree after skipping the cycle.
  - id: s3-q6
    step: s3
    concept: exit-codes
    prompt: Your recursive search finds a match in one file of a 300-file tree, but the last file it visits has no match.
      What exit code should the run give, and why would the status of the last file be wrong?
    looks_for:
      - "The code describes the whole run: zero if any line in any file was selected."
      - Using only the last file's result throws away matches found earlier.
      - A single run gives one answer, so the code is decided once at the end.
  - id: s4-q7
    step: s4
    concept: line-streaming
    prompt: Your tool reads standard input from a log that never ends, such as a live feed piped in. A version reads all
      of the input into memory before it prints anything. What breaks, and how should it read?
    looks_for:
      - A stream that never ends never finishes loading, so nothing is printed.
      - Memory grows with the whole input, not with the longest line.
      - Read in chunks and print each line as soon as its end arrives.
      - The same loop should work for a file and for a pipe.
  - id: s4-q8
    step: s4
    concept: exit-codes
    prompt: You run your tool with -v on a file where every line contains the word. It prints nothing, and a script
      branches on the exit code. What should the code be, and why does the pattern alone not decide it?
    looks_for:
      - With -v, a line is selected when it does not match.
      - No selected line means the code is 1, even though the pattern matched every line.
      - The exit code follows what would be printed, not what the pattern found.
  - id: s5-q9
    step: s5
    concept: pattern-parsing
    prompt: A colleague wants to find the two literal characters backslash and d, but your parser reads that pair as the
      digit class. How should the parser handle a backslash, and what must the colleague write?
    looks_for:
      - A backslash and the character after it form one token, read together.
      - A backslash before another backslash makes the second one literal.
      - The parser decides the meaning from the pair, not from the second character alone.
  - id: s5-q10
    step: s5
    concept: classes-and-anchors
    prompt: A teammate on a machine with a different language setting gets different lines for backslash w on a file with
      accented letters. Why does the result depend on the setting, and what must your program decide?
    looks_for:
      - A class is a set, and deciding which characters belong to it is a choice.
      - Accented letters may or may not count as word characters, depending on the rules used.
      - The program should fix its set of word characters so the result is the same on every machine.
  - id: s6-q11
    step: s6
    concept: classes-and-anchors
    prompt: A user searches with the dollar-sign anchor on a file saved with Windows line endings, and a search for lines
      ending in na finds nothing. What is the last character your program sees, and what does the anchor match?
    looks_for:
      - Each line ends with a carriage return before the newline, so that is the last character.
      - The anchor matches the position after the last character of the line.
      - The program must decide whether the carriage return is part of the line's content.
  - id: s6-q12
    step: s6
    concept: regex-automata
    prompt: Your matcher tries the pattern at each starting position in a line. With a caret at the front, which starting
      positions still need trying, and why?
    looks_for:
      - A caret matches only the position before the first character.
      - So only one starting position can succeed, and the others can be skipped.
      - The answer still depends on whether the rest of the pattern matches from that point.
      - Without the caret, every position is a candidate start.
  - id: s7-q13
    step: s7
    concept: case-folding
    prompt: A user runs with -i to find the word café, and the file contains CAFÉ. Your comparison only changes the
      letters A to Z. What is missed, and what should a case-insensitive comparison use instead?
    looks_for:
      - É and é are different characters, so an A to Z rule misses them.
      - Case-insensitive comparison works on the folded form of each character.
      - Folding rules come from Unicode, not only from the basic Latin letters.
      - The fold is applied to both the pattern and the line.
