# Coding Challenges, Build your own sort. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-sort . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-sort
  title: Build your own sort
  source_url: https://codingchallenges.fyi/challenges/challenge-sort
  level: beginner
  status: generated
  figure:
    kind: sort
  summary: A command-line tool that reads the lines of a file or of piped text and prints them in sorted order, with an
    option to drop duplicate lines, a choice of sorting algorithm and a random order that still keeps equal lines
    together.
  requirements:
    - Print the lines of a file, or of standard input, in lexicographic order
    - Drop duplicate lines with -u, giving the same result as sorting and then running uniq
    - Let the user choose between sorting algorithms such as merge sort, quicksort, heapsort and radix sort
    - Shuffle lines with -R so that equal lines still end up next to each other
    - Give the same output as the real sort, with the locale set to C, on the word list from the challenge
  primer:
    what: sort is a small command-line tool that reads lines of text and prints them back in order. You give it a file
      name, or pipe text into it, and it compares the lines two at a time to decide which goes first. You will build
      your own version that matches the real one, then add options to drop duplicates, pick the algorithm and shuffle.
    why: "Sorting is everywhere: file listings, logs, leaderboards, and as the step that lets other tools such as uniq do
      their job. Building it makes you decide what order text really has, and what a sorting algorithm costs."
    example: Given the lines dog, ant and cat, sort prints ant, cat, dog. To compare two lines it walks along them letter
      by letter, and the first letter that differs decides. Apple and apricot share a, p, then the third letters are p
      and r, and p comes first in the alphabet, so apple goes before apricot.
    words:
      - term: line
        meaning: The text up to a newline. sort treats each line as one item and never splits it.
      - term: lexicographic order
        meaning: Dictionary-style order where two pieces of text are compared from the left and the first difference decides.
      - term: byte order
        meaning: Ordering letters by the number each one is stored as, rather than by a language's alphabet rules.
      - term: locale
        meaning: The language and country settings of a machine, which can change how text is compared and sorted.
      - term: duplicate
        meaning: A line that is exactly the same, byte for byte, as another line in the input.
      - term: stable sort
        meaning: A sort that keeps items which compare as equal in the order they arrived.
  restate_rubric:
    - id: r1
      point: The tool reads lines from a file or standard input and prints them in sorted order
    - id: r2
      point: An option removes duplicate lines, and another lets the user pick the sorting algorithm
    - id: r3
      point: A random sort option shuffles the lines but keeps identical lines together
  reflection_prompt: In your own words, how does your design decide the order of two lines, where does it remove
    duplicates, and what would you change to sort a file far bigger than memory?
  reference_tool: GNU sort with LC_ALL=C, so lines are compared byte by byte.
  done_when: Sorting, -u, file and piped input match the real sort with LC_ALL=C on the word list and tiny files; every
    algorithm you offer passes one shared test suite; -R keeps equal lines together; and your notes explain, in your
    own words, byte order versus locale order, stability, and what each algorithm costs.
  open_checks:
    - Whether the reference sort -R gives a different order on each run on your machine.
    - Which line the reference keeps when -u meets lines that compare equal but are not identical, for example under a
      case-insensitive option.
    - How the reference treats a last line without a final newline and an empty input.
    - What buffer size and temporary folder the reference uses for large inputs on your machine.
learning_map:
  - concept: lexicographic-order
    where: Your sort compares lines character by character and decides at the first difference. In byte order every
      capital comes before every lowercase letter.
    explain_back:
      prompt: A release script sorts version folders named 1.9 and 1.10 and picks the last one as the newest, but it deploys
        1.9. Explain why, and what the script should do instead.
      rubric:
        - id: e1
          point: Text order compares character by character and decides at the first difference
        - id: e2
          point: 1.10 and 1.9 first differ at the 1 and the 9, and 1 comes before 9, so 1.10 sorts first and 1.9 last
        - id: e3
          point: The script needs a comparison that reads the numbers as numbers, part by part, instead of as text
  - concept: locale-settings
    where: The real sort orders lines differently under the C locale and under a UTF-8 language locale, so the challenge
      pins LC_ALL to C.
    explain_back:
      prompt: The same sort command lists Zoe before adam on a build server and adam first on your laptop. Explain why, and
        how to make the result the same everywhere.
      rubric:
        - id: e1
          point: sort follows the locale, and LC_ALL overrides the other settings
        - id: e2
          point: Under the C locale lines are compared byte by byte, so every capital comes before every lowercase letter
        - id: e3
          point: A language locale uses collation rules that group a and A together, so pin the locale, for example LC_ALL=C,
            when the order must be reproducible
  - concept: stdin-vs-file
    where: Your sort reads the file named on the command line, or standard input when there is none, with the same code.
    explain_back:
      prompt: Explain how your sort reads lines from a file or a pipe with one routine, and what it must do when the input
        does not end with a newline.
      rubric:
        - id: e1
          point: Both sources are a stream read until the end, so the source is chosen once and the rest of the code is shared
        - id: e2
          point: A final newline ends the last line; it does not start an empty extra line
        - id: e3
          point: A last line without a newline is still a line, and sort prints it followed by a newline
  - concept: unix-pipelines
    where: "sort and uniq are the classic pair: uniq only removes neighbouring duplicates, so it needs sorted input."
    explain_back:
      prompt: A colleague counts distinct visitors with uniq and then wc -l on a log, and the number is far too high.
        Explain why, and two ways to fix it.
      rubric:
        - id: e1
          point: uniq removes only duplicate lines that are next to each other
        - id: e2
          point: In an unsorted log the same visitor appears in many places, so each separate run is counted again
        - id: e3
          point: Sort first and then uniq, or use sort -u, so equal lines become neighbours before duplicates are removed
  - concept: sorting-algorithms
    where: The challenge lets the user choose between merge sort, quicksort, heapsort and radix sort, each with different
      costs.
    explain_back:
      prompt: A service sorts records that usually arrive nearly sorted, and its home-made quicksort sometimes takes minutes
        instead of milliseconds. Explain why, and two ways to fix it.
      rubric:
        - id: e1
          point: Quicksort splits the items around a pivot and sorts each part
        - id: e2
          point: Choosing the first item as the pivot on sorted input splits off one item at a time, so the work grows with the
            square of the input
        - id: e3
          point: A random pivot or the median of three avoids that, or an algorithm with a guaranteed n log n worst case, such
            as merge sort, can be used
  - concept: sort-stability
    where: Merge sort keeps equal items in their input order and quicksort usually does not. It shows when you sort
      records by a key.
    explain_back:
      prompt: A table is sorted by date and then, with a second sort, by customer. In one tool each customer's rows stay in
        date order and in another they come out scrambled. Explain why.
      rubric:
        - id: e1
          point: A stable sort keeps items whose keys compare equal in the order they arrived
        - id: e2
          point: With a stable second sort the earlier date order survives inside each customer
        - id: e3
          point: An unstable sort puts equal-key rows in any order, so the date order is lost
  - concept: time-space-complexity
    where: Removing duplicates, choosing a pivot and comparing algorithms are all about how time and memory grow with the
      input.
    explain_back:
      prompt: You can remove duplicates before sorting with a set, while merging, or after sorting by comparing neighbours.
        Explain what each costs in time and memory on a file with millions of lines.
      rubric:
        - id: e1
          point: A set needs memory for every distinct line before sorting starts
        - id: e2
          point: Removing duplicates during the merge or after sorting needs no extra memory beyond the sort itself
        - id: e3
          point: Comparing neighbours after sorting is a single linear pass, so the sort, at n log n, dominates the time
  - concept: unit-tests-first
    where: One test suite that every algorithm must pass is what makes it safe to add or swap algorithms.
    explain_back:
      prompt: You add radix sort to a tool that already offers merge sort and quicksort. Explain how a shared, test-first
        suite lets you trust it, and which cases the suite must contain.
      rubric:
        - id: e1
          point: Every algorithm runs against the same tests, written before the code they check
        - id: e2
          point: The cases include empty input, one line, all lines equal, already sorted, reverse sorted and duplicates with -u
        - id: e3
          point: A new algorithm counts as correct only when it passes the whole suite, so swapping algorithms cannot quietly
            change behaviour
  - concept: hash-functions
    where: sort -R hashes every line with a random seed and sorts by the hash, which shuffles the lines but keeps equal
      lines together.
    explain_back:
      prompt: Explain why sorting lines by a seeded hash shuffles them but always keeps identical lines next to each other,
        and why a new seed gives a new order.
      rubric:
        - id: e1
          point: A hash function gives the same number for the same input, so identical lines get identical hashes
        - id: e2
          point: Sorting by those numbers puts lines with equal hashes, including all copies of a line, next to each other
        - id: e3
          point: The seed changes the whole mapping from lines to numbers, so each run with a new seed gives a different order
  - concept: external-sorting
    where: The optional last step sorts a file bigger than the memory you allow, the way the real sort does.
    explain_back:
      prompt: You must sort a 50 GB log on a machine with 8 GB of memory. Explain how to do it and how much memory the final
        phase needs.
      rubric:
        - id: e1
          point: Read as much as fits, sort it in memory, and write it out as a sorted run in a temporary file; repeat until the
            input is used up
        - id: e2
          point: Merge the runs by repeatedly taking the smallest current line among them
        - id: e3
          point: The merge needs only one line per run in memory, and every file is read and written sequentially
  - concept: differential-testing
    where: You check your sort against the real sort with the locale pinned to C, on the word list and on tiny files.
    explain_back:
      prompt: Your sort matches your own expected outputs but differs from the real sort on one word list. Explain what such
        a comparison catches, and what must be fixed on both sides for it to mean anything.
      rubric:
        - id: e1
          point: The real sort gives the right answer for any input, including cases you did not think of
        - id: e2
          point: Your own expected outputs can share your own mistake about the order
        - id: e3
          point: Both runs must use the same locale, such as LC_ALL=C, and the same input bytes, or differences mean nothing
milestones:
  - title: Sort lines in byte order
    summary: Read lines from a file or a pipe, sort them in byte order, and check against the real sort.
    steps:
      - title: Read and sort lines
        minutes: 45
        build: Read the file named on the command line, split it into lines, sort them comparing bytes, and print them. Build
          the word list from the challenge's sample text as the page describes.
        outcome: Your output on the word list, piped into uniq and head -5, prints A, ACTUAL, AGREE, AGREEMENT and AND, the
          same as the real sort with LC_ALL=C.
        concepts:
          - lexicographic-order
        hints:
          hint: Compare at the first position where two lines differ. Which line comes first when one is a prefix of the other?
      - title: Byte order versus your locale
        minutes: 30
        build: Run the real sort on the word list under LC_ALL=C and under your usual UTF-8 locale, and compare.
        outcome: Your notes show where the two orders differ and why, and your tool matches the C order.
        concepts:
          - locale-settings
          - lexicographic-order
        hints:
          hint: Look at where capitals and lowercase words land in each run.
      - title: Files and pipes
        minutes: 30
        build: Read standard input when no file is given, using the same code, without inventing an empty last line and
          without losing a last line that has no newline.
        outcome: Piping the word list into your sort gives exactly the same output as naming the file, and a file without a
          final newline prints its last line followed by a newline.
        concepts:
          - stdin-vs-file
        hints:
          hint: Test the empty file and the one-line file without a newline first.
      - title: Compare with the real sort
        minutes: 30
        build: Write a check that runs the real sort with LC_ALL=C and your tool on the word list and on a few tiny files, and
          reports any difference.
        outcome: The check reports no differences, including on an empty file and a file with no final newline.
        concepts:
          - differential-testing
        hints:
          hint: Set the locale inside the check, not in your shell.
  - title: Unique lines
    summary: See why uniq needs sorted input, add -u, and decide where duplicates are removed.
    steps:
      - title: Why uniq needs sort, and -u
        minutes: 45
        build: Count the lines of the word list through sort and uniq, and through uniq alone. Then add -u so duplicates are
          printed once.
        outcome: Your notes hold both counts and why they differ, and your -u output starts with A, ACTUAL, AGREE, AGREEMENT
          and AND and matches the real sort -u.
        concepts:
          - unix-pipelines
        hints:
          hint: What does uniq compare each line with?
      - title: Where to remove duplicates
        minutes: 30
        build: "Choose where your tool removes duplicates: before sorting with a set, during sorting, or after sorting by
          comparing neighbours."
        outcome: Your notes compare the time and memory of the three choices on a large file, and the choice you made passes
          the -u tests.
        concepts:
          - time-space-complexity
        hints:
          hint: How much memory does each choice need for a file of mostly distinct lines?
  - title: Choose the algorithm
    summary: Offer several algorithms behind one option, all held to the same test suite.
    steps:
      - title: Merge sort and a shared test suite
        minutes: 60
        build: Add an option that selects the sorting algorithm, starting with merge sort. Write first one test suite that
          every algorithm must pass, plus a unit test that sorts records by a key.
        outcome: "Merge sort passes the suite: empty input, one line, all lines equal, already sorted, reverse sorted and
          duplicates with -u; and the key test shows records with equal keys keep their input order."
        concepts:
          - sorting-algorithms
          - sort-stability
          - unit-tests-first
        hints:
          hint: Write the tests so they never mention which algorithm is running.
      - title: Quicksort and its worst case
        minutes: 45
        build: Add quicksort, choosing the pivot so that sorted or reverse-sorted input does not hit the worst case.
        outcome: Quicksort passes the whole suite, and timings on the word list and on the already sorted word list stay close
          to merge sort's; your notes say what a first-item pivot would do.
        concepts:
          - sorting-algorithms
          - time-space-complexity
        hints:
          hint: Time the already sorted input with a first-item pivot once, to see the problem.
      - title: Heapsort and radix sort
        minutes: 45
        build: Optionally add heapsort and radix sort and run them through the same suite.
        outcome: Every algorithm you offer passes the suite, and your notes hold a timing table on the word list.
        concepts:
          - sorting-algorithms
          - time-space-complexity
        hints:
          hint: Radix sort looks at the keys byte by byte instead of comparing whole lines.
  - title: Random order and very large files
    summary: Shuffle with a seeded hash, and sort a file bigger than memory.
    steps:
      - title: Random sort with a seeded hash
        minutes: 45
        build: "Add -R: choose a random seed each run, hash every line with it, sort by the hash and break ties with the line.
          Make it work with -u."
        outcome: Two runs usually give different orders, sorting your -R output gives exactly the real sort's output, and
          equal lines are always next to each other.
        concepts:
          - hash-functions
        hints:
          hint: Test the properties, not a fixed output.
      - title: Sorting a file bigger than memory
        minutes: 60
        build: "Optionally give your tool a memory limit: sort chunks that fit, write each to a temporary file, then merge
          them."
        outcome: With a limit far below the file size, your output on a large generated file is identical to the real sort's,
          and memory stays under the limit.
        concepts:
          - external-sorting
        hints:
          hint: During the merge, how many lines do you need in memory at once?
