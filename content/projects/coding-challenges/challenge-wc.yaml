# Coding Challenges #1, Build your own wc. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-wc . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-wc
  title: Build your own wc
  source_url: https://codingchallenges.fyi/challenges/challenge-wc
  level: beginner
  status: generated
  figure:
    kind: stream
  summary: A command-line tool that counts the bytes, lines, words and characters of a file or of text piped into it,
    and gives the same numbers as the Unix wc tool. Building it teaches how text is really encoded, how to read input
    of any size in constant memory, and how a well-behaved Unix tool works.
  requirements:
    - Count bytes with -c, lines with -l, words with -w and characters with -m
    - With no option, print the line, word and byte counts followed by the file name
    - Read standard input when no file name is given
    - Give the same answers as the reference wc on the challenge's sample file
  primer:
    what: "wc counts what is inside a file: bytes, lines, words and characters. You give it a file name, or pipe text into
      it from another program, and it prints the counts. You will build your own version, called ccwc, that gives the
      same answers as the real one."
    why: Counting sounds trivial, but it forces three real questions. How is text stored as bytes? How do you read input
      that may be far bigger than memory? And how does a small tool behave so that other programs can rely on it?
    example: A file is only a row of numbers called bytes. To show them as letters, a program needs an encoding, a rule
      that maps characters to bytes. In the common encoding UTF-8 the word cat is 3 bytes, one per letter, but café is
      5 bytes, because é needs two. So asking "how many characters?" and "how many bytes?" about the same file can
      give different answers, and that difference is where this project starts.
    words:
      - term: byte
        meaning: The unit a file is stored in, a number from 0 to 255. Plain English letters take one byte each.
      - term: encoding
        meaning: The agreed rule for turning characters into bytes and back. UTF-8 is the most common one.
      - term: code point
        meaning: The number Unicode gives each character, written like U+00E9 for é.
      - term: stream
        meaning: Data you read a piece at a time, start to end, without holding all of it at once.
      - term: standard input
        meaning: The stream a program receives when another program's output is piped into it.
      - term: exit status
        meaning: The number a program returns when it ends. Zero means it worked, anything else means it failed.
  restate_rubric:
    - id: r1
      point: The tool counts bytes, lines, words and characters
    - id: r2
      point: Each count has its own option, and with no option it prints lines, words and bytes
    - id: r3
      point: It reads standard input when no file is given
  reflection_prompt: "Which idea from this project will you use outside wc first: text encodings, constant-memory
    streaming or the Unix tool contract? Describe a real situation where it would have saved you, or someone you know,
    from a bug."
  reference_tool: GNU wc run in a UTF-8 locale (for example LC_ALL=C.UTF-8). Other builds of wc differ on characters and words.
  done_when: All four options, the default output, several files with a total, and standard input match the reference on
    test.txt and on your own hard-text files; the comparison check reports no differences; and your notes explain
    bytes, code points and what a person sees as one character, in your own words.
  open_checks:
    - Which characters beyond ASCII spaces the reference treats as word separators in your locale.
    - How the reference treats invalid bytes for -m and -w.
    - The column widths the reference uses for several files and for piped input.
    - Whether your shell changes the bytes of piped text; some Windows shells do.
learning_map:
  - concept: text-encoding-utf8
    where: -c counts bytes and -m counts characters. On any file that is not plain English the two differ, because UTF-8
      stores a character in 1 to 4 bytes.
    explain_back:
      prompt: A sign-up form allows names of up to 20 characters, but the database column holds 20 bytes. A user types a
        20-character name with several accented letters and it fails to save. Explain what happened, in terms of how
        UTF-8 stores the name.
      rubric:
        - id: e1
          point: Text is stored as code points, and UTF-8 writes each code point as 1 to 4 bytes
        - id: e2
          point: Plain English letters take 1 byte, but accented letters such as é or ó take 2, so 20 characters can need more
            than 20 bytes
        - id: e3
          point: "The limit has to be counted in one unit on both sides: either count characters everywhere, or give the column
            room for the encoded bytes"
  - concept: utf16-code-units
    where: -m has to count code points. Many languages store strings as UTF-16, where a string length counts 16-bit units,
      not characters, so a naive count is wrong for emoji.
    explain_back:
      prompt: A chat app limits messages to 100 characters using the string length of a language that stores strings in
        UTF-16. Users say emoji-heavy messages are cut off early, and some end with a broken symbol. Explain both
        problems.
      rubric:
        - id: e1
          point: UTF-16 stores code points above U+FFFF, which includes most emoji, as a surrogate pair of two 16-bit units
        - id: e2
          point: The string length counts units, so each such emoji counts as 2 and the limit is reached early
        - id: e3
          point: Cutting at a unit boundary can split a surrogate pair, leaving half an emoji that shows as a broken symbol
  - concept: grapheme-clusters
    where: wc -m counts code points, which is not always what a person sees as one character. A thumbs-up with a skin tone
      is one visible symbol made of two code points.
    explain_back:
      prompt: 👍🏽 looks like one character. Explain what it is made of, what a code-point count such as wc -m reports for
        it, and why a text editor still moves the cursor over it in one step.
      rubric:
        - id: e1
          point: "It is two code points: the thumbs-up emoji followed by a skin-tone modifier"
        - id: e2
          point: A code-point count reports 2
        - id: e3
          point: Editors move by grapheme clusters, the units a person reads as one character, so the cursor treats both code
            points as one
        - id: e4
          point: Both counts are correct for different purposes, so a tool must say which one it reports
  - concept: explicit-charsets
    where: To count characters and words your tool decodes bytes into characters, and it must name the encoding instead of
      relying on the machine or locale default.
    explain_back:
      prompt: Your tool gives the right -m count on your laptop but a different one on a colleague's machine for the same
        file. Explain a likely cause and how to make the result the same everywhere.
      rubric:
        - id: e1
          point: Decoding bytes into characters needs an encoding, and if none is named the platform or locale default is used,
            which differs between machines
        - id: e2
          point: Name the encoding explicitly, for example UTF-8, or let the user choose it with an option
        - id: e3
          point: The byte count does not change, because counting bytes needs no decoding
  - concept: decoding-across-chunks
    where: You read input in chunks, and a chunk can end in the middle of a multi-byte character. -m and -w must not break
      that character.
    explain_back:
      prompt: A service reads a UTF-8 file 4,096 bytes at a time and decodes each chunk on its own. Some characters come out
        as replacement symbols, and only in large files. Explain why, and what the decoder needs to do instead.
      rubric:
        - id: e1
          point: A UTF-8 character can be up to 4 bytes, so a chunk boundary can fall inside one
        - id: e2
          point: Decoding each chunk alone sees an incomplete sequence at the edge and replaces it
        - id: e3
          point: One decoder should be kept for the whole input, holding the leftover bytes until the next chunk completes the
            character, and flushing at the end
  - concept: malformed-input
    where: Real files contain bytes that are not valid UTF-8. Your tool has to pick a policy for them and match the
      reference tool.
    explain_back:
      prompt: A log file contains a few bytes that are not valid UTF-8. Describe the ways a decoder can treat them, and how
        each choice changes a character count.
      rubric:
        - id: e1
          point: Stop with an error, so there is no count
        - id: e2
          point: Replace each bad sequence with the replacement character U+FFFD, which is then counted as a character
        - id: e3
          point: Skip the bad bytes, so they are not counted as characters
        - id: e4
          point: Pick one policy on purpose, match the reference tool, and say which one you chose
  - concept: streaming-constant-memory
    where: wc must handle files bigger than memory and pipes that never say how long they are. Your tool keeps only one
      buffer and a few counters.
    explain_back:
      prompt: Your tool counts a 20 GB log on a machine with 8 GB of memory. Explain how much memory it needs and why, and
        what would happen if it read the whole file first.
      rubric:
        - id: e1
          point: It reads a fixed-size buffer at a time and reuses that buffer for every read
        - id: e2
          point: Between reads it keeps only the counters and a little state, so memory does not grow with the size of the input
        - id: e3
          point: Reading the whole file first needs memory in proportion to the file, so it fails or slows to a crawl, and it
            cannot work on an endless pipe
  - concept: stream-read-contract
    where: Your read loop must use the number of bytes each read actually returned, not the size of the buffer.
    explain_back:
      prompt: A read asks for 8,192 bytes and gets back 3. Explain what that means, what the program should do next, and how
        it knows the input has ended.
      rubric:
        - id: e1
          point: A read may return fewer bytes than asked for, for example near the end or from a pipe, and that is not an error
        - id: e2
          point: Only the bytes it reported are valid; the rest of the buffer still holds old data and must be ignored
        - id: e3
          point: The program keeps reading until a read reports the end of the input
  - concept: word-state-machine
    where: -w counts words across chunk boundaries, and -l counts newline characters, so a final line without a newline is
      not counted.
    explain_back:
      prompt: Explain how a program can count words in a stream it only sees in pieces, so that a word split across two
        pieces is counted once. Then explain why a file whose last line has no newline reports one line fewer.
      rubric:
        - id: e1
          point: There are two states, inside a word and between words
        - id: e2
          point: A word is counted on the change from whitespace to a non-whitespace character
        - id: e3
          point: The current state is kept from one piece to the next, so a split word is not counted twice
        - id: e4
          point: Lines are counted by newline characters, so a last line without one is not counted
  - concept: stdin-vs-file
    where: With no file name, ccwc reads standard input. One counting path should serve both a file and a pipe.
    explain_back:
      prompt: Explain how one counting routine can work for both a named file and text piped in from another program, and
        why asking the file system for the size cannot work for piped input.
      rubric:
        - id: e1
          point: Both are a stream of bytes read until the end, so the counting routine only needs something to read from
        - id: e2
          point: Which source to use is decided once, where the input is opened
        - id: e3
          point: A pipe has no size and can be read only once, so the counts have to be made while reading
  - concept: cli-subcommands
    where: ccwc takes options, prints results to standard output and errors to standard error, and reports failure through
      its exit status.
    explain_back:
      prompt: ccwc is given three files and the second does not exist. Explain what should go to standard output, what to
        standard error, what exit status it should return, and why scripts care.
      rubric:
        - id: e1
          point: The counts for the files that exist, and the total, go to standard output
        - id: e2
          point: A message naming the missing file goes to standard error
        - id: e3
          point: The exit status is non-zero to signal that something failed
        - id: e4
          point: Scripts read standard output and check the exit status, so mixing errors into the output, or exiting with 0,
            breaks them
  - concept: differential-testing
    where: You check ccwc by running it and the reference wc on the same inputs and comparing the results.
    explain_back:
      prompt: All your own tests pass, yet your word count differs from the real wc on a file with unusual spaces. Explain
        what comparing against a reference tool catches that your own expected values miss, and what must be the same
        on both sides.
      rubric:
        - id: e1
          point: The reference tool supplies the right answer for any input, including inputs you did not think of
        - id: e2
          point: Your own expected values carry your own misunderstanding, so they can agree with a wrong program
        - id: e3
          point: Both runs must see the same bytes and the same settings, such as the locale or encoding
milestones:
  - title: Bytes and lines
    summary: Set up, pin the reference, then count bytes and lines by streaming the input.
    steps:
      - title: Set up and pin the reference
        minutes: 30
        build: Create the project in your language, download the challenge's test.txt, and run the reference wc on it in a
          UTF-8 locale. Write down its numbers.
        outcome: "Your notes hold the reference counts for test.txt: 342190 bytes, 7145 lines, 58164 words and 339292
          characters."
        concepts:
          - differential-testing
        hints:
          hint: Run the reference with each option on its own, and say which locale it ran under.
      - title: Count bytes by streaming
        minutes: 45
        build: Make ccwc -c read the input through one fixed-size buffer, adding up the number of bytes each read returns.
        outcome: ccwc -c test.txt prints 342190, and memory stays flat on a generated file of several gigabytes.
        concepts:
          - streaming-constant-memory
          - stream-read-contract
        hints:
          hint: Ask what each read tells you besides filling the buffer.
          example: A cashier counting a long queue of coins tips them into a tray a handful at a time, counts the handful, and
            empties the tray, so the tray never needs to hold them all.
      - title: Count lines
        minutes: 30
        build: Make ccwc -l count newline characters in the same read loop.
        outcome: ccwc -l test.txt prints 7145, and a file whose last line has no newline matches the reference.
        concepts:
          - word-state-machine
        hints:
          hint: Which single byte ends a line, and what happens to a last line that does not end with it?
  - title: Words and characters
    summary: Count words with state kept across chunks, and characters by decoding the bytes safely.
    steps:
      - title: Count words across chunks
        minutes: 45
        build: Make ccwc -w count words with a small state that survives from one chunk to the next.
        outcome: ccwc -w test.txt prints 58164, and gives the same answer when the buffer is made tiny.
        concepts:
          - word-state-machine
        hints:
          hint: Count the moment a word starts, not the spaces. What must you remember when a chunk ends inside a word?
      - title: Count characters by decoding
        minutes: 60
        build: Make ccwc -m decode the bytes as UTF-8 with one decoder kept across all chunks, and count code points.
        outcome: ccwc -m test.txt prints 339292 in a UTF-8 locale, a file holding one emoji counts 1, and a tiny buffer gives
          the same answers.
        concepts:
          - text-encoding-utf8
          - utf16-code-units
          - decoding-across-chunks
        hints:
          hint: Bytes for -c and -l, characters for -m. Where does a character that straddles two reads get finished?
          example: A translator reading a letter page by page keeps the half-sentence at the bottom of one page in mind until
            the next page arrives, instead of guessing its ending.
      - title: Hard text
        minutes: 45
        build: Make test files with an emoji with a skin tone, a few invalid bytes, Windows line endings and no final newline.
          Choose your policy for invalid bytes and name the encoding explicitly.
        outcome: Every file gives the same -c, -l, -w and -m as the reference, and your notes say which invalid-byte policy
          you chose and why.
        concepts:
          - grapheme-clusters
          - malformed-input
          - explicit-charsets
        hints:
          hint: Run the reference on each file first and predict your own result before you run it.
  - title: Behaving like a Unix tool
    summary: Default output, standard input, several files and errors, then a comparison against the reference.
    steps:
      - title: Default output and options
        minutes: 45
        build: With no option, print lines, words and bytes, then the file name. Reject an unknown option with a message on
          standard error and a non-zero exit status.
        outcome: ccwc test.txt prints the same line as the reference, including column widths, and an unknown option exits
          non-zero with a message on standard error.
        concepts:
          - cli-subcommands
        hints:
          hint: Compare your output with the reference character by character, spaces included.
      - title: Read standard input
        minutes: 30
        build: When no file name is given, read standard input through the same counting path.
        outcome: Piping test.txt into ccwc -l prints 7145, the same as the reference.
        concepts:
          - stdin-vs-file
        hints:
          hint: Where does your program decide what to read from, and does the counting code need to know?
      - title: Several files and errors
        minutes: 45
        build: Accept several file names, print a total line, and report a missing file without stopping the others.
        outcome: With two files and one missing name, the counts and total match the reference, the missing file is reported
          on standard error, and the exit status is non-zero.
        concepts:
          - cli-subcommands
        hints:
          hint: Which output belongs to the user's pipeline, and which belongs to the person watching?
      - title: Compare with the reference
        minutes: 45
        build: Write a check that runs ccwc and the reference on all your test files, plus piped input, under the same locale,
          and reports any difference.
        outcome: The check runs over every test file and reports no differences.
        concepts:
          - differential-testing
        hints:
          hint: Fix the locale for both runs inside the check itself.
