# Coding Challenges, Build your own grep. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-grep . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-grep
  title: Build your own grep
  source_url: https://codingchallenges.fyi/challenges/challenge-grep
  level: advanced
  status: generated
  figure:
    kind: match
  summary: A command-line tool that prints the lines of files or piped text that match a pattern, with digit and word
    classes, start and end anchors, recursive search, inverted and case-insensitive matching, and the same exit status
    as grep. Use your language's regex library, or write your own matching engine.
  requirements:
    - Print every line of the input that matches the pattern, where an empty pattern matches every line
    - Exit with status 0 when a line was printed, 1 when none was, and 2 on an error such as a missing file
    - Search a folder tree with -r, putting the file path before each printed line
    - Print the lines that do not match with -v, and ignore case with -i
    - Support a digit class, a word class, and anchors for the start and end of a line
    - Read standard input when no file name is given, so the tool works after a pipe
  primer:
    what: "grep reads text one line at a time and prints the lines that contain a match for a pattern. The pattern is a
      regular expression: plain letters match themselves, and a few special signs stand for a whole class of
      characters or for a position such as the start of a line. You will build a version that can search a folder
      tree, invert the search, ignore case, and tell a script through its exit status whether anything matched."
    why: Searching logs, code and data for lines of a certain shape is an everyday programming job, and grep's exit status
      lets scripts decide what to do next. Writing one also shows how pattern matching works underneath.
    example: "Picture three lines of text: Rome, Paris and Oslo. Searching it for the letter s prints Paris and Oslo,
      because a line is printed when the pattern appears anywhere in it, at the start, the middle or the end. Rome has
      no s, so it is left out."
    words:
      - term: pattern
        meaning: The regular expression grep looks for in each line.
      - term: match
        meaning: A place in a line where the whole pattern fits. One match anywhere is enough to print the line.
      - term: character class
        meaning: One sign that matches any single character from a set, such as any digit.
      - term: anchor
        meaning: A sign that matches a position rather than a character, such as the start or the end of a line.
      - term: exit status
        meaning: A small number a program hands back when it ends, which scripts read to learn how it went.
      - term: recursive search
        meaning: Searching every file in a folder, then every file in each folder inside it, all the way down.
  restate_rubric:
    - id: r1
      point: The tool prints the lines that match a pattern, from files, a folder tree or a pipe
    - id: r2
      point: It supports classes such as any digit, anchors for the start and end of a line, -v to invert and -i to ignore
        case
    - id: r3
      point: Its exit status says whether anything matched or an error happened, so scripts can act on it
  reflection_prompt: In your own words, how does your grep decide that a line matches, and what would change if you
    swapped the regex library for an engine you wrote yourself, or the other way round?
  reference_tool: GNU grep, with the locale fixed (for example LC_ALL=C.UTF-8). For backslash classes use a grep that
    understands them, such as GNU grep with its Perl-style option.
  done_when: Matching, the empty pattern, exit statuses, -r, -v, -i, both classes, both anchors and piped input match
    the reference on the challenge's files; the comparison check reports no differences; and your notes explain, in
    your own words, why some regex engines can take exponential time and yours does or does not.
  open_checks:
    - Which regex dialect your reference grep uses by default, and how it treats a backslash d and a backslash w.
    - Whether the reference follows symbolic links with -r, and what it prints for an unreadable folder.
    - What the reference prints as the file name for piped input when several sources are searched.
    - How the reference treats binary files during -r.
learning_map:
  - concept: regex-matching
    where: grep prints every line in which the pattern matches somewhere. On the hard route you build the matcher
      yourself, as a small state machine over the line.
    explain_back:
      prompt: A log search tool scans gigabytes of logs for a pattern in seconds. Explain how a regular expression can be
        turned into something that checks a line by reading each character once.
      rubric:
        - id: e1
          point: "A regular expression can be turned into a finite automaton: states joined by transitions labelled with
            characters"
        - id: e2
          point: Matching reads the line one character at a time while keeping the set of states the automaton could be in
        - id: e3
          point: That set is never bigger than the number of states, so the work grows only with the length of the text times
            the size of the pattern
  - concept: regex-backtracking
    where: How your matcher tries alternatives decides whether some patterns finish instantly or never. Comparing your
      grep with the real one on a nasty pattern shows the difference.
    explain_back:
      prompt: A firewall rule containing a pattern with two wildcard repetitions next to each other pinned every processor
        of a large company's servers for half an hour. Explain how a regex can do that, and what kind of engine is
        immune.
      rubric:
        - id: e1
          point: A backtracking engine tries one way to match, and on failure backs up and tries the next way
        - id: e2
          point: Nested or adjacent repetition gives it exponentially many ways to split a line that almost matches, and it
            tries them all before failing
        - id: e3
          point: An automaton-based engine tracks all possible states at once and reads each character once, so its time stays
            linear in the input
  - concept: line-endings
    where: grep works line by line, so it must agree with the real grep on a last line without a newline and on Windows
      line endings.
    explain_back:
      prompt: A pattern anchored with a dollar sign at the end of a line matches on Linux but finds nothing in a file that
        came from Windows. Explain why.
      rubric:
        - id: e1
          point: Windows files end each line with a carriage return before the newline
        - id: e2
          point: A line-oriented tool removes only the newline, so the carriage return is still the last character of the line
        - id: e3
          point: The end anchor sits after the carriage return, so a pattern expecting the last letter there does not match
  - concept: cli-subcommands
    where: "grep reports through its exit status: 0 when a line was printed, 1 when none was, and 2 on an error such as a
      missing file."
    explain_back:
      prompt: A deployment script runs grep for the word ERROR in a log and aborts when grep succeeds. One day the log file
        is missing and the deploy goes ahead anyway. Explain what grep should have returned in each case and how the
        script should test it.
      rubric:
        - id: e1
          point: Status 0 means a line matched, 1 means no line matched, and 2 means something went wrong, such as a missing
            file
        - id: e2
          point: Treating every non-zero status as no errors found mixes up a clean log with an unreadable one
        - id: e3
          point: The script should check for status 2 separately, and grep prints the reason on standard error
  - concept: recursive-file-walk
    where: With -r your grep walks a folder tree and prints the path of each file before its matching lines.
    explain_back:
      prompt: Your recursive search over a home folder never finishes, and on another machine it stops halfway with a
        permission error. Explain both, and how a tree walker should behave.
      rubric:
        - id: e1
          point: A symbolic link that points back up the tree makes the walk loop for ever unless links are skipped or visited
            folders are remembered
        - id: e2
          point: An unreadable folder should give a message on standard error, and the walk should carry on with the rest
        - id: e3
          point: The order in which entries are listed is not guaranteed, so output that must be stable has to be sorted
  - concept: stdin-vs-file
    where: With no file name, grep reads standard input, so the second grep in a pipeline works on the first one's output.
    explain_back:
      prompt: Explain how one line loop serves both files and piped input, and why grep prints a file name before each line
        only in some cases.
      rubric:
        - id: e1
          point: Files and standard input are both streams of lines read until the end, so the same matching loop serves both
        - id: e2
          point: With one source the file name adds nothing, so it is printed only when several files are searched or -r is used
        - id: e3
          point: Piped input has no name, so it is reported as standard input when a name is needed
  - concept: unix-pipelines
    where: "grep -r piped into grep -v shows tools composing: each one only filters the lines it receives."
    explain_back:
      prompt: grep -r Nirvana piped into grep -v Madonna leaves one line. Explain what each stage sees, and what the exit
        status of the whole pipeline tells a script.
      rubric:
        - id: e1
          point: The first grep prints matching lines with their paths, and the second sees only those lines as its input
        - id: e2
          point: grep -v prints the lines that do not match, so it removes the ones that also mention Madonna
        - id: e3
          point: A pipeline's exit status is normally the last command's, so a script that cares about an earlier stage must
            check it separately
  - concept: case-folding
    where: -i makes grep ignore case. Beyond English letters the rules get subtle, and your grep has to agree with the
      reference.
    explain_back:
      prompt: A case-insensitive search for straße finds STRASSE in one tool and not in another, and an application
        lowercasing user names with a Turkish locale breaks a login. Explain both.
      rubric:
        - id: e1
          point: Simple case folding maps one character to one character, but full folding turns ß into ss, so only full folding
            matches STRASSE
        - id: e2
          point: In Turkish the capital of i is a dotted İ and the lowercase of I is a dotless ı, so case mapping depends on the
            language
        - id: e3
          point: Case-insensitive matching is therefore a choice of rules, and a tool should say which one it uses
  - concept: streaming-constant-memory
    where: grep reads, tests and prints one line at a time, so it can search files far larger than memory.
    explain_back:
      prompt: Explain why grep can search a 50 GB log on a laptop, and what kind of input would still make its memory grow.
      rubric:
        - id: e1
          point: It keeps only the current line and the compiled pattern, and discards each line after testing it
        - id: e2
          point: Nothing from earlier lines is needed, so memory does not grow with the size of the file
        - id: e3
          point: A file with one enormous line, such as a minified data dump, makes the current line itself huge
  - concept: differential-testing
    where: The last step compares your grep with a pinned reference on the same patterns and files, including exit statuses.
    explain_back:
      prompt: Your own tests for classes and anchors pass, but a comparison with the real grep finds differences. Explain
        what such a comparison catches, and why the comparison must pin the regex dialect and locale.
      rubric:
        - id: e1
          point: The reference gives the right answer for inputs you did not think to write tests for
        - id: e2
          point: Different greps read backslash classes differently, for example Git Bash's grep treats a backslash d as a plain
            d unless its Perl-style option is used
        - id: e3
          point: The locale changes what counts as a letter or a digit and how case is folded, so both runs must use the same
            one
milestones:
  - title: Matching lines
    summary: Print matching lines one at a time, handle the empty pattern, and report results through the exit status.
    steps:
      - title: Find a letter
        minutes: 45
        build: Make your grep take a pattern and a file and print every line that contains it, reading one line at a time. On
          the easy route, use your language's regex library; on the hard route, start an engine that matches plain
          letters.
        outcome: grep J rockbands.txt prints Judas Priest, Bon Jovi and Junkyard, the same as the real grep.
        concepts:
          - regex-matching
          - streaming-constant-memory
        hints:
          hint: Test the pattern anywhere in the line, not only at the start.
      - title: The empty pattern and line endings
        minutes: 30
        build: Make an empty pattern match every line, and check a file with no final newline and a file with Windows line
          endings.
        outcome: grep with an empty pattern on test.txt, compared with test.txt using diff, prints nothing, and your grep
          agrees with the real grep on both special files.
        concepts:
          - regex-matching
          - line-endings
        hints:
          hint: Does every line contain the empty string? What exactly is a line in each file?
      - title: Exit status
        minutes: 30
        build: Return 0 when a line matched, 1 when none did, and 2 on an error, with the message on standard error.
        outcome: Printing the exit status after each run shows 0 for J in rockbands.txt, 1 for a pattern that is not there,
          and 2 for a missing file, matching the real grep.
        concepts:
          - cli-subcommands
        hints:
          hint: Run the real grep in each case first and write down the three statuses.
  - title: Files, folders and pipes
    summary: Walk a folder tree, invert the match, and read from a pipe.
    steps:
      - title: Search a folder tree
        minutes: 60
        build: "Add -r: list a folder's entries, search each file, and walk into each subfolder the same way, printing the
          path, a colon and the line. Decide what to do with unreadable folders and links."
        outcome: From the test folder, grep -r Nirvana with a star for the files prints rockbands.txt:Nirvana and the five
          lines from test-subdir/BFS1985.txt, each starting with its path, as the real grep does apart from order.
        concepts:
          - recursive-file-walk
        hints:
          hint: What stops your walker if a link points back to a folder it is already inside?
      - title: Invert the match
        minutes: 30
        build: Add -v to print the lines that do not match, with the exit status following the lines printed.
        outcome: grep -r Nirvana with a star piped into grep -v Madonna leaves only rockbands.txt:Nirvana.
        concepts:
          - unix-pipelines
        hints:
          hint: Which lines does the second grep receive, and which does it print?
      - title: Read from a pipe
        minutes: 30
        build: With no file name, read standard input through the same line loop, and print the file name prefix only when it
          helps.
        outcome: The Nirvana and Madonna pipeline gives the same output as the real grep, and a single searched file prints no
          prefix.
        concepts:
          - stdin-vs-file
          - unix-pipelines
        hints:
          hint: When is a file name useful in the output, and when is it noise?
  - title: Classes, anchors and case
    summary: Support digit and word classes, anchors and -i, then compare with a pinned reference, including a pattern
      that explodes.
    steps:
      - title: Digit and word classes
        minutes: 45
        build: Support the digit class, a backslash and a d, and the word class, a backslash and a w. On the hard route, a
          class is a test on one character against a set.
        outcome: The digit class on BFS1985.txt prints five lines, and the word class on symbols.txt prints the lines pound
          and dollar, matching a reference that understands these classes.
        concepts:
          - regex-matching
        hints:
          hint: "Check which reference you compare with: some greps need a Perl-style option for these classes."
      - title: Start and end anchors
        minutes: 45
        build: Support a caret for the start of a line and a dollar sign for the end.
        outcome: On rockbands.txt, caret A prints AC/DC, Aerosmith, Accept, April Wine and Autograph, and n, a, dollar prints
          Nirvana.
        concepts:
          - regex-matching
        hints:
          hint: An anchored pattern is tried at one position; an unanchored one at every position.
      - title: Ignore case
        minutes: 30
        build: Add -i, so that letters, classes and anchors behave the same with and without case.
        outcome: grep A rockbands.txt piped into wc -l prints 8, and grep -i A prints 58, and your notes record what your -i
          does with ß.
        concepts:
          - case-folding
        hints:
          hint: Compare in one common form of the letters, and decide which form.
      - title: Compare with the real grep
        minutes: 45
        build: Write a check that runs your grep and a pinned reference on the same patterns and files, with the locale fixed,
          comparing output and exit status. Include a pattern with nested repetition on a long line that almost
          matches.
        outcome: The check reports no differences on the normal patterns, and your notes record how long each grep takes on
          the nested-repetition pattern.
        concepts:
          - differential-testing
          - regex-backtracking
        hints:
          hint: Time both tools on a line of thirty letters a followed by one character that breaks the match.
