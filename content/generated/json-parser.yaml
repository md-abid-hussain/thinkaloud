stage0:
  summary: "You will build a program that reads one file and decides whether it contains valid JSON, a text format for
    structured data that is widely used to send information between systems. It reports its verdict in two ways: a
    message a person can read, and a success or failure code that scripts and other tools can act on. The input is
    just text, so the program has to turn raw characters into meaningful pieces and then check how those pieces are
    arranged. What makes it harder than it looks is that 'looks right' is not the test: the format's written rules
    decide every case, including tricky ones like escaped characters, unusually written numbers and structures nested
    inside other structures. Read the format's definition before you write any code, because that definition is the
    only judge of what counts as valid."
  questions:
    - id: p-what
      kind: what
      prompt: The program is given one file and must answer whether it is valid. What does it take in and give back, and
        what decides whether the file counts as valid?
      looks_for:
        - the input is a single file of text
        - the output is a readable message plus a success or failure code
        - valid means the text matches the format's grammar, not that it looks roughly right
    - id: p-why
      kind: why
      prompt: Where would someone use a program like this, and why would a team want one before the data is used? Think
        about data that comes from users or other systems.
      looks_for:
        - data from users or other systems can't be trusted to be well formed
        - configuration files and API payloads are common places this check runs
        - checking early gives a clear error instead of a crash or wrong result later
        - a machine-readable result lets scripts and pipelines stop automatically
    - id: p-how
      kind: how
      prompt: Before writing any code, how would you split the job of deciding whether a file is valid? Describe the first
        idea in plain words.
      looks_for:
        - first group raw characters into meaningful pieces such as brackets, strings and numbers
        - then check the order of those pieces against the format's rules
        - begin with the simplest version that handles a small valid input and widen it from there
questions:
  - id: s0-q1
    step: s0
    concept: conformance-tests
    prompt: Your program accepts every file in the valid folder, so you call it done. What could still be wrong, and what
      would the invalid files catch that the valid ones can't?
    looks_for:
      - a program can accept everything and still be wrong
      - invalid files check that the program rejects what it must
      - running the whole set every time catches a change that breaks an older case
  - id: s1-q2
    step: s1
    concept: grammar-and-parsing
    prompt: A teammate wants the parser to skip spaces and newlines itself, reading raw characters. Why is it better to
      turn the file into tokens first?
    looks_for:
      - the parser only sees meaningful tokens
      - whitespace is handled in one place
      - the grammar stays about structure, not characters
      - the lexer can reject an unknown character early
  - id: s1-q3
    step: s1
    concept: exit-codes
    prompt: Your checker prints 'invalid' for a broken file, but the build script that runs it keeps going and deploys.
      What did the checker get wrong, and what must it do instead?
    looks_for:
      - tools read the exit code, not the printed text
      - invalid input must exit with a non-zero code and valid input with 0
      - the message is for people, the code is for tools
      - the code must be set on every invalid path
  - id: s2-q4
    step: s2
    concept: strings-escapes-unicode
    prompt: A string value holds a raw tab character between its quotes, and your scanner accepts it. Why is that wrong,
      and what must the scanner track while it reads the string?
    looks_for:
      - JSON forbids unescaped control characters inside a string
      - the scanner must know it is inside a string
      - a tab must be written as an escape sequence
      - a line-by-line pattern cannot tell string content from the rest
  - id: s2-q5
    step: s2
    concept: grammar-and-parsing
    prompt: Your parser accepts an object with a comma after its last pair. Why does the grammar reject it, and what
      should the parser expect right after a comma?
    looks_for:
      - a comma separates pairs, so another pair must follow
      - after a comma the parser expects a key string
      - skipping commas the grammar doesn't allow accepts forbidden forms
      - examples can look fine when the grammar says no
  - id: s3-q6
    step: s3
    concept: number-grammar-precision
    prompt: Your number reader accepts a value written with a leading zero, such as 0123. The grammar forbids it. Why does
      a general-purpose number reader get this wrong, and what rule must yours follow?
    looks_for:
      - the grammar allows a lone 0, or a first digit from 1 to 9
      - general number readers accept forms JSON forbids, such as leading zeros, plus signs or trailing dots
      - the rule comes from the grammar, not from the reader's habits
  - id: s3-q7
    step: s3
    concept: grammar-and-parsing
    prompt: Your lexer meets the letters t, r, u, e, x in a value position and reads true followed by a stray x. Why is
      that wrong, and how should the lexer read a run of letters?
    looks_for:
      - the lexer reads the whole run of letters before deciding
      - truex is one unknown word, not a keyword plus junk
      - a keyword must match exactly
      - splitting the word early accepts input the grammar rejects
  - id: s4-q8
    step: s4
    concept: grammar-and-parsing
    prompt: Your parser handles ordinary nested files well, but a file with a hundred thousand open brackets in a row
      crashes it. Why does nesting cause this, and what would you change?
    looks_for:
      - each nesting level adds a call to the call stack
      - deep input uses up the stack and the program crashes
      - set a depth limit and fail with a clear message, or track nesting yourself
      - recursion matches the grammar's shape but needs a bound
  - id: s5-q9
    step: s5
    concept: error-reporting
    prompt: A user's file is missing a comma on line 3, but your message points at the closing brace on line 40. What's
      wrong with that message, and what should it say?
    looks_for:
      - the parser reported where it gave up, not where the problem started
      - a good message says what was expected and what was found
      - it gives a line and column for the first problem
      - it stops at the first error rather than guessing further
  - id: s5-q10
    step: s5
    concept: conformance-tests
    prompt: Your parser accepts a file holding only one string, but an older test list says to reject it. Which do you
      trust, and how would you decide?
    looks_for:
      - a suite can be older than the current specification
      - check what the current specification says about top-level values
      - explain any disagreement rather than blindly obeying or ignoring the suite
      - the specification settles the question, the suite is a guide
