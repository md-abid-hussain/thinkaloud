stage0:
  summary: You build a command-line tool that reads one source file and prints it back with the comments removed,
    leaving everything else exactly as it was. Comment syntax differs from one language to the next, so the tool must
    pick the rules that match the file it is given. The output is still a working program, so a lost line break, a
    glued pair of words or a damaged string can change what the program does. What makes this harder than it looks is
    that a comment marker only starts a comment where code is, while the same characters inside a string are data and
    must stay. The problem is about reading text carefully in order, which is why it is a good first look at how
    compilers and formatters see code.
  questions:
    - id: p-what
      kind: what
      prompt: You give the tool a file with a web address inside a string, and a comment after some code on another line.
        What should come out, and why must the address survive?
      looks_for:
        - The input is a whole source file and the output is the same file with only the comments gone
        - Comment markers inside a string are data, not the start of a comment
        - Everything outside the comments comes out exactly as it went in
    - id: p-why
      kind: why
      prompt: Why would a team want a tool that strips comments from source code? Think about what happens when an AI
        assistant adds many low-value comments to a file.
      looks_for:
        - Generated comments can clutter code and make it harder to read
        - Comment removal is a step in minifiers that shrink code before it ships
        - Compilers, interpreters and formatters already deal with comments, so the same idea recurs in other tools
    - id: p-how
      kind: how
      prompt: Before writing any code, you have to decide how the tool reads the file. What would you try first, and what
        would it need to remember as it goes?
      looks_for:
        - Read the text in order, one character at a time, rather than searching line by line
        - Keep track of whether you are in plain code, inside a string, or inside a comment
        - Copy everything outside comments through unchanged, and see where a simple search for markers would fail
questions:
  - id: s1-q1
    step: s1
    concept: scanner-state-machine
    prompt: Your remover cuts each line at the first hash sign. A line holds a double-quoted string that contains an
      escaped quote and a hash sign, followed by a real comment. What gets cut wrongly, and what must the scanner
      track to remove only the real comment?
    looks_for:
      - the hash sign inside the string is data, so cutting there breaks the string and the program
      - the scanner must know it is inside a string, and that a backslash skips the next character
      - only a marker found in code state starts a comment, so the real comment is removed
      - a line-by-line cut has no memory of where the string began
  - id: s2-q2
    step: s2
    concept: scanner-state-machine
    prompt: A block comment opens on one line and closes many lines later. A remover that works one line at a time sees
      each middle line alone, with no comment marker on it. What goes wrong, and what must the scanner carry from one
      line to the next?
    looks_for:
      - the middle lines hold no marker, so a line-by-line pass keeps them as code
      - the scanner must remember that it is still inside a block comment
      - that state has to survive the end of each line
      - only a scanner that carries state forward can see the closing marker
  - id: s2-q3
    step: s2
    concept: lexical-rules
    prompt: A regular expression can hold a slash next to a star inside a character group. Your remover reads that pair as
      the start of a block comment, which never closes. What decides whether a slash begins a regex, a division or a
      comment, and what would fix the remover?
    looks_for:
      - "the meaning of a slash depends on the token before it: after an operator or the start of an expression it
        begins a regex, after a name or number it is division"
      - once a regex starts, its contents are one token with no comments inside it
      - the scanner must track that it is inside a regex, so pairs inside it are data
      - without this rule the remover eats code up to a star and slash, or finds none
  - id: s2-q4
    step: s2
    concept: exact-preservation
    prompt: A function has a return keyword, then a block comment that spans two lines, with the returned value on the
      line after. Your remover deletes the whole comment, line breaks included. What changes in how the program runs,
      and what should replace the comment?
    looks_for:
      - in this language a block comment containing a line break counts as a line break, which can end the statement
      - deleting the line breaks joins the two lines, so the function now returns the value instead of nothing
      - the replacement should keep a line break where the comment had one
      - the output must match the original in meaning, not only in how it looks
  - id: s3-q5
    step: s3
    concept: lexical-rules
    prompt: A line comment in a compiled systems language ends with a backslash, and the next line is ordinary code. What
      does the compiler do with that next line, and what would your remover do if it ignored the backslash?
    looks_for:
      - the backslash at the end of the line joins the next line into the comment
      - that code line is never seen as code by the compiler
      - a remover that ignores the backslash keeps code the compiler treats as a comment, so its output changes meaning
      - the rule belongs to each language's lexical rules, since another language may end the comment at the line break
  - id: s3-q6
    step: s3
    concept: exact-preservation
    prompt: Your remover sees a type keyword, then a block comment, then a variable name, with no spaces around the
      comment. It deletes the comment outright. What does the compiler now see, and what should stand in for the
      comment?
    looks_for:
      - deleting the comment joins the two words into one word, which the compiler reads differently or rejects
      - a comment separates tokens, so it must leave a space behind
      - everything outside the comment should be identical to the input
  - id: s3-q7
    step: s3
    concept: transformation-testing
    prompt: Your remover passes every example the page gives, and a colleague asks how you know it is safe on a large
      project. What kinds of input did those examples leave out, and what check would catch a bug on them?
    looks_for:
      - the examples have no comment markers inside strings and no escaped quotes, which is where real bugs hide
      - use real open-source files plus hand-written tricky cases with exact expected output
      - compile the stripped file and compare its behaviour, or compare its tokens with the original's tokens minus
        the comments
      - comparing output by eye misses changes that look harmless
  - id: s4-q8
    step: s4
    concept: meaningful-comments
    prompt: Your remover keeps every comment that names the function near it. One comment names a function, but a blank
      line separates it from that function's declaration. Should it be kept, and what rule decides?
    looks_for:
      - a doc comment is placed directly above a top-level declaration with no blank line between them
      - a blank line turns it back into an ordinary comment that can be removed
      - the decision is made by position, not by what the comment says
      - a comment inside a function body is never a doc comment, even if it names the function
  - id: s4-q9
    step: s4
    concept: token-stream
    prompt: Your remover drops each comment as soon as it reads it, and only later wants to keep the doc comments. What
      does early dropping lose, and what should the scanner keep instead?
    looks_for:
      - deciding whether a comment is doc needs the token that follows it
      - once a comment is dropped there is nothing left to attach it to or look past
      - keep comments in the token stream, attached to the token they sit before
      - make the decision later, when the neighbouring tokens are known
  - id: s5-q10
    step: s5
    concept: meaningful-comments
    prompt: Your remover removes every comment that follows code on the same line. A line of code ends with a linter
      suppression comment that names one warning. What does the linter do once that comment is gone, and what must the
      remover recognise instead?
    looks_for:
      - the linter reads the comment and skips the named warning on that line
      - removing it brings the warning back, so the output no longer matches what the team checks
      - the remover must recognise the exact form of a tool directive, not just any comment
      - a directive stays on its own line, where it applies
