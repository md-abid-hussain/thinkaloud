stage0:
  summary: You will build a network server that sends back every byte a client sends it, for as long as that client
    stays connected. The first version uses TCP, which keeps a connection open and carries a stream of bytes, and a
    later version uses UDP, which sends separate packets with no connection. What goes in is whatever a client sends,
    and what comes out is those same bytes returned to that client, with nothing added and nothing removed. It is
    harder than it looks because the network does not split data into messages for you, so one send can arrive in
    pieces, and several clients must be served at once without one blocking the others. Stopping cleanly is also
    tricky, because data already received must still be sent back before the server exits.
  questions:
    - id: p-what
      kind: what
      prompt: A client connects to your server and types a line of text. What travels over the network, in which direction,
        and who starts the connection? Say what the exchange looks like from start to finish.
      looks_for:
        - the client opens the connection to the server, not the other way round
        - the bytes travel from client to server, and the same bytes travel back
        - the exchange lasts until the client disconnects
        - the server does not change or add to what it returns
    - id: p-why
      kind: why
      prompt: Why would a network engineer run a service that only repeats back what it receives? Name a situation where it
        is useful.
      looks_for:
        - it checks that a path between two machines works end to end
        - it measures delay and loss without any application logic getting in the way
        - it is a simple example of the same pattern as web or database servers
        - it helps debug a firewall or a network setting
    - id: p-how
      kind: how
      prompt: The server receives bytes from a client, but it cannot tell where one message ends and the next begins. How
        would you decide what to send back, and when? Say what happens if a line arrives in two pieces.
      looks_for:
        - the server sends back each chunk exactly as it arrives
        - it does not need to find message boundaries to echo correctly
        - the connection itself, not a message, marks the session, and it ends when the client closes it
        - sending in pieces still produces the same bytes in the same order
questions:
  - id: s1-q1
    step: s1
    concept: socket-lifecycle
    prompt: Your server is listening, and a client connects a moment before you call accept. Where does that connection
      wait, and what does accept give you back?
    looks_for:
      - the operating system finishes the handshake and holds the connection in a queue
      - accept takes one connection from the queue and returns a new socket for that client
      - the listening socket stays open to accept the next client
  - id: s2-q2
    step: s2
    concept: concurrency-models
    prompt: Each client gets its own thread, and a thousand clients connect and then say nothing at all. What does the
      server cost, and what would you change?
    looks_for:
      - every thread reserves its own stack memory, even while it sits idle
      - switching between many threads costs time as well as memory
      - limit how many connections you accept, or use one event loop that waits on many sockets
      - threads are simple to write but do not scale to very large numbers
  - id: s3-q3
    step: s3
    concept: byte-stream
    prompt: A client sends one long send, and your read returns only its first part. Your code writes the whole buffer
      back each time, so later echoes repeat old bytes. What's wrong, and what should each write send?
    looks_for:
      - a read returns whatever has arrived so far, which can be less than the whole send
      - write back only the bytes that this read returned
      - otherwise bytes left in the buffer from earlier reads are sent again
  - id: s3-q4
    step: s3
    concept: socket-lifecycle
    prompt: Your echo loop is reading from a client, and the client quits. The read now returns zero bytes. What does that
      mean, and what should the handler do next?
    looks_for:
      - zero bytes means the client has closed its side and nothing more will come
      - it is not an error and not an empty message to read again
      - the handler closes its own socket, logs the disconnect, and ends
      - reading again in a loop spins at full speed on a dead connection
  - id: s3-q5
    step: s3
    concept: reading-an-rfc
    prompt: "A teammate says the spec is met because typing a line into nc comes back unchanged. The RFC gives one rule
      for TCP: send back whatever arrives until the client ends the connection. How would you turn that rule into a
      check that could fail?"
    looks_for:
      - send known bytes and compare the exact reply, not a glance at a terminal
      - include bytes that are not text, since the rule covers any data
      - the check must also cover the client closing, not only the content
      - a server that echoes nothing should fail the check
  - id: s4-q6
    step: s4
    concept: tcp-vs-udp
    prompt: Two clients send datagrams to your UDP echo at the same time. Your server replies to the address it saw from
      the first datagram it ever received. What goes wrong, and what should it do?
    looks_for:
      - UDP keeps no connection, so there is no single client to remember
      - each datagram carries its sender's address, which the server should read for every reply
      - reply to the sender of each datagram, using one socket for all of them
      - a reply sent to the wrong address reaches a client that never sent that datagram
  - id: s5-q7
    step: s5
    concept: graceful-shutdown
    prompt: Your service is told to stop while a client has sent data that you have not yet echoed. If the program exits
      at once, that data is lost. What order should shutdown follow, and why?
    looks_for:
      - stop accepting new clients first, so the work stops growing
      - finish echoing the bytes already received before closing each connection
      - wake handlers blocked on quiet clients, and cap the wait with a deadline
      - the platform kills the process after a grace period, so the work must finish within it
