stage0:
  summary: You will build a small web service with a pair of endpoints. One answers every caller, and the other answers
    normally until a caller sends too many requests, then refuses them. Each request arrives over HTTP and is
    identified by the client that sent it, and the response is either the page's text or a refusal that tells the
    client to slow down. The core rule is that each client gets its own allowance over time, so one heavy caller is
    slowed down without slowing everyone else. What makes it harder than it looks is that the count must stay correct
    across many requests and clients, must survive between requests, and must still be right when requests overlap,
    and measuring time accurately is awkward on its own.
  questions:
    - id: p-what
      kind: what
      prompt: A client sends a request to the protected endpoint and sometimes gets back a refusal. What does the service
        take in and give back, and what does the limit promise each client?
      looks_for:
        - a request arrives over HTTP and the response is either the normal text or a refusal
        - the open endpoint always answers, while the protected one may refuse
        - "the promise is per client: each caller gets its own allowance over time, not a shared total for the whole
          service"
    - id: p-why
      kind: why
      prompt: A team runs a public API, and one customer's script sends thousands of requests a minute and slows the service
        for everyone. Why would the team limit each client, and who relies on that limit?
      looks_for:
        - one heavy caller should not use up capacity that other callers need
        - a limit protects against accidents, such as a runaway retry loop, and against deliberate floods
        - the well-behaved callers and the service's own health depend on the limit holding
    - id: p-how
      kind: how
      prompt: Each client's count has to be remembered between requests. Where would you keep it, and what could go wrong if
        two requests from the same client arrive at the same moment?
      looks_for:
        - the counts must live somewhere that outlasts a single request, such as memory in the process or a shared
          store
        - two requests can read the same count before either writes its update, so one update is lost
        - the check and the update have to happen as one step, or a request can slip past the limit
questions:
  - id: s2-q1
    step: s2
    concept: token-bucket
    prompt: A client sends one request every 0.9 seconds to a bucket that refills one token a second, and it is refused
      for good after its first burst. Why does that happen, and what should the bucket do with the time that doesn't
      yet make a whole token?
    looks_for:
      - the refill is computed from the time elapsed since the last update
      - a partial token must be kept, not thrown away
      - the last-update time should move only by the time that was actually converted into tokens
      - the capacity still caps how many tokens can be saved
  - id: s2-q2
    step: s2
    concept: why-limit-and-who
    prompt: Behind a load balancer every request seems to come from one address, so one heavy client limits everyone.
      Where would you read the real client address, and why can't you trust the first entry in X-Forwarded-For?
    looks_for:
      - the proxy's address is the one the service sees directly
      - the client can write any value into the header it sends
      - only entries added by your own trusted proxies can be believed
      - an attacker can change the first entry on every request to avoid the limit
  - id: s2-q3
    step: s2
    concept: http-429
    prompt: A client gets a 429 from your service and immediately retries in a tight loop, adding load to a busy server.
      What should your response tell it, and what should a well-behaved client do?
    looks_for:
      - 429 says this client sent too many requests, not that the server failed
      - Retry-After tells the client how long to wait
      - the client waits as told instead of retrying at once
      - a little randomness in the wait stops many clients returning together
  - id: s3-q4
    step: s3
    concept: fixed-window
    prompt: Your fixed window allows 100 requests a minute. A client sends 100 in the last second of one minute and 100
      more in the first second of the next, and every one succeeds. Why does that happen, and what does a fixed window
      actually promise?
    looks_for:
      - the counter resets when the window starts on the clock
      - counts do not carry from one window to the next
      - the limit holds only inside each window, so a short span across a boundary can hold about twice the limit
      - clients whose windows reset together can cause spikes
  - id: s4-q5
    step: s4
    concept: sliding-window-log
    prompt: Your sliding window log records every request, including the ones it rejected. A client that keeps retrying
      stays blocked long after its allowed requests should have aged out. Why does that happen, and would you keep
      recording rejected requests?
    looks_for:
      - rejected attempts go into the log and count against the window
      - a client that keeps hammering never drops below the limit until it stops
      - not recording rejections lets the client return once its allowed requests age out
      - this is a policy choice with a trade-off
  - id: s5-q6
    step: s5
    concept: sliding-window-counter
    prompt: A client used its whole limit at the end of the previous window, and the current window has only just started.
      Why should the previous count still carry most of its weight here, and what goes wrong if you weight it by the
      part of the current window already passed?
    looks_for:
      - the previous window's requests still fall inside the sliding span right after a boundary
      - weighting by the passed part makes old traffic count least when it matters most
      - that lets the boundary burst come back
      - the estimate assumes requests were spread evenly, so it can be a little off
  - id: s6-q7
    step: s6
    concept: shared-state
    prompt: Two instances receive requests from the same client at the same moment, and each reads the count, adds one and
      writes it back. What goes wrong, and how do you stop it?
    looks_for:
      - both read the same value and one update is lost
      - extra requests get through the limit
      - the read and the update must happen as one atomic step inside the store
      - an atomic increment, a transaction or a script run by the store does this
  - id: s6-q8
    step: s6
    concept: time-and-clocks
    prompt: Two instances have wall clocks a second apart, and a client's requests arrive right at a window boundary. Each
      instance decides which window a request is in by its own clock. What goes wrong, and what would you change?
    looks_for:
      - wall clocks differ between machines, so instances can disagree about the window
      - requests near a boundary can be counted in different windows
      - the window should be decided from one shared time source, such as the store
      - the same time source must be used by every instance
