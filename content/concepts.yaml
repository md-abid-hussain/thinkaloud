  - slug: sort-stability
    name: Stable sorting
    area: design-structure
    kind: foundation
    status: generated
    brief: A stable sort keeps items that compare equal in the order they arrived. That lets you sort by several keys in
      passes, and it matters whenever equal-looking items are not really identical.
    lesson:
      how_it_works: >-
        A sort is stable when items that compare as equal come out in the same relative order they went in. If two
        lines have the same sort key but differ elsewhere, a stable sort keeps the first of them first.


        Stability matters whenever the comparison looks at only part of an item. Sorting people by last name, a stable
        sort keeps their original order within each last name, so if the list was already sorted by first name, the
        result is sorted by last name and then first name. This is how multi-key sorting is done in passes: sort by
        the least important key first, then by each more important key with a stable sort, and the earlier orders
        survive inside ties. With an unstable sort the order inside ties is arbitrary and can change from run to run
        or between library versions, which shows up as flaky tests and reports that reorder themselves.


        Merge sort and insertion sort are naturally stable; quicksort and heapsort, in their usual in-place forms, are
        not. Any sort can be made stable by adding the original position as a final tie-breaker. Tools expose this
        too: sort compares whole lines by default and, when keys tie, falls back to comparing the whole line, which
        hides stability; with a key option and the stable flag it keeps input order among equal keys instead. A sort
        that removes duplicates also has to decide which of several equal items it keeps.
      examples:
        - A table sorted by date and then by customer loses its date order inside each customer when the second sort
          is unstable.
        - A snapshot test fails at random because two records with the same score swap places between runs.
        - A leaderboard sorted by score keeps earlier achievers ahead of later ones only because the sort is stable.
      misconceptions:
        - Equal items are identical, so order among them cannot matter. They are equal only on the key being compared.
        - All built-in sorts are stable. Many in-place sorts are not, and documentation says which.
        - Stability is only about duplicates. It is about any items whose keys compare equal.
      elsewhere:
        - Spreadsheet column sorting and database ORDER BY with several columns rely on stable tie handling.
        - User interfaces that sort tables by clicked column expect earlier orders to persist inside ties.
        - Version control and build tools sort file lists stably to keep output reproducible.
    resources:
      - title: Sorting algorithm (Wikipedia), Stability
        url: https://en.wikipedia.org/wiki/Sorting_algorithm#Stability
        opened: true
      - title: Merge sort (Wikipedia)
        url: https://en.wikipedia.org/wiki/Merge_sort
        opened: true
      - title: Timsort (Wikipedia)
        url: https://en.wikipedia.org/wiki/Timsort
        opened: true
  - slug: myers-diff
    name: The Myers diff algorithm
    area: design-structure
    kind: foundation
    status: generated
    brief: Myers' algorithm finds a shortest edit script in time proportional to the file size times the number of
      differences. It is fast when files are similar, which is the usual case, and it is the default in GNU diff and
      Git.
    lesson:
      how_it_works: >-
        The table method for diff costs the product of the two file lengths, which is hopeless for large files even
        when they differ in only a few lines. Eugene Myers' 1986 algorithm takes a different view. Picture a grid with
        the old file along one side and the new file along the other; moving right deletes an old line, moving down
        inserts a new line, and where the two lines are equal you may move diagonally for free. A shortest edit script
        is a path from the top-left corner to the bottom-right with the fewest non-diagonal moves.


        The algorithm searches outward by number of edits. With zero edits it follows the diagonal as far as the lines
        match. With one edit it tries one step right or down and then follows the free diagonal again, keeping only
        the furthest point reached on each diagonal line. It repeats for two edits, three, and so on, and stops as
        soon as some path reaches the corner. Because it only explores paths with at most D edits, its time is
        proportional to the total length times D, the size of the difference. For two versions of a file that differ
        in a handful of lines, that is close to linear, and a refinement needs only linear memory.


        That is why Myers' algorithm, or a variation of it, is the default in GNU diff and Git. It is not always the
        most readable: Git also offers patience and histogram diffs, which first anchor on lines that occur once in
        each file and often produce diffs that match how people edited the code.
      examples:
        - Diffing two versions of a 100,000-line log that differ in ten lines is instant with Myers and needs
          gigabytes with the full table.
        - Git can show the same change with the default algorithm or with the patience option, and the second often
          lines up functions better.
        - Diffing two completely different files is the worst case, because the number of differences is as large as
          the files.
      misconceptions:
        - Diff always builds a table of every pair of lines. Practical diffs explore only paths with few edits.
        - A faster diff gives a different, worse answer. Myers finds a shortest edit script, the same length as the
          table method.
        - The shortest diff is always the most readable. Alternative algorithms trade a slightly longer diff for
          better alignment.
      elsewhere:
        - Git, GNU diff and most code review tools use Myers or its variants.
        - Text editors and IDEs compute the changed-lines gutter with the same algorithm.
        - Bioinformatics and plagiarism detection compare long sequences with related edit-graph searches.
    resources:
      - title: Eugene W. Myers, An O(ND) Difference Algorithm and Its Variations (paper)
        url: http://www.xmailserver.org/diff2.pdf
        opened: true
      - title: "James Coglan, The Myers diff algorithm: part 1"
        url: https://blog.jcoglan.com/2017/02/12/the-myers-diff-algorithm-part-1/
        opened: true
      - title: diff (Wikipedia)
        url: https://en.wikipedia.org/wiki/Diff
        opened: true
  - slug: unified-diff-format
    name: The unified diff format
    area: formats-parsing
    kind: foundation
    status: generated
    brief: Unified diffs group changes into hunks with a header giving line ranges, three lines of unchanged context, and
      lines marked with a space, a minus or a plus. The context is what lets patch apply a diff to a file that has
      shifted slightly.
    lesson:
      how_it_works: >-
        A unified diff starts with two header lines naming the old and new files, marked with three minus signs and
        three plus signs. The changes follow as hunks. Each hunk begins with a header such as @@ -12,7 +12,8 @@,
        meaning the hunk covers seven lines of the old file starting at line 12 and eight lines of the new file
        starting at line 12. Inside the hunk, a line starting with a space is unchanged context, a line starting with
        a minus was removed, and a line starting with a plus was added. By default each change carries three lines of
        context before and after it, and changes close together share one hunk.


        The context is the clever part. A patch tool applying the diff does not trust the line numbers blindly: it
        looks for the context lines near the expected position, so a patch still applies when the target file has
        gained or lost a few lines elsewhere. If the context does not match, the hunk is rejected and written to a
        reject file for a person to resolve. The header counts must agree with the body, or the patch is treated as
        corrupt.


        Compared with the older normal format, which prints line-number commands and marks lines with less-than and
        greater-than signs, unified diffs are shorter and easier to read, because removals and additions sit side by
        side inside their surrounding lines. They are the format of patch files, Git output and code review tools.
        Special markers also matter: a line saying there is no newline at end of file records that the last line had
        no final newline.
      examples:
        - A security fix mailed as a unified diff still applies to a slightly newer version of the file because its
          context lines are found a few lines further down.
        - A patch is rejected because someone edited one of its context lines; the reject file shows exactly which
          hunk to fix by hand.
        - A code review tool turns every pull request into unified hunks with context, so reviewers see each change in
          place.
      misconceptions:
        - The line numbers are enough to apply a patch. Patch tools rely on context and allow the file to have shifted.
        - Context lines are only for people. They are what lets the patch tool find the right place.
        - Unified and normal diffs carry different information. They describe the same edit script in different
          layouts.
      elsewhere:
        - Git, GitHub, GitLab and mailing-list patch workflows use the unified format.
        - Configuration management and infrastructure tools show planned changes as unified diffs.
        - Database schema migration tools and document comparison tools borrow the hunk layout.
    resources:
      - title: POSIX diff utility (the -u unified format)
        url: https://pubs.opengroup.org/onlinepubs/9799919799/utilities/diff.html
        opened: true
      - title: patch(1), Linux manual page
        url: https://man7.org/linux/man-pages/man1/patch.1.html
        opened: true
      - title: diff (Wikipedia), unified format
        url: https://en.wikipedia.org/wiki/Diff
        opened: true
  - slug: tape-memory-model
    name: A tape of cells as memory
    area: design-structure
    kind: foundation
    status: generated
    brief: Brainfuck's memory is a tape of byte cells and a pointer. The choices of cell size, wrapping, tape length and
      end-of-input behaviour are part of the language, and programs break when interpreters choose differently.
    lesson:
      how_it_works: >-
        A memory model says what the program's memory is and what happens at its limits. Brainfuck's model is
        deliberately tiny: a row of cells, traditionally 30,000 of them, each starting at zero, and a data pointer
        that points at one cell. Commands move the pointer one cell left or right, add or subtract one from the
        current cell, read a byte of input into it or write it as output, and loop while it is non-zero. It is close
        to the tape of a Turing machine, which is why such a small language can still compute anything.


        Because the original description left the limits open, interpreters differ, and those differences are part of
        the model. The first is cell size: most use one byte per cell, where adding one to 255 wraps round to 0 and
        subtracting one from 0 gives 255, but some use larger cells that do not wrap. Many programs depend on
        wrapping, for example to clear a cell by adding until it reaches zero. The second is the tape's edges: moving
        left of the first cell or past the last can be an error, wrap to the other end, or grow the tape. The third is
        end of input: reading when no input is left may leave the cell unchanged, set it to 0, or set it to 255.


        A portable interpreter picks the most common conventions, thirty thousand wrapping byte cells and an error or
        growth at the edges, and documents each choice, so users know which programs it will run as their authors
        intended.
      examples:
        - A program that clears a cell by adding one until it reaches zero runs forever on an interpreter whose cells
          do not wrap.
        - A program that reads input until a zero byte appears loops forever on an interpreter that leaves the cell
          unchanged at the end of input.
        - Integer overflow in other languages, where a counter wraps from the largest value to the smallest, is the
          same choice made for every number.
      misconceptions:
        - There is one correct Brainfuck behaviour. The original left cell size, tape ends and end of input open, so
          interpreters differ.
        - Wrapping is a bug to avoid. Many programs rely on it on purpose.
        - A larger tape is always better. Growing without limit lets a runaway program use all memory, so a limit can
          be a feature.
      elsewhere:
        - "Every language defines what happens when a number overflows: wrapping, an error or a larger type."
        - Virtual machines define their memory model, such as how much memory a program may use and what happens past
          its end.
        - Turing machines, the theoretical model of computation, use the same idea of a tape and a head.
    resources:
      - title: Brainfuck (Wikipedia)
        url: https://en.wikipedia.org/wiki/Brainfuck
        opened: true
      - title: brainfuck (Esolang wiki)
        url: https://esolangs.org/wiki/Brainfuck
        opened: true
      - title: Turing machine (Wikipedia)
        url: https://en.wikipedia.org/wiki/Turing_machine
        opened: true
