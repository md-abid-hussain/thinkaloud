# Coding Challenges, Build your own JSON parser. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-json-parser . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-json-parser
  title: Build your own JSON parser
  source_url: https://codingchallenges.fyi/challenges/challenge-json-parser
  level: intermediate
  status: generated
  figure:
    kind: tokens
  summary: A command-line tool that reads a file and decides whether it holds valid JSON. It splits the text into
    tokens, checks them against the JSON grammar with a recursive descent parser, prints a verdict and exits with
    status 0 for valid input and 1 for invalid input.
  requirements:
    - Read a file named on the command line and decide whether it holds valid JSON
    - Print a message and exit with status 0 for valid input and 1 for invalid input
    - Split the text into tokens first, then check the tokens against the JSON grammar
    - Support objects, arrays, strings, numbers, true, false and null, nested inside each other
    - Pass the test folders that come with the challenge, then the json.org checker suite
  primer:
    what: JSON is a plain-text format for data. Objects sit in curly braces and hold pairs of a key and a value, arrays
      sit in square brackets and hold lists of values, and the simple values are strings in double quotes, numbers,
      true, false and null. You will build a tool that reads a file and says whether it is valid JSON, exiting with
      status 0 when it is and 1 when it is not.
    why: "Web APIs and many configuration files speak JSON, and a parser is how a program decides whether to trust that
      text. Building one teaches the two-stage shape used by compilers and interpreters: a lexer, then a parser."
    example: "Take the text made of an opening square bracket, the number 42, a comma, a space, the word true and a
      closing square bracket. The lexer skips the space and hands over five tokens: open bracket, the number 42,
      comma, true and close bracket. A string in double quotes becomes a single token however many letters or spaces
      it holds. The parser then checks the order of the tokens: an array opens, its values are separated by commas,
      and it closes. They are in order here, so the tool prints that the file is valid and exits with status 0."
    words:
      - term: token
        meaning: One meaningful piece of the text, such as a brace, a colon, a comma, a whole string, a number or the word
          null.
      - term: lexer
        meaning: The first stage, which reads characters, groups them into tokens and skips the whitespace between them.
      - term: parser
        meaning: The second stage, which checks that the tokens come in an order the grammar allows.
      - term: grammar
        meaning: The rules for what may follow what, for example that a key in an object is always followed by a colon.
      - term: recursive descent
        meaning: A way of writing a parser with one function per grammar rule, where a rule that contains others calls their
          functions.
      - term: exit status
        meaning: The number a program hands back when it ends. Zero means success, and anything else means something went
          wrong.
  restate_rubric:
    - id: r1
      point: The tool reads a file and decides whether its text is valid JSON
    - id: r2
      point: It prints a message and exits with status 0 when the input is valid and 1 when it is not
    - id: r3
      point: It first splits the text into tokens and then checks them against the grammar, covering every kind of value and
        nesting
  reflection_prompt: In your own words, how do the lexer and the parser share the work in your design, and what would
    you change to turn the validator into a parser that builds the data in memory?
  reference_tool: RFC 8259 is the rulebook. The challenge's test folders, the json.org JSON_checker suite and, as a
    stretch, JSONTestSuite supply labelled inputs to compare against.
  done_when: Every file in the challenge's step folders and the json.org suite gives the expected verdict through the
    exit status, apart from choices you made on purpose and recorded; deeply nested input never crashes the tool;
    errors point at the right line and column; and your notes explain the lexer and parser split, number precision and
    your strictness choices in your own words.
  open_checks:
    - How the challenge names its test files, and therefore how your check works out the expected verdict.
    - Which json.org fail files conflict with RFC 8259, for example a bare string at the top level, which RFC 8259
      allows.
    - How deep your language lets a program call itself before the stack runs out on your machine.
    - Whether the json.org checker itself accepts any input the grammar forbids; do not treat its behaviour as the
      rulebook.
learning_map:
  - concept: lexical-analysis
    where: "Your tool first turns the file into tokens: braces, brackets, colons, commas, whole strings, numbers and the
      words true, false and null, with whitespace dropped."
    explain_back:
      prompt: A teammate wants to check JSON by splitting the text on spaces and looking at each piece. Explain why that
        fails, and what a lexer does instead.
      rubric:
        - id: e1
          point: A string can contain spaces, commas and braces, and tokens such as a comma and a closing bracket can touch with
            no space between them, so splitting on spaces cuts in the wrong places
        - id: e2
          point: A lexer reads the characters once, left to right, and groups them into tokens with a kind, such as string,
            number or left brace, skipping the whitespace between them
        - id: e3
          point: The lexer only checks that each piece is a valid token, and leaves the order of the tokens to the parser
  - concept: json-grammar
    where: "The grammar is the rulebook your parser enforces: what a value can be, how objects and arrays are built, and
      the strict rules such as double-quoted keys and no trailing commas."
    explain_back:
      prompt: A configuration file copied from a JavaScript project has unquoted keys, a comma after the last item and a
        comment, and your validator rejects it. Explain which JSON rules it breaks, and why JSON is that strict.
      rubric:
        - id: e1
          point: JSON keys must be strings in double quotes, so unquoted keys are not allowed
        - id: e2
          point: There is no comma after the last member or element, and JSON has no comments at all
        - id: e3
          point: JSON is a data interchange format, not JavaScript; keeping the grammar small and strict means every parser can
            agree on what a document means
  - concept: recursive-descent-parsing
    where: Your parser has one routine per grammar rule, and the routine for a value calls the routines for objects and
      arrays, which call the value routine again for what they contain.
    explain_back:
      prompt: Explain how a parser with one routine per grammar rule handles an array that contains objects that contain
        arrays, and how it decides which routine to call at each point.
      rubric:
        - id: e1
          point: Each grammar rule, such as value, object and array, is one routine, and a rule that contains other rules calls
            their routines
        - id: e2
          point: The nesting in the input becomes nesting of calls, so the call stack remembers where the parser is in every
            enclosing object and array
        - id: e3
          point: "It looks at the next token to choose: a left brace means object, a left square bracket means array, a string
            token means string, and so on"
  - concept: string-escapes
    where: Your string lexer has to accept escapes such as a backslash before a double quote and the backslash-u form, and
      reject raw control characters and unknown escapes.
    explain_back:
      prompt: A JSON document holds an emoji written as two backslash-u escapes in a row. Explain why it takes two escapes,
        what a parser should do with them, and what should happen if only the first one were there.
      rubric:
        - id: e1
          point: "A backslash-u escape names one 16-bit UTF-16 unit, so a character above U+FFFF, such as most emoji, is written
            as a surrogate pair: a high surrogate followed by a low surrogate"
        - id: e2
          point: A parser that builds text must join the two halves into one code point
        - id: e3
          point: A lone surrogate is not a real character; parsers disagree about it, so a strict parser rejects it or the
            choice must be deliberate and documented
  - concept: floating-point-numbers
    where: Your lexer enforces the JSON number spelling exactly, and any program that reads the numbers has to store them
      in some machine type with limited precision.
    explain_back:
      prompt: An API sends a 19-digit order ID as a JSON number, and a client that reads numbers as double-precision floats
        looks up the wrong order. Explain what went wrong, and how the API could avoid it.
      rubric:
        - id: e1
          point: Double-precision floats hold about 15 to 17 significant digits, and whole numbers are exact only up to 2 to the
            power 53
        - id: e2
          point: A 19-digit integer is beyond that, so reading it as a double rounds it to a nearby value and its last digits
            change
        - id: e3
          point: The JSON text itself is fine; the problem is the reader's type, so APIs send such IDs as strings, or both sides
            use a type with enough precision
  - concept: nesting-depth-limits
    where: Every level of nesting in the file is another level of calls in your parser, so a small file with very deep
      nesting can exhaust the stack.
    explain_back:
      prompt: A 100 KB request body made of tens of thousands of opening square brackets crashes your service every time.
        Explain why such a small input can crash it, and two ways a parser can defend itself.
      rubric:
        - id: e1
          point: A recursive parser makes one nested call per level, each call keeps a frame on the call stack, and the stack is
            small and fixed, so very deep nesting overflows it
        - id: e2
          point: File size does not protect you, because depth costs stack, not bytes
        - id: e3
          point: Set a depth limit and reject deeper input with a clear error, or replace recursion with an explicit stack in
            ordinary memory, which can also be capped
  - concept: parse-error-reporting
    where: When a file is invalid, your tool should say where the problem is, by line and column, what it expected and
      what it found.
    explain_back:
      prompt: Your tool rejects a 2,000-line configuration file. Explain what a useful error message contains, and where in
        the file it should point.
      rubric:
        - id: e1
          point: The position of the problem as a line and column a person can find in an editor
        - id: e2
          point: What the parser expected at that point and what it actually found, for example a colon expected after a key but
            a comma found
        - id: e3
          point: It points at the first token that broke the rules, not where the program happened to notice, and for an
            unclosed bracket it also names the bracket that was never closed
  - concept: strict-vs-lenient-parsing
    where: "You decide what your validator does at the edges: trailing commas, comments, duplicate keys and very large
      numbers, and you record each choice."
    explain_back:
      prompt: A gateway checks the first role key in a JSON request, and the service behind it uses the last one. Explain
        how an attacker can exploit that, and what this teaches about lenient parsing.
      rubric:
        - id: e1
          point: The grammar allows the same key twice, and parsers disagree about which value wins
        - id: e2
          point: A request with role user and then role admin passes the gateway's check and runs as admin in the service
        - id: e3
          point: When two systems parse the same input differently they no longer agree on what it means, so parsers should be
            strict by default and make every open choice deliberate and documented
  - concept: conformance-test-suite
    where: You run the challenge's test folders and the json.org suite over your tool and compare each verdict with the
      expected one.
    explain_back:
      prompt: All your own test files pass, but the json.org suite finds mismatches. Explain what a conformance suite
        catches that your own tests miss, and what to do when you disagree with one of its verdicts.
      rubric:
        - id: e1
          point: Your own tests cover only the cases you thought of, while a conformance suite is written by others to probe the
            corners of the specification
        - id: e2
          point: An accepted invalid file is as much a failure as a rejected valid one
        - id: e3
          point: Suites can be outdated or wrong, so settle each disagreement against the specification and record the choice
            and the reason instead of hiding it
  - concept: cli-subcommands
    where: Your tool reports its verdict through its exit status, 0 for valid and 1 for invalid, so scripts and build
      pipelines can use it.
    explain_back:
      prompt: A build pipeline runs your validator on every configuration file before deploying. Explain why the exit status
        matters more than the message it prints, and what each status should mean.
      rubric:
        - id: e1
          point: Scripts and pipelines read the exit status, not the text, to decide whether to continue
        - id: e2
          point: Status 0 means the file is valid and a non-zero status, 1 here, means it is invalid or could not be read
        - id: e3
          point: Messages go to people, ideally on standard error for problems, while the status is the contract with other
            programs
milestones:
  - title: Tokens and the simplest object
    summary: Split the text into tokens, accept the empty object, report the verdict through the exit status, then add
      string keys and values.
    steps:
      - title: Lexer, parser and verdict
        minutes: 45
        build: Write a lexer that turns the file into tokens and skips whitespace, and a parser that accepts an empty object.
          Print a verdict and exit with status 0 for valid input and 1 for invalid input.
        outcome: The valid file in tests/step1 exits with status 0, the invalid one exits with status 1, and an empty file
          also exits with status 1.
        concepts:
          - lexical-analysis
          - json-grammar
          - cli-subcommands
        hints:
          hint: Decide what the lexer hands over for each piece of text, and what the parser expects first.
          example: A bank teller reads a cheque by first picking out the date, the amount and the signature as separate pieces,
            and only then checks that they are in the right places.
      - title: String keys and values
        minutes: 45
        build: Extend the parser to objects whose keys and values are strings, with members separated by commas. Make the
          string lexer handle the escapes JSON allows, including backslash-u, and reject raw control characters.
        outcome: Every file in tests/step2 gives the verdict its name says, a string with an escaped double quote and a
          backslash-u escape is accepted, and a string holding a raw tab is rejected.
        concepts:
          - lexical-analysis
          - string-escapes
          - json-grammar
        hints:
          hint: Inside a string, what can follow a backslash, and when does the string really end?
  - title: Every kind of value, nested
    summary: Numbers, true, false and null, then arrays and objects inside each other, then input nested far deeper than
      any real file.
    steps:
      - title: Numbers and keywords
        minutes: 60
        build: Accept numbers, true, false and null as values, following the JSON number spelling exactly.
        outcome: Every file in tests/step3 gives the verdict its name says; small inputs of your own with a leading zero, a
          lone minus sign, a dot with no digits after it, a plus sign and an exponent with no digits are all rejected;
          and 0, minus zero and 1.5e-3 are accepted.
        concepts:
          - json-grammar
          - floating-point-numbers
        hints:
          hint: Write the number rule out in words, part by part, before you change the lexer.
      - title: Arrays and nesting
        minutes: 45
        build: Let values be objects and arrays too, including empty ones, by having the value rule call the object and array
          rules.
        outcome: Every file in tests/step4 gives the verdict its name says, including an empty array inside an empty object
          and an object inside an array.
        concepts:
          - recursive-descent-parsing
          - json-grammar
        hints:
          hint: Which token tells the value rule that an object or an array is starting?
          example: "Russian nesting dolls: opening one may reveal another, and you only finish with a doll once everything
            inside it is closed again."
      - title: Deep nesting
        minutes: 30
        build: Generate a file of a hundred thousand opening square brackets followed by the same number of closing ones, and
          make your tool handle it without crashing, either with a depth limit or an explicit stack.
        outcome: The deep file ends with a clear verdict and status, never a crash, and your notes record the depth limit you
          chose or why you need none.
        concepts:
          - nesting-depth-limits
        hints:
          hint: How deep can your program call itself before it runs out of stack, and how would you find out?
  - title: Errors and conformance
    summary: Run every test automatically, make errors point at the problem, and check yourself against the json.org suite.
    steps:
      - title: Run the tests automatically
        minutes: 30
        build: Write a check that runs your tool on every file in tests/step1 to tests/step4, works out the expected verdict
          from each file name, compares it with the exit status and lists every mismatch.
        outcome: One command runs every test file and reports zero mismatches.
        concepts:
          - conformance-test-suite
        hints:
          hint: Make the check fail loudly, so you notice the day a change breaks an old file.
      - title: Errors that point at the problem
        minutes: 45
        build: Make every error message give the line and column of the token that broke the rules, and say what was expected
          and what was found.
        outcome: For five invalid files of your own, such as a missing colon, a trailing comma and an unclosed bracket, each
          message points at the right line and column.
        concepts:
          - parse-error-reporting
        hints:
          hint: Record the position when the lexer creates each token, not when the parser complains.
      - title: The json.org suite and your choices
        minutes: 60
        build: Download the test suite from the JSON_checker page on json.org and run your tool on every pass file and every
          fail file. Decide your policy for duplicate keys and very large numbers.
        outcome: All pass files are accepted and all fail files are rejected, except any you accept on purpose, and your notes
          give the reason for each such choice and for your duplicate-key and number policies.
        concepts:
          - conformance-test-suite
          - strict-vs-lenient-parsing
        hints:
          hint: Before changing code for a failing file, read what RFC 8259 says about that case.
