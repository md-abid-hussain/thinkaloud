stage0:
  summary: You will build a command-line tool that turns a host name, such as the name of a website, into the numeric
    address that computers use to reach it. Your program has to write each request as raw bytes that follow a
    published layout, send it over the network to a name server, and decode the binary reply that comes back. The
    input is a host name and the output is one or more addresses, or an error if the name doesn't exist. It is harder
    than it looks because the messages have no readable text or separators, names are packed in a compressed form, and
    the network underneath doesn't guarantee that a reply arrives. You also can't rely on one server knowing
    everything, so a full lookup means walking down from the top of the naming system through servers that each know
    only who to ask next.
  questions:
    - id: p-what
      kind: what
      prompt: Your program is given a host name. Who does it talk to to get the answer, and what does one exchange between
        them look like on the wire?
      looks_for:
        - the program is a client that sends a query to a name server
        - the name server sends a reply, so one exchange is one question and one answer
        - both sides are just bytes in a fixed layout, not text
        - a host name goes in and an IP address comes out
    - id: p-why
      kind: why
      prompt: Your browser runs a lookup like this before it can open almost any website. Why is this step needed, and what
        would break without it?
      looks_for:
        - people use names but networks route packets by numeric addresses
        - the translation has to happen before any connection can be made
        - without it, users would have to remember and type raw numbers
        - one shared translation service serves every app on the machine
    - id: p-how
      kind: how
      prompt: The reply arrives as a block of bytes with no labels on it. How does your program know where one message ends
        and where each record starts?
      looks_for:
        - the header has a fixed size, so the first bytes are always read the same way
        - counts in the header say how many entries follow
        - each entry's fixed fields and data length show where it ends
        - a UDP packet is one whole message, so its boundary is the packet itself
questions:
  - id: s1-q1
    step: s1
    concept: byte-order-bit-fields
    prompt: Your program writes the query by copying its numbers straight from memory into the packet. It works on your
      laptop, but a teammate on a different processor gets no reply that matches. What goes wrong, and how do you fix
      it?
    looks_for:
      - processors differ in which byte of a multi-byte number they store first
      - DNS sends the most significant byte first, called network byte order
      - convert each 16-bit number when writing it and when reading it back
      - check the bytes against a known hex sample to catch a swap
  - id: s2-q2
    step: s2
    concept: udp-request-response
    prompt: Your program sends the query and then waits on the socket with no timeout. The only reply is lost on the
      network, and the program hangs forever. What is UDP doing that causes this, and what would you add?
    looks_for:
      - UDP sends one datagram with no acknowledgement and no resend
      - a lost query or reply means no answer ever arrives
      - set a timeout and resend the query a few times before giving up
  - id: s3-q3
    step: s3
    concept: dns-message-format
    prompt: Your socket receives a packet that is exactly your own query, echoed back with the right ID. Your parser
      treats it as the answer and finds no addresses. What check is missing, and what is it for?
    looks_for:
      - the QR flag is 0 in a query and 1 in a response
      - matching the ID alone can't tell an echoed query from a real reply
      - check the flag before reading any answers
  - id: s3-q4
    step: s3
    concept: domain-names-on-the-wire
    prompt: A malformed reply contains a name whose compression pointer points back at its own position. Your parser
      follows pointers forever and the program never returns. What is wrong, and what would you change?
    looks_for:
      - a pointer is an offset into the message, so it can form a loop
      - limit how many pointers one name may follow, or require each pointer to point earlier in the message
      - check that every offset lies inside the message
  - id: s3-q5
    step: s3
    concept: resource-records
    prompt: Your parser assumes every answer's data is a 4-byte IPv4 address. A reply's authority section contains an NS
      record, or a type you don't know. What goes wrong, and how does the record's layout let a parser cope?
    looks_for:
      - the data length comes before the data in every record
      - a parser can skip an unknown type by jumping past its length
      - reading a fixed 4 bytes for other types lands in the wrong place
      - the type field says how to read the data
  - id: s4-q6
    step: s4
    concept: recursive-vs-iterative
    prompt: You clear the recursion desired flag and send the query to a root server. It replies with no answer and no
      error, only a list of servers to ask next. Is the reply broken, and what should your program do with it?
    looks_for:
      - without recursion a server answers only from its own data or with a referral
      - root servers answer iteratively, so a referral is a normal reply
      - follow the referral to one of the listed servers and continue the walk
      - the recursion desired flag asks the server to do the whole lookup, which is why it is cleared here
  - id: s4-q7
    step: s4
    concept: dns-hierarchy
    prompt: A teammate fixes the starting point as the single authoritative server for one company's names. The program
      works for those names but fails for others. Why does a fixed server only help for some names, and where should
      the walk begin?
    looks_for:
      - each server holds records only for the zone it is responsible for
      - names outside that zone are unknown to it
      - the walk starts at a root server, which sits at the top of the tree and can lead to any name
      - a resolver starts from its list of root hints
  - id: s4-q8
    step: s4
    concept: referrals-and-glue
    prompt: A referral names the next server, but its additional section has no address for that server. Your program
      reports a dead end and stops. What is missing, and what should the program do to continue?
    looks_for:
      - glue is an address sent with the referral, needed to send the next query
      - glue is required when the name server sits inside the zone it serves
      - without glue, look up the server's own name first, then return to the original question
      - cap the number of steps so referral loops end
