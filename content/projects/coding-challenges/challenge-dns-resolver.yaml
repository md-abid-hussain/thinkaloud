# Coding Challenges, Build your own DNS resolver. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-dns-resolver . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-dns-resolver
  title: Build your own DNS resolver
  source_url: https://codingchallenges.fyi/challenges/challenge-dns-resolver
  level: intermediate
  status: generated
  figure:
    kind: net
  summary: A resolver that turns a host name into an IP address. It builds DNS query messages byte by byte, sends them
    over UDP, decodes the binary replies, compressed names included, and finally resolves any name on its own by
    starting at a root server and following referrals.
  requirements:
    - Build a DNS query by hand, a 12-byte header and a question, with every number big-endian
    - Send the query over UDP to a DNS server on port 53 and read the reply
    - Check that the reply's ID matches the query and that it is marked as a response
    - Decode the header, question and answer records, following compressed name pointers
    - Print the addresses of A records as four numbers joined by dots
    - Resolve a name iteratively from a root server, following referrals until an address comes back
  primer:
    what: DNS is how a name such as example.com becomes the numeric address a computer can connect to. A resolver sends a
      small binary message, the query, to a DNS server over UDP and reads back a reply holding the answer. You will
      build these messages byte by byte, read the replies, and then resolve any name yourself, starting from one of
      the root servers at the top of the system.
    why: Every connection to a named host starts with this lookup. Building it shows how a binary protocol packs numbers
      and single bits into bytes, and how the work of naming the whole internet is split between many servers.
    example: Inside a DNS message a name is not written with dots. Each part, called a label, is preceded by one byte
      giving its length, and a zero byte marks the end. The name go.dev becomes the byte 2, the letters g and o, the
      byte 3, the letters d, e and v, and then a zero byte, which is 8 bytes in all.
    words:
      - term: resolver
        meaning: The program that asks DNS servers questions until it has the address for a name.
      - term: query
        meaning: The message a resolver sends, holding a header and the question, such as which address belongs to a name.
      - term: label
        meaning: One part of a name between dots, such as google in dns.google.com, written with its length in front.
      - term: big-endian
        meaning: Writing a number that takes several bytes with its most significant byte first. DNS writes every number this
          way.
      - term: UDP
        meaning: A way to send single messages, called datagrams, with no connection. A datagram can be lost, and nothing
          resends it.
      - term: root server
        meaning: One of the servers at the top of DNS. It does not know most addresses, but knows who to ask next.
  restate_rubric:
    - id: r1
      point: It is a DNS resolver that turns a host name into an IP address by sending DNS messages itself
    - id: r2
      point: It builds the binary query and decodes the binary reply by hand, including compressed names
    - id: r3
      point: It can start at a root server and follow referrals to the servers that know the answer
  reflection_prompt: In your own words, how does your resolver turn a name into bytes, bytes back into an address, and
    one referral into the next query? What would you add so it stays fast when it is asked for the same names again
    and again?
  reference_tool: dig, or nslookup where dig is not installed, to compare answers; dig with +trace shows the same walk from the root.
  done_when: Your resolver builds queries that match the challenge's example byte for byte, sends them over UDP with
    timeouts and retries, decodes headers, compressed names and answers safely, resolves names from a root server by
    following referrals to the same addresses dig reports, and caches records by TTL; and your notes explain, in your
    own words, how a name becomes an address.
  open_checks:
    - Whether your network lets UDP on port 53 reach outside servers; some networks force their own resolver.
    - Whether 198.41.0.4 is still a root server address; the IANA root server list says.
    - Which test names return replies large enough to be truncated.
    - What your system does with a datagram larger than your receive buffer.
learning_map:
  - concept: dns-message-format
    where: You build the 12-byte header and the question by hand, and decode the header, question and answer records of
      every reply.
    explain_back:
      prompt: A reply says it holds 2 answers, 0 authority records and 1 additional record. Explain how a DNS message is
        laid out, how your decoder knows where each section starts, and why it cannot simply jump to the answers.
      rubric:
        - id: e1
          point: A fixed 12-byte header with the ID, the flags and four counts, then the question, answer, authority and
            additional sections in that order
        - id: e2
          point: The counts in the header say how many entries each section holds
        - id: e3
          point: Names and record data vary in length, so the decoder must read each entry completely to find where the next one
            starts, starting with the question the reply repeats
  - concept: byte-order
    where: Every number in a DNS message, from the ID to the TTL, is written big-endian, in network byte order.
    explain_back:
      prompt: Your query uses the ID 22, but your tool reads the reply's ID as 5632 and rejects it as a mismatch. Explain
        what went wrong and the rule that avoids it.
      rubric:
        - id: e1
          point: A number wider than a byte can be stored most significant byte first, big-endian, or least significant first,
            little-endian
        - id: e2
          point: Network protocols such as DNS use big-endian, so 22 must go out as the bytes 00 16
        - id: e3
          point: Writing it in the machine's little-endian order sends 16 00, which reads back as 5632
        - id: e4
          point: Write and read every multi-byte field explicitly in network byte order, never in the machine's own order
  - concept: bit-packing
    where: The 16-bit flags field packs the query or response bit, the opcode, AA, TC, RD, RA and the response code into
      fixed bit positions.
    explain_back:
      prompt: Your resolver asks for recursion, but after a teammate's change servers ignore every query because they now
        look like responses. Explain how the flag bits are packed, and how a program sets or reads one flag without
        disturbing the others.
      rubric:
        - id: e1
          point: "Single-bit flags and small numbers sit at fixed positions in one 16-bit field: the query or response bit is
            the top bit and recursion desired is bit 8"
        - id: e2
          point: A flag is set by combining the field with a mask using OR, and tested by combining it with the mask using AND
        - id: e3
          point: Multi-bit fields such as the response code are read by masking and shifting
        - id: e4
          point: Setting the top bit instead of the recursion bit marks the message as a response, so servers ignore it
  - concept: udp-datagrams
    where: Queries and replies travel as single UDP datagrams to port 53, with no guarantee that either arrives.
    explain_back:
      prompt: Your resolver sometimes waits for ever, and for one large domain the reply has the TC flag set and records
        missing. Explain both in terms of UDP, and what a resolver should do in each case.
      rubric:
        - id: e1
          point: UDP does not resend lost datagrams, so a lost query or reply is simply gone
        - id: e2
          point: The resolver needs a timeout and a small number of retries, and must check that the reply's ID matches
        - id: e3
          point: Classic DNS over UDP limits a reply to 512 bytes; a reply that does not fit is cut short and marked truncated
            with TC
        - id: e4
          point: On a truncated reply the resolver should repeat the query over TCP
  - concept: dns-name-compression
    where: Names in replies can end with a two-byte pointer back to an earlier place in the message, such as c0 0c
      pointing at offset 12.
    explain_back:
      prompt: Your decoder handles every real reply, but a crafted one makes it run for ever. Explain how DNS name
        compression works, and what a decoder must check so that it cannot be trapped.
      rubric:
        - id: e1
          point: A name is a series of labels, each preceded by its length, ending with a zero byte
        - id: e2
          point: "A byte whose top two bits are both set starts a pointer: the remaining 14 bits give an offset in the message
            where the rest of the name continues"
        - id: e3
          point: A pointer can point at itself or form a cycle, which loops a naive decoder
        - id: e4
          point: The decoder must check that each offset lies inside the message, limit the number of jumps and cap the name at
            255 bytes
  - concept: iterative-resolution
    where: Starting at a root server, your resolver follows referrals to the com servers, then to the domain's own
      servers, until one answers with an address.
    explain_back:
      prompt: Explain how your resolver finds the address of dns.google.com starting only from a root server's address, what
        a referral is, and what glue records are for.
      rubric:
        - id: e1
          point: "Each server answers what it knows: the root refers the resolver to the com servers, they refer it to the
            google.com servers, and those answer"
        - id: e2
          point: A referral is a reply with no answers and NS records in the authority section naming the next servers
        - id: e3
          point: Glue records in the additional section give those servers' addresses, so the resolver does not first have to
            resolve their names
        - id: e4
          point: A recursive resolver such as 8.8.8.8 does this walk on the client's behalf when recursion is requested
  - concept: dns-caching-ttl
    where: Every record in a reply carries a TTL in seconds, which says how long your resolver may reuse it without asking
      again.
    explain_back:
      prompt: A team moves its website to a new server and updates its DNS record, yet some users keep reaching the old
        server for hours. Explain why, and what the team should have done beforehand.
      rubric:
        - id: e1
          point: Resolvers cache each record for its TTL and answer from the cache until it runs out
        - id: e2
          point: Until then, users of those resolvers get the old address
        - id: e3
          point: The team should have lowered the TTL well before the move, at least one old TTL ahead, then changed the record,
            then raised the TTL again
milestones:
  - title: Build the query
    summary: Encode the name and header byte by byte, and prove the query matches the challenge's example.
    steps:
      - title: Encode the name and the header
        minutes: 45
        build: Encode a host name as labels, each preceded by its length and ended by a zero byte. Build the 12-byte header
          with the ID 22, recursion desired set, a question count of 1 and zero for the other counts, every number
          written as two bytes, high byte first.
        outcome: For dns.google.com your encoded name and your header, printed as hexadecimal, match the challenge's example
          byte for byte.
        concepts:
          - dns-message-format
          - byte-order
          - bit-packing
        hints:
          hint: Write the flags as one 16-bit number first, then split it into two bytes.
      - title: Put the query together and test it
        minutes: 45
        build: "Append the question: the encoded name, the type 1 for an A record and the class 1 for internet. Add a test
          that builds the query for dns.google.com with the ID 22 and compares it with the challenge's hexadecimal."
        outcome: The test passes, and it fails if you deliberately write one number in the wrong byte order or drop the zero
          byte at the end of the name.
        concepts:
          - dns-message-format
          - byte-order
        hints:
          hint: Make the test fail on purpose once, so you know it can.
  - title: Send it and read the reply
    summary: Send over UDP, decode the header, the names and the answers, and defend against hostile replies.
    steps:
      - title: Send over UDP with a timeout
        minutes: 45
        build: Open a UDP socket, send the query to 8.8.8.8 on port 53, read one datagram and print it as hexadecimal. Give up
          after a few seconds with a clear error, and retry a small number of times.
        outcome: The reply's first two bytes are 00 16, your query's ID, and pointing the tool at an address where nothing
          answers ends with a timeout message instead of hanging.
        concepts:
          - udp-datagrams
        hints:
          hint: Decide how long to wait and how many times to try before you send anything.
      - title: Read the header and its flags
        minutes: 30
        build: "Parse the 12-byte header of the reply: the ID, each flag and the four counts."
        outcome: For the reply from 8.8.8.8 your tool prints the ID 22, the response flag set, recursion available set, one
          question and the number of answers the reply holds.
        concepts:
          - bit-packing
          - dns-message-format
        hints:
          hint: Test each flag with its own mask, and print them all, not only the ones you expect.
      - title: Decode names and follow pointers
        minutes: 45
        build: Decode names by joining labels with dots, and follow a pointer whenever a length byte has its top two bits set.
          Bound every jump.
        outcome: The question name and every answer name decode as dns.google.com, and a hand-made message whose pointer
          points at itself is rejected with an error instead of hanging.
        concepts:
          - dns-name-compression
        hints:
          hint: "After a pointer, where does the rest of the record continue: at the jump target or after the two pointer
            bytes?"
      - title: Read the answers
        minutes: 45
        build: After each answer's name, read the type, class, TTL, data length and data, and print an A record's data as four
          numbers joined by dots.
        outcome: For dns.google.com your tool prints the same IPv4 addresses that dig or nslookup prints for the name, each
          with its TTL.
        concepts:
          - dns-message-format
          - byte-order
        hints:
          hint: Use the data length to skip records you do not understand.
  - title: Resolve from the root
    summary: Ask a root server, follow referrals to an answer, and cache what you learn.
    steps:
      - title: Ask a root server
        minutes: 30
        build: Clear the recursion-desired flag and send the query for dns.google.com to the root server 198.41.0.4. Print
          every section of the reply.
        outcome: The reply has no answers, NS records for the com servers in its authority section and their addresses in its
          additional section, and your tool prints all three sections.
        concepts:
          - iterative-resolution
        hints:
          hint: An empty answer section is not a failure here. What else did the server give you?
      - title: Follow the referrals
        minutes: 60
        build: "Loop: send the query to the current server; stop when the answer section holds an A record; otherwise take a
          name server from the authority section and its address from the additional section, and ask it. When a name
          server has no address, resolve its name from the root first. Stop after a fixed number of queries."
        outcome: Resolving dns.google.com from the root prints each server queried and ends with the same address as dig, and
          a name whose servers have no glue is still resolved, with the total number of queries capped.
        concepts:
          - iterative-resolution
          - udp-datagrams
        hints:
          hint: Print each step of the walk, the way dig with its trace option does, and compare the two.
      - title: Cache answers by TTL
        minutes: 45
        build: Keep every record you receive, including referrals, in a cache keyed by name and type, and reuse it until its
          TTL runs out. Accept several names in one run to test it.
        outcome: Resolving a list in which one name appears twice sends no queries for the second copy, and after its TTL has
          passed, shortened in a test, the name is queried again.
        concepts:
          - dns-caching-ttl
        hints:
          hint: Store the time each record expires, not the TTL itself.
