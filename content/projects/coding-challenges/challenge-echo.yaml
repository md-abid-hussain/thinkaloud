# Coding Challenges, Build your own echo server. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-echo . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-echo
  title: Build your own echo server
  source_url: https://codingchallenges.fyi/challenges/challenge-echo
  level: beginner
  status: generated
  figure:
    kind: net
  summary: A network server on port 7 that sends back every byte a client sends it, first for one TCP client, then for
    many at once, then over UDP with a command-line flag, and that shuts down cleanly without dropping echoes that are
    still on their way.
  requirements:
    - Listen on port 7 on every local address and log each connection it accepts
    - Read what a client sends and write the same bytes back until the client closes the connection
    - Serve several clients at the same time, so one slow client never holds up another
    - Run over UDP instead of TCP when started with a UDP flag, still on port 7
    - Shut down cleanly, finishing echoes in flight and closing every connection
  primer:
    what: "An echo server is the smallest useful network server: whatever a client sends, it sends straight back. The
      server listens on a port, the echo protocol uses port 7, and each client that connects gets its own connection
      to read from and write to. You will build one for TCP, make it serve many clients at once, add a UDP mode and
      make it stop cleanly."
    why: Almost every network program, from web servers to databases, is built on the same few socket calls. An echo
      server lets you learn them, and how TCP and UDP really deliver data, with nothing else in the way.
    example: "In one terminal you start the server. In another you connect with netcat to localhost on port 7 and type
      good morning, then press enter. The server reads those 13 bytes, 12 letters and spaces plus the newline, and
      writes the same 13 bytes back, so the line appears twice on your screen: once as you typed it and once as the
      echo."
    words:
      - term: socket
        meaning: The handle a program uses to send and receive network data, much as a file handle is used to read a file.
      - term: port
        meaning: A number from 0 to 65535 that picks out one service on a machine. The echo protocol uses port 7.
      - term: listening socket
        meaning: A socket that only waits for clients. Each time it accepts one, it hands back a new socket for that client
          and keeps waiting.
      - term: TCP
        meaning: A protocol that gives two programs a connection carrying a stream of bytes, delivered in order, with lost
          pieces resent.
      - term: UDP
        meaning: A protocol that sends separate messages with no connection. A message can be lost, and nothing resends it.
      - term: netcat
        meaning: A command-line tool, nc, that connects to a port and sends what you type, which makes it handy for testing
          servers.
  restate_rubric:
    - id: r1
      point: It is a server on port 7 that sends back exactly what each client sends it
    - id: r2
      point: Over TCP it serves many clients at the same time and keeps echoing until each one closes its connection
    - id: r3
      point: A flag switches it to UDP, and it shuts down cleanly without losing echoes
  reflection_prompt: In your own words, what surprised you about how data really arrives over TCP and UDP, and what
    would you change in your server if it had to handle ten thousand clients?
  reference_tool: netcat (nc) as the client, over TCP and over UDP with -u. Flags differ between netcat versions, so check yours.
  done_when: The server echoes every byte back over TCP for several clients at once, survives a client that never reads,
    echoes datagrams over UDP to the right sender, reports startup failures on standard error with a non-zero exit
    status, and stops cleanly on Ctrl+C; and your notes explain, in your own words, the difference between a TCP byte
    stream and UDP datagrams.
  open_checks:
    - Whether listening on port 7 needs administrator rights on your system; use a high port such as 7007 while
      developing if it does.
    - Which netcat you have, and which flags it uses for UDP and for closing after the end of input.
    - How large a UDP datagram your system lets you send on the local machine.
    - How long your system keeps a closed connection's port busy, and whether address reuse changes that.
learning_map:
  - concept: tcp-sockets
    where: ccecho listens on port 7, accepts each client as its own connected socket, and reads and writes bytes on that
      socket until the client leaves.
    explain_back:
      prompt: Your echo server works when you connect from the same machine, but a colleague on another laptop cannot reach
        it, and restarting the server sometimes fails with "address already in use". Explain both, and what accepting
        a connection gives your program.
      rubric:
        - id: e1
          point: "The address the server listens on decides who can connect: the loopback address accepts only local clients,
            while all addresses accept clients from the network"
        - id: e2
          point: Only one listener can hold an address and port; after a restart, recently closed connections can still hold the
            port for a while, so binding fails unless address reuse is allowed
        - id: e3
          point: Accepting gives a new socket for that one client, while the listening socket keeps waiting for others
  - concept: stream-read-contract
    where: Each read returns whatever has arrived, possibly half a line, and reports the end when the client closes; each
      write can also send fewer bytes than it was given.
    explain_back:
      prompt: A client sends a 1 MB file through your echo server and gets back only part of it, although the server reports
        no error. Explain two ways the server can lose bytes, and what it must do instead.
      rubric:
        - id: e1
          point: It may echo the whole buffer or assume one read holds everything, instead of using the number of bytes each
            read actually returned
        - id: e2
          point: A write can accept fewer bytes than it was given, and ignoring that count silently drops the rest
        - id: e3
          point: The server must keep reading until the read reports the end, and keep writing until every byte it read has been
            sent
  - concept: message-framing
    where: Echo needs no framing because it sends back raw bytes, but as soon as you answer per line you must find the
      line boundaries yourself.
    explain_back:
      prompt: You change the server to reply "You said:" followed by each line. Typed input works, but pasted text gets
        replies that break in the middle of lines or join several lines in one reply. Explain why, and how to fix it.
      rubric:
        - id: e1
          point: TCP is a byte stream with no message boundaries, so one read can hold part of a line or several lines
        - id: e2
          point: Replying per read therefore follows the network's splits, not the lines
        - id: e3
          point: Buffer the bytes, reply only when a complete line ending in a newline is present, and keep the leftover for the
            next read
  - concept: concurrent-connections
    where: A second client must be echoed while the first is still connected, so each connection needs its own thread,
      task or turn in an event loop.
    explain_back:
      prompt: In your first version, a second netcat client connects but sees no echo until the first one quits. Explain
        why, compare two ways to serve both at once, and name one limit you should set either way.
      rubric:
        - id: e1
          point: The server handles one client at a time, so it does not accept or serve the next until the first finishes
        - id: e2
          point: A thread or task per connection serves each client independently, at the cost of memory per client
        - id: e3
          point: An event loop waits on many sockets at once and serves whichever is ready, which scales to many idle clients
        - id: e4
          point: Either way, cap the number of connections or the pool size so a flood of clients cannot exhaust the server
  - concept: flow-control-backpressure
    where: A client that sends a lot but never reads its echoes eventually makes your writes stop going through, and the
      server must not buffer without limit.
    explain_back:
      prompt: A client streams data into your echo server but never reads the replies. After a while the server stops making
        progress with that client, and memory or threads start piling up. Explain what is happening and how the server
        should handle it.
      rubric:
        - id: e1
          point: The client's receive buffer fills, TCP tells the server to stop sending, and the server's send buffer fills too
        - id: e2
          point: The server's write then blocks or reports it would block, which is backpressure slowing the server to the
            client's pace
        - id: e3
          point: The server should stop reading from that client while it cannot write, rather than queueing echoes in memory
            without limit
        - id: e4
          point: A timeout or limit should disconnect a client that never drains, so it cannot hold a thread or memory for ever
  - concept: udp-datagrams
    where: With the UDP flag the server receives separate datagrams on one socket, each with its sender's address, and
      must reply to that address.
    explain_back:
      prompt: Over TCP your server echoes a long paste correctly, but over UDP the reply comes back cut short, and sometimes
        a second client receives the first client's echo. Explain both, in terms of how UDP differs from TCP.
      rubric:
        - id: e1
          point: "UDP keeps message boundaries: each receive returns exactly one datagram, and a buffer smaller than the
            datagram loses the rest of it"
        - id: e2
          point: There is no connection, so each datagram carries its sender's address and the reply must go to that address,
            not to a remembered client
        - id: e3
          point: UDP does not resend lost datagrams or keep them in order, so an echo can simply be missing
  - concept: cli-subcommands
    where: A flag chooses TCP or UDP, and startup failures such as a port already in use go to standard error with a
      non-zero exit status.
    explain_back:
      prompt: A deployment script starts ccecho on port 7, but on that machine the port needs administrator rights. Explain
        what your program should print, where, and what exit status it should return, and how the script uses that.
      rubric:
        - id: e1
          point: A clear message saying which port could not be opened and why
        - id: e2
          point: The message goes to standard error, not standard output
        - id: e3
          point: The exit status is non-zero
        - id: e4
          point: The script checks the exit status to stop or alert instead of assuming the server is running
  - concept: graceful-shutdown
    where: On Ctrl+C the server stops accepting, lets echoes in progress finish, closes every connection and exits within
      a time limit.
    explain_back:
      prompt: Your echo server runs under a process manager that restarts it during every deploy, and users complain their
        sessions break in the middle of a message. Describe how the server should stop, and why it needs a time limit.
      rubric:
        - id: e1
          point: On the stop signal, close the listening socket so no new clients arrive
        - id: e2
          point: Let the echo in progress on each connection finish, then close each connection
        - id: e3
          point: Use a deadline after which the remaining connections are closed anyway, so a client that never leaves cannot
            block the exit
milestones:
  - title: Echo one client over TCP
    summary: Accept a connection, echo until the client leaves, and make sure every byte comes back.
    steps:
      - title: Accept a connection
        minutes: 30
        build: Start ccecho so that it listens on every local address on port 7, accepts one TCP connection, logs the client's
          address and port, and exits.
        outcome: Running nc localhost 7 in another terminal makes the server log one line with the client's address and port.
        concepts:
          - tcp-sockets
        hints:
          hint: Which address do you listen on so that other machines can connect, not only this one?
      - title: Echo until the client leaves
        minutes: 45
        build: After accepting, read from the client and write the same bytes back until a read reports that the client has
          closed, then log the disconnect.
        outcome: In netcat each line you type appears twice, once as typed and once as echoed, and closing netcat makes the
          server log the disconnect.
        concepts:
          - stream-read-contract
          - tcp-sockets
        hints:
          hint: Ask what a read returns when the client has gone, and how that differs from a read that found nothing yet.
      - title: Every byte comes back
        minutes: 45
        build: Pipe a file of several megabytes through netcat and compare what comes back with the original. Make the server
          use each read's byte count and keep writing until every byte has gone.
        outcome: A file of several megabytes piped through the server comes back byte for byte identical, checked with a
          checksum or a file comparison.
        concepts:
          - stream-read-contract
          - message-framing
        hints:
          hint: Count what each read and each write reports, not the size of your buffer.
          example: A courier who can carry only part of a delivery on each trip keeps going back until the whole order has
            arrived, and counts each load.
  - title: Many clients and slow readers
    summary: Serve clients side by side, and keep the server healthy when a client never reads.
    steps:
      - title: Serve clients side by side
        minutes: 45
        build: Keep the server running after each client and accept connections in a loop, giving each one its own thread,
          task or turn in an event loop.
        outcome: Two netcat clients connected at the same time are both echoed immediately, and the log shows both
          connections.
        concepts:
          - concurrent-connections
        hints:
          hint: Where does your server wait, and what is it unable to do while it waits there?
      - title: A client that never reads
        minutes: 45
        build: Write a test client that sends a large stream but never reads the echoes. Make the server stop reading from
          such a client while it cannot write, and disconnect a client that has not drained for a set time.
        outcome: While the test client sends 100 MB without reading, the server's memory stays flat, another netcat client is
          still echoed, and the stuck client is disconnected after your timeout.
        concepts:
          - flow-control-backpressure
          - concurrent-connections
        hints:
          hint: Watch the server's memory while the test runs. What is it holding on to?
          example: A tap filling a sink with a blocked drain has to be turned down, or the water ends up on the floor.
  - title: UDP, errors and a clean stop
    summary: Echo over UDP, report startup failures properly, and shut down without dropping echoes.
    steps:
      - title: Echo over UDP
        minutes: 45
        build: Add a flag that runs the server over UDP on port 7. Reply to the sender of each datagram, with a receive buffer
          large enough for any datagram you expect.
        outcome: With the UDP flag, nc -u sends a line and gets it back, two UDP clients each receive only their own lines,
          and a line of a few thousand characters comes back whole.
        concepts:
          - udp-datagrams
          - cli-subcommands
        hints:
          hint: Every datagram arrives with an address. Where does your reply go?
      - title: Errors and exit status
        minutes: 30
        build: Report a port that is already in use, or that needs higher rights, and an unknown flag, each with a message on
          standard error and a non-zero exit status.
        outcome: Starting a second copy on the same port prints a message on standard error and exits with a non-zero status,
          which you can see with the shell's last exit status.
        concepts:
          - cli-subcommands
          - tcp-sockets
        hints:
          hint: Check the exit status as well as the message, the way a script would.
      - title: Stop cleanly
        minutes: 45
        build: On Ctrl+C or a stop signal, stop accepting new connections, let every echo in progress finish, close all open
          connections and exit, with a time limit after which the rest are closed anyway.
        outcome: Pressing Ctrl+C while two clients are connected lets the echo in progress finish, both clients see their
          connection close, a new connection attempt is refused, and the process exits within your time limit.
        concepts:
          - graceful-shutdown
        hints:
          hint: Write down the order of the steps, then check each one in your log.
