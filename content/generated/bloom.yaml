stage0:
  summary: "You will build a command line spell checker that reads a word list once and saves a compact summary of it to
    a file. Later runs load that file and report which words typed on the command line are probably misspelt. The
    summary is much smaller than the list, so it must answer membership questions without holding every word. Its
    trade-off is a rare, known kind of error: it may pass a misspelt word, but it never flags a word that is in the
    list. What makes this harder than it looks is that the file must be written and read back exactly, and words must
    be put into the same form every time they are built or checked."
  questions:
    - id: p-what
      kind: what
      prompt: You give the checker a few words typed on the command line. What goes in, what comes out, and what does a
        reply of probably spelt correctly actually promise? Think about what the word list is for.
      looks_for:
        - Input is one or more words, checked against the word list the tool was built from
        - Output is a list of words flagged as probably misspelt, not a verdict on each word
        - A flagged word is certainly absent from the list, but an unflagged word is only probably right
        - A word that passes can still be misspelt, so the answer is a likelihood
    - id: p-why
      kind: why
      prompt: Why would anyone keep only a compact summary of a word list rather than the list itself? Think about where
        such a checker runs, and what other software needs the same trick.
      looks_for:
        - Storage and memory are limited on small or old devices
        - A full list is slow to load and search on such devices
        - The same trade appears in databases, caches and web crawlers that must skip costly lookups
        - Accepting rare errors buys a large saving in space
    - id: p-how
      kind: how
      prompt: Suppose you had to check words against a big word list with no special structure. What is the simplest
        approach, and what goes wrong as the list grows or the device has little memory?
      looks_for:
        - Store every word in full and look each typed word up in the stored list
        - The answers are exact, but the space needed grows with the total length of all the words
        - Each lookup gets slower as the list grows, unless the list is sorted and searched cleverly
        - On a small device the full list may not fit at all
questions:
  - id: s1-q1
    step: s1
    concept: probabilistic-membership
    prompt: Your teammate removes a word from the filter by setting its bits back to zero. Later, a word that was added
      earlier is reported as never added. What happened, and why can't a bit be cleared safely?
    looks_for:
      - other words share some of the same bits
      - clearing a bit can turn a yes into a no, which is a false negative
      - the filter can't tell which word set a bit, so it can't undo one word alone
      - removing items needs a counter in each position, as counting filters use
  - id: s1-q2
    step: s1
    concept: hash-functions
    prompt: Your filter needs several positions for each word, and you compute a separate hash for every one of them. The
      build is slow on a large dictionary. What would you change, and what must still hold about the positions?
    looks_for:
      - two hashes can generate all the positions
      - position i is the first hash plus i times the second, taken modulo the bit count
      - the positions must stay spread out and unrelated to each other
      - a fast hash that isn't cryptographic is enough here
  - id: s2-q3
    step: s2
    concept: filter-sizing
    prompt: A colleague builds the filter from today's word list, then adds a much larger list to it without resizing.
      Made-up words start being reported as real far more often. Why, and what would you do instead?
    looks_for:
      - the bits fill with ones beyond the planned count
      - a made-up word is fooled once all its positions are ones, so the rate climbs fast
      - size the filter for the largest count you expect, from the start
      - rebuild at a new size rather than adding to a full filter
  - id: s2-q4
    step: s2
    concept: canonical-words
    prompt: Your build reads a word list saved on Windows, and every word is then reported as misspelt, even words you
      typed correctly. What's the likely cause, and what should the build do with each line?
    looks_for:
      - each line ends with an invisible carriage return that becomes part of the word
      - the stored bytes no longer match what a person types
      - trim line endings and stray spaces before a word is added
  - id: s3-q5
    step: s3
    concept: binary-file-format
    prompt: A teammate writes the header by copying each number straight from memory on a laptop. The file is read on a
      machine that stores numbers the other way round, and the bit count comes out wrong. Why, and what does the
      format need to say?
    looks_for:
      - processors differ in the order they keep multi-byte numbers
      - the header needs one fixed byte order, big-endian here
      - each field has a fixed width, so a reader knows where it ends
  - id: s3-q6
    step: s3
    concept: bit-arrays
    prompt: Your file packs the filter's bits eight to a byte. A second tool counts position zero from the other end of
      each byte, so every check comes back wrong. What must the format say about bit order, and why can't a reader
      guess it?
    looks_for:
      - each position maps to one byte and one bit inside it, found with division and remainder
      - which end of the byte is bit zero must be shared by writer and reader
      - the choice must be written in the format's documentation or version
      - a wrong order still loads without any error, which makes it hard to spot
  - id: s4-q7
    step: s4
    concept: binary-file-format
    prompt: You change the hash functions and deliberately keep the same file identifier and version. Old files still load
      without error, but correct words are now reported as misspelt. What went wrong, and what should have changed?
    looks_for:
      - the same bits no longer hold the same words, so answers are silently wrong
      - a version number must change whenever the meaning of the bits changes
      - the reader checks the version and refuses files it doesn't know
      - a loader that accepts any version gives quiet wrong answers
  - id: s4-q8
    step: s4
    concept: hash-functions
    prompt: You build the filter on Monday and load it on Tuesday in a new run. Some correct words now come back as
      misspelt, though the file and version are unchanged. What's the likely cause, and what property must a hash have
      here?
    looks_for:
      - some languages randomise string hashes at each start for safety
      - a word lands on different positions in another run
      - use a hash whose output is fixed for given bytes, such as FNV
      - stable positions are needed because the file is read later, possibly elsewhere
  - id: s5-q9
    step: s5
    concept: space-accuracy-tradeoff
    prompt: A colleague wants to replace the filter with the full word list, so that no typo can ever pass unreported.
      What would they gain, what would they pay, and is a passed typo a serious cost for this checker?
    looks_for:
      - an exact list stores every word, so it costs far more space
      - a false positive here costs one typo passing unreported, which is cheap
      - choose the error rate from what a false positive costs
      - a filter is worth it when space is tight or the exact check is expensive
  - id: s5-q10
    step: s5
    concept: canonical-words
    prompt: A user types 'Coding' with a capital letter, and the checker reports it as misspelt, though 'coding' is in the
      dictionary. What's the cause, and what rule should apply to a word from the command line?
    looks_for:
      - the filter hashes exact bytes, so a capital letter gives different bits
      - the build and the check must apply the same normalising rule
      - lowercase the word before it is added and before it is checked
runner: script
checks:
  - step: s2
    commands:
      - name: build exits cleanly
        run: <run> -build {fixture:dict.txt}
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
      - name: build leaves words.bf with content
        run: test -s words.bf
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
      - name: rebuild replaces the file rather than appending to it
        run: a=$(wc -c < words.bf); <run> -build {fixture:dict.txt} && test "$a" = "$(wc -c < words.bf)"
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
  - step: s3
    commands:
      - name: build first so the file exists
        run: <run> -build {fixture:dict.txt}
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
      - name: header starts with CCBF and the file length matches the big-endian bit count
        run: python3 -c "d=open('words.bf','rb').read(); assert d[:4]==b'CCBF'; bits=int.from_bytes(d[8:12],'big'); assert
          bits>0 and len(d)==12+(bits+7)//8; print('header ok')"
        stdin: null
        expect_exit: 0
        stdout_contains:
          - header ok
        stdout_not_contains: []
      - name: filter file is smaller than the dictionary
        run: python3 -c "import os; assert os.path.getsize('words.bf') < os.path.getsize('{fixture:dict.txt}');
          print('smaller')"
        stdin: null
        expect_exit: 0
        stdout_contains:
          - smaller
        stdout_not_contains: []
  - step: s5
    commands:
      - name: dictionary words are never flagged
        run: out=$(<run> $(cat {fixture:dict.txt})); ! printf '%s\n' "$out" | grep -qx -F -f {fixture:dict.txt}
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
      - name: made-up words are flagged, with at most a small share slipping through
        run: awk 'BEGIN{for(i=1;i<=2000;i++) print "qx" i "zv"}' > {tmp}/fake.txt; out=$(<run> $(cat {tmp}/fake.txt)); test
          $(printf '%s\n' "$out" | grep -c 'qx') -ge 1800
        stdin: null
        expect_exit: 0
        stdout_contains: []
        stdout_not_contains: []
