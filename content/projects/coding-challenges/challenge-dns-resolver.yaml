# Coding Challenges, Build your own DNS resolver.
# Source: https://codingchallenges.fyi/challenges/challenge-dns-resolver
# Written in our own words. The source page is linked, not copied.
# The page's sample reply has the flags 80 80 in hex, so its recursion desired bit is 0 although the query set it.
# A real reply from 8.8.8.8 copies the bit back (81 80). No key depends on the reply's RD bit.
# Every predict and trace key is proven by content/proofs/challenge-dns-resolver.mjs, offline, with Buffer.

format: 1

project:
  source: coding_challenges
  slug: challenge-dns-resolver
  title: Build your own DNS resolver
  source_url: https://codingchallenges.fyi/challenges/challenge-dns-resolver
  level: intermediate
  status: generated
  figure:
    kind: net
  summary: >-
    A resolver that turns a host name into an IP address. It builds DNS query messages byte by byte, sends them over
    UDP, decodes the binary replies, compressed names included, and finally resolves any name on its own by starting
    at a root server and following referrals.
  requirements:
    - Build a DNS query by hand, a 12-byte header and a question, with every number big-endian
    - Send the query over UDP to a DNS server on port 53 and read the reply
    - Check that the reply's ID matches the query and that it is marked as a response
    - Decode the header, question and answer records, following compressed name pointers
    - Print the addresses of A records as four numbers joined by dots
    - Resolve a name iteratively from a root server, following referrals until an address comes back
  restate_rubric:
    - id: r1
      point: "It is a DNS resolver that turns a host name into an IP address by sending DNS messages itself"
    - id: r2
      point: "It builds the binary query and decodes the binary reply by hand, including compressed names"
    - id: r3
      point: "It can start at a root server and follow referrals to the servers that know the answer"
  reflection_prompt: >-
    In your own words, how does your resolver turn a name into bytes, bytes back into an address, and one referral
    into the next query? What would you add so it stays fast when it is asked for the same names again and again?
  primer:
    what: >-
      DNS is how a name such as example.com becomes the numeric address a computer can connect to. A resolver sends a
      small binary message, the query, to a DNS server over UDP and reads back a reply holding the answer. You will
      build these messages byte by byte, read the replies, and then resolve any name yourself, starting from one of
      the root servers at the top of the system.
    why: >-
      Every connection to a named host starts with this lookup. Building it shows how a binary protocol packs numbers
      and single bits into bytes, and how the work of naming the whole internet is split between many servers.
    example: >-
      Inside a DNS message a name is not written with dots. Each part, called a label, is preceded by one byte giving
      its length, and a zero byte marks the end. The name go.dev becomes the byte 2, the letters g and o, the byte 3,
      the letters d, e and v, and then a zero byte, which is 8 bytes in all.
    words:
      - term: resolver
        meaning: The program that asks DNS servers questions until it has the address for a name.
      - term: query
        meaning: The message a resolver sends, holding a header and the question, such as which address belongs to a name.
      - term: label
        meaning: One part of a name between dots, such as google in dns.google.com, written with its length in front.
      - term: big-endian
        meaning: Writing a number that takes several bytes with its most significant byte first. DNS writes every number this way.
      - term: UDP
        meaning: A way to send single messages, called datagrams, with no connection. A datagram can be lost, and nothing resends it.
      - term: root server
        meaning: One of the servers at the top of DNS. It does not know most addresses, but knows who to ask next.

milestones:
  # ------------------------------------------------------------------------------------------
  - title: Build the query
    summary: Encode the name, pack the header with its ID, flags and counts, and check the bytes against the page.
    concepts: [dns-message-format, byte-order, bit-packing]
    steps:
      - title: Encode the name
        minutes: 10
        think:
          kind: predict
          prompt: >-
            Your resolver writes the name dns.google.com into the question of a query, as length-prefixed labels
            ending with a zero byte. How many bytes does the encoded name take? Answer with one number.
          key:
            match: number_exact
            expected: 16
            derivation: >-
              The labels are dns, google and com. Each costs one length byte plus its letters, so 1 + 3, 1 + 6 and
              1 + 3, which is 15, and the zero byte at the end makes 16. The proof encodes the name into a Buffer and
              takes its length. Proof script output: 16.
        build:
          prompt: >-
            Write a routine that encodes a host name as labels, each preceded by its length, followed by a zero byte.
            For dns.google.com you should get the byte 3, then dns, the byte 6, then google, the byte 3, then com, and
            the zero byte.
        hints:
          hint: Count what goes in front of each label as well as its letters, and remember how a name ends.
          example: >-
            On a shelf of boxes, each box gets a tag saying how many items are inside, and an empty box tagged zero
            marks the end of the shelf.

      - title: Set the flags
        minutes: 15
        think:
          kind: predict
          prompt: >-
            The 16-bit flags field is sent as two bytes, high byte first. Reading the first byte from its leftmost bit,
            it holds QR as one bit, the opcode as four bits, and then AA, TC and RD as one bit each. A query has only
            recursion desired, RD, set. What is the value of the first flags byte? Answer with one decimal number.
          key:
            match: number_exact
            expected: 1
            derivation: >-
              QR takes the top bit, the opcode the next four, then AA and TC, so RD is the last, lowest bit of the
              first byte. With only RD set, that byte is 00000001 in binary, which is 1, and the second byte is 0. The
              proof packs the bits into a Buffer and reads the byte back. Proof script output: 1.
        build:
          prompt: >-
            Build the 12-byte header: the ID 22, the flags with recursion desired set, a question count of 1 and zero
            for the answer, authority and additional counts, each written as two bytes, high byte first. In hex the
            header should read 00 16 01 00 00 01 00 00 00 00 00 00.
        hints:
          hint: Write out the eight bits of the first byte in the order given, and see where RD lands.
          example: >-
            In a row of eight light switches, the one on the far right counts for 1 when it is on, the next one for 2,
            the next for 4, and so on up to 128 on the far left.

      - title: Put the query together
        minutes: 10
        think:
          kind: predict
          prompt: >-
            The full query for dns.google.com is the header, then the question: the encoded name, a two-byte type and
            a two-byte class. The answer, authority and additional sections are empty. How many bytes long is the
            whole query? Answer with the total only.
          key:
            match: number_exact
            expected: 32
            derivation: >-
              The header is always 12 bytes. The name dns.google.com encodes to 16 bytes, and the type and class add 2
              each. 12 + 16 + 2 + 2 is 32. The proof builds the query in a Buffer, checks that its hex is exactly the
              query shown on the challenge page, and takes its length. Proof script output: 32.
        build:
          prompt: >-
            Append the question: the encoded name, the type 1 for an A record and the class 1 for internet, each
            number as two bytes, high byte first. Print the whole query as hex and compare it digit by digit with the
            query given on the challenge page for dns.google.com with the ID 22.
        hints:
          hint: Add up the parts one by one, starting with the size of the header, which never changes.
          example: >-
            A parcel's weight is the box, plus the contents, plus the label, each weighed on its own and then added.

      - title: Check the byte order
        minutes: 15
        think:
          kind: spot_bug
          prompt: >-
            This code builds a query, but the server ignores it or replies with an error. Find the two problems and
            say how to fix them.
          snippet: |-
            function append_u16(out, n):
                append_byte(out, n % 256)
                append_byte(out, n / 256)

            append_u16(out, id)
            append_u16(out, flags)
            append_u16(out, 1)
            append_u16(out, 0)
            append_u16(out, 0)
            append_u16(out, 0)
            for label in split(name, "."):
                append_byte(out, length(label))
                append_text(out, label)
            append_u16(out, 1)
            append_u16(out, 1)
          rubric:
            - id: p1
              point: "append_u16 writes the low byte first, but DNS numbers are big-endian, so the high byte must come first"
            - id: p2
              point: "With the bytes swapped, the ID 22 goes out as 16 00 in hex and the question count reads as 256"
            - id: p3
              point: "The name has no zero byte after its last label, so the server reads the type bytes as another label"
            - id: p4
              point: "The fix is to write the high byte first and to append a zero byte after the labels, before the type and class"
        build:
          prompt: >-
            Add a test that builds the query for dns.google.com with the ID 22 and compares it with the page's hex, so
            a byte order or terminator mistake fails at once.
        hints:
          hint: Write out the two bytes this routine produces for the number 22, and compare them with the header the page shows.
          example: >-
            Writing a date as day then month, for a reader who expects month then day, turns the 3rd of April into
            the 4th of March.
    teach_back:
      prompt: >-
        Explain how your resolver turns the name dns.google.com and the ID 22 into the bytes of a query, and why each
        number and flag is written the way it is.
      rubric:
        - id: t1
          concept: dns-message-format
          point: "The query is a 12-byte header with the ID, the flags and four counts, then a question holding the name as length-prefixed labels ending in a zero byte, a type and a class"
        - id: t2
          concept: byte-order
          point: "Every number is big-endian, high byte first, so the ID 22 goes out as 00 16 in hex"
        - id: t3
          concept: bit-packing
          point: "Recursion desired is a single bit, the lowest of the first flags byte, so setting only it makes the flags 01 00 in hex"

  # ------------------------------------------------------------------------------------------
  - title: Send it and read the reply
    summary: Send the query over UDP, check the reply's header, and decode its names and addresses.
    concepts: [udp-datagrams, bit-packing, dns-message-format, dns-name-compression]
    steps:
      - title: Send over UDP
        minutes: 15
        think:
          kind: explain
          prompt: >-
            Your resolver sends the query to 8.8.8.8 on port 53 over UDP and then reads. Explain what UDP does and does
            not promise here, and what the resolver should check and do as a result.
          rubric:
            - id: p1
              point: "One read returns one whole datagram, so the reply arrives as a single message and needs no framing"
            - id: p2
              point: "A datagram can be lost and nothing resends it, so the resolver needs a timeout and then resends the query or tries another server"
            - id: p3
              point: "It checks that the reply's ID matches the ID it sent, and ignores a datagram that does not match"
        build:
          prompt: >-
            Open a UDP socket, send the query to 8.8.8.8 on port 53, read one datagram and print it as hex. Check that
            its first two bytes are 00 16, the ID you sent, and stop with an error if no reply comes within a few
            seconds.
        hints:
          hint: Compare it with TCP. Who resends a lost packet, and who decides where a message ends?
          example: >-
            A postcard arrives whole or not at all. If no answer comes back, you send another, and you check the
            reply is about the card you sent.

      - title: Read the header
        minutes: 15
        think:
          kind: spot_bug
          prompt: >-
            This code reads the header of the page's sample reply, whose first four bytes are 00 16 80 80 in hex. It
            reports the wrong ID and says the message is not a response. Find the problems.
          snippet: |-
            id = reply[0] + reply[1] * 256
            if reply[2] % 2 == 1:
                print("this is a response")
            else:
                print("not a response")
            answers = reply[7]
          rubric:
            - id: p1
              point: "The ID is read low byte first, so 00 16 comes out as 5632 instead of 22; it should be the first byte times 256 plus the second"
            - id: p2
              point: "QR is the top bit of the first flags byte, worth 128, not the lowest bit, which is recursion desired"
            - id: p3
              point: "The answer count uses only its second byte, so a count above 255 would be wrong; both bytes are needed, high byte first"
        build:
          prompt: >-
            Parse the 12-byte header of the reply and print the ID, whether QR marks it as a response, and the four
            counts. The sample reply on the page should give the ID 22, 1 question, 2 answers, 0 authority records and
            0 additional records.
        hints:
          hint: Write the first flags byte out as eight bits. Which of them is QR, and which is RD?
          example: >-
            In the number 47 the 4 is worth ten times the 7 because it comes first. DNS writes its two-byte numbers
            the same way, the first byte worth 256 times the second.

      - title: Follow a pointer
        minutes: 10
        think:
          kind: predict
          prompt: >-
            While reading a name, your parser meets the byte 192 followed by the byte 28, which are c0 and 1c in hex.
            The top two bits of 192 are both set. At which offset in the message does the rest of the name start?
            Answer with one decimal number.
          key:
            match: number_exact
            expected: 28
            derivation: >-
              Two set top bits mark a compression pointer, and the other 14 bits of the two bytes give the offset. 192
              is 11000000 in binary, so once the two flag bits are removed the first byte adds nothing, and the offset
              is the second byte, 28. Taking all 16 bits as a number would give the wrong 49180. Proof script output:
              28.
        build:
          prompt: >-
            Decode names in the reply, joining labels with dots, and follow a pointer whenever a length byte has its
            top two bits set. The page's reply uses c0 0c, a pointer to offset 12, where the name in the question
            starts.
        hints:
          hint: Of the 16 bits in the two bytes, two only say this is a pointer. What do the other 14 say?
          example: >-
            A footnote mark tells you the text continues somewhere else, and the number beside it says exactly where.

      - title: Read the answers
        minutes: 15
        think:
          kind: trace
          prompt: >-
            In the sample reply, the first answer record begins with the two bytes c0 0c, a pointer to the name
            dns.google.com at offset 12. How many bytes does the name take up inside the answer record itself, before
            the type field starts? Answer with one number.
          key:
            match: number_exact
            expected: 2
            derivation: >-
              The pointer stands in for the whole name, so the record spends only the 2 pointer bytes on it. The 16
              bytes of dns.google.com live at offset 12 and are not repeated, and reading the record continues right
              after the pointer. The proof decodes the page's sample reply and measures where the type field starts.
              Proof script output: 2.
        build:
          prompt: >-
            After each answer's name, read the type, class, TTL, data length and data, and print an A record's data as
            four numbers joined by dots. The sample reply should give two answers for dns.google.com, each of type 1
            and class 1 with a TTL above zero, with the addresses 8.8.8.8 and 8.8.4.4.
        hints:
          hint: The pointer replaces the name in the record. How many bytes did the record itself spend on it?
          example: >-
            A note saying see page 12 takes a few words on this page, however long the text on page 12 is.
    teach_back:
      prompt: >-
        Explain how your resolver sends a query over UDP and turns the reply that comes back into names and
        addresses.
      rubric:
        - id: t1
          concept: udp-datagrams
          point: "It sends one datagram and reads one back whole, with a timeout and a retry because UDP may lose it, and it checks that the ID matches"
        - id: t2
          concept: bit-packing
          point: "It checks the QR bit, the top bit of the flags, to confirm that the message is a response"
        - id: t3
          concept: dns-message-format
          point: "It reads the counts in the header, passes over the question, then reads each answer's name, type, class, TTL, data length and data, where an A record's data is a 4-byte address"
        - id: t4
          concept: dns-name-compression
          point: "A length byte with its top two bits set starts a two-byte pointer whose other 14 bits give the offset of the rest of the name, and reading carries on right after the pointer"

  # ------------------------------------------------------------------------------------------
  - title: Resolve from the root
    summary: Ask a root server directly and follow referrals down to the server that knows the address.
    concepts: [iterative-resolution, bit-packing, dns-message-format]
    steps:
      - title: Ask a root server
        minutes: 10
        think:
          kind: predict
          prompt: >-
            Your resolver now sends its query straight to a root server, such as 198.41.0.4, and will follow the
            referrals itself instead of asking one server to do the whole lookup. What should the recursion desired
            bit be in this query? Answer with 0 or 1.
          key:
            match: number_exact
            expected: 0
            derivation: >-
              Recursion desired asks the server to do the whole lookup for you. Here the resolver does that work itself,
              and root and authoritative servers do not offer recursion anyway, so the bit is cleared and the flags are
              00 00, as the page asks. The proof builds the header for iterative mode in a Buffer and reads the bit
              back. Proof script output: 0.
        build:
          prompt: >-
            Set the flags to zero and send the query for dns.google.com to the root server 198.41.0.4. Print the
            reply's counts and sections: it should hold no answers, NS records for the com servers in the authority
            section, and usually their addresses in the additional section.
        hints:
          hint: Who is doing the work of following the chain now, your resolver or the server you ask?
          example: >-
            If you ask a librarian to find a book for you, you say so. If you only want to know which floor to try
            next, you do not ask them to fetch it.

      - title: Follow the referrals
        minutes: 15
        think:
          kind: trace
          prompt: >-
            Your resolver looks up www.example.org with no cache, starting every lookup at the root. The root refers it
            to the org servers and gives their addresses. An org server refers it to the server ns1.example.net but
            gives no address for it. Looking up ns1.example.net works the usual way: the root refers to net with
            addresses, a net server refers to example.net with addresses, and that server returns the address.
            Finally ns1.example.net returns the address of www.example.org. How many queries does the resolver send in
            all? Answer with one number.
          key:
            match: number_exact
            expected: 6
            derivation: >-
              The main lookup asks the root (1) and an org server (2). The referral names ns1.example.net without an
              address, so a side lookup starts at the root: the root (3), a net server (4) and the example.net server
              (5), which returns the address of ns1.example.net. Asking that server (6) gives the address of
              www.example.org. The proof walks a small model of these servers and counts the queries. Proof script
              output: 6.
        build:
          prompt: >-
            Loop: send the query to the current server, and if the answer section holds an A record, print the address
            and stop. Otherwise take a name server from the authority section, find its address in the additional
            section, and ask it next. Print each server you query. For dns.google.com you should see 198.41.0.4, then
            a com server such as 192.12.94.30, then a google.com server such as 216.239.34.10, and finally the address
            8.8.8.8.
        hints:
          hint: When a referral gives a server's name but not its address, what must happen before you can ask it?
          example: >-
            Told to ask Sam at the post office, you first have to find out where the post office is before you can
            ask Sam anything.

      - title: Handle every kind of referral
        minutes: 15
        think:
          kind: spot_bug
          prompt: >-
            This loop resolves some names but fails on others. Find the problems and say how to fix them.
          snippet: |-
            server = "198.41.0.4"
            while true:
                reply = ask(server, name)
                if reply.answers is not empty:
                    return reply.answers[0].data
                server = reply.authority[0].data
          rubric:
            - id: p1
              point: "An NS record in the authority section holds a server's name, not its address, so it cannot be used directly as the next server"
            - id: p2
              point: "The address should come from the A record for that name in the additional section, and when there is none, the server's name must be resolved from the root first"
            - id: p3
              point: "There is no limit on the number of queries and no check for a reply with an error or an empty authority section, so it can loop forever or crash"
        build:
          prompt: >-
            Handle a referral whose name server has no address in the additional section by resolving that server's
            name from the root first, then carry on. Stop with an error after a fixed number of queries, or when a
            reply reports that the name does not exist.
        hints:
          hint: Look at what kind of value the authority section holds, and ask whether the loop can ever give up.
          example: >-
            A forwarding note that says ask the town hall is no use until you look up the town hall's address, and
            someone who follows notes forever with no limit may walk in circles.
    teach_back:
      prompt: >-
        Explain how your resolver finds the address of any name starting from a root server, and how it reads each
        reply to decide what to do next.
      rubric:
        - id: t1
          concept: iterative-resolution
          point: "It asks a root server, which refers it to the top-level domain's servers, which refer it to the domain's authoritative servers, which return the address"
        - id: t2
          concept: bit-packing
          point: "It clears the recursion desired bit, because it follows the referrals itself and these servers do not resolve for it"
        - id: t3
          concept: dns-message-format
          point: "An A record in the answer section ends the search, while a referral puts NS records in the authority section and, when given, their addresses in the additional section"
        - id: t4
          concept: iterative-resolution
          point: "When a referral names a server without its address, it resolves that server's name first and then carries on"
