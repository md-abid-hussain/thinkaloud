stage0:
  summary: "You build Bitcask, a key-value store made of a small library that holds the data and a command-line tool on
    top that sets, gets and deletes keys and can tidy up old data. Keys and values go in from the command line, and a
    get prints the latest value stored for that key, or a not-found reply if the key is missing or was deleted. The
    store keeps its data in a folder of files, and each command runs as a new process, so anything that must survive
    has to be on disk before the process exits. The hard part is that nothing is overwritten: every change is added to
    the end of a log, so old values pile up, and a delete is itself a record that must still count after a restart.
    Finding the latest value quickly means keeping an index of where each key sits, and that index has to be rebuilt
    from the files every time the store starts, while a crash that stops a write halfway must not spoil the rest of
    the data."
  questions:
    - id: p-what
      kind: what
      prompt: "You set a key to one value, then set the same key to another, and get it in a later run. What comes back, and
        what does that tell you about what a key holds? "
      looks_for:
        - the get returns the most recent value set for that key
        - a key holds one value at a time, so a newer set replaces the older one
        - the stored data survives the end of the run that wrote it
    - id: p-why
      kind: why
      prompt: A team wants a key-value store that keeps user sessions through restarts. Why would they build it around a log
        of changes, and where else do logs like this sit underneath real systems?
      looks_for:
        - a log written to disk keeps data safe across restarts and crashes
        - appending to the end of a file is much cheaper than rewriting data in place
        - databases, message queues and file systems all use logs underneath
    - id: p-how
      kind: how
      prompt: The data is far too big to fit in memory, and a user asks for one key. How would you find that key's latest
        value without reading every file?
      looks_for:
        - keep a map in memory from each key to where its latest value sits on disk
        - read only that one spot in the file instead of scanning everything
        - build the map again from the files when the store starts
questions:
  - id: s1-q1
    step: s1
    concept: durability
    prompt: Your set command prints OK, and the next run finds the key. Then the machine loses power a moment after the
      set returned. Was the write saved, and why?
    looks_for:
      - The kernel keeps written bytes in memory and writes them to the disk later
      - Exiting the process is safe because the kernel still holds the data, but a power cut is not
      - Forcing the bytes onto the device costs time, so how often to flush is a choice
  - id: s2-q2
    step: s2
    concept: append-only-log
    prompt: A teammate changes set so that an update overwrites the old record in place, to save space. What goes wrong if
      the power fails halfway through that write, and why does appending avoid the problem?
    looks_for:
      - The old value is damaged while the new one is only partly written, so both can be lost
      - Appending never touches existing bytes, so a crash can only damage the last record
      - The new value may not fit in the old space anyway
  - id: s2-q3
    step: s2
    concept: record-framing
    prompt: A user sets a value that contains a newline, and the next run reads garbage after it. Why does the reader lose
      its place, and what framing would stop that?
    looks_for:
      - Separators can appear inside the data, so the reader can't tell a boundary from content
      - A length prefix tells the reader exactly how many bytes to take
      - Lengths are counted in bytes, so a multibyte character still fits its stated length
  - id: s2-q4
    step: s2
    concept: segments-rotation
    prompt: A teammate suggests fixing a key's old record inside an earlier, closed file, so the store keeps fewer files.
      Why is that a bad idea?
    looks_for:
      - Closed files never change, so they can be read or copied without locks while writes continue
      - Compaction can rewrite closed files while new writes go to the active file
      - An edit can resize a record and make every saved position into that file wrong
  - id: s3-q5
    step: s3
    concept: keydir-index
    prompt: The data files are named 1, 2 up to 10. A teammate's start-up sorts the names as text, so file 10 is read
      before file 2. A key is set in file 2 and set again in file 10, so what does the index hold after start-up, and
      why is it wrong?
    looks_for:
      - Start-up rebuilds the index by reading files from oldest to newest and keeping the last record seen per key
      - Text sorting puts file 10 before file 2, so the older value in file 2 wins
      - File ids must order by write time, which means comparing them as numbers
  - id: s4-q6
    step: s4
    concept: updates-tombstones
    prompt: A user sets the same key a thousand times, and every get returns the newest value, yet the data folder keeps
      growing. Why does the disk fill up, and what happens to the old records?
    looks_for:
      - Each set appends a new record and nothing overwrites the old ones
      - The index points only at the newest record, so the older ones are dead weight on disk
      - Only a later cleanup pass can reclaim that space
  - id: s5-q7
    step: s5
    concept: updates-tombstones
    prompt: A user stores an empty value for a key, and the next get prints (nil) as if the key were deleted. What's
      wrong, and where should the delete marker be stored?
    looks_for:
      - If a delete is marked by an empty value, a value the user really set looks the same
      - The marker belongs in the record's header, where no user value can imitate it
      - Reads must check the marker before they return any value
  - id: s6-q8
    step: s6
    concept: compaction-hint-files
    prompt: A merge is copying live records into new files when the power fails. Which files must be safely on disk before
      any old file is deleted, and what would go wrong if the order were reversed?
    looks_for:
      - New data files and their hint files must be written and flushed before any old file is deleted
      - A crash at any moment must leave a complete copy of every live key on disk
      - Deleting first can lose live data that existed only in the old files
  - id: s6-q9
    step: s6
    concept: crash-recovery
    prompt: The power fails halfway through an append, leaving a partial record at the end of the newest file. What should
      start-up do with those bytes, and what goes wrong if new records are appended after them?
    looks_for:
      - The record's checksum shows it is incomplete, so start-up drops it
      - The file is cut back to the last good record before any new append
      - Appending after the damage buries it between good records, so later reads can fail
  - id: s7-q10
    step: s7
    concept: single-writer
    prompt: Your server and a second copy of the tool both open the same data folder and both set keys. What goes wrong
      with the log, and how would you stop the second one from starting?
    looks_for:
      - Two writers can interleave records or disagree about where the end of the file is
      - Each index can point at bytes the other process has moved or rewritten
      - Take a lock on the folder in one atomic step, and decide what happens when a crash leaves it behind
