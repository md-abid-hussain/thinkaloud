stage0:
  summary: You will build a command-line tool that compares two text files and reports how the second differs from the
    first, much like the Unix diff. It takes two file paths and prints the lines that were removed from the first file
    and the lines that were added in the second, and it prints nothing when the files are the same. The unit of
    comparison is a whole line, so a changed line shows up as one removal followed by one addition. It looks like a
    simple line-by-line comparison, but matching lines by position breaks as soon as one line is inserted near the
    top, because every line below it appears to change. The real task is to find the largest set of lines the two
    files share in the same order, and treat everything else as a change, which gets expensive as the files grow.
  questions:
    - id: p-what
      kind: what
      prompt: The tool is given two text files and prints some lines with a minus mark and some with a plus mark. What does
        it take in and give back, and what does each mark tell you?
      looks_for:
        - two text files go in and a list of changes comes out
        - a minus mark means the line exists only in the original file
        - a plus mark means the line exists only in the new version
        - a changed line appears as a removal plus an addition
    - id: p-why
      kind: why
      prompt: Developers run comparisons like this many times a day, often without thinking about it. Where does comparing
        two versions of a file matter in real work, and why?
      looks_for:
        - reviewing changes before they are saved or merged into shared code
        - checking what an update or patch actually altered
        - version control systems use this to show history
        - a short list of changes is much faster to read than two full files
    - id: p-how
      kind: how
      prompt: Suppose you compare line one of one file with line one of the other, then line two with line two, and so on.
        What goes wrong if one new line is added near the top of the new file, and what would you try instead?
      looks_for:
        - position-by-position matching marks every later line as changed
        - the goal is to keep the lines the files share, in order
        - look for the largest set of shared lines kept in order, not necessarily adjacent
        - everything outside that shared set is a removal or an addition
questions:
  - id: s1-q1
    step: s1
    concept: lcs
    prompt: A teammate matches each character of the first string to the next equal character in the second string, moving
      forward only. On 'ABCD' and 'BCDA' it returns 'A', yet 'BCD' is common and longer. Why does that early match
      hurt, and what should it consider instead?
    looks_for:
      - the early match of A uses up the rest of the second string, ruling out BCD
      - a match is not always safe, because taking it can block a longer common result
      - the right method also considers skipping a character on either side and keeps the longer result
      - a subsequence keeps order but may skip items, so skipping must be allowed
  - id: s1-q2
    step: s1
    concept: dynamic-programming
    prompt: Your recursive LCS passes the short tests but takes minutes on two 40-character strings. It solves the same
      pairs of shorter strings over and over. Why does that grow so fast, and what fixes it?
    looks_for:
      - the recursion solves the same subproblems repeatedly
      - the number of calls multiplies at each level, so time grows exponentially
      - store each answer the first time it is worked out, and reuse it
      - with a table of prefixes, time becomes the product of the two lengths
  - id: s2-q3
    step: s2
    concept: lines-as-units
    prompt: A teammate says the tool should compare words instead of lines, because edits are usually small. Does the same
      algorithm still work, and what does choosing lines give you that words would not?
    looks_for:
      - the algorithm works on any sequence, so only the unit changes
      - words create many more items, making the output noisier and the table larger
      - people edit and review text line by line, so lines match how changes are read
      - a line is a meaningful unit of change, while words split changes into fragments
  - id: s3-q4
    step: s3
    concept: edit-script
    prompt: Your tool is correct, but its output lists an added line one place higher than the reference diff does. A
      teammate's test compares your output with the reference text, character for character, and fails. What's wrong
      with the test, and how should it check your output?
    looks_for:
      - more than one shortest diff can exist, and both can be correct
      - the test should apply your edit script to the first file and check it gives the second
      - it should also check the script is no longer than the reference's
      - exact text matching rejects valid answers
  - id: s4-q5
    step: s4
    concept: lines-as-units
    prompt: A file saved on Windows has an extra carriage return at the end of each line. Your tool now reports every line
      as changed, though only one word differs. Why does that happen, and how would you decide what counts as equal?
    looks_for:
      - the carriage return is part of the line's bytes, so the lines are not equal
      - decide whether line endings are content or noise, and state that choice
      - a last line with no newline is different from the same line with one
      - make the choice once, when the text is split into lines
  - id: s5-q6
    step: s5
    concept: large-inputs
    prompt: Two files of 100,000 lines differ in only five places, but your table still needs memory for every pair of
      lines. Which lines can you set aside before building the table, and why does the result stay correct?
    looks_for:
      - lines shared at the start and end of both files can be matched straight away
      - a line that appears in only one file cannot be part of the LCS, so it can be dropped
      - only the small middle that differs needs the table
      - matching the common ends first never loses a longest match
  - id: s5-q7
    step: s5
    concept: myers
    prompt: Git finishes quickly on two files that differ in a few lines, but your table-based tool takes far longer on
      the same pair. Why does Myers' method suit this case, and what is its cost tied to?
    looks_for:
      - it explores paths by how many edits they use, so few differences means little work
      - its time grows with the file size times the number of differences
      - the table does work for every cell, however similar the files are
      - the result is still a shortest diff, so the output keeps the same meaning
