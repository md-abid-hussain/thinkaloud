# Coding Challenges, Build your own duplicate file finder. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-duplicate-files . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-duplicate-files
  title: Build your own duplicate file finder
  source_url: https://codingchallenges.fyi/challenges/challenge-duplicate-files
  level: intermediate
  status: generated
  figure:
    kind: hash
  summary: A command-line tool that walks a folder tree, finds files with identical content by grouping on size, then
    MD5 digest, then a byte-by-byte check, skips small files on request, and lets you delete one copy of each
    duplicate after asking which.
  requirements:
    - List every file under the folder given on the command line, at any depth
    - Report files of the same size as potential duplicates, and hash only those
    - Report files with the same MD5 digest as probable duplicates, and confirm them byte by byte
    - Skip files smaller than the number of bytes given with --minsize
    - Ask which file of a duplicate set to delete, and keep every file on any answer that is not a listed number
  primer:
    what: A duplicate file finder looks through a folder, and every folder inside it at any depth, for files whose content
      is exactly the same, whatever they are called. It lists files only; folders themselves are not reported. You
      will build one called ccdupe that reports duplicate sets and can delete the extra copies.
    why: Copies pile up from downloads, backups and photo imports and waste disk space. Reading and comparing every file
      against every other one would take far too long, so the tool needs cheap tests that rule most files out before
      it reads any of them.
    example: "A folder holds notes.txt and copy.txt, both 6 bytes with the same text, todo.txt, also 6 bytes but different
      text, and photo.jpg at 2,000 bytes. No other file is 2,000 bytes, so the photo cannot have a duplicate and is
      never read. The three 6-byte files are hashed: notes and copy get the same digest and todo gets its own. Finally
      notes and copy are compared byte by byte and reported as duplicates."
    words:
      - term: duplicate
        meaning: Two or more files whose bytes are exactly the same, even if their names, folders or dates differ.
      - term: file size
        meaning: The number of bytes in a file. The file system keeps it, so it is known without reading the file.
      - term: digest
        meaning: A short fingerprint computed from every byte of a file, such as an MD5 hash. Equal files have equal digests.
      - term: MD5
        meaning: A fast digest of 128 bits. Fine for spotting likely copies, but two different files can be made to share one.
      - term: candidate
        meaning: A file that has not yet been ruled out as a duplicate and needs a closer check.
  restate_rubric:
    - id: r1
      point: The tool scans a folder and all its subfolders and reports files whose content is identical
    - id: r2
      point: "It narrows the candidates in stages: same size, then same digest, then the same bytes"
    - id: r3
      point: It can skip small files and offers to delete duplicates, asking before it removes anything
  reflection_prompt: In your own words, where does your tool spend its time on a big folder, and what would you change
    if it had to scan a million files every night?
  reference_tool: find and md5sum on the same folder, to check your file list and digests.
  done_when: ccdupe finds every duplicate in your test data at any depth, skips links and unreadable entries, hashes
    only files that share a size, confirms duplicates byte by byte, honours --minsize, reuses cached digests until a
    file changes, and never deletes a file without a valid choice; and your notes explain why size first, then digest,
    then bytes, in your own words.
  open_checks:
    - How your platform reports symbolic links and hard links, and whether two hard links to one file are reported as
      duplicates.
    - How precise your file system's modification times are, and whether an edit within the same second is caught by
      your cache.
    - How many files your tool actually hashes on a large real folder, compared with the total.
learning_map:
  - concept: recursive-file-walk
    where: ccdupe must find every file under a folder at any depth, without looping through links or stopping at the first
      folder it cannot read.
    explain_back:
      prompt: Your duplicate finder ran for hours on a home folder and reported the same files thousands of times, and on
        another machine it stopped at a protected folder. Explain what went wrong in each case and how a walker should
        behave.
      rubric:
        - id: e1
          point: A symbolic link can point back to a folder higher up, so following links can visit the same tree again and
            again
        - id: e2
          point: A walker should skip links, or remember the folders it has visited, so every folder is visited once
        - id: e3
          point: A folder or file that cannot be read should be reported and skipped, so one bad entry does not stop the whole
            scan
  - concept: candidate-filtering
    where: Files can only be duplicates if they have the same size, so you group by size first and hash only files that
      share a size.
    explain_back:
      prompt: A first version hashes every file on a disk of 200,000 photos and takes an hour. Explain how checking sizes
        first changes the work, and why it can never miss a real duplicate.
      rubric:
        - id: e1
          point: The size of each file is known without reading it, so grouping by size costs almost nothing
        - id: e2
          point: A file with a unique size cannot have a duplicate, so most files are ruled out without reading a byte
        - id: e3
          point: Identical files always have the same size, so the size check never throws away a real duplicate
        - id: e4
          point: Only the few files that share a size go on to the expensive hashing step
  - concept: time-space-complexity
    where: With thousands of files, comparing every file with every other is far too slow, while grouping keeps the work
      close to one pass over the files.
    explain_back:
      prompt: A teammate suggests comparing every file with every other file byte by byte. It works on a test folder of 20
        files. Explain what happens on a folder of 10,000 files, and why grouping is better.
      rubric:
        - id: e1
          point: "Comparing every pair grows with the square of the number of files: 20 files make 190 pairs, but 10,000 make
            almost 50 million"
        - id: e2
          point: Each comparison also reads both files, so the cost becomes huge
        - id: e3
          point: Grouping by size and then by digest looks at each file a small number of times, so the work grows roughly in
            line with the number of files
  - concept: content-digests
    where: Within a size group, an MD5 digest of each file separates most different files cheaply, and a byte-by-byte
      check confirms real duplicates.
    explain_back:
      prompt: Your tool reports two files as duplicates because their MD5 digests match, and offers to delete one. Explain
        when a matching MD5 is enough, when it is not, and what the tool should do before deleting.
      rubric:
        - id: e1
          point: Different digests prove the files differ, and equal digests mean they are very probably the same
        - id: e2
          point: MD5 is fine for spotting accidental duplicates, but people can deliberately make two different files with the
            same MD5
        - id: e3
          point: Before deleting, compare the two files byte by byte, which turns very probably into certainly
  - concept: streaming-constant-memory
    where: Some candidates are videos of several gigabytes, so you feed each file to the digest and to the byte comparison
      in fixed-size chunks.
    explain_back:
      prompt: Your digest step crashes with an out-of-memory error on a folder of large videos. Explain the likely cause and
        how hashing and comparing should read the files.
      rubric:
        - id: e1
          point: The tool probably reads each whole file into memory before hashing or comparing it
        - id: e2
          point: A digest can be computed by feeding the file in fixed-size chunks, so memory stays the same for any file size
        - id: e3
          point: Comparing two files byte by byte can also read both in matching chunks and stop at the first difference
  - concept: cache-invalidation
    where: Hashing is slow, so you cache each file's digest between runs, together with the size and modification time it
      was computed for.
    explain_back:
      prompt: Your cached digests make the second run fast, but after a user edits a file the tool still reports it as a
        duplicate of its old copy. Explain what the cache must store and check, and when you should not trust it.
      rubric:
        - id: e1
          point: A cached digest is only true for the content it was computed from
        - id: e2
          point: Store the size and modification time with each digest, and recompute the digest when either has changed
        - id: e3
          point: Times can be preserved or reset by tools, so before deleting anything, confirm the files directly instead of
            trusting the cache
  - concept: safe-destructive-actions
    where: ccdupe can delete files, so it shows each duplicate set, asks which file to delete, and keeps everything unless
      the answer is a listed number.
    explain_back:
      prompt: A user presses Enter by accident at the prompt, and another runs your tool from a script with no keyboard at
        all. Explain how the delete prompt should behave in both cases, and what must be checked just before deleting.
      rubric:
        - id: e1
          point: Anything other than a clear, valid choice, including an empty line or the end of input, must keep all the files
        - id: e2
          point: The prompt shows each file by its full path, so the user knows exactly what will be deleted
        - id: e3
          point: Just before deleting, check the file still exists and still matches the copy being kept, because it may have
            changed during the prompt
        - id: e4
          point: In a script with no person to ask, deletion should need an explicit option, and otherwise the tool refuses
  - concept: cli-subcommands
    where: ccdupe takes a folder and options such as --minsize, and reports bad input on standard error with a non-zero
      exit status.
    explain_back:
      prompt: A user runs ccdupe --minsize=ten on a folder. Explain what the tool should do, where the message goes, and why
        that matters to anyone calling it from a script.
      rubric:
        - id: e1
          point: The tool should reject a value that is not a whole number instead of guessing or ignoring it
        - id: e2
          point: The message goes to standard error, so the normal output stays clean for other programs
        - id: e3
          point: It exits with a non-zero status, so a script knows the run failed and does not trust empty output
milestones:
  - title: Walk the tree and group by size
    summary: Find every file at any depth, safely, and group the candidates by size.
    steps:
      - title: List every file
        minutes: 45
        build: "Make test data: twenty files of 100 random bytes, one of them copied to a twenty-first file, and subfolders at
          different depths with more copies. Make ccdupe take a folder and list every file under it."
        outcome: ccdupe lists every file in your test data, including those in the deepest subfolder, and the count matches
          what a find command reports for the same folder.
        concepts:
          - recursive-file-walk
        hints:
          hint: Decide whether you use recursion or a list of folders still to visit.
      - title: Walk safely
        minutes: 30
        build: Skip symbolic links, and report then skip any folder or file the tool cannot read, so one bad entry never stops
          the scan.
        outcome: With a link pointing to a parent folder and an unreadable folder added to the test data, the scan finishes,
          reports the unreadable folder on standard error, and lists each real file once.
        concepts:
          - recursive-file-walk
          - cli-subcommands
        hints:
          hint: Create the loop on purpose and watch what your walker does.
      - title: Group by size
        minutes: 30
        build: Record each file's path and size, and print a Potential duplicates group for every size shared by two or more
          files.
        outcome: On the test data every file appears in one size group, because they are all 100 bytes, and a file of a unique
          size appears in none.
        concepts:
          - candidate-filtering
          - time-space-complexity
        hints:
          hint: A map from size to a list of paths is enough.
  - title: Digests and the final proof
    summary: Hash only the candidates, in chunks, and confirm duplicates byte by byte.
    steps:
      - title: Group by digest
        minutes: 45
        build: Compute the MD5 digest of each file in a size group of two or more, and print a Probable duplicates group for
          each set of matching digests.
        outcome: On the test data only the original file and its copies share a digest, and files with unique sizes are never
          hashed.
        concepts:
          - content-digests
          - candidate-filtering
        hints:
          hint: Count how many files you hash; it should be far fewer than the total.
      - title: Hash big files
        minutes: 30
        build: Feed each file to the digest in fixed-size chunks, so memory use does not grow with the file.
        outcome: Hashing a generated file of several gigabytes gives the same digest as the md5sum tool, and memory use stays
          flat.
        concepts:
          - streaming-constant-memory
        hints:
          hint: Watch memory use while it runs.
      - title: Confirm byte by byte
        minutes: 45
        build: Compare every pair in a digest group byte by byte, reading both files in chunks, and print a Duplicates group
          for each set that matches completely.
        outcome: The original and its copies are reported as Duplicates, a test that hands the comparison two different files
          of the same size gets no match, and the comparison stops reading at the first difference.
        concepts:
          - content-digests
          - streaming-constant-memory
        hints:
          hint: Stop reading at the first byte that differs.
  - title: Options, caching and deleting
    summary: Add a minimum size, cache digests between runs, and delete with care.
    steps:
      - title: A minimum size
        minutes: 30
        build: Accept --minsize, for example --minsize=1000, and skip every file below that many bytes. Reject a value that is
          not a whole number.
        outcome: With --minsize=1000 the 100-byte test files are skipped, and --minsize=ten prints an error on standard error
          and exits non-zero.
        concepts:
          - cli-subcommands
        hints:
          hint: Validate the option before scanning anything.
      - title: Cache the digests
        minutes: 45
        build: Cache each file's digest between runs with the size and modification time it was computed for, and hash again
          when either changed.
        outcome: A second run on the same folder hashes nothing, and after you edit one file only that file is hashed again.
        concepts:
          - cache-invalidation
        hints:
          hint: Print how many files were hashed on each run.
      - title: Delete with care
        minutes: 45
        build: Show each duplicate set numbered from 1 with full paths, ask which file to delete, keep every file on any
          answer that is not a listed number, and check the file still matches before deleting it.
        outcome: Pressing Enter, typing a letter or ending the input keeps every file; typing a listed number deletes exactly
          that file and prints which one was removed.
        concepts:
          - safe-destructive-actions
        hints:
          hint: Try every wrong answer you can think of before trying a right one.
