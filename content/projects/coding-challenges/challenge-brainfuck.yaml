# Coding Challenges, Build your own Brainfuck interpreter. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-brainfuck . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-brainfuck
  title: Build your own Brainfuck interpreter
  source_url: https://codingchallenges.fyi/challenges/challenge-brainfuck
  level: intermediate
  status: generated
  figure:
    kind: tape
  summary: An interpreter for Brainfuck, a language of eight one-character commands that work on a tape of 30,000 byte
    cells. It starts as a REPL and a file runner, then compiles programs to bytecode for a small virtual machine and
    speeds it up with run-length merging and pattern rewrites, timed on a Mandelbrot program.
  requirements:
    - Start a REPL with no arguments, and run a program file when one is named
    - Run all eight commands on 30,000 cells that start at zero, ignoring every other character
    - Pair loop brackets correctly, including nested loops, and report unbalanced brackets
    - Compile the program to bytecode with comments removed and jump targets worked out, and run it on a virtual
      machine
    - Merge runs of the same command into one instruction, and turn common loops such as clearing a cell into single
      instructions
    - Time the Mandelbrot program at each stage and check that its picture never changes
  primer:
    what: Brainfuck is a tiny programming language with only eight commands, each a single character. A program works on a
      long row of 30,000 cells, each holding a number that starts at zero, and a data pointer that marks one cell as
      the current one. Plus and minus add or take one from the current cell, the greater-than and less-than signs move
      the pointer one cell right or left, a full stop prints the current cell as a character, and a comma reads one
      character into it. Square brackets make a loop that repeats its body while the current cell is not zero.
    why: "With so few commands you can write a working interpreter in an afternoon, and then spend the rest of the project
      on the ideas behind real language runtimes: compiling to bytecode, resolving jumps ahead of time, and optimising
      the instructions that run most often."
    example: Take the program plus, plus, greater-than, plus, plus, plus. The first two commands make the first cell 2,
      the greater-than moves the pointer to the second cell, and the three pluses make that cell 3. The program ends
      with the pointer on the second cell. Any letter, space or digit in the program would simply be skipped.
    words:
      - term: cell
        meaning: One slot on the tape, holding a small number. Usually a byte, from 0 to 255.
      - term: data pointer
        meaning: Which cell the commands currently work on. The greater-than and less-than commands move it.
      - term: program counter
        meaning: Which command of the program runs next. It normally moves forward by one, and brackets make it jump.
      - term: loop
        meaning: A body between square brackets that runs again and again until the current cell is zero at a bracket.
      - term: bytecode
        meaning: A compact list of instructions made from the source ahead of time, which a small virtual machine runs.
  restate_rubric:
    - id: r1
      point: The tool runs Brainfuck programs, from a REPL or from a file, on a tape of cells with a data pointer
    - id: r2
      point: It first interprets the source directly, then compiles it to bytecode that a small virtual machine runs
    - id: r3
      point: It adds optimisations such as merging repeated commands and replacing common loops, and measures the speedup on
        a Mandelbrot program
  reflection_prompt: In your own words, where did your interpreter spend its time at the start, which change gave the
    biggest speedup, and what would you try next?
  reference_tool: Your own first, simple interpreter, once it passes the challenge's test scripts. Any widely used
    Brainfuck interpreter with 30,000 wrapping byte cells also works.
  done_when: The REPL and the file runner work; Hello!, the test scripts and Mandelbrot give the expected output at
    every stage; unbalanced brackets are reported before anything runs; the optimised VM matches the first interpreter
    byte for byte on every program; and your notes hold a timing table for Mandelbrot across the stages and explain
    your memory-model choices.
  open_checks:
    - Whether the Mandelbrot program and the test scripts rely on cells wrapping from 255 to 0.
    - What the input command should do at the end of input for the programs you run, and what your choice breaks.
    - Whether any test program moves the pointer left of the first cell.
    - How much of your timing is start-up and compilation rather than running.
learning_map:
  - concept: interpreter-loop
    where: Your first ccbf reads the program one command at a time with a program counter, does what the command says to
      the tape, and moves on, skipping every character that is not a command.
    explain_back:
      prompt: Explain what a simple interpreter does on every turn of its main loop, using Brainfuck as the example, and why
        it is usually much slower than the same program compiled ahead of time.
      rubric:
        - id: e1
          point: Each turn fetches the command at the program counter, works out what it is, carries it out on the tape or the
            pointers, and advances the counter, until the program ends
        - id: e2
          point: The fetching and deciding is paid again for every command executed, including skipping comment characters, so a
            loop body is decoded afresh on every pass
        - id: e3
          point: Without preparation, a jump at a bracket means searching for the matching bracket each time
        - id: e4
          point: Compiling does the decoding and the searching once, before the program runs, so running only does the work
            itself
  - concept: tape-memory-model
    where: The program works on 30,000 cells that start at zero, a data pointer that moves left and right, and one byte
      per cell, so you choose what happens at the tape's ends and when a cell goes past 255 or below 0.
    explain_back:
      prompt: A Brainfuck program written for another interpreter prints garbage on yours. Explain which memory-model
        choices differ between interpreters, and how each can change what a program does.
      rubric:
        - id: e1
          point: "Cell size: one byte that wraps from 255 to 0 and from 0 to 255, or a larger cell that does not wrap; many
            programs rely on wrapping"
        - id: e2
          point: "Tape length, and what happens when the pointer moves past either end: an error, wrapping round, or growing the
            tape"
        - id: e3
          point: "What the input command does at the end of input: leave the cell alone, set it to 0, or set it to 255"
        - id: e4
          point: The fix is to pick the common conventions, such as 30,000 wrapping byte cells, and document every choice
  - concept: bracket-matching
    where: Loops are square brackets, so every opening bracket needs its partner, including nested loops. You pair them
      all with a stack before running, and refuse a program whose brackets do not balance.
    explain_back:
      prompt: Your interpreter scans forward for the matching bracket on every pass through a loop, and a program with long
        nested loops runs painfully slowly. Explain why, how pairing every bracket once before running fixes it, and
        how the same pass finds unbalanced brackets.
      rubric:
        - id: e1
          point: Scanning for the partner re-reads the loop body every time the loop runs, so the cost grows with the size of
            the loop multiplied by the number of passes
        - id: e2
          point: One pass with a stack pushes the position of each opening bracket and, at each closing bracket, pops its
            partner and records both positions as each other's jump target
        - id: e3
          point: At run time a jump is then a lookup in that table, with no searching
        - id: e4
          point: A closing bracket that finds an empty stack, or opening brackets left on the stack at the end, means the
            program is unbalanced, and it is reported with a position before anything runs
  - concept: bytecode-compilation
    where: Instead of interpreting the source text, ccbf compiles it to a list of instructions with comments removed and
      jump targets worked out, and a small virtual machine runs that list.
    explain_back:
      prompt: Explain what changes when an interpreter first compiles a program to bytecode and then runs the bytecode, and
        what an instruction can carry that the raw source text cannot.
      rubric:
        - id: e1
          point: "Compiling happens once: comments are dropped and each command becomes an instruction, so the virtual machine
            never reads text again"
        - id: e2
          point: An instruction can carry operands worked out ahead of time, such as a repeat count or the position of its
            matching bracket
        - id: e3
          point: "The virtual machine's loop becomes simpler and faster: fetch an instruction, act on it, with no searching or
            skipping"
        - id: e4
          point: Separating translating from running creates a place to improve the instruction list before it runs, which is
            where optimisation happens
  - concept: peephole-optimization
    where: You shrink the instruction list by merging runs of the same command and replacing common loop patterns, such as
      the clear-cell loop, with one instruction, checking that the output never changes.
    explain_back:
      prompt: Explain how merging runs of plus signs and recognising the clear-cell loop can make a program several times
        faster, and what you must check to be sure an optimisation never changes the output.
      rubric:
        - id: e1
          point: A run of the same command becomes one instruction with a count, so the machine does one step where it did many
        - id: e2
          point: A loop that only takes one from the current cell always ends with that cell at zero, so it can become a single
            set-to-zero instruction
        - id: e3
          point: A rewrite must be safe for every possible input and cell value, and jump targets must be worked out again after
            the list changes
        - id: e4
          point: You check it by running the same programs before and after the optimisation and comparing the output byte for
            byte
  - concept: benchmarking
    where: You time the Mandelbrot program after each stage, simple interpreter, bytecode and optimised bytecode, to see
      what each change actually bought.
    explain_back:
      prompt: One run of Mandelbrot suggests your optimised interpreter is three times faster than before. Explain how to
        measure the speed-up so that the number can be trusted.
      rubric:
        - id: e1
          point: Time several runs of each version and report a typical value, such as the median, rather than a single run
        - id: e2
          point: "Keep everything else the same: the machine, the program, the input, and no other heavy work running"
        - id: e3
          point: Check that both versions produced identical output, so you are timing the same work
        - id: e4
          point: Say what the time includes, such as start-up and compilation, and compare like with like
  - concept: differential-testing
    where: Each optimisation is checked by running the same programs on your first, simple interpreter and on the
      optimised one, and comparing their output.
    explain_back:
      prompt: Explain why the simple interpreter you wrote first is still valuable after you have built a much faster one,
        and how you would use it to test every new optimisation.
      rubric:
        - id: e1
          point: The simple interpreter is easy to trust because it does exactly what each command says, so it can act as the
            reference
        - id: e2
          point: Run the same programs, such as Hello!, the test scripts and Mandelbrot, through both and compare the output
            byte for byte
        - id: e3
          point: Any difference points straight at the optimisation that broke something
        - id: e4
          point: Keep a set of test programs that exercise nested loops, wrapping cells and the tape's edges, and add every
            program that ever exposed a bug
  - concept: cli-subcommands
    where: With no arguments ccbf starts a REPL, and with a file name it runs the file. A missing file or unbalanced
      brackets are reported on standard error with a non-zero exit status.
    explain_back:
      prompt: Explain how one program can act both as a REPL and as a file runner, and what each mode should do when the
        code it is given has unbalanced brackets.
      rubric:
        - id: e1
          point: "The arguments decide the mode: with none, the program loops reading and running lines typed by the user; with
            a file name, it reads and runs the file once"
        - id: e2
          point: In the REPL a bad line is reported and the session carries on, so the user can try again
        - id: e3
          point: When running a file, the program prints a message with the position on standard error and exits with a non-zero
            status without running anything
        - id: e4
          point: The Brainfuck program's own output goes to standard output, so it can be piped into other tools
milestones:
  - title: A REPL and a direct interpreter
    summary: Read code from a REPL or a file, run the eight commands on a tape, and pair the brackets before running.
    steps:
      - title: Read code from a REPL or a file
        minutes: 30
        build: Make ccbf with no arguments start a REPL that reads a line and, for now, prints it back. With a file name, read
          the file instead, using a test.bf that holds the Hello! program from the challenge page.
        outcome: ccbf with no arguments echoes a typed line, ccbf test.bf prints the program, and a missing file gives a
          message on standard error and a non-zero exit status.
        concepts:
          - cli-subcommands
        hints:
          hint: Decide the mode from the arguments in one place, before anything else runs.
      - title: Run the commands
        minutes: 60
        build: Interpret the program one character at a time with 30,000 cells starting at zero, a program counter and a data
          pointer, skipping every character that is not one of the eight commands. Decide how cells wrap and what
          happens at the tape's ends, and write the choices down.
        outcome: The Hello! program prints Hello!, and the challenge's first test script gives the output the page shows.
        concepts:
          - interpreter-loop
          - tape-memory-model
        hints:
          hint: "Write down, for each of the eight commands, exactly what it changes: a cell, the data pointer or the program
            counter."
      - title: Pair the brackets
        minutes: 45
        build: Before running, pair every bracket with its partner using a stack, and refuse to run a program whose brackets
          do not balance, saying where the problem is.
        outcome: A program with a loop inside a loop runs correctly, and programs with an extra opening or closing bracket are
          refused with a position, before any output.
        concepts:
          - bracket-matching
        hints:
          hint: "Record both directions: each opening bracket needs to know its closer, and each closer its opener."
  - title: Bytecode and a virtual machine
    summary: Compile the program to bytecode with comments removed and jumps resolved, run it on a virtual machine, and
      time it.
    steps:
      - title: Compile to bytecode
        minutes: 45
        build: Design a small bytecode with one instruction for each of the eight commands, and write a compiler that turns a
          source file into a list of these instructions, dropping comments.
        outcome: The compiled Hello! program has exactly one instruction for each command character in the source, and none
          for comments.
        concepts:
          - bytecode-compilation
        hints:
          hint: An instruction is a kind plus, later, an operand. Leave room for the operand now.
      - title: Resolve the jumps
        minutes: 30
        build: Work out every jump target in the compiler with a stack, and store it with its bracket instruction, so taking a
          jump in the virtual machine is just setting the program counter.
        outcome: Every bracket instruction holds the position of its partner, and the compiler refuses unbalanced programs.
        concepts:
          - bracket-matching
          - bytecode-compilation
        hints:
          hint: The positions are now instruction positions, not character positions in the source.
      - title: Run it on a VM and time it
        minutes: 60
        build: Write a virtual machine with its own program counter and data pointer that runs the instruction list. Check
          Hello! and the test script, then time the Mandelbrot program on the first interpreter and on the VM.
        outcome: Hello! and the test script give the same output as before, the Mandelbrot picture is identical on both, and
          your notes record the time of each.
        concepts:
          - bytecode-compilation
          - benchmarking
          - differential-testing
        hints:
          hint: Run each timing several times and keep the middle value.
  - title: Optimising the instructions
    summary: Merge repeated commands, replace common loops with single instructions, and prove the output never changes.
    steps:
      - title: Merge repeated commands
        minutes: 45
        build: Merge each run of the same command into one instruction with a count, for plus, minus and both moves, and
          optionally for repeated output commands.
        outcome: Hello! shrinks from 70 commands to about 26 or 27 instructions with unchanged output, and the new Mandelbrot
          time is in your notes.
        concepts:
          - peephole-optimization
          - benchmarking
        hints:
          hint: Merge before resolving jumps, or every target moves.
      - title: Replace the clear-cell loop
        minutes: 45
        build: Recognise a loop that only takes one from the current cell, and, if your cells wrap, a loop that only adds one,
          and compile each to a single instruction that sets the cell to zero.
        outcome: Both loop patterns compile to one clear instruction, and Hello! and Mandelbrot give exactly the same output
          as before.
        concepts:
          - peephole-optimization
          - tape-memory-model
        hints:
          hint: Why does the adding loop also end at zero, and only when cells wrap?
      - title: Rewrite patterns safely
        minutes: 60
        build: Also compile the clear-and-move-right pattern into one instruction. Resolve jump targets only after all
          rewrites, then compare the output of your first interpreter and your optimised VM on every program you have,
          and time Mandelbrot once more.
        outcome: Every program gives byte-identical output on the first interpreter and the optimised VM, and your notes hold
          a timing table covering every stage.
        concepts:
          - peephole-optimization
          - differential-testing
          - benchmarking
        hints:
          hint: Make the comparison a script, so you can rerun it after every new rewrite.
