# Coding Challenges, Build your own spell checker using a Bloom filter. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-bloom . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-bloom
  title: Build your own spell checker using a Bloom filter
  source_url: https://codingchallenges.fyi/challenges/challenge-bloom
  level: beginner
  status: generated
  figure:
    kind: bits
  summary: A command-line spell checker that squeezes a dictionary into a Bloom filter, saves it as a small binary file
    with its own header, loads it again and reports which words are probably spelt wrong, without ever storing the
    word list itself.
  requirements:
    - Size a Bloom filter from the number of words and the false positive rate you accept
    - Insert words by setting the bits chosen by several hash functions, such as FNV-1a
    - Build the filter from a dictionary file with a build option
    - Save it as a CCBF file, a big-endian header followed by the packed bits, and load it back after checking the
      header
    - Check the words given as arguments and print the ones that are probably spelt wrong
  primer:
    what: A Bloom filter answers one question about a set, is this item in it, using only a row of bits and a few hash
      functions. Adding a word runs it through each hash function, and each one picks a bit to turn on. Checking a
      word looks at the same bits. You will use one to build a spell checker that keeps a whole dictionary in a file
      far smaller than the word list.
    why: Storing every word takes a lot of space. A Bloom filter takes a fraction of it and answers fast, at the price of
      sometimes saying yes to a word that was never added. For a spell checker that trade is often fine.
    example: Picture a filter of 8 bits, all zero. Adding the word sun, its two hash functions point at bits 0 and 3, so
      those two bits become one. Checking the word sky, its hashes point at bits 3 and 5. Bit 5 is still zero, so sky
      was definitely never added. A bit can be turned on by more than one word, and turning on a bit that is already
      one changes nothing.
    words:
      - term: bit array
        meaning: A row of bits, each zero or one, numbered from 0. A new filter starts with every bit at zero.
      - term: hash function
        meaning: A recipe that turns any word into a number, always the same number for the same word. FNV-1a is a simple,
          fast one.
      - term: false positive
        meaning: The filter saying a word is probably there when it was never added.
      - term: false negative
        meaning: The filter saying a word is missing when it was added. A Bloom filter never does this.
      - term: header
        meaning: The first bytes of a file, which say what kind of file it is and the numbers needed to read the rest.
      - term: big-endian
        meaning: Writing a number of several bytes with its most significant byte first, so 7 in two bytes is a zero byte,
          then a byte holding 7.
  restate_rubric:
    - id: r1
      point: It stores a dictionary as a Bloom filter, a bit array set by several hash functions, instead of the words
    - id: r2
      point: A build option reads a dictionary and saves the filter to a file with a header, and the checker loads that file
    - id: r3
      point: Words given on the command line are checked and the ones that are not in the filter are reported as spelt wrong
  reflection_prompt: In your own words, what did you give up by storing bits instead of words, what did you get for it,
    and how would you choose the size differently for a different use?
  done_when: The tool builds words.bf from a dictionary, saves it in the CCBF format with a correct big-endian header,
    refuses files that are not filters, never flags a dictionary word, and measures a false positive rate close to the
    one you sized for; and your notes explain why a Bloom filter has false positives but no false negatives, in your
    own words.
  open_checks:
    - Whether your dictionary has Windows line endings, capital letters or duplicate words, and how each affects the
      filter.
    - How close your measured false positive rate is to the sized rate, and how it changes if you add twice as many
      words.
    - Exactly how many bytes the version, hash count and bit count each take in the challenge's header layout.
learning_map:
  - concept: bloom-filter
    where: Your spell checker keeps a compact filter instead of the whole dictionary. It can wrongly accept a misspelling,
      but it never flags a real word.
    explain_back:
      prompt: A user complains that your spell checker missed a typo, and another asks whether it could ever flag a
        correctly spelt dictionary word. Answer both, using how a Bloom filter adds and looks up a word.
      rubric:
        - id: e1
          point: Adding a word sets the bits its hash functions choose, and a lookup checks those same bits
        - id: e2
          point: If any of the bits is zero the word was never added, so a dictionary word is never flagged, because its bits
            were all set
        - id: e3
          point: "A typo can find all its bits already set by other words, so the filter wrongly says it is probably a word: a
            false positive"
        - id: e4
          point: The filter stores no words, only bits, so it cannot tell which case it is in
  - concept: false-positive-rate
    where: You size the filter from the number of dictionary words and the error rate you accept, which fixes the bit
      count and the number of hash functions.
    explain_back:
      prompt: A teammate sized your filter for 100,000 words at 1 in 100, then loaded a dictionary of 500,000 words into it.
        Explain what happens to the false positive rate and how you would size it properly.
      rubric:
        - id: e1
          point: Each word sets several bits, so loading five times more words sets far more of the bits to one
        - id: e2
          point: A lookup for a word that was never added is then much more likely to find all its bits set, so the rate gets
            far worse than 1 in 100
        - id: e3
          point: The bit count and hash count must be computed from the real number of words and the chosen rate, about 9.6 bits
            per word and 7 hash functions for 1 in 100
        - id: e4
          point: You can check the result by measuring the rate on words you know were never added
  - concept: hash-functions
    where: Each word must map to the same k bit positions every time, spread evenly over the whole filter. You implement
      FNV-1a and derive k positions from it.
    explain_back:
      prompt: Your filter uses one hash function and takes k positions from it by adding 1, 2, 3 and so on to the first
        position. The measured false positive rate is far above what you sized for. Explain why, and a better way to
        get k positions.
      rubric:
        - id: e1
          point: "Consecutive positions are not independent: two words that collide on the first position collide on all of
            them"
        - id: e2
          point: The positions should look independent and spread evenly over the whole bit array
        - id: e3
          point: A standard approach combines two different hashes as the first plus i times the second, or uses differently
            seeded hashes
        - id: e4
          point: The same word must always give the same positions, so the hashes must not depend on anything but the word
  - concept: bit-packing
    where: The filter holds millions of bits, so you store eight bits per byte and find each bit by its byte and its
      position inside that byte.
    explain_back:
      prompt: Your first filter used one byte per bit and the saved file was eight times bigger than expected. Explain how
        to store and find bit number 21 when bits are packed eight to a byte.
      rubric:
        - id: e1
          point: Packing stores eight bits in each byte, so a filter of 4,000,000 bits takes 500,000 bytes
        - id: e2
          point: Bit 21 lives in byte 2, because 21 divided by 8 rounded down is 2, at position 5 inside it, the remainder
        - id: e3
          point: Setting or testing a bit changes or reads only that one bit with a mask, leaving the other seven untouched
        - id: e4
          point: The format must say which end of the byte counts as position 0
  - concept: file-header-format
    where: words.bf starts with the identifier CCBF and a version, then the hash count and bit count the loader needs
      before reading the bits.
    explain_back:
      prompt: Someone passes your spell checker an old filter file built with a different hash count, and another person
        passes it a text file. Explain what your header must contain and what the loader must check before trusting
        any bits.
      rubric:
        - id: e1
          point: The header starts with the fixed identifier CCBF and a version number, so the loader can recognise its own
            files
        - id: e2
          point: It also stores the hash count and the bit count used to build the filter, so lookups use the same settings
        - id: e3
          point: The loader checks the identifier and version first and refuses a file that does not match, and checks the file
            holds as many bytes as the bit count needs
  - concept: byte-order
    where: The header numbers are written big-endian, as the format says, so a hex dump shows them most significant byte
      first.
    explain_back:
      prompt: A hex dump of your words.bf shows 01 00 where the version should be, and the challenge author's file shows 00
        01. Explain what your writer did wrong, and why your own loader did not notice.
      rubric:
        - id: e1
          point: The format stores numbers big-endian, most significant byte first, so version 1 in two bytes is 00 01
        - id: e2
          point: Your writer used little-endian, which puts the low byte first and gives 01 00
        - id: e3
          point: Your loader read with the same wrong order, so it agreed with itself; only another program reveals the bug
  - concept: line-endings
    where: The dictionary is a text file with one word per line, and a file saved with Windows line endings leaves an
      invisible carriage return on every word.
    explain_back:
      prompt: After building the filter from a dictionary downloaded on Windows, your checker flags almost every word as
        misspelt, even hello. Explain the likely cause and the fix.
      rubric:
        - id: e1
          point: Windows text files end lines with a carriage return and a newline, not just a newline
        - id: e2
          point: Splitting on newline alone leaves a carriage return at the end of every word, so the filter holds hello plus an
            invisible character
        - id: e3
          point: Strip the carriage return, and surrounding spaces, from each word before adding or checking it
  - concept: round-trip-testing
    where: You check the saved file by saving a filter, loading it back, and confirming every dictionary word is still
      found.
    explain_back:
      prompt: Your save and load functions both run without errors. Explain how you would prove the saved file is right, and
        what number you would measure besides.
      rubric:
        - id: e1
          point: Build a filter, save it, load it back and check that every word that was added is still reported present
        - id: e2
          point: Compare the loaded bits or the answers with the original filter, not just that loading did not crash
        - id: e3
          point: Look up many random strings that were never added and compare the measured false positive rate with the rate
            you sized for
  - concept: cli-subcommands
    where: "One tool has two modes: a build option that makes words.bf, and a check mode that takes words as arguments and
      prints the misspelt ones."
    explain_back:
      prompt: A script runs your spell checker on a document and needs to know whether any word was misspelt, without
        reading every line of output. Explain what the tool should print, where, and what exit status it should
        return.
      rubric:
        - id: e1
          point: The misspelt words go to standard output, one per line, so other programs can use them
        - id: e2
          point: Errors such as a missing or invalid filter file go to standard error
        - id: e3
          point: "The exit status tells the script the result: zero when all is well, and a different status for errors, so
            scripts can act without parsing text"
milestones:
  - title: A filter in memory
    summary: Add and look up words with several hash functions over a packed bit array.
    steps:
      - title: Add and look up
        minutes: 45
        build: Create a filter with a given number of bits and hash functions. Adding a word sets the bit each hash picks;
          looking it up answers definitely not present if any bit is zero, and probably present if all are one. Test
          it by hand on a tiny filter first.
        outcome: Every word you added is always found, and on a tiny filter you can show a word you never added that is
          reported probably present.
        concepts:
          - bloom-filter
        hints:
          hint: Work through a 10-bit filter on paper before trusting the code.
      - title: Hash functions
        minutes: 45
        build: Implement FNV-1a yourself from its reference page, and derive k positions for a word within the bit count, for
          example by combining two hashes.
        outcome: Your FNV-1a gives the published test values from its reference page, and the same word always gives the same
          k positions.
        concepts:
          - hash-functions
        hints:
          hint: Check the hash against published test values before using it.
      - title: Pack the bits
        minutes: 30
        build: Store the bits eight to a byte and find each bit by its byte and its position in that byte.
        outcome: A filter of 4,000,000 bits takes 500,000 bytes, and setting one bit never changes its neighbours.
        concepts:
          - bit-packing
        hints:
          hint: Which byte holds bit n, and which position inside it?
  - title: Build from a dictionary and save
    summary: Size the filter, read the dictionary, and save it in the CCBF format.
    steps:
      - title: Size the filter
        minutes: 30
        build: Count the words in your dictionary, choose a false positive rate such as 1 in 100, and compute the bit count
          and hash count from the formulas on the Bloom filter reference page. Print both.
        outcome: For your dictionary the printed numbers match an online Bloom filter calculator for the same word count and
          rate.
        concepts:
          - false-positive-rate
        hints:
          hint: Use the real word count, not a guess.
      - title: Read the dictionary
        minutes: 30
        build: Add a build option that reads every word from the dictionary, one per line, and adds it, trimming line endings
          and spaces.
        outcome: Built from a dictionary with Windows line endings, the filter still finds hello and every other word you
          spot-check.
        concepts:
          - line-endings
          - cli-subcommands
        hints:
          hint: Print the length of the first word you read; is it longer than it looks?
      - title: Write the file
        minutes: 45
        build: "Save the filter to words.bf: the identifier CCBF, version 1, the hash count and the bit count, all big-endian,
          then the packed bits."
        outcome: A hex dump of the start of words.bf shows CCBF, then 00 01 for the version, then your hash count and bit
          count most significant byte first, and the file is far smaller than the dictionary.
        concepts:
          - file-header-format
          - byte-order
        hints:
          hint: Write the expected bytes on paper, then compare with the hex dump.
  - title: Load and check words
    summary: Load the saved filter safely, check words from the command line, and test what you built.
    steps:
      - title: Load the filter
        minutes: 30
        build: "Load words.bf: check the identifier and version before anything else, then read the hash count, bit count and
          bits. Refuse any file that fails the checks."
        outcome: Loading a text file or a truncated filter gives a clear error on standard error and a non-zero exit status,
          and loading your own file succeeds.
        concepts:
          - file-header-format
        hints:
          hint: What should happen if the file is shorter than the bit count requires?
      - title: Check words
        minutes: 30
        build: Without the build option, load words.bf, check every argument and print the words that are probably misspelt.
        outcome: Checking a mix of dictionary words and made-up words prints only the made-up ones, plus any real words your
          dictionary lacks.
        concepts:
          - bloom-filter
          - cli-subcommands
        hints:
          hint: A real word that is flagged means your dictionary lacks it, or a word was stored wrongly.
      - title: Test what you built
        minutes: 45
        build: Write tests that save and reload a filter, check every dictionary word against the loaded copy, and look up
          many random strings to measure the false positive rate.
        outcome: Every dictionary word is found after reloading, and the measured false positive rate is close to the rate you
          sized for.
        concepts:
          - round-trip-testing
          - false-positive-rate
        hints:
          hint: Use random strings long enough that they are very unlikely to be real words.
