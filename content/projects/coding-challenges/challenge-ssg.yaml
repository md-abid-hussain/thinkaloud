# Coding Challenges, Build your own static site generator. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-static-site-generator . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-ssg
  title: Build your own static site generator
  source_url: https://codingchallenges.fyi/challenges/challenge-ssg
  level: beginner
  status: generated
  figure:
    kind: pages
  summary: A command-line tool that turns a folder of Markdown pages and an HTML theme into a static website, and can
    serve the site locally and refresh it when files change.
  requirements:
    - Create a new site with a content folder and a starting page
    - Create themes and new pages from the command line
    - Fill the theme template with each page's title and rendered Markdown, and write the result to a public folder
    - Serve the site locally and update it when a page or the theme changes
  primer:
    what: A static site generator turns pages written in Markdown, a simple way of marking headings and paragraphs in
      plain text, into a finished website of HTML files. The look of the site lives in a theme, an HTML file with
      holes where each page's title and text go. You will build one with commands to create a site, a theme and pages,
      a build command, and a local server that refreshes when you edit.
    why: Most blogs and documentation sites are plain files on a server. Generating them once, instead of building each
      page when someone asks for it, makes them fast, cheap and hard to break.
    example: After you create a site called mysite, a theme called cc and a page called about, the folder holds
      content/index.md and content/about.md, written by the author, and themes/cc/index.html, written by the designer.
      Building fills the theme once per page and writes public/index.html and public/about.html, ready to publish.
    words:
      - term: Markdown
        meaning: Plain text with light marks, such as a hash at the start of a line for a heading, that converts to HTML.
      - term: theme
        meaning: The HTML that decides how every page looks, with placeholders for the page's own title and content.
      - term: placeholder
        meaning: A named hole in the theme, such as Title or Content in double curly braces, filled in for each page.
      - term: build
        meaning: The step that reads the content and the theme and writes the finished site into the public folder.
      - term: escaping
        meaning: Writing characters such as less-than and ampersand in a safe form, so the browser shows them as text.
      - term: live reload
        meaning: The browser refreshing by itself when the development server rebuilds the site after an edit.
  restate_rubric:
    - id: r1
      point: It builds a static site from Markdown pages and an HTML theme
    - id: r2
      point: It has commands to create a site, a theme and a page, and a build command that writes the finished HTML to a
        public folder
    - id: r3
      point: It can serve the site locally and refresh it when files change
  reflection_prompt: In your own words, how does your design keep content, theme and output separate, and what would you
    change if the site had a thousand pages?
  reference_tool: The CommonMark specification and its worked examples for rendered Markdown, and a browser's developer
    tools for what the development server sends.
  done_when: init, new theme, new page, build and serve all work; every content page builds into public with its title
    escaped and no stale files left behind; the development server serves the right content types, stays inside
    public, rebuilds once per save and reloads open pages; and the built site contains no development script. Your
    notes explain the layout, the single-pass template and your escaping rule in your own words.
  open_checks:
    - Which Markdown features beyond headings and paragraphs you will support, and which CommonMark examples you test
      against.
    - How many change events one save in your editor produces on your system.
    - Whether your browser shows a cached page after a reload, and which headers your development server should send
      to prevent it.
    - What a page name containing spaces or accented letters should become as a file name and an address.
learning_map:
  - concept: site-directory-layout
    where: "The folder structure is the data model: content holds the pages as Markdown, themes hold the templates, and
      public holds the generated site, so every command works from these conventions."
    explain_back:
      prompt: Explain why a static site generator uses fixed folder names such as content, themes and public, and what goes
        wrong when generated output is written into the same folder as the sources.
      rubric:
        - id: e1
          point: Each folder has one role, so no configuration is needed and a page's place in content decides its address on
            the site
        - id: e2
          point: People and tools always know where to look for sources, templates and output
        - id: e3
          point: Output mixed with sources gets picked up again as content by the next build, edited by hand and then
            overwritten, or committed by mistake
        - id: e4
          point: A separate output folder can be deleted and rebuilt from the sources at any time
  - concept: cli-subcommands
    where: init, new theme, new page, build and serve are subcommands of one tool, each with its own arguments, and an
      unknown command is reported on standard error with a non-zero exit status.
    explain_back:
      prompt: Explain how a tool with subcommands such as init, build and serve should behave when run with a mistyped
        command, with init on a folder that already exists, and with no arguments at all.
      rubric:
        - id: e1
          point: A mistyped command gets a message on standard error naming it, perhaps suggesting the closest real command, and
            a non-zero exit status
        - id: e2
          point: init on an existing folder refuses rather than overwriting the user's work, unless they explicitly ask to force
            it
        - id: e3
          point: With no arguments the tool prints its usage, listing the subcommands
        - id: e4
          point: Consistent behaviour and exit statuses make the tool safe to use in scripts
  - concept: untrusted-paths
    where: Page names given to new page, and paths requested from the development server, must stay inside the content and
      public folders.
    explain_back:
      prompt: Someone runs new page with a name that starts with two sets of dot-dot-slash, and later requests a path with
        dots from your development server. Explain the risk in each case, and the one check that prevents both.
      rubric:
        - id: e1
          point: The page name could make the tool write a file outside content, overwriting files that belong to the user
        - id: e2
          point: The request could make the server read and return files from outside public
        - id: e3
          point: The fix is to work out the final absolute path, after joining and normalising it, and check that it is still
            inside the allowed folder
        - id: e4
          point: Anything outside is refused, rather than trying to strip dots from the text, which attackers can get around
            with encodings
  - concept: markup-to-html
    where: "Each Markdown page is converted to HTML: headings, paragraphs, emphasis, links and lists each become HTML
      elements."
    explain_back:
      prompt: "Two Markdown tools turn the same page into different HTML: one makes a list, the other a plain paragraph.
        Explain why this happens, and how a specification such as CommonMark helps."
      rubric:
        - id: e1
          point: The original Markdown description was informal and left many cases open, such as indentation, blank lines and
            nesting, so tools made different choices
        - id: e2
          point: CommonMark defines exact rules with hundreds of worked examples, so conforming tools produce the same HTML
        - id: e3
          point: "Converting Markdown is parsing: block structure such as headings, paragraphs and lists first, then inline
            marks such as emphasis and links, not search and replace"
  - concept: template-substitution
    where: The theme's page template has placeholders for the title and the content in double braces, and the build fills
      them with each page's title and rendered HTML in one pass over the template.
    explain_back:
      prompt: A page whose text happens to mention the content placeholder, in double braces, shows up after the build with
        its body pasted in twice. Explain the bug, and how substituting in a single pass avoids it.
      rubric:
        - id: e1
          point: Replacing one placeholder after another re-scans text that has already been inserted, so a placeholder inside a
            page's own text gets replaced again
        - id: e2
          point: A single pass reads the template once and replaces each placeholder with its value, and never scans inserted
            values
        - id: e3
          point: An unknown placeholder should be reported, or at least made visible, so typos in a theme are caught
  - concept: output-escaping
    where: The title comes from the page's text and is inserted into HTML, so characters such as less-than and ampersand
      must be escaped. The rendered Markdown body is already HTML and goes in as it is.
    explain_back:
      prompt: A page titled with a less-than sign and an ampersand breaks your site's layout, and a guest author's title
        runs a script in readers' browsers. Explain both problems, and the rule that fixes them.
      rubric:
        - id: e1
          point: Characters that mean something in HTML, such as less-than, greater-than, ampersand and quotes, are read as
            markup when inserted raw, which breaks the page
        - id: e2
          point: A title containing a script tag is run by the browser, which is cross-site scripting
        - id: e3
          point: Text is escaped for the place it goes, replacing those characters with character references, in body text and
            in attribute values
        - id: e4
          point: Values that are meant to be HTML, such as rendered Markdown, are not escaped, so the code must know which
            values are text and which are markup
  - concept: build-pipeline
    where: build reads every content page, renders it, fills the template and writes it to public, after clearing old
      output, so the output always matches the sources.
    explain_back:
      prompt: After you rename about.md to team.md and build again, both about.html and team.html are on your site. Explain
        why, and how a build should work so that its output always matches the sources.
      rubric:
        - id: e1
          point: The build only writes files and never removes them, so the output of a renamed or deleted page stays behind
        - id: e2
          point: Clearing the output first, or tracking and deleting files with no source, makes the result depend only on the
            current sources
        - id: e3
          point: "A good build is repeatable: running it twice on the same sources gives the same output"
        - id: e4
          point: Splitting it into clear stages, read, convert, apply the template and write, makes it easy to debug and to
            rebuild only what changed
  - concept: static-file-serving
    where: serve maps / to index.html and other paths to files under public, with the right content type, and answers 404
      for missing files.
    explain_back:
      prompt: Your development server shows a page, but the browser downloads the stylesheet instead of applying it. Explain
        what the server forgot and how it should decide.
      rubric:
        - id: e1
          point: Every response needs a Content-Type header that matches the file, such as text/css for a stylesheet and
            text/html for a page
        - id: e2
          point: The type is chosen from the file's extension, using a table of media types
        - id: e3
          point: With a wrong or missing type the browser treats the file as unknown data, offers to download it, or refuses to
            apply it
        - id: e4
          point: A folder path maps to its index.html, and a missing file gets a 404
  - concept: file-watching
    where: serve watches the content and theme folders and rebuilds the site when a file changes.
    explain_back:
      prompt: Your watcher rebuilds the site three times every time you save one file, and sometimes misses changes in a new
        subfolder. Explain why, and how to make watching reliable.
      rubric:
        - id: e1
          point: Editors often save in several steps, such as writing a temporary file and renaming it, and each step produces
            its own change event
        - id: e2
          point: Waiting for a short quiet period after the last event, then rebuilding once, turns the burst into one rebuild
        - id: e3
          point: Operating-system watchers, such as inotify on Linux, watch specific folders, so new subfolders must be added as
            they appear, or the tool falls back to checking modification times
        - id: e4
          point: The output folder must be ignored, or each rebuild triggers the next
  - concept: live-reload-push
    where: After each rebuild the server tells open browser pages to reload, over a long-lived connection such as
      server-sent events, using a small script added only by the development server.
    explain_back:
      prompt: Explain how a development server can make an open browser tab reload when the site is rebuilt, why it cannot
        do so without a connection the page opened first, and why the reload script must not end up in the published
        site.
      rubric:
        - id: e1
          point: HTTP is request and response, so a server cannot contact a browser on its own
        - id: e2
          point: The page opens a long-lived connection, such as server-sent events or a WebSocket, and the server sends a
            message on it after each rebuild, which makes the page reload
        - id: e3
          point: The development server adds the reload script only when it serves pages, so the files written by build stay
            clean
        - id: e4
          point: A published page with the script would keep trying to reach a development server that does not exist
milestones:
  - title: Project layout and commands
    summary: Create a project, a theme and pages from the command line, with safe names and clear errors.
    steps:
      - title: Create a project
        minutes: 45
        build: Make init mysite create the project folder with content/index.md, and refuse to overwrite an existing folder.
          Then make new theme cc create themes/cc/index.html, and new page about create content/about.md.
        outcome: Those three commands create exactly those files, and init on a folder that already exists refuses with a
          message and a non-zero exit status.
        concepts:
          - site-directory-layout
          - cli-subcommands
        hints:
          hint: Write down the folder tree you expect after each command before you build it.
      - title: Subcommands and safe names
        minutes: 30
        build: Reject page names that would leave content, and make an unknown command print a message on standard error and
          exit with a non-zero status.
        outcome: A page name that climbs out of content with dots is refused and nothing is written, and a mistyped command
          prints a message on standard error and exits non-zero.
        concepts:
          - cli-subcommands
          - untrusted-paths
        hints:
          hint: Check the final resolved path, not the text the user typed.
  - title: Templates and build
    summary: Render Markdown, fill the template safely, and build the whole site into public.
    steps:
      - title: Render Markdown
        minutes: 45
        build: Render headings and paragraphs from a content page to HTML, then add any other Markdown features you want,
          checking each against examples from the CommonMark specification.
        outcome: A sample page with headings and paragraphs, plus each feature you added, renders to the HTML its CommonMark
          examples show.
        concepts:
          - markup-to-html
        hints:
          hint: Find the blocks first, such as headings and paragraphs, and only then look inside them for emphasis and links.
      - title: Fill the template
        minutes: 45
        build: Fill the title placeholder with the page's first top-level heading and the content placeholder with the
          rendered HTML, in a single pass over the template.
        outcome: A built page shows its own title and body, and a page whose text mentions a placeholder name is not
          substituted a second time.
        concepts:
          - template-substitution
        hints:
          hint: Write each value into the output once, and never look at it again.
      - title: Escape what you insert
        minutes: 30
        build: Escape the title before it goes into the template, and leave the rendered body as HTML.
        outcome: A title containing a less-than sign and an ampersand displays exactly as written, and a title containing a
          script tag shows as text and runs nothing.
        concepts:
          - output-escaping
        hints:
          hint: Which of the values you insert is text, and which is already HTML?
      - title: Build into public
        minutes: 45
        build: Make build render every content page into public, for example about.md into public/about.html, after clearing
          old output.
        outcome: build writes one HTML file per content page, and after you rename a page and build again, no stale file is
          left in public.
        concepts:
          - build-pipeline
          - site-directory-layout
        hints:
          hint: Delete the output from the last build before writing the new one, or track which outputs belong to which
            sources.
  - title: Development server and live reload
    summary: Serve the site locally, keep requests inside public, rebuild on change and reload the browser.
    steps:
      - title: Serve the public folder
        minutes: 45
        build: Serve public on a local port, mapping / to index.html, sending the right content type for each file and
          answering 404 for missing files.
        outcome: The site appears in a browser with its stylesheet applied, / shows index.html, and a missing page gets a 404.
        concepts:
          - static-file-serving
        hints:
          hint: Look at the response headers in the browser's developer tools.
      - title: Keep requests inside the folder
        minutes: 30
        build: Refuse any request whose resolved path is outside public.
        outcome: Requests that climb out of public with dots, plain or percent-encoded and sent with curl --path-as-is, never
          return a file from outside it.
        concepts:
          - untrusted-paths
        hints:
          hint: Decode the request path first, then resolve it, then check it.
      - title: Rebuild on change
        minutes: 45
        build: Rebuild the site when a content or theme file changes, waiting for a short quiet period so one save causes one
          rebuild.
        outcome: Saving a content or theme file triggers exactly one rebuild within a couple of seconds, and a new page in a
          new subfolder is picked up too.
        concepts:
          - file-watching
          - build-pipeline
        hints:
          hint: Log every change event you receive for one save, and look at how many there are.
      - title: Reload the browser
        minutes: 60
        build: Tell open browser pages to reload after each rebuild, for example over a server-sent events connection opened
          by a small script that the development server adds to the pages it serves.
        outcome: An open page reloads by itself after you save a content file, and the files written by build contain no
          reload script.
        concepts:
          - live-reload-push
        hints:
          hint: Who opens the connection, and who sends the message on it?
