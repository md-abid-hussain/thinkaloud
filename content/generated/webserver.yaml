stage0:
  summary: You build a small web server that answers HTTP requests directly on raw network connections, without a
    ready-made web framework. A browser or command-line client sends a plain-text request naming a method and a path,
    and your server replies with a status line, headers and a body. A connection is a stream of bytes with no built-in
    message boundaries, so the server has to work out where each request ends before it can answer. The server must
    also serve several clients at once, and it must turn each URL path into a file without letting any request reach
    beyond the folder it serves. The hard parts are reading a stream correctly, staying responsive under concurrent
    clients, and treating every path as untrusted input.
  questions:
    - id: p-what
      kind: what
      prompt: A browser asks your server for a page that is in its folder. What does the server take in, and what does it
        send back?
      looks_for:
        - A plain-text request arrives over a connection, with a method, a path and headers
        - The server replies with a status line, headers and a body on the same connection
        - The status code tells the client whether the request worked, and the body holds the page or an error message
    - id: p-why
      kind: why
      prompt: Why would someone build a web server from scratch when ready-made ones already run most of the web?
      looks_for:
        - Web servers sit behind almost every website and web API, so the protocol matters everywhere
        - Seeing the raw requests and responses makes it easier to debug real problems
        - Reading requests, sending responses and serving files work the same way under any framework
    - id: p-how
      kind: how
      prompt: Requests arrive as a stream of bytes with no marked end. How could your program tell where one request ends,
        and why isn't one read from the network enough?
      looks_for:
        - The headers end with an empty line, so the program keeps reading until it sees that line
        - One read can return only part of a request, or part of the next one
        - A request with a body states the body's length in a header, not by where reading happens to stop
questions:
  - id: s1-q1
    step: s1
    concept: socket-lifecycle
    prompt: Your server handles one client at a time. While it answers the first, a second client's connection completes,
      but its request gets no reply until the first is done. Where is that second connection waiting, and when does
      your server first see it?
    looks_for:
      - the operating system holds it in a queue on the listening socket
      - the listening socket stays open while a connected socket serves the first client
      - the server only sees it when it calls accept again after closing the first connection
      - the connection can complete before the program reads anything
  - id: s1-q2
    step: s1
    concept: http-message-format
    prompt: A client's request arrives in two pieces, so your first read returns the request line and half the headers.
      What should your server do before it parses anything, and why?
    looks_for:
      - keep reading until the empty line that ends the headers
      - TCP is a stream with no message boundaries, so one read can return part of a message
      - every line ends with CRLF, which marks where each line ends
  - id: s2-q3
    step: s2
    concept: url-to-file
    prompt: A browser asks for /notes/my%20file.html?v=2 and your server returns 404, though the file exists on disk. What
      steps turn that request target into a path on disk?
    looks_for:
      - the query string after the question mark is dropped
      - percent escapes such as %20 are decoded to the real character
      - the result is placed under the document root
      - a path that names a folder gets the default index file
  - id: s2-q4
    step: s2
    concept: status-and-headers
    prompt: Your server answers a missing file with a 200 status and a page saying not found. A crawler then indexes that
      page as real content. Why does the status code matter more than the page's words, and what should be sent
      instead?
    looks_for:
      - clients, caches and crawlers act on the code, not the text
      - the 4xx class says the request was wrong, so the answer is 404
      - the body is for people, while the code is for machines
      - a 200 for an error hides the failure from everything that reads codes
  - id: s3-q5
    step: s3
    concept: concurrency-models
    prompt: You build a single-thread event loop, and each response waits on a deliberate sleep. Three clients connect at
      the same moment. What happens to each one, and what would you change?
    looks_for:
      - the sleep blocks the one thread, so every client waits behind it
      - a blocking step must not run inside the loop
      - a thread or task per connection lets the others proceed
      - slow work can be handed off or waited on without blocking the loop
  - id: s3-q6
    step: s3
    concept: resource-limits
    prompt: A client sends one byte every ten seconds and never finishes its request. A per-read timeout doesn't stop it,
      so what would you set instead, and why?
    looks_for:
      - each byte resets a per-read timeout, so the client keeps the connection
      - a deadline on the whole request ends the wait
      - a cap on connections or threads stops the total from being unlimited
  - id: s4-q7
    step: s4
    concept: path-traversal
    prompt: A client sends a path with ....// in it. Your server first removes every ../ and then serves what remains, and
      the secret file still comes out. Why did the removal fail, and what should the check do instead?
    looks_for:
      - removing a sequence once can leave a new ../ behind
      - decode once, join to the root, and resolve to the real path with links followed
      - the real path must be the root or inside it, compared by whole folder names
      - anything else is refused without saying why
  - id: s5-q8
    step: s5
    concept: cgi
    prompt: Your server runs any executable file under the document root when a request names it. A visitor then makes it
      run a program that was never meant to be public. Why is that risky, and what rule should decide which files may
      run?
    looks_for:
      - the program runs with the server's rights on input the client controls
      - only files in a folder set aside for scripts may run
      - request data must never reach a shell command
      - static files are served as data and never executed
