    - step: s7
      check: partly
      why: The stub checks HEAD returns without waiting for a body and PATCH is sent; keep-alive and a trusted certificate
        need a manual look.
stage0:
  summary: You build a command-line tool that sends web requests the way curl does, but you write it directly on a
    network connection instead of using a ready-made library. You give it a URL, a method such as GET, DELETE, POST or
    PUT, and optionally a body and extra headers, and it prints what the server sends back. The URL names the server
    and the resource, and the tool must write the request as exact text and send it over the connection. What makes
    this harder than it looks is that the network delivers bytes in pieces with no built-in message boundaries, so the
    tool has to know where the server's reply ends. Each method also carries a promise about what the server may do,
    which matters when you choose one.
  questions:
    - id: p-what
      kind: what
      prompt: A teammate runs your tool with one URL and sees a block of text printed. What went in, what came out, and what
        is one exchange between the tool and the server?
      looks_for:
        - the input is a URL, plus options such as the method, a body and headers
        - the output is the server's reply, shown as its body and optionally its headers
        - one exchange is one request the tool sends and one reply it reads back
        - the URL tells the tool which server to contact and which resource to ask for
    - id: p-why
      kind: why
      prompt: A developer wants to check that a REST API accepts a new item before writing client code. Why would they use a
        tool like this instead of a browser?
      looks_for:
        - a browser mostly sends GET requests when it loads a page
        - this tool can send any method, with a body and custom headers
        - it is used to test and demonstrate APIs from the command line
        - its output can be read by scripts and other tools
    - id: p-how
      kind: how
      prompt: The server's reply arrives as a stream of bytes with no marked end. How would your tool know when the reply is
        finished?
      looks_for:
        - the bytes come in pieces, so one read may not be the whole reply
        - the tool keeps reading until it can tell the reply is complete
        - the server closing the connection is one signal that the reply has ended
        - the headers may state the size of the body, which is another signal
questions:
  - id: s1-q1
    step: s1
    concept: url-anatomy
    prompt: Your program gets http://localhost:8080/api/items?page=2#top. Which parts go into the request line, and which
      parts stay with the program?
    looks_for:
      - the path and query together form the request target
      - the fragment is never sent to the server
      - the port is used for the connection, not copied into the request line
      - dropping the query would fetch the wrong page
  - id: s1-q2
    step: s1
    concept: http-request
    prompt: Your program prints the request for a site on a shared server that hosts many sites, and the URL uses port
      8080. What must the request contain so the server answers for the right site, and what changes for the port?
    looks_for:
      - HTTP/1.1 requires a Host header in every request
      - one address often serves many sites, and the server picks by Host
      - the port goes in Host when it isn't the default
  - id: s2-q3
    step: s2
    concept: dns-and-connect
    prompt: Your client resolves a host name to two addresses, and the first one refuses the connection at once. What
      should it do next, and why isn't that first failure the end?
    looks_for:
      - try the remaining addresses in order
      - a refusal means nothing is listening at that address
      - a silent drop needs the client's own timeout
      - the name may map to IPv4 and IPv6 addresses
  - id: s2-q4
    step: s2
    concept: response-framing
    prompt: Your client reads once from the connection and prints what it got. Over a real network it shows only the start
      of the response, while a local test server works. Why, and how should it read?
    looks_for:
      - TCP is a stream with no message boundaries
      - one read can return only part of the response
      - read in a loop into a buffer until the server closes the connection
      - a local server often sends everything in one piece
  - id: s3-q5
    step: s3
    concept: output-streams
    prompt: A teammate pipes the program's output into a JSON formatter with verbose mode on. The formatter fails on the
      first line. What went wrong, and where should each kind of output go?
    looks_for:
      - verbose lines went to standard output along with the body
      - standard output must carry only the body
      - verbose lines and error messages belong on standard error
      - standard error still shows in the terminal
  - id: s4-q6
    step: s4
    concept: method-semantics
    prompt: Your script sends a DELETE for an item, and the connection drops before any reply. The script sends the same
      DELETE again. Why is that safe here, and why would the same retry be risky for a POST?
    looks_for:
      - DELETE is idempotent, so a repeat leaves the server in the same state
      - a repeat may get a not-found reply, which is harmless
      - POST may create something new each time, so a retry can duplicate it
      - a client should resend only what the method promises
  - id: s5-q7
    step: s5
    concept: http-request
    prompt: A teammate POSTs a JSON body with an accented letter, and the server reports broken JSON. Their Content-Length
      counts characters. What should it count, and why does the wrong count cut the body short?
    looks_for:
      - Content-Length counts bytes, not characters
      - an accented letter takes more than one byte in UTF-8
      - a count of characters is too small
      - the server stops reading early and the rest of the body breaks
  - id: s6-q8
    step: s6
    concept: method-semantics
    prompt: A client sends a PUT with only a name field to update a stored item, and the item loses its other fields. Why
      did that happen, and how does PUT differ from POST here?
    looks_for:
      - PUT replaces the target with the body sent
      - fields left out of the body are removed
      - POST hands the body to the server to process, so it may add or merge
      - a partial update needs the full item sent with PUT
  - id: s7-q9
    step: s7
    concept: response-framing
    prompt: Your client sends two requests over one connection, and the first reply is read until the server closes. The
      second request never gets an answer. What is wrong, and how should the client know where the first response
      ends?
    looks_for:
      - keep-alive means the server doesn't close after each response
      - waiting for a close that never comes hangs the client
      - Content-Length gives the body size in bytes
      - chunked coding ends the body with a zero-size piece
  - id: s7-q10
    step: s7
    concept: method-semantics
    prompt: A client sends HEAD to a URL and waits for a body. The reply has a Content-Length header but no body, so the
      client hangs. Why does the reply have no body, and what should the client do?
    looks_for:
      - HEAD asks only for the head, the same as GET without the body
      - the Content-Length describes the body that a GET would have sent
      - the client should stop after the headers
      - a reply to HEAD has no body to wait for
  - id: s7-q11
    step: s7
    concept: tls
    prompt: Your client fails a certificate check on an https site, and a teammate suggests turning checks off to make the
      error go away. What does that expose, and what should you check instead?
    looks_for:
      - the connection is still encrypted, but the client no longer knows who it talks to
      - an attacker in the middle could read or change the traffic
      - check that the certificate chains to a trusted authority and names the host
      - for a private authority, trust that authority rather than skipping checks
