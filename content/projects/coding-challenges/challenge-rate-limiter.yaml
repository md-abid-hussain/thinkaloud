# Coding Challenges, Build your own rate limiter. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-rate-limiter . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-rate-limiter
  title: Build your own rate limiter
  source_url: https://codingchallenges.fyi/challenges/challenge-rate-limiter
  level: intermediate
  status: generated
  figure:
    kind: bucket
  summary: A small HTTP service with a limited and an unlimited endpoint, protected in turn by a token bucket, a fixed
    window counter, a sliding window log and a sliding window counter, and finally by a limit shared between several
    servers through Redis.
  requirements:
    - Serve two endpoints, /limited and /unlimited, where only /limited is rate limited
    - Limit each client IP address with a token bucket of 10 tokens refilled at 1 token per second
    - Answer a rejected request with 429 Too Many Requests
    - Replace the token bucket with a fixed window counter whose windows are aligned to the clock
    - Implement a sliding window log and a sliding window counter, each with tests you design
    - Share one limit between two servers on different ports through a store such as Redis
  primer:
    what: A rate limiter sits in front of an API and decides, for each incoming request, whether the client has asked too
      often recently. If it has, the request is turned away with a status meaning too many requests, and the work
      behind the endpoint never runs. You will build one in four different ways and then make several servers share a
      single limit.
    why: Without a limit, one buggy script, one heavy user or one attacker can flood a service and slow it down for
      everyone. A limiter keeps each client to a fair share and lets the service survive sudden spikes.
    example: Picture a bucket for one client that holds at most 2 tokens and gains 1 token every second. The client sends
      3 requests at the same instant. The first two each take a token and are served, and the third finds the bucket
      empty and is rejected. A second later one token has appeared, so the client's next request is served again.
    words:
      - term: rate limiter
        meaning: The part of a service that counts each client's recent requests and rejects the ones over the limit.
      - term: token bucket
        meaning: A limiter where each request spends a token from a small store of tokens that refills at a steady pace.
      - term: window
        meaning: A stretch of time, such as one minute, in which requests are counted against the limit.
      - term: burst
        meaning: Many requests arriving close together, faster than the long-run allowed rate.
      - term: 429 Too Many Requests
        meaning: The HTTP status a server sends when it refuses a request because the client is over its limit.
      - term: shared store
        meaning: A database such as Redis that several servers read and update, so they all see the same counts.
  restate_rubric:
    - id: r1
      point: The service limits how many requests each client can make to one endpoint and leaves the other endpoint
        unlimited
    - id: r2
      point: "It implements several algorithms: a token bucket, a fixed window counter, a sliding window log and a sliding
        window counter"
    - id: r3
      point: A rejected request gets the status 429 Too Many Requests
    - id: r4
      point: In the end several servers enforce one shared limit by keeping the counts in a shared store such as Redis
  reflection_prompt: In your own words, which of your limiters would you put in front of a real API, what does it cost
    in memory and in fairness at window boundaries, and what would you change to run it on many servers?
  done_when: Each of the four algorithms protects /limited while /unlimited stays open, rejected requests get 429, the
    sliding window log has tests that control the clock, two servers enforce one shared limit through the store with
    expiring keys, and your notes compare the four algorithms on burst behaviour, memory and accuracy, in your own
    words.
  open_checks:
    - Where your HTTP library exposes the client address, and what it reports when the server runs behind a proxy.
    - Whether your store can set an expiry in the same atomic step as the first increment, or whether a key can be
      left without one.
    - "What your limiter should do when the shared store is unreachable: allow traffic or reject it."
    - Which clock your windows use, and what happens to them if the server clock jumps.
learning_map:
  - concept: token-bucket
    where: Your first limiter gives each client a bucket of 10 tokens that refills at 1 token per second. The capacity
      sets the largest burst and the refill rate sets the long-run average.
    explain_back:
      prompt: A public API promises clients "bursts of up to 20 requests, and 5 per second on average". Explain how a token
        bucket keeps both promises, and what a client sees if it sends 40 requests in one second after being quiet for
        a minute.
      rubric:
        - id: e1
          point: The capacity of 20 tokens sets the largest burst a client can send at once
        - id: e2
          point: The refill rate of 5 tokens per second sets the long-run average
        - id: e3
          point: Tokens beyond the capacity are thrown away, so a quiet minute saves up at most one full bucket
        - id: e4
          point: Of the 40 requests, about 20 are served from the full bucket, plus any refilled during that second, and the
            rest are rejected until tokens refill
  - concept: fixed-window-counter
    where: Your second limiter counts each client's requests in windows aligned to the clock, and the count starts over at
      every boundary.
    explain_back:
      prompt: A login endpoint allows 5 attempts per minute, using fixed windows that start on each whole minute. Explain
        how an attacker can make 10 attempts in two seconds, and why this design is still popular.
      rubric:
        - id: e1
          point: The count starts over at each window boundary, whatever happened just before it
        - id: e2
          point: Five attempts just before the boundary and five just after all pass, so twice the limit gets through in a
            moment
        - id: e3
          point: It stays popular because it needs only one small counter per client and window, which is cheap and simple
  - concept: sliding-window-log
    where: Your third limiter keeps the time of each accepted request and counts only the ones inside the last window.
    explain_back:
      prompt: Explain how a sliding window log guarantees that no one-minute stretch ever holds more than the limit, and
        what it costs when a busy client sends thousands of requests a minute.
      rubric:
        - id: e1
          point: It stores a timestamp for each accepted request
        - id: e2
          point: Before each decision it drops the timestamps older than the window and counts the rest, so the limit holds
            wherever the minute starts and there is no boundary burst
        - id: e3
          point: Memory and work grow with the limit and the traffic, because every accepted request keeps an entry until it
            ages out
        - id: e4
          point: Rejected requests must not be logged, or a client that keeps retrying stays blocked for good
  - concept: sliding-window-counter
    where: "Your fourth limiter estimates the last window from just two counts: the current fixed window and the previous
      one."
    explain_back:
      prompt: A sliding window counter keeps only two counts per client. Explain how it estimates the requests in the last
        minute, why the estimate is good enough in practice, and when it is wrong.
      rubric:
        - id: e1
          point: The estimate is the current window's count plus the previous window's count, weighted by how much of the
            previous window still overlaps the last minute
        - id: e2
          point: It assumes the previous window's requests were spread evenly across it
        - id: e3
          point: With constant memory per client it smooths out most of the boundary burst
        - id: e4
          point: It is wrong when the previous window's traffic was bunched at one end
  - concept: client-identity
    where: Your limiter keys each bucket on the client's IP address. The choice of key decides who shares a limit.
    explain_back:
      prompt: Your limiter keys on the client's IP address. Explain two ways this limits the wrong people or fails to stop
        an abuser, and what a better key is for an API with accounts.
      rubric:
        - id: e1
          point: Many people behind one office network, mobile carrier or proxy share an IP address and use up each other's
            limit
        - id: e2
          point: An abuser can spread requests across many addresses, or fake a forwarding header if the server trusts it
            blindly
        - id: e3
          point: Behind a load balancer the server sees the balancer's address unless it reads the forwarded client address from
            a proxy it trusts
        - id: e4
          point: For an API with accounts, key on the API key or user, and keep IP limits for anonymous traffic
  - concept: rate-limit-responses
    where: Only /limited is limited. A rejected request gets 429 Too Many Requests, and a good limiter tells the client
      when to try again.
    explain_back:
      prompt: A client keeps retrying the moment it is rate limited, and makes the overload worse. Explain what the server
        should send back, and what a well-behaved client does with it.
      rubric:
        - id: e1
          point: The status is 429 Too Many Requests, not a normal success or a server error
        - id: e2
          point: A Retry-After header tells the client how long to wait, in seconds or as a date
        - id: e3
          point: A well-behaved client waits, and backs off with growing, randomised delays instead of retrying at once
        - id: e4
          point: The limiter rejects before the expensive work behind the endpoint runs
  - concept: concurrent-connections
    where: Many requests are handled at the same time, so two of them can read the same bucket and both take its last token.
    explain_back:
      prompt: Two requests from the same client arrive at the same moment, and the bucket holds one token. Explain how both
        can be accepted, and how to prevent it.
      rubric:
        - id: e1
          point: Each request reads a count of 1, decides to accept, and writes 0
        - id: e2
          point: Reading, checking and writing are separate steps, so the two interleave and one update is lost
        - id: e3
          point: Make the read, check and write one indivisible step, with a lock per bucket or an atomic operation
  - concept: distributed-counters
    where: In the last milestone two servers share one limit by keeping their counts in a shared store.
    explain_back:
      prompt: You run the API on three servers behind a load balancer, each with its own in-memory limit of 100 requests a
        minute. Explain what limit a client really gets, and how a shared store fixes it without losing updates.
      rubric:
        - id: e1
          point: Each server counts on its own, so a client can get up to 300 a minute, depending on how the balancer spreads
            its requests
        - id: e2
          point: Moving the counts into one store that every server uses gives a single limit
        - id: e3
          point: Each update must be an atomic increment that returns the new value, not a read followed by a write, so two
            servers cannot both take the last slot
        - id: e4
          point: The store adds a network trip and becomes a dependency, so you must decide whether to allow or block traffic
            when it is down
  - concept: key-expiry
    where: Counts are stored under one key per client and window, and every key needs an expiry so old windows disappear.
    explain_back:
      prompt: Your shared store gains a new key for every client every minute. Explain why each key must expire, how long it
        should live for a sliding window counter, and what happens if you forget.
      rubric:
        - id: e1
          point: Without expiry the keys pile up for ever and the store's memory grows without limit
        - id: e2
          point: Set the expiry when the key is first created, so the store removes it by itself
        - id: e3
          point: A sliding window counter still reads the previous window, so each key must live for at least two windows
milestones:
  - title: Endpoints and the token bucket
    summary: Serve a limited and an unlimited endpoint, then protect the limited one with a token bucket per client.
    steps:
      - title: Two endpoints
        minutes: 30
        build: Write a small HTTP server on 127.0.0.1 port 8080 with two endpoints, /limited and /unlimited, each returning a
          short text of your choice.
        outcome: curl gets 200 and the expected text from both /limited and /unlimited.
        concepts:
          - rate-limit-responses
        hints:
          hint: Get both endpoints answering before you add any limiting.
      - title: A token bucket per client
        minutes: 60
        build: Give each client IP address its own bucket of 10 tokens, refilled at 1 token per second and never above 10.
          Each request to /limited takes one token.
        outcome: 15 quick calls to /limited serve the first 10 and reject the rest; after waiting 3 seconds, the next 3 calls
          are served.
        concepts:
          - token-bucket
          - client-identity
        hints:
          hint: You can refill with a timer, or work out the tokens earned from the time since the last request. Which needs
            less work per client?
          example: "A phone plan that earns one free message per hour, up to a cap, never needs a clock running per customer: it
            works out the credit when the customer next sends a message."
      - title: Reject with 429 and test under load
        minutes: 45
        build: Answer rejected requests with 429 Too Many Requests, and optionally a Retry-After header. Protect each bucket
          so concurrent requests cannot both take its last token. Load test with about 10 clients at once.
        outcome: Under load, /limited answers 429 after the first burst while /unlimited always answers 200, and a concurrent
          test never serves more requests than the bucket allows.
        concepts:
          - rate-limit-responses
          - concurrent-connections
        hints:
          hint: Send many requests at exactly the same moment to a nearly empty bucket, and count how many were served.
  - title: Windows and logs
    summary: Count in fixed windows, see the boundary burst, then fix it with a log of request times and a weighted counter.
    steps:
      - title: Fixed window counter
        minutes: 45
        build: "Replace the bucket with a fixed window counter: 60-second windows aligned to the clock, a threshold of 60
          requests, one counter per client and window."
        outcome: A burst sent just before a minute boundary and another just after are both served, showing up to twice the
          limit in a few seconds.
        concepts:
          - fixed-window-counter
        hints:
          hint: Round each request's timestamp down to the start of its window, and use that as part of the counter's key.
      - title: Sliding window log
        minutes: 45
        build: Keep the time of each accepted request per client, drop times older than the window, and accept only while
          fewer than the limit remain. Write tests that set the clock rather than read it.
        outcome: The same boundary burst never gets more than the limit served in any 60 seconds, and a test with a client
          that keeps retrying after rejection passes.
        concepts:
          - sliding-window-log
        hints:
          hint: Write the log out after each request, removing old entries first and adding the new time only if it was
            accepted.
      - title: Sliding window counter
        minutes: 45
        build: Keep the counts of the current and the previous window per client, and estimate the last window by weighting
          the previous count by its overlap.
        outcome: A test at a known point in a window checks the estimate, and the boundary burst is mostly smoothed out.
        concepts:
          - sliding-window-counter
        hints:
          hint: Draw the last 60 seconds as a span ending now, and ask what share of the previous window falls inside it.
  - title: Many servers, one limit
    summary: Move the counts into a shared store with atomic updates and expiring keys, then run two servers on one limit.
    steps:
      - title: Counts in a shared store
        minutes: 60
        build: Move the counters into Redis or another shared store. Update them with an atomic increment, under keys made of
          the client and the window start, each with an expiry.
        outcome: The store shows one key per client and window, the keys disappear after two windows, and the counts survive a
          restart of your server.
        concepts:
          - distributed-counters
          - key-expiry
        hints:
          hint: Ask whose requests end up in the same key, and what removes a key once its window is long past.
      - title: Two servers, one limit
        minutes: 45
        build: Run two copies of your server on ports 8080 and 8081 against the same store, with a limit of 60 requests per
          minute.
        outcome: After 60 quick requests to the server on 8080, a curl call to the server on 8081 answers 429.
        concepts:
          - distributed-counters
        hints:
          hint: If the second server still serves the request, check whether both servers are really writing to the same keys.
