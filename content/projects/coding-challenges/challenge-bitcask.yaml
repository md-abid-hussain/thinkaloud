# Coding Challenges, Build your own Bitcask. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-bitcask . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-bitcask
  title: Build your own Bitcask
  source_url: https://codingchallenges.fyi/challenges/challenge-bitcask
  level: intermediate
  status: generated
  figure:
    kind: log
  summary: A key-value store and command-line tool that appends every write to a log of checksummed records, keeps an
    in-memory index of where each value lives, deletes with tombstones, compacts old files with a merge that writes
    hint files, and recovers cleanly after a crash.
  requirements:
    - Set, get and delete keys from the command line, with the database directory given by -db
    - Append every write to the active log file as a record that starts with a CRC-32 checksum
    - Close the active file at a size limit and start a new one, leaving all older files unchanged
    - Keep an in-memory keydir with the file, position, size and timestamp of each key's latest value
    - Read a value with one seek and one read, and never return a deleted key
    - Merge closed files into new ones holding only live values, with a hint file for each, and rebuild the keydir on
      startup
  primer:
    what: Bitcask is a way to build a key-value store on disk. Every write, even an update, is added to the end of a log
      file, and nothing already written is ever changed. A table in memory, called the keydir, remembers for each key
      where its latest value sits in the log, so reading means one jump to the right place. You will start with a
      first version that simply rewrites the whole table to one file after every change, then turn it into Bitcask.
    why: Adding to the end of a file is the fastest thing a disk does, and a crash can only damage the last record. It is
      how the Riak database stores data, and the same log idea sits under many modern databases.
    example: Suppose you set colour to red, then set colour to blue. The first version keeps a table in memory and writes
      it out whole after each change, so its file ends with a single line, colour then blue. The log version appends
      instead, so its file holds two records, one for red and one for blue, and the keydir entry for colour points at
      the second record.
    words:
      - term: log
        meaning: A file that is only ever added to at the end. Old records stay where they are.
      - term: record
        meaning: One entry in the log, holding a checksum, a timestamp, the sizes of the key and value, then the key and the
          value.
      - term: keydir
        meaning: The in-memory table from each key to the file, position and size of its latest value.
      - term: active file
        meaning: The one log file currently being written. When it reaches a size limit it is closed and never changed again.
      - term: checksum
        meaning: A number computed from a record's bytes and stored with it, so damage can be detected when the record is
          read.
      - term: tombstone
        meaning: A record that says a key has been deleted.
  restate_rubric:
    - id: r1
      point: It is a key-value store that never changes data in place but appends every write to a log file
    - id: r2
      point: An in-memory index records where each key's latest value is on disk, so a read is one seek
    - id: r3
      point: Deletes write tombstones, a merge removes stale data, and startup rebuilds the index and skips damaged records
  reflection_prompt: In your own words, what did you give up and what did you gain by never changing a record in place,
    and what would you change if the keys no longer fitted in memory?
  done_when: ccbitcask sets, gets and deletes keys from checksummed records in rotating append-only files, reads each
    value with one seek, never returns a deleted key, merges closed files with hint files, and recovers from a crash
    without losing earlier writes or resurrecting deletes; and your notes explain the keydir, tombstones and your
    durability rule in your own words.
  open_checks:
    - How long a sync takes on your disk, and how many sets per second you get with and without syncing each one.
    - What your platform guarantees when a file is renamed or deleted while another process has it open.
    - Whether your timestamps are precise enough to order two writes of the same key made in the same second.
learning_map:
  - concept: key-value-store
    where: "ccbitcask stores values under keys with set, get and del, starting from the simplest version: a flat file
      rewritten after every change."
    explain_back:
      prompt: Your first version rewrites the whole data file after every set. It works on ten keys but becomes painfully
        slow with a million. Explain why, and what a log-structured store does instead.
      rubric:
        - id: e1
          point: Rewriting the whole file costs time in proportion to all the data, for every single change
        - id: e2
          point: With a million keys each set rewrites everything, so writes get slower as the store grows
        - id: e3
          point: A log-structured store appends one record per change to the end of a file, so each write costs only the size of
            that record
  - concept: append-only-log
    where: Every set and delete becomes one record appended to the active file, which is closed at a size limit, and older
      files are never written again.
    explain_back:
      prompt: A teammate asks why ccbitcask never updates a value in place, even though that would save disk space. Explain
        what appending gains for writes and for crashes, and what it costs.
      rubric:
        - id: e1
          point: Appending to the end of a file is sequential writing, the fastest thing a disk does, and needs no searching
        - id: e2
          point: Earlier records are never touched again, so a crash can damage at most the record being written
        - id: e3
          point: The cost is that old values stay on disk as dead data until a merge removes them, and reads need an index to
            find the latest value
  - concept: byte-order
    where: Each record starts with fixed-size numbers for the checksum, timestamp and sizes, so you choose and document
      one byte order for all of them.
    explain_back:
      prompt: A tool written in another language reads your data files and gets absurd key sizes, while your own program
        reads them fine. Explain the likely cause and what the format must state.
      rubric:
        - id: e1
          point: The sizes are multi-byte numbers, which can be written with the most significant byte first or last
        - id: e2
          point: The other tool assumed the opposite order from your writer, so it read the bytes backwards
        - id: e3
          point: The record format must state one byte order for every number, and your program agreeing with itself proves
            nothing
  - concept: checksums
    where: Each record begins with a CRC-32 of every byte after it, so reading a record can tell whether it was damaged or
      cut short.
    explain_back:
      prompt: After a power cut, the last record in the active file has a correct key size but its value is cut short.
        Explain how the CRC reveals this, which bytes the CRC must cover, and what the store should do with that
        record.
      rubric:
        - id: e1
          point: The reader recomputes the CRC from the bytes it finds and compares it with the stored one; a cut or damaged
            record does not match
        - id: e2
          point: The CRC must cover every byte after it, including the timestamp and the size fields, or a damaged size could
            send the reader to the wrong place
        - id: e3
          point: A record that fails at the end of the active file is a write that never finished, so it is dropped and
            everything before it is kept
  - concept: hash-index
    where: The keydir is an in-memory table from each key to the file, position, size and timestamp of its latest value,
      so a get needs one seek and one read.
    explain_back:
      prompt: Your store holds 100 GB of values but runs on a machine with 8 GB of memory, and every get still needs only
        one disk read. Explain what the keydir holds, why that is enough, and what kind of query it cannot answer.
      rubric:
        - id: e1
          point: "The keydir holds, for every key, where its latest value is: the file, the position and the size, not the value
            itself"
        - id: e2
          point: A get looks up the key in memory, then seeks to that position and reads that many bytes, so one disk read is
            enough
        - id: e3
          point: Only the keys and their locations must fit in memory, not the values
        - id: e4
          point: A hash table has no order, so it cannot answer range queries such as every key between a and c
  - concept: tombstones
    where: A del cannot remove the old record from an append-only file, so it appends a tombstone, and get must never
      return a deleted key.
    explain_back:
      prompt: After you add merging, a key that was deleted weeks ago reappears after a restart. Explain how deletes work in
        an append-only store and what the merge did wrong.
      rubric:
        - id: e1
          point: A delete appends a tombstone record that marks the key as deleted, because old records cannot be changed
        - id: e2
          point: On restart the store rebuilds its index from the records on disk, so a tombstone must hide every older value of
            the key
        - id: e3
          point: The merge dropped the tombstone while an older value of the key survived in another file, so the old value came
            back to life
  - concept: log-compaction
    where: A merge rewrites the closed files with only the live value of each key, writes a hint file next to each, and
      only then deletes the old files.
    explain_back:
      prompt: Your data directory is 50 GB, but only 2 GB of it is live data. Explain how a merge reclaims the space, which
        file it must never touch, and in what order it must do its steps so a crash cannot lose data.
      rubric:
        - id: e1
          point: The merge reads the closed files and writes new files holding only the latest live value of each key
        - id: e2
          point: It never touches the active file, which is still being written
        - id: e3
          point: It syncs the new files, writes their hint files and points the keydir at the new copies before deleting any old
            file, so a crash leaves either old or new files complete
  - concept: crash-recovery
    where: On startup ccbitcask rebuilds the keydir from hint files and by replaying the other data files, checking every
      record's CRC.
    explain_back:
      prompt: Your store is killed in the middle of a write. Explain what it finds on disk when it starts again, how it
        rebuilds its index, and how hint files make that faster.
      rubric:
        - id: e1
          point: Only the record being written at the moment of the crash can be damaged, because earlier records are never
            changed
        - id: e2
          point: On startup it reads the files in order and fills the keydir, checking each CRC and dropping a damaged record at
            the end of the active file
        - id: e3
          point: Hint files list each record's key and location without the value, so merged files can be indexed without
            reading all their data
  - concept: durability-and-fsync
    where: "You decide when a set counts as done: after writing to the operating system, or after syncing the file so it
      survives a power cut."
    explain_back:
      prompt: ccbitcask printed OK for a set, then the machine lost power and the value was gone after reboot. Explain how
        that is possible and what the store could do differently, and at what cost.
      rubric:
        - id: e1
          point: Writing a file usually only hands the data to the operating system's cache, not to the disk
        - id: e2
          point: A power cut loses data still in the cache, even though the program already said OK
        - id: e3
          point: Syncing the file after each write, with fsync, makes the write durable before saying OK
        - id: e4
          point: Syncing every write is much slower, so stores choose between syncing each write, syncing in batches, or
            accepting some loss
milestones:
  - title: From a flat file to an append-only log
    summary: Start with the simplest store, then turn it into checksummed records appended to rotating files.
    steps:
      - title: A flat file first
        minutes: 45
        build: Build ccbitcask with a -db directory option and set, get and del commands, keeping every key and value in one
          text file that is rewritten in full after each change.
        outcome: After set Key Value, get Key prints Value, del Key removes it, and timing a thousand sets shows each one
          getting slower as the file grows.
        concepts:
          - key-value-store
        hints:
          hint: Keep it simple on purpose; the slowness is the lesson.
      - title: Records in bytes
        minutes: 60
        build: "Replace the flat file with an append-only log: each set appends one record of a CRC-32 over the other fields,
          then the timestamp, the key size, the value size, the key and the value, with every number in one documented
          byte order."
        outcome: A hex dump of the data file after two sets shows two records whose sizes match the keys and values you set,
          and updating a key appends a new record instead of changing the old one.
        concepts:
          - append-only-log
          - byte-order
          - checksums
        hints:
          hint: Write the expected bytes of one record on paper before coding it.
      - title: Rotate the active file
        minutes: 30
        build: Make the size limit configurable, and when a write would take the active file past it, close that file and
          start the next one.
        outcome: With a limit of a few hundred bytes, writing many keys produces several numbered files, and the closed files
          never change again.
        concepts:
          - append-only-log
        hints:
          hint: Record each closed file's size and check it later.
      - title: Trust only good records
        minutes: 45
        build: Check the CRC of every record you read, and decide and document when a set counts as done, for example after
          syncing the file.
        outcome: A test that changes one byte of a record, including its key size, makes reading that record fail the CRC
          check, and your notes state your durability rule.
        concepts:
          - checksums
          - durability-and-fsync
        hints:
          hint: What should the CRC cover so a damaged size field is caught?
  - title: The keydir, reads and deletes
    summary: Keep locations in memory, read with one seek, and delete with tombstones.
    steps:
      - title: The keydir and one-seek reads
        minutes: 60
        build: Keep an in-memory keydir from each key to the file, value position, value size and timestamp of its latest
          record, and make get seek straight to the value and read exactly that many bytes.
        outcome: With keys spread over several files, get returns the latest value of each key with one seek and one read, and
          an updated key returns its new value.
        concepts:
          - hash-index
        hints:
          hint: The keydir points at the value, not the whole record.
      - title: Delete with tombstones
        minutes: 45
        build: Add del, which appends a tombstone record and removes the key from the keydir, and make get never return a
          deleted key.
        outcome: After set Key Value then del Key, get Key reports not found, also after the program restarts and rebuilds its
          keydir from the files.
        concepts:
          - tombstones
        hints:
          hint: What must a restart see to know the key is gone?
  - title: Merge, hint files and recovery
    summary: Reclaim dead space safely, start fast, and recover cleanly after a crash.
    steps:
      - title: Merge away dead values
        minutes: 60
        build: Add a merge over every closed file that writes new files holding only the live value of each key, points the
          keydir at the new copies, then deletes the old files. Never touch the active file.
        outcome: After updating a few keys many times and merging, the data directory is much smaller, every get still returns
          the latest value, and deleted keys stay deleted after a restart.
        concepts:
          - log-compaction
          - tombstones
        hints:
          hint: A tombstone may only be dropped once no older value of its key survives anywhere.
      - title: Hint files
        minutes: 45
        build: Write a hint file next to each merged file with the timestamp, key size, value size, value position and key of
          every record, and use hint files on startup to fill the keydir.
        outcome: Startup with hint files gives the same keydir as replaying the data files, and is clearly faster on a large
          store.
        concepts:
          - log-compaction
          - crash-recovery
        hints:
          hint: Compare the two keydirs entry by entry.
      - title: Recover after a crash
        minutes: 45
        build: On startup, rebuild the keydir from hint files for merged files and by replaying the other files, checking
          every CRC, and drop an incomplete or damaged last record in the active file.
        outcome: After you cut the active file in the middle of its last record, the store starts, serves every earlier value,
          and reports the dropped record.
        concepts:
          - crash-recovery
          - checksums
        hints:
          hint: Simulate the crash by truncating a copy of the file.
      - title: A merge that survives a crash
        minutes: 45
        build: Make the merge sync its new files and hint files and update the keydir before deleting any old file.
        outcome: Killing the program at any point during a merge, in repeated tests, never loses a live value or brings back a
          deleted key.
        concepts:
          - log-compaction
          - durability-and-fsync
        hints:
          hint: List the merge steps and ask what is on disk if it stops after each one.
