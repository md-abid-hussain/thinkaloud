stage0:
  summary: You'll build a command-line tool that looks through a folder and every folder inside it, then reports files
    whose contents are exactly the same. You give it a starting folder, and it prints the groups of copies it finds
    and can offer to delete the extra ones. Two files count as duplicates only when every byte matches, so a matching
    name or size isn't enough. That strictness is what makes it harder than it looks, because comparing every file
    with every other file is far too slow on a real disk, and a wrong delete loses data for good. So the job is to
    find likely copies cheaply, then confirm them carefully before anything is removed.
  questions:
    - id: p-what
      kind: what
      prompt: You point the tool at a folder holding a photo, an exact copy of that photo, and a different photo of the same
        size. What goes in, what should come out, and why is the third photo not a duplicate?
      looks_for:
        - the input is a starting folder, searched through all its subfolders
        - the output is groups of files that have identical contents
        - duplicates must match byte for byte, not just in name or size
        - the same size only means the file is a candidate, not a match
    - id: p-why
      kind: why
      prompt: A friend asks why anyone would build a duplicate finder when disks keep getting bigger. What would you tell
        them the tool is for, and where do such tools get used?
      looks_for:
        - removing extra copies frees storage space
        - backups can leave out files they already hold
        - backup and storage systems keep one copy of identical data to save space and network traffic
        - tools like fdupes already exist for this job
    - id: p-how
      kind: how
      prompt: Describe the simplest way you can think of to find the duplicates in a folder, in plain words. What happens to
        that approach when the folder holds many more files?
      looks_for:
        - comparing every file with every other file is the naive approach
        - the number of comparisons grows much faster than the number of files
        - reading every byte of every file is slow on a large disk
        - a cheap first test, such as grouping by size, can rule out most files
questions:
  - id: s1-q1
    step: s1
    concept: directory-traversal
    prompt: Your listing stops with an error the moment it reaches a folder you can't read, so the rest of the tree never
      gets listed. What should happen instead, and why?
    looks_for:
      - an unreadable folder is reported and the walk carries on with the other branches
      - the error goes to standard error, separate from the listing
      - a denied folder affects only its own subtree, not the whole scan
      - a real walk visits the whole tree, however deep, without stopping at the first problem
  - id: s2-q2
    step: s2
    concept: grouping-by-key
    prompt: Your tool compares every file with every other file to find matches, and on a folder of 200,000 files it runs
      for hours. What would you do instead, and what does it cost as the folder grows?
    looks_for:
      - use a key that equal files must share, such as size
      - keep a map from each key to the list of files with that key
      - one pass with one lookup per file instead of all pairs
      - cost grows with the number of files, not with its square
  - id: s2-q3
    step: s2
    concept: staged-filtering
    prompt: A teammate hashes every file first and only then groups by size, so the output is right. On a photo library
      with few copies, the tool still reads gigabytes more than it needs to. Why, and which check should come first?
    looks_for:
      - size comes from the file system without opening the file
      - a file whose size no other file shares can't have a duplicate
      - order the checks by cost so most files drop out before the expensive reads
      - the real cost is the bytes read from disk
  - id: s3-q4
    step: s3
    concept: content-hashing
    prompt: Your tool reports two files as probable duplicates because their MD5 hashes match. A colleague says the
      matching hash proves they're identical, so the tool can delete one. What's wrong with that?
    looks_for:
      - different files can share a hash, since there are far more files than hash values
      - collisions are rare by chance but can be made on purpose for MD5
      - a match is strong evidence, not proof
      - confirm with a byte-by-byte compare before deleting anything
  - id: s3-q5
    step: s3
    concept: hash-cache
    prompt: Your tool saves each file's hash between runs. A user edits one file between two runs, and the next run
      reports it as a copy of a file it no longer matches. Why did the saved hash survive, and what should the tool
      check before trusting it?
    looks_for:
      - the cache was keyed on the path alone, or checked too little metadata
      - size, modification time, status change time and inode are cheap to read and detect most edits
      - trust the saved hash only while all of them still match
      - times can be fooled by changes in the same timestamp tick or by tools that set times back
  - id: s4-q6
    step: s4
    concept: chunked-reading
    prompt: Two 4 GB video files share a hash, and your compare loads each whole into memory before checking a byte. What
      goes wrong, and how should the loop read them instead?
    looks_for:
      - memory use grows with file size, so big files run out of memory
      - read a fixed-size chunk from each file and compare the pair before reading more
      - stop at the first difference, which comes early for most different files
      - use the byte count each read actually returned, since a read can come back short
  - id: s6-q7
    step: s6
    concept: safe-deletion
    prompt: Your tool shows a numbered list of copies, and the user takes a minute to answer. In that time one file in the
      group is rewritten. What could go wrong when you delete the chosen file, and what check should come right before
      the delete?
    looks_for:
      - the compare was done on the content from the scan, which may have changed since
      - there is a gap between checking a file and acting on it
      - re-check size, times and identity right before removing it
      - refuse to delete and report it if they no longer match
  - id: s6-q8
    step: s6
    concept: file-identity
    prompt: Your tool reports two paths in one group as duplicates, but one path is a second name for the other file. The
      user deletes one of them and nothing changes on disk. Why, and how should the tool tell this case apart from a
      real copy?
    looks_for:
      - two names can point at one inode, which means one file with one set of bytes
      - device and inode numbers identify a file, not its path
      - the link count shows how many names still exist
      - group by identity, and never report or delete a file as a copy of itself
