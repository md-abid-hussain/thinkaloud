# Coding Challenges, Build your own code comment remover. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-code-comment-remover . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-code-comment-remover
  title: Build your own code comment remover
  source_url: https://codingchallenges.fyi/challenges/challenge-code-comment-remover
  level: null
  status: generated
  figure:
    kind: states
  summary: A command-line tool that reads a source file in Python, JavaScript, C, C++ or Go and writes it back with the
    comments removed and the code unchanged, while keeping the comments that tools rely on, such as Go doc comments
    and linter or build directives.
  requirements:
    - Remove Python comments that start with a hash and run to the end of the line
    - Remove line comments and block comments from JavaScript, C and C++
    - Leave comment markers that appear inside strings and character literals alone
    - Keep Go doc comments that sit directly above a top-level declaration, and remove the other Go comments
    - Keep tool and linter directives, such as noqa in Python and go:generate or go:build in Go
    - The cleaned program must behave exactly like the original
  primer:
    what: A comment is a note for people inside a program's source code, and the computer skips it. In Python a comment
      starts with a hash and runs to the end of the line. JavaScript, C, C++ and Go use two slashes for a comment to
      the end of the line, and a slash followed by a star to open a block comment that a star followed by a slash
      closes, possibly many lines later. You will build a command-line tool that reads a source file and writes it
      back with the comments taken out and the code untouched.
    why: Stripping comments is the smallest useful job of a lexer, the same first step that compilers, minifiers and code
      formatters take. It also shows that the same character can mean different things depending on where it appears.
    example: Take a JavaScript line that sets a total to zero and then has two slashes and the words start empty. The tool
      keeps everything before the slashes, drops the slashes and the note, and trims the spaces left at the end of the
      line, so only the code that sets the total remains. A line that held nothing but a comment disappears.
    words:
      - term: comment
        meaning: A note inside source code that the language ignores when it runs or compiles the program.
      - term: line comment
        meaning: A comment that starts with a marker, a hash in Python or two slashes in C-style languages, and ends at the
          end of the line.
      - term: block comment
        meaning: A comment that opens with slash star and closes with star slash, and can cover part of a line or many lines.
      - term: string literal
        meaning: Text written between quote marks inside code, such as a message the program prints.
      - term: lexer
        meaning: A program that reads source code character by character and splits it into pieces such as code, strings and
          comments.
      - term: directive
        meaning: A comment that a tool reads as an instruction, for example telling a linter to skip a line.
  restate_rubric:
    - id: r1
      point: The tool reads source code and writes it back with the comments removed and the code unchanged
    - id: r2
      point: It handles Python hash comments and the line and block comments of JavaScript, C, C++ and Go
    - id: r3
      point: It keeps comments that tools read, such as Go doc comments and linter or build directives
  reflection_prompt: In your own words, how does your tool tell a comment from the same characters inside a string, and
    what would you change to support another language?
  reference_tool: "The original program itself: build or run it next to the cleaned copy and compare. Each language's
    own compiler or interpreter, and its linter, do the checking."
  done_when: Comments are removed from the challenge's Python, JavaScript, C, C++ and Go examples and your own samples;
    strings, character literals and escapes are never touched; Go doc comments and tool directives survive; and every
    cleaned sample builds and behaves exactly like the original. Your notes explain the scanner's states and why a
    single pattern is not enough.
  open_checks:
    - Whether your JavaScript samples contain regular-expression literals, which can include slashes, and how your
      scanner should treat them.
    - Whether your C samples use line continuations with a trailing backslash, which can extend a line comment onto
      the next line.
    - Exactly which Go comments count as doc comments inside a grouped declaration block.
    - What to do with a line that becomes empty after its comment is removed.
learning_map:
  - concept: lexer-states
    where: Your scanner walks the source once and keeps a state, such as in code, in a string, in a line comment or in a
      block comment, so a comment marker counts only in the right state.
    explain_back:
      prompt: A teammate strips comments with a find-and-replace on two slashes, and a line holding a web address inside a
        string gets cut in half. Explain why, and how a scanner with states avoids it.
      rubric:
        - id: e1
          point: Comment markers such as two slashes or a hash can appear inside strings, so a plain search cannot tell a
            comment from string content
        - id: e2
          point: A scanner keeps a state, such as code, string, line comment or block comment, and changes state only on the
            characters that matter in the current state
        - id: e3
          point: In the string state comment markers are ordinary characters, and the string ends only at its own closing quote
        - id: e4
          point: The scanner reads the file once from start to end, so what came before always decides what a character means
  - concept: string-escapes
    where: A backslash before a quote keeps a string open, and Python's triple-quoted strings can span lines, so the
      scanner must understand escapes to know where a string really ends.
    explain_back:
      prompt: One line of code has a string that contains an escaped quote, followed by a real comment after the string.
        Explain how a scanner that ignores escapes gets this line wrong, and what rule it needs.
      rubric:
        - id: e1
          point: Without the escape rule the escaped quote looks like the end of the string, so the scanner treats the rest of
            the string as code and the real comment as part of a new string
        - id: e2
          point: Inside a string, a backslash means the next character belongs to the string, so the scanner skips over it
        - id: e3
          point: Two backslashes in a row are one literal backslash, so a quote right after them does close the string
        - id: e4
          point: Triple-quoted strings end only at three matching quotes, and may contain line breaks and comment markers
  - concept: lexical-analysis
    where: "Each language defines its own tokens: Python has hash comments and triple quotes, C has character literals in
      single quotes and preprocessor lines, JavaScript has template strings, and Go has raw strings."
    explain_back:
      prompt: Your Python comment remover works perfectly, and a colleague runs it on a C file. Explain why it damages the
        file, and what has to change for each language.
      rubric:
        - id: e1
          point: In C a hash starts a preprocessor line, such as an include, so treating it as a comment deletes real code
        - id: e2
          point: C comments use two slashes and slash-star pairs, which the Python rules do not know
        - id: e3
          point: Single quotes mean a character literal in C but a string in Python, so the rules for quotes differ too
        - id: e4
          point: Each language needs its own rules for strings and comments, chosen from the file extension or an option
  - concept: regex-matching
    where: A regular expression is tempting for stripping comments, but it cannot follow strings and escapes reliably. It
      is the right tool later, on comment text the scanner has already found, to spot directives.
    explain_back:
      prompt: Explain why a single regular expression cannot reliably remove comments from source code, and give one place
        in this tool where a regular expression is the right choice.
      rubric:
        - id: e1
          point: "Whether a marker starts a comment depends on everything before it: open strings, escapes and open block
            comments"
        - id: e2
          point: A pattern applied line by line cannot remember that state, so it ends up matching inside strings or across the
            end of one string and the start of another
        - id: e3
          point: Patterns are fine for small, regular jobs, such as recognising a directive like noqa or go:build in the text of
            a comment the scanner has already identified
  - concept: meaningful-comments
    where: "Some comments are read by tools, not people: Go doc comments above declarations, build constraints, generate
      directives and linter suppressions. Removing them changes how the program is built or checked."
    explain_back:
      prompt: After running your tool, a Go project fails to build on one operating system, and the linter suddenly reports
        many warnings. Explain which comments your tool should have kept and how it can recognise them.
      rubric:
        - id: e1
          point: Build constraints such as go:build decide which files are compiled on which platform, so removing them breaks
            builds
        - id: e2
          point: Linter directives such as noqa or nolint switch off specific warnings, so removing them brings the warnings
            back
        - id: e3
          point: Doc comments directly above a top-level declaration feed documentation tools
        - id: e4
          point: They are recognised by position, directly above a declaration with no blank line between, and by an exact
            directive pattern at the start of the comment
  - concept: differential-testing
    where: The cleaned program must behave exactly like the original, so you compile or run both and compare their output.
    explain_back:
      prompt: Explain how you can check, without reading every file by hand, that removing comments never changed what a
        program does, and what kinds of mistakes this catches.
      rubric:
        - id: e1
          point: Run or compile the original and the cleaned copy on the same inputs and compare their output and exit status
        - id: e2
          point: It catches code glued together when a comment between two words is removed without leaving a space
        - id: e3
          point: It catches string content that was deleted by mistake, and removed directives that change how the program
            builds
        - id: e4
          point: It checks cases you never wrote a test for, because the original program is the reference
  - concept: unit-tests-first
    where: "The rules for Go doc comments are subtle, so you write one test per rule before the code: a one-line doc
      comment, a three-line one, one separated by a blank line, and a directive."
    explain_back:
      prompt: The rules for which Go comments to keep have several edge cases. Explain why writing a test for each rule
        before the code helps here, and list the cases you would start with.
      rubric:
        - id: e1
          point: A test per rule pins down the intended behaviour before any code exists, fails until it is implemented, and
            guards it from later changes
        - id: e2
          point: "Cases to keep: a one-line comment directly above a function, a group of comment lines above a type kept as a
            whole, and a directive anywhere"
        - id: e3
          point: "Cases to remove: a comment group separated from its declaration by a blank line, and a comment inside a
            function body"
  - concept: stdin-vs-file
    where: The tool reads a file named on the command line, or standard input when no name is given, and writes the
      cleaned code to standard output, so it can sit in a pipeline.
    explain_back:
      prompt: Explain why a comment remover that reads standard input and writes standard output is easier to use in scripts
        than one that edits files in place, and how a user still gets a cleaned copy of a file.
      rubric:
        - id: e1
          point: Standard streams let it combine with other tools in a pipeline, such as feeding a formatter or a diff
        - id: e2
          point: Nothing is overwritten by accident, because the original file is never touched
        - id: e3
          point: The user redirects the output to a new file to keep a cleaned copy
        - id: e4
          point: Reading standard input means there is no file extension, so the language has to come from an option
milestones:
  - title: Python hash comments
    summary: Strip Python comments, then replace pattern matching with a scanner that understands strings, escapes and
      triple quotes.
    steps:
      - title: Strip a small Python file
        minutes: 30
        build: Read a Python file named on the command line, or standard input when no name is given, and write the code to
          standard output with every hash comment removed. Try it on the challenge's Python example.
        outcome: The challenge's Python example comes out with its comments gone and its code unchanged, both from a file and
          from standard input.
        concepts:
          - stdin-vs-file
          - regex-matching
        hints:
          hint: Start simple, then try a line where a hash sits inside a string and see what breaks.
      - title: Scan instead of matching
        minutes: 45
        build: Replace the pattern with a scanner that walks the source, tracks whether it is inside a single-quoted or
          double-quoted string, and removes text only from a hash found outside a string.
        outcome: A line that prints a colour code containing a hash keeps its string intact, while a real comment after the
          string is removed.
        concepts:
          - lexer-states
          - regex-matching
        hints:
          hint: List your states first, and for each state, which characters change it.
          example: A proofreader reading aloud stops treating punctuation as instructions while reading a quotation, and picks
            up again at the closing quote mark.
      - title: Escapes and triple quotes
        minutes: 45
        build: Handle a backslash before a quote, which keeps a string open, and triple-quoted strings, which can run over
          several lines and contain hash characters. Leave docstrings in, because they are strings.
        outcome: Strings with escaped quotes, strings ending in two backslashes, and triple-quoted strings with hash
          characters over several lines all come through unchanged.
        concepts:
          - string-escapes
          - lexer-states
        hints:
          hint: What should the scanner do with the character right after a backslash?
  - title: Slash comments in JavaScript, C and C++
    summary: Add line and block comments, character literals, and make sure removing a comment never glues code together.
    steps:
      - title: Line and block comments
        minutes: 45
        build: "Add JavaScript: remove line comments that start with two slashes and block comments from slash-star to
          star-slash, leaving strings in single quotes, double quotes and template quotes alone."
        outcome: The challenge's JavaScript example comes out without comments, and strings in all three quote styles that
          contain comment markers are untouched.
        concepts:
          - lexical-analysis
          - lexer-states
        hints:
          hint: Which characters can end each kind of comment, and which states can a comment start from?
      - title: Block comments across lines
        minutes: 30
        build: Carry the scanner's state from one line to the next, or scan the whole file as one stream, so a block comment
          can open on one line and close several lines later. Decide what to do with lines a comment leaves empty.
        outcome: A block comment that opens on one line and closes three lines later is removed completely, and your notes
          state your rule for empty lines.
        concepts:
          - lexer-states
        hints:
          hint: Does your state survive the end of a line?
      - title: Character literals in C
        minutes: 45
        build: "Add C and C++: the same two comment styles, plus character literals in single quotes, which can hold a quote
          mark or a backslash escape. Leave preprocessor lines alone."
        outcome: The challenge's C example comes out without comments, character literals holding a quote or a backslash are
          untouched, and include lines survive.
        concepts:
          - lexical-analysis
          - string-escapes
        hints:
          hint: Why must a single quote mean something different in C than in Python?
      - title: Do not glue code together
        minutes: 45
        build: Replace each removed block comment with a single space, or with the line breaks it contained, and compile or
          run the original and the cleaned version of every sample.
        outcome: For every sample, including a block comment between two words with no spaces, the original and cleaned
          versions build and give identical output.
        concepts:
          - lexical-analysis
          - differential-testing
        hints:
          hint: What does the compiler see if a comment between two names simply disappears?
  - title: Comments that must stay
    summary: "Keep the comments tools rely on: Go doc comments and build, generate and linter directives."
    steps:
      - title: Go doc comments
        minutes: 60
        build: Add Go, which uses C's comment markers plus raw strings. Write a test for each rule first, then keep doc
          comments, the comment lines directly above a top-level declaration with no blank line between, as a whole
          group, and remove every other comment.
        outcome: Your tests for a one-line doc comment, a three-line one, one separated by a blank line and one inside a
          function body all pass.
        concepts:
          - meaningful-comments
          - unit-tests-first
        hints:
          hint: Treat a run of comment lines with nothing between them as one group, and decide for the whole group.
      - title: Keep tool directives
        minutes: 45
        build: Keep linter and build directives, such as noqa in Python and go:generate and go:build in Go. Recognise them
          with a precise pattern applied only to comment text your scanner has already found.
        outcome: Directives survive in every sample, a cleaned Go sample still builds for the same platforms, and the linter
          reports the same warnings before and after cleaning.
        concepts:
          - meaningful-comments
          - regex-matching
          - differential-testing
        hints:
          hint: Apply the pattern to the comment's text, never to the whole line.
