# Coding Challenges, Build your own diff. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-diff . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-diff
  title: Build your own diff
  source_url: https://codingchallenges.fyi/challenges/challenge-diff
  level: intermediate
  status: generated
  figure:
    kind: diff
  summary: A command-line tool that compares two text files and prints the lines to remove and the lines to add to turn
    the first into the second, built on a longest common subsequence function written test first.
  requirements:
    - Write unit tests before the code they test, starting with the cases on the challenge page
    - Find the longest common subsequence of two strings, then of two lists of lines
    - Turn two lists of lines into a list of differences, with removed lines marked by a less-than sign and added
      lines by a greater-than sign
    - Provide a ccdiff command that takes two file paths and prints their differences, and prints nothing for
      identical files
    - Consider how the approach copes with very large files
  primer:
    what: diff compares two text files and lists the changes that turn the first into the second. If the files are the
      same it prints nothing. The heart of it is finding the longest run of lines that both files share in the same
      order; every line outside that shared part was either removed from the old file or added in the new one. You
      will build that function first for strings, then for lines, then wrap it in a ccdiff command.
    why: Every code review, version control system and patch relies on diffs. Building one teaches a classic use of
      dynamic programming, and how a careful table turns an impossible search into a quick one.
    example: An old shopping list says milk, eggs, bread. The new one says milk, butter, bread. Both share milk then
      bread, in that order, and nothing longer. So eggs was removed and is printed after a less-than sign, and butter
      was added and is printed after a greater-than sign. Milk and bread are not printed at all.
    words:
      - term: subsequence
        meaning: Items taken from a sequence in their original order, possibly skipping some. ACE is a subsequence of ABCDE,
          but CA is not.
      - term: longest common subsequence
        meaning: The longest subsequence that two sequences both contain. For two files it is the lines that stay the same.
      - term: dynamic programming
        meaning: Solving a big problem by solving each smaller overlapping part once, storing the answers in a table and
          building on them.
      - term: edit script
        meaning: The list of removals and additions that turns one version of a text into another.
      - term: unit test
        meaning: A small automatic check that one function gives the expected answer for one input.
  restate_rubric:
    - id: r1
      point: The tool compares two files and prints what to remove and what to add to turn the first into the second
    - id: r2
      point: It is built on the longest common subsequence of the two files' lines, which is the part that stays the same
    - id: r3
      point: Removed lines are marked with a less-than sign and added lines with a greater-than sign, and the tests are
        written before the code
  reflection_prompt: In your own words, how does your design find what changed between two files, how did writing tests
    first shape it, and what would you change for files with millions of lines?
  reference_tool: GNU diff (diffutils) for differences and exit statuses, and patch to check unified output.
  done_when: All the page's tests and your own pass, written before the code; ccdiff prints the right differences and
    exit statuses on the page's files; the comparison with the real diff matches on removed and added line counts; and
    your notes explain, in your own words, why the table does not scale and how an edit-count search does.
  open_checks:
    - What the real diff prints for a missing final newline, and whether it treats a carriage return as part of the
      line.
    - Which lines the real diff keeps when the longest common subsequence has ties, and whether yours differs.
    - The exit status and message the real diff gives when one path is a folder.
    - How much memory your table needs before your machine starts to swap.
learning_map:
  - concept: unit-tests-first
    where: The challenge asks you to write the tests first, starting with the cases on its page, and watch them fail
      before writing the code.
    explain_back:
      prompt: A teammate's test for your LCS function expects one exact string and fails, although your answer has the same
        length and appears in both inputs. Explain what the test should check instead, and why writing tests first
        helps here.
      rubric:
        - id: e1
          point: Two different subsequences can share the longest length, so more than one answer can be correct
        - id: e2
          point: "The test should check the properties: the result is a subsequence of both inputs and has the expected length"
        - id: e3
          point: Writing the test first forces you to decide what correct means, including ties and empty inputs, before
            choosing an algorithm
  - concept: longest-common-subsequence
    where: The longest common subsequence of the two files' lines is what stays the same; every other line is reported as
      removed or added.
    explain_back:
      prompt: Explain how finding the longest common subsequence of two versions of a file tells you which lines were
        removed and which were added.
      rubric:
        - id: e1
          point: A subsequence keeps lines in their order but may skip some, and the longest common one is the most that both
            versions share in order
        - id: e2
          point: Lines of the old file outside it were removed, and lines of the new file outside it were added
        - id: e3
          point: Maximising what stays the same minimises what has to be reported as changed
  - concept: dynamic-programming
    where: You fill a table with one cell per pair of prefixes, each cell built from its neighbours, and read the answer
      back from the corner.
    explain_back:
      prompt: A recursive LCS function is instant on short strings but takes minutes on two 30-character strings. Explain
        why, and how a table fixes it.
      rubric:
        - id: e1
          point: The recursion solves the same pairs of prefixes again and again, so the work grows exponentially
        - id: e2
          point: A table stores the answer for each pair of prefixes once, built from the cells above, to the left and
            diagonally before it
        - id: e3
          point: Filling the table takes time and memory in proportion to the product of the two lengths, and the answer is in
            the last cell
  - concept: edit-scripts
    where: Your ccdiff turns the two lists of lines into removals marked with a less-than sign and additions marked with a
      greater-than sign.
    explain_back:
      prompt: Two diff tools give different-looking outputs for the same two files, and both outputs have the same number of
        removed and added lines. Explain how both can be correct.
      rubric:
        - id: e1
          point: "A diff is an edit script: removals and additions that turn the old file into the new one around the lines
            kept"
        - id: e2
          point: The shortest script has the same length as long as the kept lines form a longest common subsequence
        - id: e3
          point: When several longest common subsequences exist, the tools may keep different lines and place the edits
            differently
  - concept: line-endings
    where: ccdiff must decide what to do with carriage returns and a missing final newline, which the real diff reports by
      default.
    explain_back:
      prompt: A code review shows every line of a file as changed, although nobody edited its text. Explain the likely cause
        and what a diff tool can do about it.
      rubric:
        - id: e1
          point: One version has Windows line endings with a carriage return before each newline, and the other has plain
            newlines
        - id: e2
          point: Compared exactly, every line differs by that invisible carriage return
        - id: e3
          point: A diff tool reports it truthfully by default, and can offer an option to ignore carriage returns or whitespace
            at line ends
  - concept: time-space-complexity
    where: The full table grows as the product of the two file lengths, which is what makes very large files the
      challenge's optional last step.
    explain_back:
      prompt: ccdiff works on two essays but runs out of memory on two versions of a 100,000-line log that differ in a few
        lines. Explain why, and two ways to cope.
      rubric:
        - id: e1
          point: The table has one cell per pair of lines, so two 100,000-line files need about ten billion cells
        - id: e2
          point: Trimming the shared lines at the start and end shrinks the table to the region that actually changed
        - id: e3
          point: An algorithm whose cost grows with the number of differences, such as Myers', or one that keeps only two rows,
            avoids the full table
  - concept: cli-subcommands
    where: ccdiff takes two paths, prints the differences, and reports through its exit status whether the files differ.
    explain_back:
      prompt: A backup script runs your ccdiff and copies a file only when it changed. Explain which exit status ccdiff
        should return for identical files, different files and a missing file, and why the script should rely on it
        rather than the printed text.
      rubric:
        - id: e1
          point: Identical files give status 0 and print nothing
        - id: e2
          point: Different files give status 1, and a missing or unreadable file gives status 2 with a message on standard error
        - id: e3
          point: The status is a stable contract for scripts, while the printed text is meant for people and can change format
  - concept: differential-testing
    where: You compare ccdiff with the real diff on many pairs of files, comparing only the removed and added lines
      because the real diff also prints change headers.
    explain_back:
      prompt: Your ccdiff and the real diff sometimes list different lines as removed, yet both are correct. Explain what
        your comparison check should compare so that it still catches real bugs.
      rubric:
        - id: e1
          point: Ties in the longest common subsequence let both tools choose different but equally short edit scripts
        - id: e2
          point: The check should compare the number of removed and added lines, or apply each diff and confirm it turns the old
            file into the new one
        - id: e3
          point: Comparing exact output would report false failures, while comparing counts or round trips still catches wrong
            edits
  - concept: myers-diff
    where: A step beyond the challenge replaces the full table with a search that explores edit scripts in order of how
      many edits they make, as GNU diff and Git do.
    explain_back:
      prompt: Git diffs two versions of a huge file that differ in three lines almost instantly, while your table-based
        ccdiff takes minutes. Explain the idea that makes Git fast, and when that idea is slow too.
      rubric:
        - id: e1
          point: The comparison is a path through a grid where matching lines are free diagonal moves and each removal or
            addition costs one step
        - id: e2
          point: The search tries all paths with zero edits, then one edit, then two, keeping only the furthest point on each
            diagonal, and stops as soon as one reaches the end
        - id: e3
          point: Its time grows with the file size times the number of differences, so it is fast for similar files and slow for
            files that are completely different
  - concept: unified-diff-format
    where: A step beyond the challenge adds unified output, the format of patch files, Git and code review tools.
    explain_back:
      prompt: A fix mailed as a unified diff still applies cleanly to a version of the file that gained twenty lines near
        the top. Explain what in the format makes that possible, and what happens when it cannot apply.
      rubric:
        - id: e1
          point: Each hunk has a header with line ranges and keeps a few unchanged context lines around the change
        - id: e2
          point: The patch tool searches for those context lines near the expected position, so it still finds the place after
            the file has shifted
        - id: e3
          point: If the context no longer matches, the hunk is rejected and written to a reject file for a person to resolve
milestones:
  - title: Longest common subsequence of strings
    summary: Write the tests first, then fill the table and read the subsequence back.
    steps:
      - title: Tests first
        minutes: 30
        build: "Set up a unit testing library and write the page's cases as tests before any code: identical strings, no
          letters in common, AABCXY with XYZ, two empty strings, and ABCD with AC."
        outcome: The test run lists five tests, and all five fail because the function does not exist yet.
        concepts:
          - unit-tests-first
        hints:
          hint: Write down what each case should return before you think about how.
      - title: Fill the table and read it back
        minutes: 60
        build: Build a table with one row per prefix of the first string and one column per prefix of the second, fill it from
          its neighbours, then walk back from the last cell to read out the subsequence.
        outcome: All five page tests pass.
        concepts:
          - longest-common-subsequence
          - dynamic-programming
        hints:
          hint: When the two current letters match, look diagonally up and left; otherwise take the larger of the cell above and
            the cell to the left.
          example: Two people comparing their shopping lists tick off matching items in order, and when items differ they try
            skipping one item from either list and keep whichever choice ticks off more.
      - title: Edge cases and ties
        minutes: 30
        build: "Add your own cases: one empty string, a single letter, one string inside the other, and a pair with two
          equally long answers. Write the tie test so it accepts any correct answer."
        outcome: All your tests pass, and the tie test checks the length and that the result is a subsequence of both strings,
          not one exact string.
        concepts:
          - unit-tests-first
          - longest-common-subsequence
        hints:
          hint: What must be true of any correct answer, whichever one your function returns?
  - title: From lines to an edit script
    summary: Run the same method on lines, write out the differences, and decide about line endings.
    steps:
      - title: LCS of lines
        minutes: 30
        build: Make your function work on lists of lines as well as strings, comparing whole lines. Write the page's two line
          tests first.
        outcome: The short test gives the single shared line this is the lcs, and the paragraph test gives the two shared
          lines about the weekly challenge and about writing a full application.
        concepts:
          - longest-common-subsequence
        hints:
          hint: A line is now one item, just as a letter was before.
      - title: Write out the differences
        minutes: 45
        build: Write a function that returns the differences, each removed line after a less-than sign and each added line
          after a greater-than sign. Write its tests first.
        outcome: "On the page's sample it returns four lines: the old opening line removed, its new version added, the old
          line about using the challenges removed, and its new version added."
        concepts:
          - edit-scripts
        hints:
          hint: Walk both lists alongside the common subsequence; anything not in it is a removal or an addition.
      - title: Line endings
        minutes: 30
        build: Decide what ccdiff does with carriage returns and a missing final newline, and add a test for each case.
        outcome: Both tests pass, and for each case your notes say what the real diff reports and whether ccdiff matches it.
        concepts:
          - line-endings
        hints:
          hint: Run the real diff on a Windows file against its Unix copy first.
  - title: The ccdiff command and large files
    summary: Build the command with honest exit statuses, measure how it grows, then go beyond the table.
    steps:
      - title: A command that behaves
        minutes: 45
        build: "Build ccdiff: it takes two file paths, prints the differences, and exits 0 for identical files, 1 for
          different files and 2 for trouble, with messages on standard error."
        outcome: ccdiff origcc.txt newcc.txt prints the four lines and exits 1, two identical files print nothing and exit 0,
          and a missing file exits 2 with a message on standard error.
        concepts:
          - cli-subcommands
          - edit-scripts
        hints:
          hint: Check the real diff's exit status in each case before writing yours.
      - title: How the table grows
        minutes: 30
        build: Run ccdiff on pairs of growing files, such as two versions of a long book, and record time and memory.
        outcome: Your notes hold a table of time and memory against file length, and an estimate of the cells needed for two
          100,000-line files.
        concepts:
          - time-space-complexity
          - dynamic-programming
        hints:
          hint: Double the file length and see what happens to the memory.
      - title: Trim what is shared, and compare
        minutes: 45
        build: Strip the shared lines at the start and end before building the table, then write a check that compares ccdiff
          with the real diff on many pairs of files.
        outcome: Large files that differ in a few lines now run in seconds, and the check finds the same numbers of removed
          and added lines as the real diff on every pair.
        concepts:
          - time-space-complexity
          - differential-testing
        hints:
          hint: Count lines starting with a less-than or greater-than sign on both sides, since the real diff also prints change
            headers.
      - title: Fewer edits, faster
        minutes: 60
        build: "Beyond the challenge: replace the table with a search that explores edit scripts in order of how many edits
          they make, keeping only the furthest point reached on each diagonal."
        outcome: On two versions of a long book that differ in a few lines, ccdiff finishes in about a second with the same
          numbers of removed and added lines as before.
        concepts:
          - myers-diff
        hints:
          hint: Draw the grid for two short lists and mark the free diagonal moves before you write anything.
      - title: Unified output
        minutes: 45
        build: "Beyond the challenge: add a -u option that prints unified hunks with three lines of context and correct line
          ranges."
        outcome: Applying your -u output to the old file with patch reproduces the new file exactly, on the page's sample and
          on two versions of a long book.
        concepts:
          - unified-diff-format
        hints:
          hint: Check that each hunk header's counts equal the context plus removed lines, and the context plus added lines.
