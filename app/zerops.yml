# Zerops: one Node.js service (hostname app) running `next start`, and one PostgreSQL service (hostname db).
# The server loads the schema, seeds and app migrations into db on first boot (lib/db.ts).
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next
        - node_modules
        - package.json
        - next.config.ts
        - public
        - vendor
        - db
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        DATABASE_URL: ${db_connectionString}
      # ANTHROPIC_API_KEY is a secret the owner sets on the app service in the Zerops GUI.
      start: npm start
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health
