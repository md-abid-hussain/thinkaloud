# Coding Challenges, Build your own Redis server. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-redis . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-redis
  title: Build your own Redis server
  source_url: https://codingchallenges.fyi/challenges/challenge-redis
  level: intermediate
  status: generated
  figure:
    kind: kv
  summary: A small Redis-compatible server on port 6379 that speaks the Redis protocol, keeps keys in memory with
    optional expiry, serves many clients at once, supports counters and lists, saves its data to disk and can be
    measured against the real Redis with redis-benchmark.
  requirements:
    - Encode and decode every RESP type, including the null bulk string, and reject malformed input
    - Listen on port 6379 and answer PING with PONG and ECHO with its argument
    - Store values with SET and read them with GET, replying in the format the real Redis uses
    - Serve many clients at the same time without errors, checked with redis-benchmark
    - Support the expiry options EX, PX, EXAT and PXAT on SET
    - Add EXISTS, DEL, INCR, DECR, LPUSH, RPUSH and SAVE, and load the saved data on startup
  primer:
    what: Redis is a database that keeps all its data in memory and answers commands sent over a network connection, such
      as SET to store a value under a key and GET to read it back. Clients and server talk in a simple text-like
      format called RESP. You will build a small server that speaks RESP on port 6379, so the real redis-cli and
      redis-benchmark tools can talk to it.
    why: Holding data in memory makes every command fast, which is why Redis is used for caches, sessions and counters.
      Building it teaches how a protocol marks where one message ends on a stream of bytes, and how a server stays
      correct when many clients change the same data.
    example: When you type PING in redis-cli, the client sends an array holding one bulk string. On the wire that is a
      star and the digit 1, then a carriage return and a newline. Next comes a dollar sign and the digit 4, the length
      of the word, then a carriage return and a newline, then the four letters P, I, N and G, and one more carriage
      return and newline. Your server reads that, and replies with a plus sign, the word PONG and a carriage return
      and newline.
    words:
      - term: RESP
        meaning: The Redis protocol. The first byte of each value says its type, and every line ends with a carriage return
          and a newline.
      - term: carriage return and newline
        meaning: The two bytes that end every line in RESP, often written as CRLF. Together they count as 2 bytes.
      - term: simple string
        meaning: A short reply that starts with a plus sign, such as OK or PONG. It cannot contain a line break.
      - term: bulk string
        meaning: A string that starts with a dollar sign and its length in bytes, so it can hold any bytes at all.
      - term: array
        meaning: A list of values that starts with a star and the number of items it holds. Clients send every command as an
          array.
      - term: key
        meaning: The name a value is stored under, such as Name in SET Name John.
  restate_rubric:
    - id: r1
      point: It is an in-memory key-value server that clients talk to over TCP using the Redis protocol
    - id: r2
      point: It handles commands such as PING, ECHO, SET and GET, plus expiry, counters and lists
    - id: r3
      point: It serves many clients at once and can save its data to disk and load it again on startup
  reflection_prompt: In your own words, what decided how fast and how correct your server was under fifty clients at
    once, and what would you change to make it survive a crash without losing recent writes?
  reference_tool: The real Redis server with redis-cli and redis-benchmark, run locally on the same machine as your server.
  done_when: redis-cli and redis-benchmark work against your server for every command in the challenge; expiry,
    counters, lists and saving give the same replies as the real Redis; 50 clients incrementing one key never lose an
    update; a SAVE interrupted by a kill still leaves a loadable file; and your notes compare your benchmark numbers
    with the real Redis and explain the difference in your own words.
  open_checks:
    - The exact error replies the real Redis gives for a wrong number of arguments and for a wrong type.
    - Whether redis-benchmark uses pipelining by default, and how many connections it opens.
    - How your language reports that a client has closed its connection.
    - What your operating system needs, beyond flushing the file, for a rename to survive a power cut.
    - Which part of the gap with the real Redis comes from the data structure, from locking, and from system calls.
learning_map:
  - concept: resp-protocol
    where: Every command and reply your server handles is a RESP value. Clients send arrays of bulk strings, and each
      reply type, from OK to a missing key, has its own encoding.
    explain_back:
      prompt: A client stores a small image under a key, and the image bytes happen to contain a carriage return and a
        newline. Explain how RESP lets the server read the value correctly, and why a protocol that ended every value
        at the first line break would fail here.
      rubric:
        - id: e1
          point: A bulk string starts with its length in bytes, so the reader knows how many bytes to take before reading them
        - id: e2
          point: The reader never searches the value for a line ending, so any byte, including a line break, can be part of the
            value
        - id: e3
          point: A protocol that ends values at a delimiter would cut the image at the first line break and misread the rest as
            a new message
  - concept: message-framing
    where: TCP delivers a stream of bytes, so one read can hold half a command or several commands. Your server needs a
      buffer per connection that it turns into complete commands.
    explain_back:
      prompt: Your server answers redis-cli perfectly, but a client that sends three commands in one write gets only one
        reply, and a large SET sent over a slow link sometimes fails as malformed. Explain both bugs and what the
        server should do instead.
      rubric:
        - id: e1
          point: TCP keeps no message boundaries, so one read can contain several commands or only part of one
        - id: e2
          point: Handling one command per read drops the extra commands that arrived in the same read
        - id: e3
          point: Treating an incomplete command as malformed is wrong; it means the rest has not arrived yet
        - id: e4
          point: Keep a buffer per connection, take out every complete command it holds, and keep the partial one until more
            bytes arrive
  - concept: tcp-sockets
    where: Your server listens on port 6379, accepts a connection for each client, and reads and writes bytes on it until
      the client closes.
    explain_back:
      prompt: Explain what happens from the moment your server starts until it has answered one PING from redis-cli and the
        client has gone away, in terms of the listening socket and the connection.
      rubric:
        - id: e1
          point: The server binds a listening socket to port 6379 and waits for clients
        - id: e2
          point: Accepting a client gives a new connection socket for that client, while the listening socket keeps waiting for
            others
        - id: e3
          point: The server reads the request bytes from the connection and writes the reply bytes back on it
        - id: e4
          point: When the client closes, a read reports the end of the stream and the server closes its side and frees the
            connection
  - concept: key-value-store
    where: SET, GET, EXISTS, DEL, INCR, DECR, LPUSH and RPUSH all work on one in-memory map from keys to typed values.
    explain_back:
      prompt: Two web servers each count page views by doing GET on a counter, adding one, and SET-ing the result. The count
        comes out lower than the real number of views. Explain why, and why INCR on the Redis server does not have
        this problem.
      rubric:
        - id: e1
          point: Each server reads the same old value, adds one and writes back, so one of the two updates is lost
        - id: e2
          point: INCR does the read, the addition and the write as one operation on the server, so no other command can run in
            between
        - id: e3
          point: The store keeps the counter as a typed value and refuses INCR on a value that is not an integer, instead of
            corrupting it
  - concept: concurrent-connections
    where: redis-benchmark opens 50 connections at once, and many clients change the same keys. Your server must serve
      them all without errors and without corrupting the store.
    explain_back:
      prompt: Redis serves thousands of clients, yet it runs commands one at a time. Explain how a server can handle many
        connections this way, why it makes each command atomic, and what you must add if you use a thread per client
        instead.
      rubric:
        - id: e1
          point: An event loop waits for whichever connections have data ready and handles them in turn, so one thread can serve
            many clients
        - id: e2
          point: Because only one command runs at a time, no command can see another half-finished, so each command is atomic
        - id: e3
          point: Commands must stay short, because a slow command makes every other client wait
        - id: e4
          point: With a thread per client, the shared store must be protected, for example with a lock, or two threads can
            change it at the same time
  - concept: key-expiry
    where: SET accepts EX, PX, EXAT and PXAT, and expired keys must disappear without your server ever scanning every key.
    explain_back:
      prompt: A cache server holds a million keys that expire in an hour and are never read again. Explain how a server can
        make sure the memory is freed without checking every key, and how you would turn the four expiry options into
        one rule.
      rubric:
        - id: e1
          point: Every option is turned into one absolute expiry time when the command arrives, and a key is expired once the
            current time passes it
        - id: e2
          point: Lazy expiry checks the deadline whenever a key is read and deletes it then
        - id: e3
          point: Active expiry regularly samples a few keys with deadlines and deletes the expired ones, so keys nobody reads
            are still freed
        - id: e4
          point: Neither approach scans every key, so the cost stays small however large the store is
  - concept: snapshot-persistence
    where: SAVE writes the whole store to a file, and your server loads it on startup.
    explain_back:
      prompt: A team must choose between saving a full snapshot every five minutes and appending every write to a log.
        Explain what each choice loses in a crash, what it costs, and which you would pick for a cache and for
        shopping carts.
      rubric:
        - id: e1
          point: A snapshot loses every write since the last snapshot, but the file is compact and quick to load
        - id: e2
          point: An append-only log loses at most the writes not yet flushed, but it grows and must be compacted, and replaying
            it takes longer
        - id: e3
          point: A cache that can be rebuilt can live with snapshots or none, while shopping carts need the log
        - id: e4
          point: Expired keys must not come back when the file is loaded, because their deadlines are absolute times
  - concept: durability-and-fsync
    where: Your SAVE must never leave a corrupt file, even if the server is killed or the machine loses power while it
      writes.
    explain_back:
      prompt: Your server is killed halfway through SAVE, and on restart it cannot load its data file. Explain what went
        wrong, how writing to a temporary file and renaming it fixes it, and what more is needed to survive a power
        cut.
      rubric:
        - id: e1
          point: Overwriting the file in place left a mix of old and new bytes when the process stopped mid-write
        - id: e2
          point: Writing the whole snapshot to a temporary file and then renaming it over the old one means a reader sees either
            the old file or the new one
        - id: e3
          point: A successful write may only be in the operating system cache, so the data must be flushed to disk, for example
            with fsync, before the rename
        - id: e4
          point: Each flush costs time, so how often to flush is a trade-off between speed and how much data can be lost
  - concept: request-pipelining
    where: redis-benchmark and real clients can send many commands before reading any replies, and your server must answer
      every one in order.
    explain_back:
      prompt: A script loads a million keys by sending one SET and waiting for its reply each time, and it takes minutes
        even though the server is idle. Explain why, how pipelining changes it, and what the server must do to support
        it.
      rubric:
        - id: e1
          point: Each command waits a full network round trip, so the round trips, not the server, limit the speed
        - id: e2
          point: Pipelining sends many commands before reading the replies, so one round trip is shared by the whole batch
        - id: e3
          point: The server must handle every complete command already in its buffer and send the replies in the same order
        - id: e4
          point: Pipelining does not make a batch atomic; other clients' commands can still run in between
  - concept: benchmarking
    where: You measure your server against the real Redis with redis-benchmark and explain the difference.
    explain_back:
      prompt: Your server reaches half the requests per second of the real Redis. Explain how you would make the comparison
        fair, which numbers you would report, and where you would look for the cause.
      rubric:
        - id: e1
          point: Run both on the same machine with the same tool, connections, number of requests and value sizes, and repeat
            each run
        - id: e2
          point: Report throughput and latency percentiles such as p50 and p99, not only an average
        - id: e3
          point: Change one thing at a time and look at the data structure, locking between clients, and the number of system
            calls per command
        - id: e4
          point: A pipelined run shows how much of the time was spent waiting on round trips rather than in the server
milestones:
  - title: Speak RESP
    summary: Turn RESP values into data and back, by length rather than by searching, with clear handling of bad and
      incomplete input.
    steps:
      - title: Serialise and parse RESP
        minutes: 45
        build: Write a serialiser and a parser for simple strings, errors, integers, bulk strings and arrays, plus the null
          bulk string and the null array. Test them with the example messages from the challenge.
        outcome: Tests pass for every example message in the challenge, including the null bulk string, the empty bulk string
          and an array of two bulk strings, and each one survives a round trip unchanged.
        concepts:
          - resp-protocol
        hints:
          hint: Let the first byte decide which reader to call, and give each type its own small test.
      - title: Read by length, reject bad input
        minutes: 45
        build: "Make the parser read a bulk string by its stated length, and give three distinct results: a complete value, an
          error, or not enough bytes yet."
        outcome: A bulk string whose value contains a line break round-trips correctly; an unknown type byte and a length that
          is not a number each give an error; and a message cut short reports that more bytes are needed instead of an
          error.
        concepts:
          - resp-protocol
          - message-framing
        hints:
          hint: Ask what the parser should say when the bytes simply stop in the middle of a value.
          example: A courier is told a parcel holds 12 letters, so they wait for exactly 12; they never open the letters to look
            for a "the end" note.
  - title: A server that answers
    summary: Listen on port 6379, answer PING and ECHO, frame commands from the byte stream, and store keys with SET and GET.
    steps:
      - title: Listen and answer PING and ECHO
        minutes: 45
        build: Start a server on port 6379 that accepts connections, parses each command with your parser and answers PING
          with PONG and ECHO with its argument.
        outcome: redis-cli PING prints PONG, and redis-cli ECHO "Hello World" prints "Hello World".
        concepts:
          - tcp-sockets
          - resp-protocol
        hints:
          hint: Keep the listening socket and the per-client connection separate in your mind; each has its own job.
      - title: One read is not one command
        minutes: 30
        build: Give each connection its own input buffer, take out every complete command it holds, and keep a partial command
          until the rest arrives.
        outcome: Two commands sent in one write get two replies in order, and one command split across two writes gets exactly
          one reply.
        concepts:
          - message-framing
          - tcp-sockets
        hints:
          hint: Send the test bytes yourself with a raw TCP tool such as netcat, so you control how they are split.
      - title: SET and GET
        minutes: 45
        build: Keep values in a map in memory. SET stores a value and replies OK, GET returns it, a missing key gets the null
          reply, and a command with the wrong number of arguments gets an error reply.
        outcome: redis-cli set Name John prints OK, get Name prints "John", get of a missing key prints (nil), and a SET with
          one argument prints an error like the real Redis.
        concepts:
          - key-value-store
        hints:
          hint: Check each reply against the command's page in the Redis docs, including its type.
  - title: Many clients at once
    summary: Serve many connections without errors and without corrupting shared data.
    steps:
      - title: Concurrent clients
        minutes: 60
        build: Serve many clients at the same time, either with a thread per client or with an event loop, and protect the
          store so two commands never change it at once.
        outcome: redis-benchmark -t SET,GET -q, which opens 50 connections, runs to the end with no errors, and your notes say
          which model you chose and how the store is protected.
        concepts:
          - concurrent-connections
          - key-value-store
        hints:
          hint: If it is slow, add -n 1000 to the benchmark; the goal here is no errors, not speed.
          example: A post office can have one clerk who serves whoever is ready next very quickly, or a clerk per customer who
            must take turns with the one shared ledger.
  - title: Expiry, counters, lists and saving
    summary: Expire keys cheaply, add counters and lists that are safe under many clients, and save and load the data safely.
    steps:
      - title: Expiry options on SET
        minutes: 45
        build: Accept EX and PX for a duration and EXAT and PXAT for an absolute time, turning each into one absolute expiry
          moment for the key.
        outcome: Automated tests set a key with each option and show it readable before its expiry and gone after it, and an
          EXAT time already in the past leaves no key.
        concepts:
          - key-expiry
        hints:
          hint: Decide the one form you will store, and convert to it as soon as the command arrives.
      - title: Expire keys nobody reads
        minutes: 30
        build: Check the deadline whenever a key is read, and add a light background task that samples a few keys with
          deadlines and removes the expired ones.
        outcome: After setting 100,000 keys with a short expiry and never reading them, your server's key count drops back
          towards zero on its own, and GET stays as fast as before.
        concepts:
          - key-expiry
        hints:
          hint: How can you find expired keys without ever looking at all of them at once?
      - title: EXISTS, DEL, INCR and DECR
        minutes: 45
        build: Add EXISTS and DEL for one or more keys, and INCR and DECR, which change a stored integer by one on the server.
        outcome: The replies match the real Redis, including INCR on a missing key giving 1 and INCR on a non-number giving an
          error, and 50 clients each running INCR 1,000 times on one key leave exactly 50,000.
        concepts:
          - key-value-store
          - concurrent-connections
        hints:
          hint: Run the same commands against the real Redis and compare reply by reply.
      - title: Lists with LPUSH and RPUSH
        minutes: 30
        build: Add LPUSH and RPUSH, which add values to the head or the tail of a list and reply with its new length, and
          refuse them on a key that holds another type.
        outcome: The replies match the real Redis, including the new length after each push and the wrong-type error when
          pushing onto a key that holds a string.
        concepts:
          - key-value-store
        hints:
          hint: Which structure makes adding at both ends cheap?
      - title: SAVE and load on startup
        minutes: 60
        build: Make SAVE write the whole store to a temporary file, flush it to disk and rename it over the data file, and
          load that file when the server starts.
        outcome: After SAVE and a restart, GET returns the saved values and keys whose expiry passed while the server was down
          are gone; killing the server in the middle of SAVE still leaves a file that loads.
        concepts:
          - snapshot-persistence
          - durability-and-fsync
        hints:
          hint: "Test the crash case on purpose: stop the process while it is writing a large store."
  - title: Measure against Redis
    summary: Benchmark your server against the real Redis and explain the gap.
    steps:
      - title: Benchmark against the real Redis
        minutes: 45
        build: Run redis-benchmark with -t set,get -n 100000 -q against your server and against a local real Redis on the same
          machine, then once more with pipelining turned on with -P 16.
        outcome: Your notes hold a table of requests per second and p50 latency for SET and GET on both servers, with and
          without pipelining, and one sentence on what you think explains the difference.
        concepts:
          - benchmarking
          - request-pipelining
        hints:
          hint: Repeat each run a few times before you trust a number.
