profile:
  learns: network-protocols
  also: []
  runs_as: client
  reason: The project teaches how a client writes an HTTP/1.1 request by hand onto a TCP socket, resolves the host and
    port, and finds where a response ends, which is the wire protocol implemented directly on sockets.
  contract:
    run: <run> [-v] [-X METHOD] [-H HEADER] [-d DATA] URL
    input: Arguments only. The URL is the last argument and always points at the sandbox's local stub server over plain
      http. -X takes the method, -d takes the body as one string, -H takes one header line, and -v turns on verbose
      output. The sandbox always passes -X explicitly, so the learner never has to infer the method from -d. Options
      may come in any order. There is no standard input and no file argument.
    output: "Standard output carries the response body, standard error carries the verbose lines, and the exit code is
      read too. The sandbox also reads what the stub received: the request line, the headers and the exact body
      bytes."
    settings: []
  oracle: stub
  reference_tool: curl
  fixtures: []
  steps:
    - step: s0
      check: auto
      why: The sandbox builds the program and runs it once against the local stub.
    - step: s1
      check: manual
      why: It prints the request without sending it, and later steps send it, so this can't run alone.
    - step: s2
      check: partly
      why: The stub records the request bytes and the body must reach stdout; the layout of printed headers is the learner's
