stage0:
  summary: "You build a calculator that takes one arithmetic expression as plain text, such as a sum with brackets, and
    prints its value. The input mixes numbers, the four basic operators and parentheses, and the answer must follow
    the usual order of operations. The program has to decide what counts as a valid expression and report a clear
    message when the text is not one. What makes it harder than it looks is that the text is only a line of
    characters: the program must find the numbers and operators, work out how they group, and then compute the result.
    Splitting the line on spaces or evaluating strictly left to right gets many expressions wrong."
  questions:
    - id: p-what
      kind: what
      prompt: A user types an expression and the program prints one result. What counts as a valid expression, and what
        should the program report when the text is not valid? Answer in plain words.
      looks_for:
        - valid input is numbers, the four operators and parentheses arranged in a well-formed order
        - the usual order of operations and grouping decide what the answer means
        - invalid text gets a message saying what is wrong, not a made-up number
        - spaces between tokens should not change the answer
    - id: p-why
      kind: why
      prompt: A calculator only adds, subtracts, multiplies and divides, so why would anyone spend time reading expressions
        as text? Name one everyday tool that does the same kind of job and say what it reads.
      looks_for:
        - reading text is the step between what a person types and what a machine computes
        - spreadsheet formulas, search filters, config files and compilers all read text with structure
        - the program must work out the meaning from how the text is arranged, not just from which characters appear
    - id: p-how
      kind: how
      prompt: Before writing any code, how would you split the job of turning a typed expression into a number? Name the
        stages and what each one produces.
      looks_for:
        - first break the characters into tokens such as numbers, operators and brackets
        - then work out how the tokens group, which operators bind tighter and where brackets apply
        - then compute the result from that structure
        - check for invalid input at each stage, not only at the end
questions:
  - id: s1-q1
    step: s1
    concept: tokenising-expressions
    prompt: Your scanner reads -3 as one negative number token. A user types 5-3 and gets an error about two numbers with
      no operator between them. What goes wrong, and how should the scanner tell a sign from a subtraction?
    looks_for:
      - a minus after a number is a subtraction, not a sign
      - reading -3 as one token leaves two numbers in a row
      - the token before the minus tells the two uses apart
      - giving each use its own token means later stages don't have to guess
  - id: s1-q2
    step: s1
    concept: number-representation
    prompt: A user types 7 / 2 and gets 3. What decision produced that answer, and what would you choose instead?
    looks_for:
      - integer division drops the fraction
      - whole or decimal results should be chosen on purpose
      - floating point keeps the fraction but stores it in binary, so many decimals are approximate
      - the choice should be stated to the user
  - id: s1-q3
    step: s1
    concept: malformed-input
    prompt: A user types 4 + * 2 and your program prints a crash trace instead of a message. What should the program
      check, and what should the message say?
    looks_for:
      - an operator cannot follow an operator, so the bad token is caught where it appears
      - the message names what was expected, what was found and where
      - the message goes to standard error with a non-zero exit code
      - a crash means the error was found too late, after the input was accepted
  - id: s2-q4
    step: s2
    concept: precedence-associativity
    prompt: A user types (1 + 1) * 5 and expects 10, but your calculator, which multiplies first, gives 6. What does the
      bracket change that the precedence ranking alone cannot, and why?
    looks_for:
      - brackets make the enclosed part finish before the operators outside it
      - precedence only ranks operators against each other, so it cannot group a whole part
      - the closing bracket ends that part, so outside operators don't reach inside
  - id: s2-q5
    step: s2
    concept: infix-postfix-shunting-yard
    prompt: Your converter turns 8 - 3 - 2 into the postfix form 8 3 2 - -, which means 8 minus (3 minus 2). What is wrong
      with the rule that pops operators, and what should it do with equal operators?
    looks_for:
      - when a new operator arrives, waiting operators that bind tighter are popped first
      - equally tight operators are popped too when the operator groups from the left
      - without that, the earlier minus waits too long and the grouping flips
  - id: s2-q6
    step: s2
    concept: stack-evaluation
    prompt: Your evaluator reads 7 2 - and returns -5 instead of 5. Which value is the left operand, and what does that
      say about the order you pop in?
    looks_for:
      - the first value popped is the right operand, the second is the left
      - subtraction and division depend on order, while addition and multiplication do not
      - the stack holds operands in the order they were pushed, so pops come off in reverse
  - id: s3-q7
    step: s3
    concept: infix-postfix-shunting-yard
    prompt: You add sine, and a user types sin(1 + 2) * 3. Where does sine wait in your conversion, and what makes it
      leave the stack?
    looks_for:
      - sine waits on the stack like an operator
      - it leaves once its bracketed argument is finished, not when the next operator arrives
      - the argument goes to the output first, so sine follows it out
  - id: s3-q8
    step: s3
    concept: number-representation
    prompt: Your test compares your sine of 1 with a trusted calculator's value digit for digit, and fails in the last
      place. Why does that happen, and how should the comparison be written?
    looks_for:
      - floating point stores an approximation, so two correct results can differ in their last bits
      - compare within a tolerance chosen for the size of the numbers
      - the trusted tool must use the same angle unit as your program
  - id: s3-q9
    step: s3
    concept: test-driven-development
    prompt: Your test table is filled in by running your program and copying its output into the expected column. Every
      test passes, so you feel safe changing the design. What is the weakness, and where should the expected values
      come from?
    looks_for:
      - the tests only confirm the program agrees with itself, so its bugs are locked in
      - expected values come from working by hand or from a trusted tool
      - a new test should fail before the code exists, to show it checks something
