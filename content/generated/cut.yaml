stage0:
  summary: "You will build a copy of the Unix cut tool, a small command that picks chosen columns out of lines of text.
    It reads a file or whatever arrives through standard input, and writes only the chosen parts of each line to
    standard output. The selection looks easy, but deciding exactly where one field ends and the next begins is the
    hard part, and the edge cases such as empty fields, repeated delimiters and lines with no delimiter all have fixed
    answers. The tool also has to behave like a good Unix filter: it must handle input of any size, keep errors out of
    the data stream, and report success or failure through its exit status. Matching the real tool's output is how you
    check your understanding, not the goal in itself."
  questions:
    - id: p-what
      kind: what
      prompt: Your tool takes lines of text, a delimiter and a list of field positions. What goes in, what comes out, and
        what exactly is a field here?
      looks_for:
        - input is lines from a named file or from standard input
        - output is only the chosen fields of each line, written to standard output
        - a field is the text between delimiters, identified by its position in the line
        - the delimiter is a single character, with a tab as the default
    - id: p-why
      kind: why
      prompt: Why does a tool this small exist at all, when a spreadsheet can also pull out columns? Where would you expect
        people to use it?
      looks_for:
        - quick column extraction from data exports and logs, without opening a spreadsheet
        - used inside scripts, where the output feeds the next command
        - works on files too big for a spreadsheet, or on a live stream
        - small tools that do one job are meant to be chained together
    - id: p-how
      kind: how
      prompt: A friend has a log file far bigger than memory, and another input arrives through a pipe. What is your first
        idea for handling either one?
      looks_for:
        - read and process one line at a time instead of loading everything
        - a pipe has no known length, so the program can't load it all first either
        - write each result out as soon as it is ready
questions:
  - id: s1-q1
    step: s1
    concept: records-and-fields
    prompt: A teammate runs your tool on a tab-separated export where some rows have an empty field 3, so two tabs sit
      side by side. What happens to field 4 and the fields after it on those rows, and why?
    looks_for:
      - two delimiters in a row mean an empty field between them
      - the empty field keeps its position, so later fields do not move left
      - the program must not merge or drop delimiters that sit in a run
  - id: s1-q2
    step: s1
    concept: line-streaming
    prompt: Your program reads a 20 GB file through a fixed-size buffer. A buffer boundary falls in the middle of a line,
      so the first half of that line is printed as a complete record. What goes wrong, and what should the reader do
      with the unfinished part?
    looks_for:
      - the first half of the line is treated as a whole record and gives wrong fields
      - the unfinished part must be kept and joined to the start of the next read
      - a last line with no final newline still counts as a record
  - id: s2-q3
    step: s2
    concept: quoted-csv
    prompt: A colleague runs your comma version on a CSV export where one title holds a comma inside double quotes, as in
      the title Hello, Goodbye. What does field 1 come out as for that row, and what would a correct reader need to
      track?
    looks_for:
      - splitting at every comma ignores the quotes, so the title is cut in two
      - inside quotes a comma is data, so every later field shifts one place
      - a real CSV reader must track whether it is currently inside quotes
  - id: s2-q4
    step: s2
    concept: pipes-and-composition
    prompt: A user pipes your cut on a large file into head -n5. Head exits after five lines, and your program's next
      write fails. What happens to your program, and why should it not print an error message?
    looks_for:
      - head closes its end of the pipe, so the next write fails
      - the program is either ended quietly by a signal or gets a broken pipe error
      - the output is no longer wanted, so stopping quietly is the correct behaviour
  - id: s3-q5
    step: s3
    concept: field-list-grammar
    prompt: A teammate runs your cut with -f3,1,3 and expects the columns in that order. What does your program print, and
      what should it do with the repeated 3?
    looks_for:
      - fields come out in the order they appear in the line, not the order listed
      - each field is printed only once however often it is listed
      - the list is parsed once into a set of selected positions
  - id: s3-q6
    step: s3
    concept: records-and-fields
    prompt: A file mixes lines with commas and lines with no comma at all. You run -f1,2 with a comma as the delimiter.
      What does your program print for a line with no comma, and why?
    looks_for:
      - a line with no delimiter is one field, so the whole line is field 1
      - the line is printed once, with no added delimiter and no invented field 2
  - id: s4-q7
    step: s4
    concept: filter-contract
    prompt: A user has a file literally named - in the current folder. They run your cut with -f1 and - as the file
      argument, expecting that file to be read. What does your program read, and how could they name the file?
    looks_for:
      - a lone dash means standard input, so the pipe is read instead of the file
      - a path such as ./- names the file unambiguously
      - standard input is read when no file name is given at all
  - id: s4-q8
    step: s4
    concept: line-streaming
    prompt: A monitoring script pipes a log that never ends into your cut and expects each line as it arrives. Why does a
      version that reads all its input before printing fail, and what does the streaming version do instead?
    looks_for:
      - reading everything first waits for an end of input that never comes, so nothing prints
      - streaming handles one line at a time and writes its fields straight away
      - memory use stays about the same whatever the length of the input
  - id: s5-q9
    step: s5
    concept: pipes-and-composition
    prompt: A colleague counts distinct artists by piping your cut output into uniq and then wc -l. The file is listed by
      song title, so the same artist appears on rows far apart, and the count is far too high. Why, and what must come
      before uniq?
    looks_for:
      - uniq only merges repeated lines that sit next to each other
      - an artist on rows far apart is counted again each time it appears
      - sorting the artist column first groups equal values so uniq can count each once
