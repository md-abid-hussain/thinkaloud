stage0:
  summary: You build a small web service, like the link shorteners people use to share long web addresses. A client
    sends in a long address and gets back a short code and the short address that contains it. Anyone who opens the
    short address should be sent on to the original page. The hard part is that each short code must always point to
    exactly one long address, the same long address should keep getting the same short link, and deleting a link has
    to really remove it. Because anyone on the internet can submit anything, the service also has to decide which
    input it accepts.
  questions:
    - id: p-what
      kind: what
      prompt: A client posts a long address to the service, opens a short one, and later asks to delete it. What does each
        of those requests promise the client, and what does the client get back?
      looks_for:
        - posting a long address returns a short code, the long address and the short address, and posting it again
          returns the same link
        - opening a short address sends the visitor on to the original address
        - deleting removes the link, and asking to delete an unknown link still gets a clear answer
    - id: p-why
      kind: why
      prompt: Who calls this service, and what would those callers lose if it went down or started giving different answers
        for the same link?
      looks_for:
        - other programs, scripts and people clicking links rely on it
        - a short link shared in a post or printed somewhere has to keep working for as long as people expect
        - a changed or missing answer breaks everyone who stored or repeated the short address
    - id: p-how
      kind: how
      prompt: The service may restart at any time, and more than one copy of it may run at once. Where would you keep the
        short codes and their long addresses so they are not lost, and why?
      looks_for:
        - keep them outside the running program, in a database or file, so a restart does not wipe them
        - a memory-only store works for a quick try but loses every link on restart
        - copies running side by side must all see the same data, so the store has to be shared
        - the store must find a link by its code quickly
questions:
  - id: s1-q1
    step: s1
    concept: short-keys
    prompt: Your service already holds many links, and a new long URL gets a short key that belongs to a different URL.
      Why can a clash happen this early even with a good hash, and what should the service do before saving?
    looks_for:
      - clashes come far sooner than the total number of possible keys suggests
      - check whether the key already maps to a different URL before saving
      - on a clash, derive a new key, for example by adding a value to the input and hashing again
      - a counter avoids clashes but makes codes sequential and guessable
  - id: s1-q2
    step: s1
    concept: url-validation
    prompt: A user submits a link that uses an unusual scheme, or points at an address on your own private network. If you
      store it as sent, what risk does it create for visitors and for your domain, and what should you check first?
    looks_for:
      - parse the URL and check its parts rather than storing the raw text
      - accept only schemes you are willing to send people to, such as http and https
      - short links hide the real target, so accepting anything lets your domain be used for phishing or hidden
        redirects
      - reject bad input with a clear 400 response rather than storing it
  - id: s2-q3
    step: s2
    concept: redirects
    prompt: Later, the owner of a short link wants it to point somewhere new, and browsers have already visited it. Why
      would a permanent redirect cause trouble here, and which code should you send instead?
    looks_for:
      - 301 lets browsers remember the redirect and skip your server on later visits
      - a remembered target keeps sending people to the old address after you change it
      - a temporary code such as 302 makes every visit come back to you, so you can change or count
      - the Location header carries the target in both cases
  - id: s2-q4
    step: s2
    concept: http-basics
    prompt: A visitor opens a key that was deleted, and your service replies 200 with the text URL not found in the body.
      Why is that a problem for a monitoring tool or a link checker, and what should the status be?
    looks_for:
      - the status code is what machines read, so 200 says the request succeeded
      - clients, caches and monitors judge the outcome from the code, not the body
      - a missing resource should return 404 Not Found, with the message kept as a short body
      - the status code and the body have separate jobs
  - id: s3-q5
    step: s3
    concept: idempotency
    prompt: A client's DELETE times out, so it sends the same DELETE again, and the link is already gone. What should the
      second call return, and why is it safe to retry?
    looks_for:
      - "the state after one call and after two calls must match: the link is gone"
      - the client can't tell whether the first call worked, so retrying is its safe option
      - a success response on the retry means the client doesn't treat it as an error
      - a 404 on the retry would look like a failure to a client that never saw the first call succeed
  - id: s3-q6
    step: s3
    concept: persistence
    prompt: The service restarts right after a link is deleted. Why must the link stay gone, and what must the delete do
      for that to hold?
    looks_for:
      - data held only in memory vanishes on restart, so the delete must reach the durable store
      - a delete that only changes an in-memory copy brings the link back after a restart
      - the store is the source of truth, so the delete should be saved there before the service answers
  - id: s4-q7
    step: s4
    concept: api-contract
    prompt: The web form and a command-line client both read the key from the response, and someone renames that field.
      What breaks for them, and why is a field name part of the contract?
    looks_for:
      - clients parse exact field names, so a rename breaks them without any server error
      - the response shape is a promise that clients depend on
      - a safer change adds the new field and keeps the old one until clients move, or versions the API
      - changes to requests and responses should be checked against the clients that use them
  - id: s4-q8
    step: s4
    concept: cross-origin-requests
    prompt: The form is served on one port and calls the API on another, and the browser blocks the response with a CORS
      error. Why does the browser block it, and what is the wrong fix?
    looks_for:
      - the same-origin policy stops a page from reading responses from another origin
      - the API must opt in with CORS headers that name the allowed origin
      - allowing every origin just to silence the error opens the API to any site
      - some requests are preceded by a preflight request asking permission
  - id: s5-q9
    step: s5
    concept: ci-cd
    prompt: A change breaks a test, but the pipeline still deploys it to production. What's wrong, and what should stop
      the deploy?
    looks_for:
      - deploy should run only after the build and tests pass
      - a failing test is the signal that should block the release
      - users get the broken version otherwise
      - the gate belongs in the pipeline's rules, not in someone's memory
