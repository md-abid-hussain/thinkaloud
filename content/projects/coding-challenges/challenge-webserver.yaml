# Coding Challenges, Build your own web server. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-webserver . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-webserver
  title: Build your own web server
  source_url: https://codingchallenges.fyi/challenges/challenge-webserver
  level: intermediate
  status: generated
  figure:
    kind: net
  summary: An HTTP server built on a bare TCP socket. It reads each request, serves files from a www folder, handles
    many clients at the same time, and refuses any request that tries to reach a file outside that folder.
  requirements:
    - Listen on a TCP port on localhost and read the request line and headers of each request
    - Reply with a status line, an empty line and a body, then close the connection
    - Serve files from a www folder, mapping / and /index.html to index.html
    - Answer 404 Not Found when no file matches the path
    - Serve several clients at the same time, so a slow one does not hold up the others
    - Never send a file from outside www, and let the user choose the www folder at startup
  primer:
    what: "A web server waits for browsers and tools such as curl to connect over TCP, reads the text request each one
      sends, and writes back a text reply. A request starts with a request line made of three parts separated by
      single spaces: the method, the path and the HTTP version. Header lines follow, one per line, and an empty line
      ends them. You will build a server that sends files from a folder called www to many clients at once, without
      letting anyone read files outside it."
    why: Every web page reaches you this way, and HTTP/1.1 is plain text, so you can read and write it yourself. Building
      a server shows how a stream of bytes becomes separate messages, and why anything a stranger sends must be
      checked.
    example: "Visiting http://localhost/ with curl sends the request line GET / HTTP/1.1, so the method is GET, the path
      is a single slash and the version is HTTP/1.1. A few header lines such as Host: localhost follow, then an empty
      line. The server answers with the status line HTTP/1.1 200 OK, an empty line and a body, then closes the
      connection."
    words:
      - term: socket
        meaning: One end of a network connection. A program reads bytes from it and writes bytes to it, like a file.
      - term: port
        meaning: A number that picks which program on a machine receives a connection. Web servers usually listen on 80.
      - term: request line
        meaning: The first line of a request, holding the method, the path and the HTTP version, separated by spaces.
      - term: header
        meaning: A line of the form name, colon, value, such as Host followed by localhost, that adds a detail to a message.
      - term: CRLF
        meaning: A carriage return followed by a line feed, the two bytes that end every line of an HTTP message.
      - term: status line
        meaning: The first line of a reply, holding the version, a status code such as 200 or 404, and a short phrase.
  restate_rubric:
    - id: r1
      point: It is an HTTP server that accepts TCP connections, reads each request and writes back a reply
    - id: r2
      point: It serves files from a www folder, giving index.html for / and 404 when a file is missing
    - id: r3
      point: It serves several clients at once and refuses paths that lead outside www
  reflection_prompt: In your own words, how does your server turn the bytes arriving on a socket into a safe reply, and
    what would you change to serve thousands of clients at once?
  reference_tool: curl as the client, with -i to see the status line and headers and -v to see connection reuse, plus a
    web browser for pages with styles and images.
  done_when: The server serves index.html and other files from a www folder chosen at startup, with correct status
    codes, Content-Type and Content-Length; seven slow requests are served side by side; idle and slow clients are
    timed out; kept-alive connections carry several requests; no traversal attempt returns a file from outside www;
    Ctrl+C lets requests in progress finish; and your notes explain, in your own words, how bytes on a socket become a
    safe reply.
  open_checks:
    - Whether binding to port 80 needs administrator rights on your system.
    - Whether your client tool rewrites .. in a path before sending it; curl does unless given --path-as-is.
    - What your platform does when more clients connect than the listen backlog allows.
    - Whether a traversal attempt should answer 403 Forbidden or 404 Not Found, and which reveals less.
learning_map:
  - concept: tcp-sockets
    where: Your server opens a listening socket on a port, accepts each browser or curl connection as a new socket, and
      reads the request as a stream of bytes.
    explain_back:
      prompt: You start your server on 127.0.0.1 port 8080. A colleague on the same Wi-Fi cannot reach it, and a second copy
        of the server refuses to start. Explain both, and describe what happens between a client connecting and your
        code reading its first bytes.
      rubric:
        - id: e1
          point: "The address decides who can connect: 127.0.0.1 accepts only connections from the same machine, while 0.0.0.0
            accepts them from the network"
        - id: e2
          point: Only one program can listen on a given address and port, so the second copy cannot bind it while the first
            holds it
        - id: e3
          point: The operating system completes the handshake and queues the connection; accepting it gives the server a new
            socket for that client while the listening socket keeps waiting
        - id: e4
          point: The new socket is a two-way byte stream, and a read returns whatever bytes have arrived so far
  - concept: message-framing
    where: A request can arrive in several pieces or glued to the next one, so your server buffers bytes until it has seen
      the empty line that ends the head, and uses Content-Length for a body.
    explain_back:
      prompt: Your server works with curl on your laptop, but a user on a slow mobile network sometimes gets a "bad request"
        error. Explain why that can happen, and how a server should read a request so that it never depends on how the
        bytes were split.
      rubric:
        - id: e1
          point: TCP keeps no message boundaries, so on a slow network a request can arrive split across several reads
        - id: e2
          point: A server that parses after a single read sees an incomplete request and rejects it
        - id: e3
          point: The server should keep appending reads to a buffer until the end marker arrives, the empty line for the head
            and Content-Length bytes for a body
        - id: e4
          point: Bytes left over after one message belong to the next and must be kept
  - concept: http-message-format
    where: You parse the request line and headers, and write a status line, headers and an empty line before every body.
    explain_back:
      prompt: A monitoring tool reports your site as healthy even when pages are missing, and a script that calls your
        server cannot tell "file missing" from "request malformed". Explain how the HTTP status line and codes should
        be used so that programs understand your replies.
      rubric:
        - id: e1
          point: Every reply starts with a status line holding the version, a three-digit code and a phrase, and programs act on
            the code, not the phrase
        - id: e2
          point: "The first digit gives the class: 2 for success, 4 for a client mistake, 5 for a server failure"
        - id: e3
          point: A missing file is 404 Not Found and a malformed request is 400 Bad Request, so each needs its own code
        - id: e4
          point: Sending an error page with 200 makes every program think the request succeeded
  - concept: static-file-serving
    where: Your server maps URL paths to files in the www folder, sends them as bytes, and labels them with Content-Type
      and Content-Length.
    explain_back:
      prompt: Your page loads, but its stylesheet has no effect and its logo shows as a broken image. Explain what the
        server must tell the browser about each file, and why the file name alone is not enough.
      rubric:
        - id: e1
          point: The server must send a Content-Type such as text/css or image/png, because browsers decide how to treat a
            response from that header, not from the name
        - id: e2
          point: Files, especially images, must be read and sent as raw bytes, never decoded as text, or they are corrupted
        - id: e3
          point: Content-Length must give the exact number of bytes so the browser knows where the body ends
  - concept: text-encoding-utf8
    where: Content-Length counts bytes, not characters. A page with accented letters or emoji has more bytes than
      characters, which is the same gap you met in wc.
    explain_back:
      prompt: A page containing the word café is cut off by one character in the browser, but only on pages with accents.
        Explain the likely bug in the server, using how UTF-8 stores text.
      rubric:
        - id: e1
          point: UTF-8 stores é in two bytes, so café has 4 characters but 5 bytes
        - id: e2
          point: If the server sets Content-Length to the number of characters, it announces fewer bytes than it sends, and the
            browser stops reading early
        - id: e3
          point: Content-Length must be the byte length of the body exactly as it is sent
  - concept: untrusted-paths
    where: The request path is chosen by whoever connects. Your server must resolve it inside www and refuse anything that
      lands outside.
    explain_back:
      prompt: Someone requests /../../etc/passwd, and later /%2e%2e/%2e%2e/etc/passwd, from your server. Explain what they
        are trying to do, why removing ".." from the text is not a safe fix, and what check actually keeps the server
        inside www.
      rubric:
        - id: e1
          point: "They are trying directory traversal: each .. climbs one folder up, out of www to a system file"
        - id: e2
          point: Text filters can be bypassed with percent-encoding, doubled patterns or other separators, so checking the raw
            string is not enough
        - id: e3
          point: The server should decode the path, resolve it against www, normalise it, and serve it only if the result is
            inside www
        - id: e4
          point: The containment check must compare whole folder names, so a sibling folder such as www-private does not pass
  - concept: concurrent-connections
    where: When one client is slow, the others must still be served, so each connection is handled by its own thread, a
      pool or an event loop.
    explain_back:
      prompt: Your server answers seven simultaneous requests one after another, and each takes 20 seconds, so the last
        client waits more than two minutes. Explain why, compare two ways to fix it, and say what new risk the fix
        brings.
      rubric:
        - id: e1
          point: Handling one connection at a time makes every other client wait until the current one finishes
        - id: e2
          point: A thread per connection, a fixed pool of threads, or an event loop lets the requests run side by side, so all
            seven finish in about 20 seconds
        - id: e3
          point: A thread per connection is simple but costly for many idle clients; a pool caps resources but can fill up; an
            event loop scales but its code must never block
        - id: e4
          point: Anything the connections share, such as a counter or a log, can now be changed by two at once and needs
            protecting
  - concept: slow-client-timeouts
    where: A client that connects and sends nothing, or one byte at a time, holds a connection and maybe a thread. Your
      server closes it after a timeout.
    explain_back:
      prompt: One laptop running a small script makes your server unreachable for everyone, without sending much data.
        Explain how that is possible and what your server needs to protect itself.
      rubric:
        - id: e1
          point: The script opens many connections and sends almost nothing, so each one holds a slot, buffer or thread while
            doing no work
        - id: e2
          point: Once every slot is held, real clients cannot be served, even though the network is barely used
        - id: e3
          point: Read and idle timeouts close connections that do not make progress, with a deadline for the whole request head
            so dribbling bytes does not reset the clock
        - id: e4
          point: Limits on connections, request size and connections per address cap what one client can take
  - concept: http-keep-alive
    where: In HTTP/1.1 a connection stays open after a reply unless someone asks to close it, so your server reads the
      next request from the same socket.
    explain_back:
      prompt: After you add keep-alive, curl hangs after the first reply until it times out. Explain what keep-alive
        changes, why a missing or wrong Content-Length now matters, and what the server must do with idle connections.
      rubric:
        - id: e1
          point: With keep-alive the connection stays open after a reply, so the client cannot use the connection closing to
            find the end of the body
        - id: e2
          point: The client relies on Content-Length to know where the body ends; if it is missing or too large it waits for
            bytes that never come
        - id: e3
          point: "After each reply the server reads the next request from the same socket and honours Connection: close"
        - id: e4
          point: Idle connections still cost resources, so the server closes them after a short timeout
  - concept: graceful-shutdown
    where: When you stop the server with Ctrl+C, requests already in flight should finish before it exits, within a time
      limit.
    explain_back:
      prompt: Every time you restart your server, users downloading files at that moment get cut off. Describe how a server
        should stop so that no request is lost, and what stops a single stuck client from blocking the exit.
      rubric:
        - id: e1
          point: First stop accepting new connections, by closing the listening socket
        - id: e2
          point: Let the requests already in progress finish, and tell kept-alive clients not to send more
        - id: e3
          point: Then close the remaining connections and release resources
        - id: e4
          point: A time limit ends the wait, so one hung client cannot keep the server running forever
  - concept: cli-subcommands
    where: The server takes its www folder as a startup argument, and refuses to start with a clear message and a non-zero
      exit status when the folder does not exist.
    explain_back:
      prompt: A deployment script starts your server with a folder name that has a typo. Explain what the server should
        print, where, and what exit status it should return, and why the script cares.
      rubric:
        - id: e1
          point: The server should refuse to start rather than run serving nothing
        - id: e2
          point: A message naming the missing folder goes to standard error, not standard output
        - id: e3
          point: It exits with a non-zero status, so the script or process manager sees the failure and can stop the deployment
milestones:
  - title: One request, one reply
    summary: Listen on a port, read one HTTP request completely, and write back a well-formed reply.
    steps:
      - title: Listen and accept
        minutes: 30
        build: Open a listening TCP socket on 127.0.0.1, on port 80 or on a port such as 8080 if 80 needs administrator
          rights. Accept one connection at a time and log the raw bytes it sends.
        outcome: Running curl http://localhost:8080/ makes your log show the raw request text, starting with GET / HTTP/1.1.
        concepts:
          - tcp-sockets
        hints:
          hint: "Which socket do you read the request from: the one you listen on, or the one accept gives you?"
      - title: Read the whole request head
        minutes: 45
        build: Keep reading and appending to a buffer until you have seen the empty line that ends the headers. Then split the
          request line into method, path and version, and the header lines into names and values.
        outcome: A request typed slowly by hand with a raw TCP client such as nc or telnet is parsed exactly the same as the
          one curl sends in one go.
        concepts:
          - message-framing
          - http-message-format
        hints:
          hint: Ask when you are allowed to start parsing, not where the request ends in the first read.
          example: A courier who collects a letter page by page does not post it until the last page, the one with the
            signature, has arrived.
      - title: Write a reply
        minutes: 30
        build: "Reply with the status line HTTP/1.1 200 OK, a Content-Length header, an empty line, and the body Requested
          path: followed by the path. Then close the connection."
        outcome: "curl -i http://localhost:8080/hello shows the status line HTTP/1.1 200 OK, a Content-Length that matches the
          body, and the body Requested path: /hello."
        concepts:
          - http-message-format
        hints:
          hint: Look at the reply with curl -i, and check that every line ends with a carriage return and a line feed.
  - title: Serve files from www
    summary: Map paths to files in a www folder, with correct status codes and headers.
    steps:
      - title: Map paths to files
        minutes: 45
        build: Create a www folder with an index.html. Answer / and /index.html with that file and 200 OK, and answer any path
          with no matching file with 404 Not Found.
        outcome: curl -i returns index.html with 200 for / and for /index.html, and 404 Not Found for /missing.html.
        concepts:
          - static-file-serving
          - http-message-format
        hints:
          hint: The challenge page shows 400 for a missing file; check what 400 and 404 each mean before you choose.
      - title: Headers that describe the body
        minutes: 45
        build: Send each file as raw bytes with a Content-Length equal to its size in bytes and a Content-Type chosen from its
          extension. Add a stylesheet and an image to www, and a page with accented letters.
        outcome: A browser shows the page with its styling and image, and curl -i shows a Content-Length equal to each file's
          size on disk, including the page with accents.
        concepts:
          - static-file-serving
          - text-encoding-utf8
        hints:
          hint: Compare the number your server sends with the size the file system reports, not with the number of characters in
            the page.
  - title: Many clients at once
    summary: Serve clients side by side, protect the server from slow clients, and reuse connections.
    steps:
      - title: Serve clients side by side
        minutes: 60
        build: Handle each connection independently, with a thread per connection, a pool, or an event loop. To test it, make
          each request wait 20 seconds before replying and log which worker handled it.
        outcome: Seven curl requests started at the same moment all finish after about 20 seconds, not one after another, and
          the log shows several workers.
        concepts:
          - concurrent-connections
        hints:
          hint: Time the seven requests together, then ask what the server was doing while the first one waited.
          example: A bank with one teller serves the queue one by one; opening more counters lets several customers be served in
            the time it takes to serve one.
      - title: Slow clients and limits
        minutes: 45
        build: Add a read timeout and a deadline for receiving the whole request head, and cap how many connections the server
          handles at once.
        outcome: A client that connects with nc and sends nothing is disconnected after your timeout, and other clients are
          served normally while it waits.
        concepts:
          - slow-client-timeouts
          - concurrent-connections
        hints:
          hint: Connect with a raw client, type nothing, and watch what your server does with that connection.
      - title: Keep connections open
        minutes: 45
        build: "After a reply, read the next request from the same connection unless the client sent Connection: close, and
          close connections that stay idle past a short timeout."
        outcome: Running curl -v with two URLs on your server in one command shows the second request re-using the same
          connection, and both replies are correct.
        concepts:
          - http-keep-alive
          - message-framing
        hints:
          hint: With the connection staying open, how does the client know where your reply ends?
  - title: Safe and well-behaved
    summary: Keep every request inside www, choose the folder at startup, and stop without cutting anyone off.
    steps:
      - title: Stay inside www
        minutes: 45
        build: Decode each request path, resolve it against www, normalise it, and refuse it unless the result is inside www.
          Write tests for traversal attempts.
        outcome: Requests for /../../etc/passwd, the percent-encoded version with %2e%2e, and a sibling folder named
          www-private never return a file's contents. Use curl --path-as-is so curl sends the dots unchanged.
        concepts:
          - untrusted-paths
        hints:
          hint: Attack your own server before you fix it, so you can see each attempt fail afterwards.
      - title: Choose the folder at startup
        minutes: 30
        build: Take the www folder as a startup argument. If it does not exist, refuse to start, with a message on standard
          error and a non-zero exit status.
        outcome: Starting the server with a missing folder prints a message naming it on standard error and exits non-zero;
          with a real folder it serves that folder.
        concepts:
          - cli-subcommands
        hints:
          hint: Check the exit status after the failed start, not only the message.
      - title: Shut down gracefully
        minutes: 45
        build: Catch the interrupt signal from Ctrl+C. Stop accepting new connections, let requests in progress finish, then
          exit, with a time limit for the whole shutdown.
        outcome: Pressing Ctrl+C during one of your 20-second test requests lets that request finish with a full reply, a new
          connection attempt is refused, and the process exits within your time limit.
        concepts:
          - graceful-shutdown
        hints:
          hint: Write down the order of the three things that must happen, then check each one in your logs.
