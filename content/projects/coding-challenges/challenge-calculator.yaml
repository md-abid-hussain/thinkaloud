# Coding Challenges, Build your own calculator. Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-calculator . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-calculator
  title: Build your own calculator
  source_url: https://codingchallenges.fyi/challenges/challenge-calculator
  level: null
  status: generated
  figure:
    kind: tokens
  summary: A calculator that reads an arithmetic expression as text, with plus, minus, times, divide and brackets,
    splits it into tokens, rearranges it into postfix order with the shunting yard algorithm, and evaluates it with a
    stack, respecting precedence and reporting invalid input.
  requirements:
    - Read an expression such as 2 * 3 + 4 and print its value
    - Read numbers with several digits as one number, and reject characters that are not part of an expression
    - Apply times and divide before plus and minus, work equal operators from left to right, and honour brackets
    - Decide between whole-number and floating-point results, and print whole results without a decimal part
    - Convert the expression to postfix order with the shunting yard algorithm and evaluate it with a stack
    - Report invalid input, such as unmatched brackets or a missing number, instead of crashing
    - Keep an automated set of tests that runs on every change
  primer:
    what: "A calculator program takes an expression written as text, a few numbers joined by plus, minus, times and divide
      signs, perhaps with brackets, and prints its value. The hard part is not the arithmetic but the order: times and
      divide happen before plus and minus, and brackets override both. You will build one that splits the text into
      tokens, rearranges them so the order is explicit, and evaluates the result with a stack."
    why: The same three steps, reading tokens, sorting out the order of operators and evaluating with a stack, sit at the
      heart of every interpreter and compiler. A calculator is the smallest program that needs all three.
    example: Take 7 minus 2 times 3. The tokens are 7, minus, 2, times and 3. Times binds tighter than minus, so 2 times 3
      is worked out first, giving 6, and 7 minus 6 gives 1. Working strictly from left to right would give 15, which
      is wrong.
    words:
      - term: token
        meaning: One meaningful piece of the expression, such as a whole number or an operator sign.
      - term: precedence
        meaning: The rule for which operator is applied first. Times and divide come before plus and minus.
      - term: associativity
        meaning: The rule for which of two operators with the same precedence, such as two minus signs in a row, is applied
          first.
      - term: postfix notation
        meaning: Writing each operator after the two numbers it works on, so 2 plus 3 becomes 2, 3, plus. It needs no
          brackets.
      - term: stack
        meaning: A pile where you only add to the top or take from the top.
  restate_rubric:
    - id: r1
      point: The calculator takes an arithmetic expression as text and prints its value
    - id: r2
      point: It respects precedence and brackets, so times and divide happen before plus and minus unless brackets say
        otherwise
    - id: r3
      point: It turns the expression into tokens, converts it to postfix order and evaluates that with a stack
  reflection_prompt: In your own words, how does your calculator decide the order of operations, and what would you
    change to add a power operator or functions such as sin?
  reference_tool: bc, the arbitrary-precision calculator found on most Unix systems, with its scale set to match your division rule.
  done_when: Every example from the challenge gives the right result; equal operators work from left to right; nested
    brackets work; every kind of invalid input gives a clear message on standard error and a non-zero status without
    crashing; the tests run with one command; and a comparison with bc reports no differences. Your notes explain
    precedence, the shunting yard and your number rules in your own words.
  open_checks:
    - How bc divides and rounds with its default scale, and which scale matches your rule.
    - Whether your shell expands an unquoted star on your machine, and how quoting differs between the shells you use.
    - Whether to accept a leading minus sign, as in -3 + 5, and how it interacts with subtraction.
    - What your language does when a number is divided by zero, and what your calculator should report instead.
learning_map:
  - concept: lexical-analysis
    where: "The calculator first turns the text into tokens: whole numbers of several digits, the four operators and
      brackets, skipping spaces and rejecting any character that cannot be part of an expression."
    explain_back:
      prompt: One user types 12+3 with no spaces, and another types 1 2 + 3. Explain how a tokenizer turns each into tokens,
        which input should be rejected and at which stage, and why reading one character at a time is not enough for
        numbers.
      rubric:
        - id: e1
          point: "A tokenizer groups digits that follow each other, and a decimal point if you allow one, into a single number
            token, so 12+3 becomes three tokens: 12, plus and 3"
        - id: e2
          point: Spaces only separate tokens and are dropped, so they are not needed between a number and an operator
        - id: e3
          point: 1 2 + 3 gives valid tokens, but two numbers in a row break the rules of an expression, so a later stage that
            checks the order of tokens rejects it
        - id: e4
          point: A character that cannot start any token, such as a letter, is rejected by the tokenizer itself, ideally with
            its position
  - concept: cli-subcommands
    where: "The expression arrives as a command-line argument, so the shell sees it first: an unquoted star can turn into
      file names. Results go to standard output, errors to standard error with a non-zero exit status."
    explain_back:
      prompt: A user runs your calculator with 2 * 3 unquoted and gets a strange error that mentions file names from their
        folder. Explain what happened, how they should call the tool, and how your tool should behave on invalid
        input.
      rubric:
        - id: e1
          point: The shell expands an unquoted star into the names of the files in the current folder before your program even
            starts
        - id: e2
          point: Quoting the whole expression as one argument, for example in single quotes, hands it to the program unchanged
        - id: e3
          point: On invalid input the tool prints a clear message on standard error, prints nothing on standard output and exits
            with a non-zero status, so scripts can tell it failed
  - concept: operator-precedence
    where: Precedence decides that times and divide bind tighter than plus and minus, and associativity decides that equal
      operators are worked from left to right, so 10 - 4 - 3 is 3, not 9.
    explain_back:
      prompt: Two calculators disagree on 8 / 4 / 2 and on 2 - 3 - 4. Explain which answers are right, which rule decides
        them, and why raising to a power is usually treated the other way round.
      rubric:
        - id: e1
          point: Precedence decides between different operators, and associativity decides between equal operators that sit next
            to each other
        - id: e2
          point: "Division and subtraction are left-associative, so they are worked from left to right: 8 / 4 / 2 is 1 and 2 - 3
            - 4 is -5"
        - id: e3
          point: Working right to left would give 4 and 3, which is what a calculator with the wrong associativity reports
        - id: e4
          point: Raising to a power is usually right-associative, so a power of a power means the top one is worked out first
  - concept: shunting-yard
    where: Your calculator rearranges the tokens into postfix order with the shunting yard algorithm and an operator
      stack, so the evaluator no longer needs to know about precedence or brackets.
    explain_back:
      prompt: Explain how the shunting yard algorithm decides when an operator waiting on its stack moves to the output, and
        how a pair of brackets is handled, so that 1 + 2 * 3 and (1 + 2) * 3 come out in a different order.
      rubric:
        - id: e1
          point: Numbers go straight to the output, while operators wait on a stack
        - id: e2
          point: Before an operator is pushed, operators on the stack with higher precedence, or equal precedence and left
            associativity, are moved to the output first
        - id: e3
          point: An opening bracket is pushed as a marker, and a closing bracket moves operators to the output until it reaches
            that marker, which is thrown away
        - id: e4
          point: At the end the remaining operators are moved to the output, so 1 + 2 * 3 becomes 1 2 3 times plus, and (1 + 2)
            * 3 becomes 1 2 plus 3 times
  - concept: bracket-matching
    where: "Brackets must pair up. The operator stack in the shunting yard doubles as a bracket matcher: a closing bracket
      with no partner, or an opening one left over at the end, means invalid input."
    explain_back:
      prompt: A user enters (1 + 2)) * (3, and your calculator has to say what is wrong. Explain how a stack finds both
        problems in one pass, and why simply counting brackets stops working once there are several kinds of bracket.
      rubric:
        - id: e1
          point: Each opening bracket is pushed, and each closing bracket pops its partner
        - id: e2
          point: A closing bracket that finds no opening bracket to pop is unmatched, and anything still on the stack at the end
            was never closed
        - id: e3
          point: Because the stack remembers positions, the message can point at the bracket that caused the problem
        - id: e4
          point: A counter cannot tell an opening round bracket closed by a square one from a correct pair; the stack can, by
            checking that the popped bracket is the same kind
  - concept: stack-evaluation
    where: "The postfix list is evaluated with a stack of numbers: each number is pushed, and each operator pops two
      operands, applies itself and pushes the result."
    explain_back:
      prompt: Your evaluator turns the postfix list 10 3 minus into -7. Explain how a stack evaluates postfix, what went
        wrong here, and how the same stack tells you that an expression was malformed.
      rubric:
        - id: e1
          point: Numbers are pushed onto the stack, and an operator pops two numbers, applies itself and pushes the result
        - id: e2
          point: The first number popped is the right-hand operand and the second is the left-hand one; popping them in the
            wrong order computes 3 - 10 instead of 10 - 3
        - id: e3
          point: If an operator finds fewer than two numbers, a number is missing; if more than one number is left at the end,
            an operator is missing; both mean invalid input
  - concept: floating-point-numbers
    where: You decide whether 7 / 2 is 3 or 3.5 and how results are printed, and floating-point arithmetic means some
      decimal answers, such as 0.1 + 0.2, come out slightly off.
    explain_back:
      prompt: Your calculator prints 0.30000000000000004 for 0.1 + 0.2, and 2.0 for 4 / 2. Explain why each happens, and
        what choices you have for division and for printing results.
      rubric:
        - id: e1
          point: Binary floating point cannot store most decimal fractions, such as 0.1, exactly, so tiny errors show up in sums
        - id: e2
          point: Whole-number division would make 7 / 2 equal 3, which surprises users, so many calculators divide in floating
            point and accept the rounding
        - id: e3
          point: Print whole results without a decimal part and round the others to a sensible number of digits, or use decimal
            arithmetic where exactness matters, such as with money
  - concept: parse-error-reporting
    where: Invalid input, such as a trailing operator, an unknown character or an unmatched bracket, gets a message that
      says what is wrong and where, instead of a crash or a half-finished result.
    explain_back:
      prompt: A user types 3 + * 4, and your calculator crashes with an internal stack error. Explain what the user should
        see instead, and at which stage each kind of mistake is best caught.
      rubric:
        - id: e1
          point: A clear message naming the problem and its position, for example that a number was expected where the second
            operator stands, on standard error with a non-zero exit status
        - id: e2
          point: Unknown characters are caught by the tokenizer
        - id: e3
          point: A misplaced operator or a missing number is caught when the order of tokens is checked, or at the latest when
            the evaluator finds too few numbers on its stack
        - id: e4
          point: Unmatched brackets are caught by the bracket stack, before any evaluation
  - concept: unit-tests-first
    where: The challenge asks you to write tests before the code and keep them running on every change, so each new rule,
      such as precedence, brackets or errors, arrives with its own test.
    explain_back:
      prompt: You add brackets, and three earlier examples quietly start giving wrong answers. Explain how writing tests
        first and running them on every change would have caught this, and what makes a good set of test cases for a
        calculator.
      rubric:
        - id: e1
          point: A test written before the code states the expected result, so it fails until the feature works and fails again
            the moment a later change breaks it
        - id: e2
          point: Running every test on every change catches a broken old example at once, instead of when a user finds it
        - id: e3
          point: "Good cases cover each rule on its own and its edges: equal operators in a row, nested brackets, division
            results and every kind of invalid input"
  - concept: differential-testing
    where: A trusted calculator such as bc gives the right answer for any expression, so you can compare your calculator
      with it on many expressions you did not write by hand.
    explain_back:
      prompt: All your own tests pass, but comparing your calculator with bc on a few hundred generated expressions finds
        differences. Explain why the comparison finds bugs your tests missed, and what must be the same for both
        tools.
      rubric:
        - id: e1
          point: The reference tool supplies the right answer for any input, including combinations you never thought of
        - id: e2
          point: Generated expressions mix operators, brackets and numbers in ways that hand-written tests rarely cover
        - id: e3
          point: Both tools must use the same rules for division and decimal places, for example by setting bc's scale to match
            your choice, or the differences are not bugs
milestones:
  - title: Tokens and a first expression
    summary: Write tests first, turn text into tokens, take the expression from the command line and decide how numbers
      behave.
    steps:
      - title: Tests first, then tokens
        minutes: 45
        build: "Read all the challenge steps first, as the page advises. Write tests before the code: 2 * 3 should become the
          tokens number, times and number, and the calculator should print 6. Then write a tokenizer that skips
          spaces, reads numbers of several digits as one token and recognises the four operators and both brackets."
        outcome: Your tests show 2 * 3 split into three tokens with the result 6, and 1 + 22 split into three tokens, not
          four.
        concepts:
          - lexical-analysis
          - unit-tests-first
        hints:
          hint: "Decide what a number token is first: where does it start, and which character ends it?"
      - title: Take the expression from the command line
        minutes: 30
        build: Read the expression as one argument, print the result on standard output, and send any problem with the
          arguments to standard error.
        outcome: Running the calculator with 2 * 3 in single quotes prints 6, and running it with no expression or with
          several arguments prints a message on standard error and exits non-zero.
        concepts:
          - cli-subcommands
        hints:
          hint: Try it once without quotes and look at what your program actually receives.
      - title: Decide how numbers work
        minutes: 45
        build: Decide whether division gives whole numbers or decimals, and how results are printed. If you allow decimals,
          read numbers such as 2.5. Reject any character the tokenizer does not recognise, saying where it was found.
        outcome: Your notes record the division rule, 10 / 4 and 4 / 2 print as that rule says (for example 2.5 and 2), and an
          input with a letter in it is rejected with the letter's position.
        concepts:
          - floating-point-numbers
          - lexical-analysis
          - parse-error-reporting
        hints:
          hint: Ask what a user expects to see for a whole result and for a result that is not whole.
  - title: Precedence and the shunting yard
    summary: Mix operators correctly, convert to postfix with the shunting yard algorithm, and handle brackets.
    steps:
      - title: Mix operators
        minutes: 45
        build: Support expressions that mix operators, with times and divide before plus and minus, and equal operators worked
          from left to right.
        outcome: 1 + 1 * 5 gives 6, 2 * 3 + 4 gives 10, the page's 1 + 22 - 12 * 33 / 2 gives -175, and 10 - 4 - 3 gives 3.
        concepts:
          - operator-precedence
        hints:
          hint: Write the expected answer for a run of minus signs before you run it, and check which direction your calculator
            works in.
      - title: Run the shunting yard
        minutes: 60
        build: Convert the tokens from infix to postfix order with the shunting yard algorithm before evaluating, and add a
          debug option that prints the postfix order.
        outcome: With the debug option, the page's example (1 * 2) - (3 * 4) prints the postfix order 1 2 times 3 4 times
          minus.
        concepts:
          - shunting-yard
          - operator-precedence
        hints:
          hint: For each operator you meet, ask which operators already waiting must leave the stack before it can join.
          example: Cars at a level crossing wait in a siding; a slower car cannot leave before the faster ones already queued
            behind the barrier are let through in order.
      - title: Brackets
        minutes: 45
        build: Let an opening bracket wait on the operator stack, and let a closing bracket move operators to the output until
          it reaches its partner, which is then thrown away. Report a bracket with no partner.
        outcome: (1 + 1) * 5 gives 10 and 10 / (6 - 1) gives 2, and both an extra closing bracket and a missing one are
          reported as errors with their position.
        concepts:
          - bracket-matching
          - shunting-yard
        hints:
          hint: What should happen when a closing bracket finds an empty stack, and when the input ends with an opening bracket
            still waiting?
  - title: Evaluate and test
    summary: Evaluate postfix with a stack, reject malformed input cleanly, and automate the tests and a comparison with a
      reference.
    steps:
      - title: Evaluate postfix with a stack
        minutes: 45
        build: "Evaluate the postfix order with a stack of numbers: push each number, and for each operator pop two numbers,
          apply it and push the result."
        outcome: The postfix order 1 2 times 3 4 times minus evaluates to -10, 10 - 3 gives 7, and the whole calculator still
          gives 10 for 2 * 3 + 4.
        concepts:
          - stack-evaluation
        hints:
          hint: Of the two numbers an operator pops, which one is on the left of the original expression?
      - title: Reject malformed input
        minutes: 30
        build: Report malformed expressions, such as a trailing operator, two numbers with nothing between them, or an empty
          expression, as invalid input.
        outcome: Each of those inputs prints a message on standard error and exits non-zero, and none of them crashes or
          prints a partial result.
        concepts:
          - parse-error-reporting
          - stack-evaluation
        hints:
          hint: Look at what is left on the stack, or missing from it, in each malformed case.
      - title: Automate and compare
        minutes: 45
        build: Keep every example from the earlier steps in one test list that runs on every change, and add a check that
          compares your calculator with bc on many generated expressions, with bc's scale set to match your division
          rule.
        outcome: One command runs all the tests and they pass, and the comparison with bc over a few hundred generated
          expressions reports no differences.
        concepts:
          - unit-tests-first
          - differential-testing
        hints:
          hint: Generate expressions with brackets and every operator, and keep the ones that ever failed as permanent tests.
