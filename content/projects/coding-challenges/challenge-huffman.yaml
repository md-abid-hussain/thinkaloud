# Coding Challenges, Build your own compression tool (Huffman). Content format 3 (CONTENT_FORMAT.md, "The learning model (v3)").
# Source: https://codingchallenges.fyi/challenges/challenge-huffman . Written in our own words; the source is linked, not copied.
# Two tracks: the learning map (concepts, each with an explain-back) and the build plan (the challenge's own steps,
# each with one checkable outcome). Concept lessons and references live in content/concepts.yaml.

format: 3
project:
  source: coding_challenges
  slug: challenge-huffman
  title: Build your own compression tool
  source_url: https://codingchallenges.fyi/challenges/challenge-huffman
  level: intermediate
  status: generated
  figure:
    kind: tree
  summary: A command-line tool that compresses a file with Huffman coding. It counts how often each symbol appears,
    builds a tree that gives common symbols short codes, writes a header and the packed bits, and decompresses the
    result back into an exact copy of the original.
  requirements:
    - Read a file named on the command line and report an error if it cannot be read
    - Count how often each symbol occurs and build a Huffman tree from the counts
    - Turn the tree into a table of prefix-free bit codes
    - Write a compressed file with a header the decoder can rebuild the table from, followed by the packed bits
    - Decompress the file back into an exact copy of the original, with the output file name given as an option
    - Check that the test novel gets smaller and comes back byte for byte
  primer:
    what: Huffman coding stores data in fewer bits by giving frequent symbols short codes and rare symbols long ones. You
      count how often each symbol occurs, build a binary tree by joining the two rarest entries again and again, and
      read each symbol's code off the path from the root to its leaf. You will build a tool that compresses a file
      this way and decompresses it back to the original.
    why: Plain text spends eight bits on every character, however common it is. Fitting the length of a code to how often
      a symbol is used is the idea behind part of the compression in ZIP files, PNG images and JPEG photos.
    example: In the word banana, a appears three times, n twice and b once, so the frequency table has three entries, one
      per different letter. The tree joins the rarest entries first, so a never ends up with a longer code than n or
      b. Reading each code as a path of 0 for left and 1 for right, the whole word fits in 9 bits instead of the 48
      that eight bits per letter would need.
    words:
      - term: frequency table
        meaning: A list of each different symbol in the input with the number of times it occurs.
      - term: Huffman tree
        meaning: A binary tree whose leaves are the symbols, built by repeatedly joining the two lightest nodes into one whose
          weight is their sum.
      - term: prefix-free code
        meaning: A set of codes in which no code is the start of another, so a stream of bits can be read back without
          separators.
      - term: priority queue
        meaning: A collection that always hands back its smallest item first, whatever order the items went in.
      - term: bit packing
        meaning: Putting codes of any length into whole bytes, eight bits to a byte, and padding the last byte.
      - term: header
        meaning: The start of the compressed file, holding what the decoder needs before it can read the data.
  restate_rubric:
    - id: r1
      point: The tool compresses a file by counting symbols, building a Huffman tree and replacing each symbol with its bit
        code
    - id: r2
      point: The compressed file holds a header that lets the decoder rebuild the codes, followed by the codes packed into
        bytes
    - id: r3
      point: Decompressing gives back exactly the original file, byte for byte
  reflection_prompt: In your own words, what does your compressed file contain and in what order, and what would you
    change to make the header smaller for short files?
  done_when: The tool compresses the test novel to a clearly smaller file, decompresses it back byte for byte, refuses
    files that are not its own, and passes a round-trip test over empty, single-symbol, all-bytes and random inputs;
    and your notes explain entropy, prefix codes and your header layout in your own words.
  open_checks:
    - How your tie-breaking rule affects the code table, and whether the decoder reproduces it exactly.
    - How small the compressed novel gets compared with the entropy you measured, and with gzip on the same file.
    - What your tool does with an empty file and with a file of one repeated byte.
learning_map:
  - concept: information-entropy
    where: Your tool shrinks a novel because some characters are far more common than others. Measuring that skew tells
      you how far compression can possibly go.
    explain_back:
      prompt: A colleague runs your compressor on a folder of photos and zip files, and they barely shrink, while text files
        shrink to about half. Explain why, and whether a cleverer algorithm could compress the photos much further.
      rubric:
        - id: e1
          point: Compression works by giving common symbols shorter codes, so it needs some symbols to be much more frequent
            than others
        - id: e2
          point: Photos and zip files are already compressed, so their bytes are close to evenly spread and their entropy is
            near 8 bits per byte
        - id: e3
          point: No lossless method can go below the entropy on average, so no algorithm can shrink every file, and already
            compressed data has almost no room left
  - concept: prefix-codes
    where: The compressed file is one long run of bits with no separators. The decoder can split it back into symbols only
      because no code is the start of another.
    explain_back:
      prompt: A teammate proposes codes a = 0, b = 01 and c = 11 to save bits. Explain what goes wrong when you decode the
        bits 011, and what rule the codes must follow.
      rubric:
        - id: e1
          point: The bits 011 could be read as a then c, or as b followed by a stray 1, so the decoding is ambiguous
        - id: e2
          point: The rule is that no code may be the beginning of another code, which is called prefix-free
        - id: e3
          point: With prefix-free codes the decoder can stop as soon as the bits so far match a code, so the stream needs no
            separators
        - id: e4
          point: Prefix-free codes are exactly the leaves of a binary tree, which is why Huffman builds a tree
  - concept: huffman-coding
    where: You build the tree from the symbol counts by repeatedly joining the two lightest nodes, and read each symbol's
      code from its path.
    explain_back:
      prompt: Your compressor and a friend's give different codes for the same file, but both outputs have exactly the same
        size. Explain how both can be correct, and what a decoder must know to rebuild your tree.
      rubric:
        - id: e1
          point: Huffman joins the two lightest nodes each time, and when weights tie there is more than one valid choice
        - id: e2
          point: Different tie choices give different codes with the same total length, so both are equally optimal
        - id: e3
          point: The decoder must rebuild exactly the same tree, so it needs the same counts and the same tie-breaking rule, or
            the codes themselves
  - concept: priority-queue
    where: Building the tree needs the lightest node over and over, while new parent nodes keep arriving. A priority queue
      makes that fast.
    explain_back:
      prompt: Your tree builder sorts the whole list of nodes again every time it joins two of them, and it is slow on files
        with many distinct symbols. Explain what a priority queue does instead, and why it is faster.
      rubric:
        - id: e1
          point: A priority queue always hands back the smallest item and accepts new items at any time
        - id: e2
          point: A binary heap keeps only the smallest item on top, so removing it or adding one costs time in proportion to the
            logarithm of the number of items
        - id: e3
          point: Re-sorting after every join costs far more each time, so with many symbols the heap is much faster
  - concept: bit-packing
    where: Codes are a few bits long, but files hold whole bytes. You pack the codes eight bits to a byte, pad the last
      byte, and must know where the real bits end.
    explain_back:
      prompt: Your decompressed output has one or two extra characters at the end, but only for some files. Explain the
        likely cause and how to fix it.
      rubric:
        - id: e1
          point: The codes rarely fill the last byte exactly, so the last byte is padded with extra bits
        - id: e2
          point: The decoder reads the padding bits as if they were codes and produces extra symbols
        - id: e3
          point: Store the number of real bits or of symbols in the header, and stop decoding there
  - concept: file-header-format
    where: The decoder needs the code table before it can read the data, so your compressed file starts with a header
      holding an identifier, a version and the frequency table.
    explain_back:
      prompt: Someone runs your decompressor on a plain text file by mistake, and it prints garbage instead of an error.
        Explain what your header should contain and what the decoder should check first.
      rubric:
        - id: e1
          point: The header should start with a fixed identifier and a version number
        - id: e2
          point: The decoder should check the identifier and the version before reading anything else, and refuse a file that
            does not match
        - id: e3
          point: The header then holds what the decoder needs to rebuild the codes, such as the frequency table, and the length
            of the data, each in a fixed size and order
  - concept: byte-order
    where: Counts in the header take several bytes each, so you choose the order of those bytes and keep it the same in
      the compressor and the decompressor.
    explain_back:
      prompt: Your files decompress fine on your machine, but a decoder a friend wrote in another language reads a count of
        1 as 16,777,216. Explain what happened and what the file format must say.
      rubric:
        - id: e1
          point: A count stored in four bytes can be written most significant byte first or least significant byte first
        - id: e2
          point: The two programs used opposite orders, so the friend read the bytes backwards
        - id: e3
          point: The format must state one byte order, often big-endian, and every reader and writer must follow it
        - id: e4
          point: One program always agrees with itself, so this bug only shows when another program reads the file
  - concept: round-trip-testing
    where: You prove the tool works by compressing and decompressing many files and checking that each comes back
      identical, byte for byte.
    explain_back:
      prompt: Your compressor passes a round-trip test on the novel. Explain which other inputs the round trip must cover,
        and why a passing round trip alone does not prove your compressor compresses.
      rubric:
        - id: e1
          point: The round trip should also cover an empty file, one symbol repeated many times, and every byte value at least
            once
        - id: e2
          point: It must compare the result byte for byte with the original, not just look at it
        - id: e3
          point: A tool that copied the input unchanged would also pass, so you must also check the compressed file is smaller
milestones:
  - title: Counting and the tree
    summary: Read the file, count every symbol, and build the Huffman tree with a priority queue.
    steps:
      - title: Count the symbols
        minutes: 45
        build: Take a file name on the command line, report an error and exit with a non-zero status if it cannot be read, and
          count how often each byte occurs in one pass. Work out the entropy of the counts.
        outcome: For the challenge's test novel your counts match the challenge's examples for the letters X and t, and your
          notes record the entropy in bits per byte next to the 8 bits a byte uses.
        concepts:
          - information-entropy
        hints:
          hint: Count bytes, not characters, so the counts match what is actually in the file.
      - title: Build the tree
        minutes: 60
        build: Build the Huffman tree from the counts with a priority queue that always hands back the lightest node, joining
          the two lightest until one remains. Pick and write down a tie-breaking rule.
        outcome: Your tree for the worked example in the OpenDSA tutorial has the same total weight at the root and the same
          code lengths, and an empty file and a one-symbol file are handled without a crash.
        concepts:
          - huffman-coding
          - priority-queue
        hints:
          hint: A file with one distinct symbol still needs a code at least one bit long.
          example: A tournament that always pairs the two weakest teams first ends with the strongest team playing the fewest
            rounds.
  - title: Codes and the compressed file
    summary: Turn the tree into codes, write a header the decoder can trust, and pack the bits.
    steps:
      - title: The code table
        minutes: 45
        build: "Walk the tree from the root, adding 0 for one branch and 1 for the other, and record each leaf's code. Check
          the table mechanically: no code may be the start of another."
        outcome: For the test novel no code is a prefix of another, and no symbol has a longer code than a rarer symbol.
        concepts:
          - prefix-codes
          - huffman-coding
        hints:
          hint: Codes live only at the leaves. What does that guarantee?
      - title: Write the header
        minutes: 45
        build: Add an option for the output file name. Write a header with a fixed identifier, a version, the frequency table
          with each count in a fixed number of bytes in one stated byte order, and the number of symbols.
        outcome: A hex dump of the output shows your identifier, then your version, then the counts in the byte order you
          documented.
        concepts:
          - file-header-format
          - byte-order
        hints:
          hint: Write down the layout before you code it, field by field, with sizes.
      - title: Pack the bits
        minutes: 45
        build: Replace each symbol with its code, pack the bits eight to a byte, pad the last byte and write the bytes after
          the header.
        outcome: The compressed test novel is clearly smaller than the original, and its data part is within a byte of the
          total code length divided by 8.
        concepts:
          - bit-packing
        hints:
          hint: Keep a small store of bits not yet written, and flush a byte each time it holds eight.
  - title: Decoding and the round trip
    summary: Rebuild the tree from the header, decode the bits, and prove the round trip.
    steps:
      - title: Rebuild from the header
        minutes: 45
        build: "Read the header back: check the identifier and version first, refuse a file that fails, then read the counts
          and rebuild exactly the same tree and code table."
        outcome: Running the decompressor on a plain text file gives a clear error and a non-zero exit status, and on your
          compressed file it rebuilds the same code table the compressor printed.
        concepts:
          - file-header-format
          - byte-order
          - huffman-coding
        hints:
          hint: The decoder must make the same tie-breaking choices as the encoder.
      - title: Decode the data
        minutes: 45
        build: Read the data bit by bit, walking the tree and returning to the root after each leaf, stop after the stored
          number of symbols, and write the output file.
        outcome: Decompressing the compressed test novel gives a file with exactly the same size as the original.
        concepts:
          - prefix-codes
          - bit-packing
        hints:
          hint: What tells you to stop, given that the last byte holds padding?
      - title: Prove the round trip
        minutes: 45
        build: Write a test that compresses and decompresses many files, including an empty file, one symbol repeated many
          times, every byte value once and the test novel, and compares each result byte for byte with its original.
        outcome: Every file comes back byte for byte identical, and the test fails if you deliberately change one bit of a
          compressed file.
        concepts:
          - round-trip-testing
        hints:
          hint: Generate some inputs at random as well as the hand-picked ones.
